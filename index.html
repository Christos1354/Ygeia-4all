['hba1c','blood','📊',['HbA1c (γλυκοζυλιωμένη αιμοσφαιρίνη)','Ο μέσος όρος του σακχάρου τους τελευταίους 2–3 μήνες. Για διάγνωση και παρακολούθηση του διαβήτη.','Αιμοληψία.','Δεν χρειάζεται νηστεία.','Ίδια ή επόμενη μέρα.','Ένα μικρό τσίμπημα.','Κάτω από 5,7%: φυσιολογικό · 5,7–6,4%: προδιαβήτης · 6,5% και πάνω: διαβήτης. Σε διαβητικούς στόχος συνήθως κάτω από 7%.','Σε αναιμία ή στίγμα μεσογειακής αναιμίας μπορεί να βγει λάθος — ο γιατρός το λαμβάνει υπόψη. Σε διαβήτη γίνεται κάθε 3–6 μήνες.'],
 ['HbA1c (glycated haemoglobin)','Average blood sugar over the last 2–3 months. For diagnosing and following diabetes.','Blood sample.','No fasting needed.','Same or next day.','A small prick.','Below 5.7%: normal · 5.7–6.4%: prediabetes · 6.5% or above: diabetes. In diabetes the target is usually below 7%.','Anaemia or thalassaemia trait can make it misleading — your doctor takes this into account. In diabetes it is done every 3–6 months.']],
['lipids','blood','🧈',['Λιπίδια (χοληστερόλη, τριγλυκερίδια)','Ολική χοληστερόλη, «κακή» LDL, «καλή» HDL και τριγλυκερίδια. Δείχνει τον κίνδυνο για καρδιά και εγκεφαλικό.','Αιμοληψία.','Συνήθως 9–12 ώρες νηστεία, ειδικά για τα τριγλυκερίδια. Όχι αλκοόλ την προηγούμενη μέρα.','Ίδια ή επόμενη μέρα.','Ένα μικρό τσίμπημα.','Ολική: κάτω από 200 mg/dL · Τριγλυκερίδια: κάτω από 150 · HDL: πάνω από 40 (άνδρες), 50 (γυναίκες) · LDL: ο στόχος εξαρτάται από τον κίνδυνό σας — από κάτω από 116 έως κάτω από 55.','Το σωστό LDL για εσάς το ορίζει ο γιατρός ανάλογα με ηλικία, πίεση, διαβήτη, κάπνισμα. Η δίαιτα ρίχνει λίγο· τα φάρμακα πολύ. Μη σταματήσετε στατίνη μόνοι σας.'],
 ['Lipids (cholesterol, triglycerides)','Total cholesterol, “bad” LDL, “good” HDL and triglycerides. Shows the risk for heart attack and stroke.','Blood sample.','Usually 9–12 hours fasting, especially for triglycerides. No alcohol the day before.','Same or next day.','A small prick.','Total: below 200 mg/dL · Triglycerides: below 150 · HDL: above 40 (men), 50 (women) · LDL: the target depends on your risk — from below 116 down to below 55.','Your right LDL is set by your doctor from age, blood pressure, diabetes, smoking. Diet lowers it a little; medicines a lot. Do not stop a statin on your own.']],
['thyroid','blood','🦋',['Θυρεοειδής (TSH, FT4)','Πόσο καλά δουλεύει ο θυρεοειδής. Η TSH είναι το «καμπανάκι»: ψηλή = υποθυρεοειδισμός, χαμηλή = υπερθυρεοειδισμός.','Αιμοληψία, καλύτερα το πρωί.','Δεν χρειάζεται νηστεία. Αν παίρνετε θυροξίνη, κάντε την εξέταση πριν το χάπι της ημέρας. Σταματήστε βιοτίνη (βιταμίνη Β7) 2 μέρες πριν — αλλοιώνει το αποτέλεσμα.','1–2 μέρες.','Ένα μικρό τσίμπημα.','TSH: περίπου 0,4–4,0 mIU/L (στους ηλικιωμένους λίγο ψηλότερα είναι συχνά φυσιολογικό).','Κούραση, κρύο, βάρος, δυσκοιλιότητα → σκεφτείτε υποθυρεοειδισμό· ταχυπαλμία, τρέμουλο, απώλεια βάρους → υπερθυρεοειδισμό. Με θεραπεία ξαναμετράμε σε 6–8 εβδομάδες.'],
 ['Thyroid (TSH, FT4)','How well the thyroid works. TSH is the “alarm bell”: high = underactive, low = overactive.','Blood sample, ideally in the morning.','No fasting needed. If you take thyroxine, test before that day’s tablet. Stop biotin (vitamin B7) 2 days before — it distorts the result.','1–2 days.','A small prick.','TSH: about 0.4–4.0 mIU/L (slightly higher is often normal in older people).','Tiredness, feeling cold, weight gain, constipation → think underactive; racing heart, tremor, weight loss → overactive. On treatment it is re-checked after 6–8 weeks.']],
['kidney','blood','🫘',['Νεφρά (κρεατινίνη, eGFR, ουρία)','Πόσο καλά φιλτράρουν τα νεφρά. Το eGFR υπολογίζεται από την κρεατινίνη, την ηλικία και το φύλο.','Αιμοληψία.','Συνήθως όχι νηστεία. Αποφύγετε πολύ κρέας και έντονη άσκηση την προηγούμενη μέρα.','Ίδια μέρα.','Ένα μικρό τσίμπημα.','Κρεατινίνη: περίπου 0,6–1,2 mg/dL · eGFR: πάνω από 90 άριστο, 60–89 ήπια μείωση (συχνή με την ηλικία), κάτω από 60 για 3 μήνες = χρόνια νεφρική νόσος.','Σημαντικό σε διαβήτη, πίεση, ηλικία 60+, και πριν από σκιαγραφικό ή φάρμακα που περνούν από τα νεφρά. Τα αντιφλεγμονώδη (π.χ. ιβουπροφαίνη) κουράζουν τα νεφρά.'],
 ['Kidneys (creatinine, eGFR, urea)','How well the kidneys filter. eGFR is calculated from creatinine, age and sex.','Blood sample.','Usually no fasting. Avoid a lot of meat and hard exercise the day before.','Same day.','A small prick.','Creatinine: about 0.6–1.2 mg/dL · eGFR: over 90 excellent, 60–89 mildly reduced (common with age), below 60 for 3 months = chronic kidney disease.','Important in diabetes, high blood pressure, age 60+, and before contrast scans or medicines cleared by the kidneys. Anti-inflammatories (e.g. ibuprofen) strain the kidneys.']],
['liver','blood','🟡',['Ηπατικά (SGOT, SGPT, γGT, ALP, χολερυθρίνη)','Πώς είναι το συκώτι και οι χοληφόροι. Ανεβαίνουν σε λιπώδες ήπαρ, αλκοόλ, ηπατίτιδες, φάρμακα, πέτρες στη χολή.','Αιμοληψία.','Καλύτερα με νηστεία 8 ωρών. Όχι αλκοόλ 2–3 μέρες πριν.','1–2 μέρες.','Ένα μικρό τσίμπημα.','SGOT (AST) και SGPT (ALT): συνήθως κάτω από 40 U/L · Χολερυθρίνη: κάτω από περίπου 1,2 mg/dL.','Ελαφρώς ψηλά ηπατικά είναι πολύ συχνά (λιπώδες ήπαρ) — βελτιώνονται με απώλεια βάρους και λιγότερο αλκοόλ. Μόνη της λίγο ψηλή χολερυθρίνη συχνά είναι το αθώο σύνδρομο Gilbert.'],
 ['Liver tests (AST, ALT, GGT, ALP, bilirubin)','How the liver and bile ducts are. Raised in fatty liver, alcohol, hepatitis, medicines, gallstones.','Blood sample.','Ideally 8 hours fasting. No alcohol 2–3 days before.','1–2 days.','A small prick.','AST and ALT: usually below 40 U/L · Bilirubin: below about 1.2 mg/dL.','Slightly raised liver tests are very common (fatty liver) — they improve with weight loss and less alcohol. Slightly high bilirubin alone is often harmless Gilbert’s syndrome.']],
['electrolytes','blood','⚡',['Ηλεκτρολύτες (Νάτριο, Κάλιο)','Τα άλατα του αίματος. Επηρεάζουν καρδιά, μυς, εγκέφαλο.','Αιμοληψία.','Δεν χρειάζεται νηστεία.','Ίδια μέρα.','Ένα μικρό τσίμπημα.','Νάτριο: 135–145 mmol/L · Κάλιο: 3,5–5,0 mmol/L.','Τα διουρητικά και ορισμένα φάρμακα πίεσης αλλάζουν το νάτριο και το κάλιο — γι’ αυτό ελέγχονται τακτικά. Χαμηλό νάτριο στους ηλικιωμένους φέρνει σύγχυση και πτώσεις.'],
 ['Electrolytes (sodium, potassium)','The salts in the blood. They affect heart, muscles and brain.','Blood sample.','No fasting needed.','Same day.','A small prick.','Sodium: 135–145 mmol/L · Potassium: 3.5–5.0 mmol/L.','Water tablets and some blood-pressure medicines change sodium and potassium — so they are checked regularly. Low sodium in older people causes confusion and falls.']],
['uric','blood','🦶',['Ουρικό οξύ','Η ουσία που, όταν είναι ψηλή, κάνει κρυστάλλους στις αρθρώσεις (ουρική αρθρίτιδα) και πέτρες στα νεφρά.','Αιμοληψία.','Καλύτερα νηστεία 8 ωρών, χωρίς αλκοόλ και πολύ κρέας την προηγούμενη.','1 μέρα.','Ένα μικρό τσίμπημα.','Περίπου κάτω από 7 mg/dL (άνδρες) και κάτω από 6 (γυναίκες). Σε ουρική αρθρίτιδα στόχος κάτω από 6.','Μπορεί να είναι φυσιολογικό στη διάρκεια μιας κρίσης. Ψηλό ουρικό χωρίς πόνο συνήθως δεν χρειάζεται φάρμακο — χρειάζεται νερό, λιγότερο κόκκινο κρέας, αλκοόλ και αναψυκτικά.'],
 ['Uric acid','The substance that, when high, forms crystals in joints (gout) and kidney stones.','Blood sample.','Ideally 8 hours fasting, without alcohol and a lot of meat the day before.','1 day.','A small prick.','About below 7 mg/dL (men) and below 6 (women). In gout the target is below 6.','It can be normal during an attack. High uric acid without pain usually needs no medicine — it needs water, less red meat, alcohol and soft drinks.']],
['vitd','blood','☀️',['Βιταμίνη D (25-OH)','Πόση βιταμίνη D έχει ο οργανισμός. Χρειάζεται για γερά κόκαλα και μυς.','Αιμοληψία.','Δεν χρειάζεται νηστεία.','2–5 μέρες.','Ένα μικρό τσίμπημα.','Κάτω από 20 ng/mL: έλλειψη · 20–30: οριακό · 30–60: καλό.','Ακόμη και στον ήλιο της Κύπρου πολλοί έχουν χαμηλή D (μένουν μέσα, αντηλιακό, ηλικία). Σημαντική σε οστεοπόρωση και πτώσεις. Μην παίρνετε μεγάλες δόσεις χωρίς οδηγία.'],
 ['Vitamin D (25-OH)','How much vitamin D the body has. Needed for strong bones and muscles.','Blood sample.','No fasting needed.','2–5 days.','A small prick.','Below 20 ng/mL: deficient · 20–30: borderline · 30–60: good.','Even in sunny Cyprus many people have low vitamin D (staying indoors, sunscreen, age). Important in osteoporosis and falls. Do not take high doses without advice.']],
['b12','blood','🔴',['Βιταμίνη Β12 και φυλλικό οξύ','Βιταμίνες για το αίμα και τα νεύρα. Η έλλειψη φέρνει αναιμία, μουδιάσματα, αστάθεια, ξεχασιά.','Αιμοληψία.','Συνήθως νηστεία 6–8 ωρών. Σταματήστε τα συμπληρώματα 2–3 μέρες πριν, αν σας πει ο γιατρός.','2–4 μέρες.','Ένα μικρό τσίμπημα.','Β12: κάτω από περίπου 200 pg/mL χαμηλή · 200–300 οριακή.','Πιο συχνή έλλειψη: ηλικία 60+, χορτοφάγοι, μεταφορμίνη, φάρμακα για το στομάχι (ομεπραζόλη κ.λπ.) για χρόνια. Θεραπεύεται εύκολα με χάπια ή ενέσεις.'],
 ['Vitamin B12 and folate','Vitamins for blood and nerves. Lack causes anaemia, numbness, unsteadiness, forgetfulness.','Blood sample.','Usually 6–8 hours fasting. Stop supplements 2–3 days before if your doctor says so.','2–4 days.','A small prick.','B12: below about 200 pg/mL low · 200–300 borderline.','More common lack: age 60+, vegans, metformin, stomach medicines (omeprazole etc.) for years. Easily treated with tablets or injections.']],
['iron','blood','🧲',['Σίδηρος και φερριτίνη','Η φερριτίνη δείχνει τις «αποθήκες» σιδήρου. Χαμηλή = έλλειψη σιδήρου, η πιο συχνή αιτία αναιμίας.','Αιμοληψία, καλύτερα το πρωί.','Νηστεία 8 ωρών. Σταματήστε σίδηρο σε χάπια 24 ώρες πριν.','1–2 μέρες.','Ένα μικρό τσίμπημα.','Φερριτίνη κάτω από 30 ng/mL συνήθως σημαίνει έλλειψη σιδήρου.','Η φερριτίνη ανεβαίνει και σε φλεγμονή, οπότε μπορεί να «κρύβει» έλλειψη. Σε άνδρες και γυναίκες μετά την εμμηνόπαυση, έλλειψη σιδήρου χρειάζεται έλεγχο για απώλεια αίματος από το έντερο.'],
 ['Iron and ferritin','Ferritin shows the iron “stores”. Low = iron deficiency, the most common cause of anaemia.','Blood sample, ideally in the morning.','8 hours fasting. Stop iron tablets 24 hours before.','1–2 days.','A small prick.','Ferritin below 30 ng/mL usually means iron deficiency.','Ferritin also rises with inflammation, so it can “hide” a deficiency. In men and in women after menopause, iron deficiency needs a check for blood loss from the bowel.']],
['crp','blood','🔥',['CRP και ΤΚΕ (δείκτες φλεγμονής)','Ανεβαίνουν όταν υπάρχει φλεγμονή ή λοίμωξη κάπου στο σώμα. Δεν δείχνουν πού.','Αιμοληψία.','Δεν χρειάζεται νηστεία.','Ίδια μέρα.','Ένα μικρό τσίμπημα.','CRP: συνήθως κάτω από 5 mg/L · ΤΚΕ: ανεβαίνει λίγο με την ηλικία (περίπου ηλικία/2 στους άνδρες).','Πολύ ψηλή ΤΚΕ σε ηλικιωμένο με πονοκέφαλο ή πόνο σε ώμους/ισχία χρειάζεται γρήγορα γιατρό (αρτηρίτιδα, ρευματική πολυμυαλγία).'],
 ['CRP and ESR (inflammation markers)','They rise when there is inflammation or infection somewhere in the body. They do not show where.','Blood sample.','No fasting needed.','Same day.','A small prick.','CRP: usually below 5 mg/L · ESR: rises a little with age (about age/2 in men).','A very high ESR in an older person with headache or shoulder/hip pain needs a doctor quickly (arteritis, polymyalgia).']],
['calcium','blood','🦴',['Ασβέστιο','Το ασβέστιο του αίματος — για κόκαλα, μυς, νεύρα. Ελέγχεται με τον παραθυρεοειδή.','Αιμοληψία.','Νηστεία 8 ωρών αν ζητηθεί.','1 μέρα.','Ένα μικρό τσίμπημα.','Περίπου 8,5–10,5 mg/dL.','Ψηλό ασβέστιο με κούραση, δίψα, δυσκοιλιότητα ή πέτρες στα νεφρά → έλεγχος παραθυρεοειδούς. Μην παίρνετε συμπληρώματα ασβεστίου χωρίς λόγο.'],
 ['Calcium','Blood calcium — for bones, muscles, nerves. Checked together with the parathyroid.','Blood sample.','8 hours fasting if asked.','1 day.','A small prick.','About 8.5–10.5 mg/dL.','High calcium with tiredness, thirst, constipation or kidney stones → parathyroid check. Do not take calcium supplements without reason.']],
['psa','blood','🔵',['PSA (προστάτης)','Πρωτεΐνη που φτιάχνει ο προστάτης. Ψηλό PSA μπορεί να σημαίνει καλοήθη διόγκωση, φλεγμονή ή (λιγότερο συχνά) καρκίνο.','Αιμοληψία.','Όχι εκσπερμάτιση 2 μέρες πριν, όχι ποδήλατο ή ιππασία 2 μέρες πριν, όχι μετά από δακτυλική εξέταση ή ουρολοίμωξη.','1–2 μέρες.','Ένα μικρό τσίμπημα.','Συνήθως κάτω από 4 ng/mL — το φυσιολογικό ανεβαίνει με την ηλικία.','Συζητήστε με τον γιατρό τα υπέρ και τα κατά πριν το κάνετε. Ένα ψηλό αποτέλεσμα συνήθως επαναλαμβάνεται και ίσως ακολουθεί μαγνητική προστάτη.'],
 ['PSA (prostate)','A protein made by the prostate. High PSA can mean benign enlargement, inflammation or (less often) cancer.','Blood sample.','No ejaculation for 2 days, no cycling or horse riding for 2 days, not after a rectal exam or urine infection.','1–2 days.','A small prick.','Usually below 4 ng/mL — normal rises with age.','Discuss the pros and cons with your doctor first. A high result is usually repeated and may be followed by a prostate MRI.']],
['inr','blood','🩸',['INR (πήξη αίματος)','Πόσο γρήγορα πήζει το αίμα. Κυρίως για όσους παίρνουν βαρφαρίνη (Sintrom, Panwarfin).','Αιμοληψία ή σταγόνα από το δάχτυλο.','Δεν χρειάζεται νηστεία. Μην αλλάζετε απότομα πράσινα λαχανικά πριν.','Ίδια μέρα — συχνά σε λεπτά.','Ένα μικρό τσίμπημα.','Χωρίς φάρμακο περίπου 1. Με βαρφαρίνη στόχος συνήθως 2–3 (ο γιατρός ορίζει).','Αντιβιώσεις και πολλά άλλα φάρμακα αλλάζουν το INR — πείτε στον γιατρό κάθε νέο φάρμακο. Τα νεότερα αντιπηκτικά (π.χ. Xarelto, Eliquis) δεν χρειάζονται INR.'],
 ['INR (blood clotting)','How fast the blood clots. Mainly for people on warfarin or acenocoumarol.','Blood sample or a finger drop.','No fasting. Do not suddenly change green vegetables before.','Same day — often in minutes.','A small prick.','Without medicine about 1. On warfarin the target is usually 2–3 (set by your doctor).','Antibiotics and many other medicines change INR — tell your doctor about every new medicine. Newer blood thinners (e.g. Xarelto, Eliquis) do not need INR.']],
['hbelectro','blood','🧬',['Ηλεκτροφόρηση αιμοσφαιρίνης (στίγμα μεσογειακής αναιμίας)','Δείχνει αν έχετε στίγμα β-θαλασσαιμίας ή άλλη αιμοσφαιρινοπάθεια. Πολύ συχνό στην Κύπρο και την Ελλάδα.','Αιμοληψία.','Δεν χρειάζεται νηστεία. Καλό να ξέρει το εργαστήριο αν παίρνετε σίδηρο.','Μερικές μέρες.','Ένα μικρό τσίμπημα.','Αυξημένη HbA2 (πάνω από περίπου 3,5%) δείχνει στίγμα β-θαλασσαιμίας.','Το στίγμα δεν είναι αρρώστια — αλλά ζευγάρια που σκέφτονται παιδιά καλό να ελεγχθούν και οι δύο. Με στίγμα μην παίρνετε σίδηρο χωρίς να δείξει έλλειψη η φερριτίνη.'],
 ['Haemoglobin electrophoresis (thalassaemia trait)','Shows whether you carry beta-thalassaemia trait or another haemoglobin disorder. Very common in Cyprus and Greece.','Blood sample.','No fasting. Tell the lab if you take iron.','A few days.','A small prick.','Raised HbA2 (above about 3.5%) shows beta-thalassaemia trait.','The trait is not an illness — but couples planning children should both be tested. With the trait, do not take iron unless ferritin shows a lack.']],
['g6pd','blood','🫘',['G6PD (ανεπάρκεια — «κουκιά»)','Ένζυμο των ερυθρών. Όσοι έχουν ανεπάρκεια μπορεί να πάθουν αιμόλυση από κουκιά ή ορισμένα φάρμακα.','Αιμοληψία.','Δεν χρειάζεται νηστεία. Καλύτερα όχι αμέσως μετά από κρίση αιμόλυσης.','Μερικές μέρες.','Ένα μικρό τσίμπημα.','Αναφέρεται ως φυσιολογική, μερική ή πλήρης ανεπάρκεια.','Συχνή στην Κύπρο, ιδίως στους άνδρες. Με ανεπάρκεια: όχι κουκιά, προσοχή στη ναφθαλίνη και σε ορισμένα φάρμακα — δείχνετε πάντα την κάρτα σας στον γιατρό και τον φαρμακοποιό.'],
 ['G6PD (deficiency — “favism”)','An enzyme in red cells. People who lack it can get haemolysis from broad beans or certain medicines.','Blood sample.','No fasting. Better not right after a haemolysis episode.','A few days.','A small prick.','Reported as normal, partial or full deficiency.','Common in Cyprus, especially in men. If deficient: no broad beans, care with mothballs and certain medicines — always show your card to doctor and pharmacist.']],
['hepvir','blood','🧪',['Ηπατίτιδες B, C και HIV','Δείχνουν αν υπάρχει ή υπήρξε μόλυνση ή αν είστε εμβολιασμένοι για ηπατίτιδα B.','Αιμοληψία.','Δεν χρειάζεται νηστεία.','Μερικές μέρες.','Ένα μικρό τσίμπημα.','Αναφέρονται ως θετικό ή αρνητικό.','Η ηπατίτιδα C σήμερα θεραπεύεται πλήρως με χάπια λίγων εβδομάδων. Καλό να γίνει μία φορά στη ζωή. Το αποτέλεσμα είναι εμπιστευτικό.'],
 ['Hepatitis B, C and HIV','Show if there is or was an infection, or if you are vaccinated against hepatitis B.','Blood sample.','No fasting.','A few days.','A small prick.','Reported as positive or negative.','Hepatitis C is now fully cured with a few weeks of tablets. Worth testing once in life. The result is confidential.']],

['urinalysis','urine','💧',['Γενική ούρων','Ψάχνει σάκχαρο, λεύκωμα, αίμα, πύον και μικρόβια στα ούρα. Για ουρολοιμώξεις, νεφρά, διαβήτη.','Δείγμα ούρων σε αποστειρωμένο δοχείο από το φαρμακείο.','Πρώτα πρωινά ούρα. Πλύνετε την περιοχή, αφήστε τα πρώτα ούρα να φύγουν και μαζέψτε από τη μέση. Γυναίκες: όχι στην περίοδο.','Ίδια μέρα.','Καθόλου.','Χωρίς σάκχαρο, χωρίς λεύκωμα, λίγα λευκά, νιτρώδη αρνητικά.','Παραδώστε το δείγμα μέσα σε 1–2 ώρες (ή στο ψυγείο ως 4 ώρες).'],
 ['Urinalysis','Looks for sugar, protein, blood, pus and germs in the urine. For urine infections, kidneys, diabetes.','Urine sample in a sterile pot from the pharmacy.','First morning urine. Wash, let the first stream go and collect the middle. Women: not during a period.','Same day.','Not at all.','No sugar, no protein, few white cells, nitrites negative.','Hand in the sample within 1–2 hours (or in the fridge up to 4 hours).']],
['urineculture','urine','🦠',['Καλλιέργεια ούρων','Ποιο μικρόβιο προκαλεί ουρολοίμωξη και σε ποιο αντιβιοτικό «υποχωρεί».','Δείγμα ούρων όπως στη γενική, σε αποστειρωμένο δοχείο.','Πριν ξεκινήσετε αντιβίωση. Μέσο της ούρησης, πρώτα πρωινά ούρα.','2–3 μέρες.','Καθόλου.','Αρνητική = δεν αναπτύχθηκε μικρόβιο.','Στους ηλικιωμένους, μικρόβια στα ούρα χωρίς συμπτώματα συνήθως δεν χρειάζονται αντιβίωση.'],
 ['Urine culture','Which germ causes a urine infection and which antibiotic works on it.','Urine sample as for urinalysis, in a sterile pot.','Before starting antibiotics. Midstream, first morning urine.','2–3 days.','Not at all.','Negative = no germ grew.','In older people, germs in the urine without symptoms usually need no antibiotic.']],
['uacr','urine','🫘',['Λεύκωμα ούρων (λόγος αλβουμίνης/κρεατινίνης)','Πρώιμο σημάδι ότι τα νεφρά «κουράζονται» από διαβήτη ή πίεση.','Ένα δείγμα ούρων, καλύτερα πρωινό.','Όχι έντονη άσκηση, όχι πυρετός ή ουρολοίμωξη τη μέρα του δείγματος.','1–2 μέρες.','Καθόλου.','Κάτω από 30 mg/g: φυσιολογικό.','Σε διαβήτη και πίεση γίνεται κάθε χρόνο. Αν βγει ψηλό, επαναλαμβάνεται· υπάρχουν φάρμακα που προστατεύουν τα νεφρά.'],
 ['Urine protein (albumin/creatinine ratio)','An early sign that the kidneys are being strained by diabetes or blood pressure.','One urine sample, ideally morning.','No hard exercise, no fever or urine infection on the sample day.','1–2 days.','Not at all.','Below 30 mg/g: normal.','In diabetes and high blood pressure it is done yearly. If high it is repeated; there are medicines that protect the kidneys.']],
['fit','urine','🔬',['Τεστ αίματος στα κόπρανα (FIT)','Ψάχνει αόρατο αίμα στα κόπρανα — έλεγχος για καρκίνο παχέος εντέρου από τα 45–50.','Παίρνετε με ένα μικρό ραβδάκι λίγο δείγμα κοπράνων στο σπίτι και το παραδίδετε.','Δεν χρειάζεται δίαιτα. Όχι στην περίοδο ή με αιμορροΐδες που ματώνουν εκείνη τη μέρα.','Λίγες μέρες.','Καθόλου.','Αρνητικό = δεν βρέθηκε αίμα.','Αν βγει θετικό χρειάζεται κολονοσκόπηση — δεν σημαίνει ότι έχετε καρκίνο· συχνά είναι πολύποδας που αφαιρείται. Επαναλαμβάνεται κάθε 1–2 χρόνια.'],
 ['Faecal blood test (FIT)','Looks for invisible blood in stool — bowel cancer screening from 45–50.','You take a tiny stool sample at home with a small stick and hand it in.','No diet needed. Not during a period or on a day when piles are bleeding.','A few days.','Not at all.','Negative = no blood found.','If positive a colonoscopy is needed — it does not mean you have cancer; often it is a polyp that is removed. Repeated every 1–2 years.']],
// ---------------- ΚΑΡΔΙΑ ----------------
['ecg','heart','💓',['Ηλεκτροκαρδιογράφημα (ΗΚΓ)','Τον ρυθμό της καρδιάς και σημάδια ισχαιμίας, παλιού εμφράγματος ή πάχυνσης.','Ξαπλώνετε· βάζουν 10 αυτοκόλλητα ηλεκτρόδια σε στήθος, χέρια, πόδια. Μένετε ακίνητοι λίγα δευτερόλεπτα.','Καμία. Φορέστε ρούχα που βγαίνουν εύκολα· όχι κρέμα σώματος στο στήθος.','5–10 λεπτά.','Καθόλου — δεν περνά ρεύμα μέσα σας.','','Ένα φυσιολογικό ΗΚΓ σε ηρεμία δεν αποκλείει στηθάγχη — μπορεί να χρειαστεί τεστ κοπώσεως.'],
 ['Electrocardiogram (ECG)','Heart rhythm and signs of poor blood supply, an old heart attack or thickening.','You lie down; 10 sticky electrodes go on chest, arms and legs. You keep still for a few seconds.','None. Wear clothes that come off easily; no body lotion on the chest.','5–10 minutes.','Not at all — no current goes into you.','','A normal resting ECG does not rule out angina — a stress test may be needed.']],
['holter','heart','📟',['Holter ρυθμού (24–48 ωρών)','Καταγράφει κάθε χτύπο της καρδιάς για 1–2 μέρες. Για αρρυθμίες, ταχυπαλμίες, ζάλη, λιποθυμίες.','Βάζουν ηλεκτρόδια στο στήθος συνδεδεμένα με μικρή συσκευή στη ζώνη. Κάνετε κανονική ζωή και σημειώνετε τι νιώθετε και πότε.','Κάντε μπάνιο πριν — με τη συσκευή δεν βρέχεστε. Άντρες: ίσως ξύρισμα στο στήθος.','24–48 ώρες (υπάρχουν και συσκευές για 1–2 εβδομάδες).','Καθόλου — μόνο τα αυτοκόλλητα ενοχλούν λίγο.','','Το ημερολόγιο που κρατάτε είναι πολύτιμο: γράψτε την ώρα κάθε συμπτώματος.'],
 ['Holter heart monitor (24–48 h)','Records every heartbeat for 1–2 days. For arrhythmias, palpitations, dizziness, fainting.','Electrodes on the chest connected to a small recorder on your belt. Live normally and note what you feel and when.','Shower before — you cannot get it wet. Men: chest may be shaved.','24–48 hours (some devices for 1–2 weeks).','Not at all — only the stickers bother a little.','','Your symptom diary is valuable: write down the time of every symptom.']],
['abpm','heart','🩺',['Holter πίεσης (24ωρη καταγραφή)','Την πίεση σε όλο το 24ωρο, και στον ύπνο. Ξεχωρίζει την «υπέρταση της λευκής μπλούζας».','Περιχειρίδα στο μπράτσο που φουσκώνει μόνη της κάθε 15–30 λεπτά (τη νύχτα κάθε 30–60).','Φορέστε φαρδύ μανίκι. Πάρτε τα φάρμακά σας κανονικά, εκτός αν σας πουν αλλιώς.','24 ώρες.','Όχι, απλώς σφίγγει λίγο σε κάθε μέτρηση.','Μέσος όρος ημέρας κάτω από 135/85 · 24ωρου κάτω από 130/80.','Όταν φουσκώνει, σταματήστε, αφήστε το χέρι χαλαρό και ίσιο. Κρατήστε σημειώσεις για ύπνο, φάρμακα, άσκηση.'],
 ['24-hour blood pressure monitor','Blood pressure over 24 hours, including sleep. It reveals “white-coat hypertension”.','A cuff on the arm inflates by itself every 15–30 minutes (at night every 30–60).','Wear a loose sleeve. Take your medicines as usual unless told otherwise.','24 hours.','No, it just squeezes a little each time.','Daytime average below 135/85 · 24-hour below 130/80.','When it inflates, stop, let the arm hang relaxed and straight. Keep notes about sleep, medicines, exercise.']],
['echo','heart','❤️',['Υπερηχοκαρδιογράφημα (triplex καρδιάς)','Πώς είναι οι βαλβίδες, οι κοιλότητες και πόσο δυνατά «σπρώχνει» η καρδιά (κλάσμα εξώθησης).','Ξαπλώνετε στο αριστερό πλάι· με ζελέ και κεφαλή υπερήχων στο στήθος.','Καμία.','20–40 λεπτά.','Καθόλου.','Κλάσμα εξώθησης φυσιολογικά περίπου 55–70%.','Δεν έχει ακτινοβολία. Χρήσιμο σε δύσπνοια, φύσημα, πρησμένα πόδια, μετά από έμφραγμα.'],
 ['Echocardiogram (heart ultrasound)','How the valves and chambers are and how strongly the heart pumps (ejection fraction).','You lie on your left side; gel and an ultrasound probe on the chest.','None.','20–40 minutes.','Not at all.','Ejection fraction normally about 55–70%.','No radiation. Useful for breathlessness, a murmur, swollen legs, after a heart attack.']],
['stress','heart','🏃',['Τεστ κοπώσεως','Αν η καρδιά παίρνει αρκετό αίμα όταν κουράζεται. Για στηθάγχη.','Περπατάτε σε διάδρομο που σιγά σιγά ανεβαίνει ταχύτητα και κλίση, με ΗΚΓ και πίεση.','Άνετα ρούχα και αθλητικά παπούτσια. Ελαφρύ γεύμα 2–3 ώρες πριν. Ρωτήστε αν πρέπει να σταματήσετε φάρμακα (π.χ. β-αναστολείς).','Περίπου 30 λεπτά (10–15 στο διάδρομο).','Όχι — κουράζεστε, λαχανιάζετε. Πείτε αμέσως αν πονέσει το στήθος ή ζαλιστείτε.','','Αν δεν μπορείτε να περπατήσετε, υπάρχει υπερηχογράφημα ή σπινθηρογράφημα με φάρμακο αντί για άσκηση.'],
 ['Exercise stress test','Whether the heart gets enough blood when working hard. For angina.','You walk on a treadmill that slowly gets faster and steeper, with ECG and blood pressure.','Comfortable clothes and trainers. Light meal 2–3 hours before. Ask whether to stop medicines (e.g. beta-blockers).','About 30 minutes (10–15 on the treadmill).','No — you get tired and breathless. Say at once if your chest hurts or you feel dizzy.','','If you cannot walk, there is a stress echo or a nuclear scan with medicine instead of exercise.']],
['carotid','heart','🧠',['Triplex καρωτίδων','Αν οι αρτηρίες του λαιμού που πάνε στον εγκέφαλο έχουν στένωση από πλάκες.','Υπέρηχος με ζελέ στα πλάγια του λαιμού.','Καμία. Φορέστε ρούχο ανοιχτό στον λαιμό.','15–20 λεπτά.','Καθόλου.','Μικρή πλάκα είναι συχνή με την ηλικία· σημαντική είναι στένωση πάνω από περίπου 50–70%.','Γίνεται μετά από παροδικό ισχαιμικό επεισόδιο ή εγκεφαλικό, ή σε υψηλό κίνδυνο.'],
 ['Carotid Doppler ultrasound','Whether the neck arteries to the brain are narrowed by plaques.','Ultrasound with gel on the sides of the neck.','None. Wear an open neckline.','15–20 minutes.','Not at all.','Small plaques are common with age; significant is narrowing above about 50–70%.','Done after a mini-stroke or stroke, or in high risk.']],
['legdoppler','heart','🦵',['Triplex φλεβών ή αρτηριών ποδιών','Φλέβες: θρόμβους (φλεβοθρόμβωση) και κιρσούς. Αρτηρίες: στένωση που φέρνει πόνο στο περπάτημα.','Υπέρηχος με ζελέ κατά μήκος του ποδιού, ξαπλωμένοι ή όρθιοι.','Καμία. Φαρδύ παντελόνι ή φούστα.','20–40 λεπτά.','Όχι — λίγη πίεση από την κεφαλή.','','Για αρτηρίες μετρούν συχνά και την πίεση στους αστραγάλους (δείκτης ABI).'],
 ['Leg vein or artery Doppler','Veins: clots (DVT) and varicose veins. Arteries: narrowing that causes pain on walking.','Ultrasound with gel along the leg, lying or standing.','None. Loose trousers or skirt.','20–40 minutes.','No — just some pressure from the probe.','','For arteries the ankle blood pressure is often measured too (ABI).']],
['ctcoronary','heart','🖥️',['Αξονική στεφανιογραφία / Calcium score','Ασβέστιο και στενώσεις στις αρτηρίες της καρδιάς χωρίς καθετήρα.','Ξαπλώνετε στον αξονικό τομογράφο. Για στεφανιογραφία δίνεται σκιαγραφικό στη φλέβα και ίσως χάπι για να πέσουν οι παλμοί.','Νηστεία 4 ώρες. Όχι καφές ή ενεργειακά ποτά από το πρωί. Πείτε αν έχετε αλλεργία σε σκιαγραφικό, πρόβλημα στα νεφρά ή παίρνετε μεταφορμίνη. Κάντε κρεατινίνη πριν.','15–30 λεπτά.','Όχι — μόνο η φλεβοκέντηση· το σκιαγραφικό φέρνει ζέστη για λίγα δευτερόλεπτα.','Calcium score 0: πολύ χαμηλός κίνδυνος.','Έχει ακτινοβολία — γίνεται όταν υπάρχει λόγος. Πίνετε άφθονο νερό μετά το σκιαγραφικό.'],
 ['CT coronary angiogram / Calcium score','Calcium and narrowings in the heart arteries without a catheter.','You lie in the CT scanner. For an angiogram, contrast is given in a vein and maybe a tablet to slow the pulse.','Fast 4 hours. No coffee or energy drinks from the morning. Tell them about contrast allergy, kidney problems or metformin. Have a creatinine test first.','15–30 minutes.','No — only the needle; the contrast feels warm for a few seconds.','Calcium score 0: very low risk.','It uses radiation — done when there is a reason. Drink plenty of water after contrast.']],
['angio','heart','🫀',['Στεφανιογραφία (καθετηριασμός)','Οι αρτηρίες της καρδιάς «από μέσα». Αν βρεθεί στένωση, μπορεί να μπει στεντ την ίδια ώρα.','Με τοπική αναισθησία, λεπτός καθετήρας μπαίνει από τον καρπό ή τη βουβωνική χώρα ως την καρδιά και δίνεται σκιαγραφικό.','Νηστεία 6 ωρών. Ρωτήστε για αντιπηκτικά, μεταφορμίνη, αλλεργίες. Συνοδός για την επιστροφή.','30–60 λεπτά· παραμονή μερικές ώρες ή 1 βράδυ.','Ελάχιστα — είστε ξύπνιοι, νιώθετε πίεση στο σημείο.','','Μετά: όχι βάρη με το χέρι ή το πόδι της παρακέντησης για λίγες μέρες· προσέξτε για πρήξιμο ή αιμορραγία στο σημείο.'],
 ['Coronary angiogram (catheter)','The heart arteries “from inside”. If a narrowing is found, a stent may be placed at the same time.','Under local anaesthetic a thin catheter goes in from the wrist or groin up to the heart and contrast is given.','Fast 6 hours. Ask about blood thinners, metformin, allergies. Someone to take you home.','30–60 minutes; stay a few hours or one night.','Very little — you are awake and feel pressure at the site.','','Afterwards: no lifting with that arm or leg for a few days; watch the site for swelling or bleeding.']],
// ---------------- ΜΑΤΙΑ ----------------
['acuity','eyes','🔤',['Οπτική οξύτητα','Πόσο καθαρά βλέπετε μακριά και κοντά, με ή χωρίς γυαλιά.','Διαβάζετε γράμματα σε πίνακα, το κάθε μάτι χωριστά.','Φέρτε τα γυαλιά σας ή τους φακούς σας.','Λίγα λεπτά.','Καθόλου.','10/10 (ή 6/6) θεωρείται φυσιολογική όραση.','Αν η όραση έπεσε ξαφνικά, πηγαίνετε την ίδια μέρα σε οφθαλμίατρο.'],
 ['Visual acuity','How clearly you see far and near, with or without glasses.','You read letters on a chart, one eye at a time.','Bring your glasses or contact lenses.','A few minutes.','Not at all.','20/20 (6/6) is considered normal vision.','If vision dropped suddenly, see an eye doctor the same day.']],
['tonometry','eyes','💨',['Τονομέτρηση (πίεση ματιού)','Την πίεση μέσα στο μάτι — βασικό για το γλαύκωμα, που «κλέβει» την όραση χωρίς πόνο.','Ή ένα φύσημα αέρα στο μάτι, ή αναισθητική σταγόνα και ένα όργανο που ακουμπά απαλά το μάτι.','Βγάλτε τους φακούς επαφής.','1–2 λεπτά.','Όχι — το φύσημα ξαφνιάζει λίγο.','Περίπου 10–21 mmHg.','Μετά τα 40 καλό να γίνεται τακτικά, ειδικά με γλαύκωμα στην οικογένεια, μυωπία ή διαβήτη.'],
 ['Tonometry (eye pressure)','The pressure inside the eye — key for glaucoma, which “steals” sight without pain.','Either a puff of air at the eye, or a numbing drop and an instrument that gently touches the eye.','Remove contact lenses.','1–2 minutes.','No — the puff is a little startling.','About 10–21 mmHg.','After 40 it is worth doing regularly, especially with glaucoma in the family, short sight or diabetes.']],
['fundus','eyes','🔦',['Βυθοσκόπηση (με σταγόνες μυδρίασης)','Τον αμφιβληστροειδή, το οπτικό νεύρο και τα αγγεία του ματιού. Για διαβήτη, πίεση, γλαύκωμα, ωχρά κηλίδα, αποκόλληση.','Σταγόνες ανοίγουν την κόρη· σε 20–30 λεπτά ο γιατρός κοιτά με φως και φακό.','Μην οδηγήσετε μετά — φέρτε συνοδό ή πάρτε ταξί. Φέρτε γυαλιά ηλίου.','Περίπου 1 ώρα συνολικά· η θολούρα κρατά 4–6 ώρες.','Όχι — οι σταγόνες τσούζουν λίγο και το φως ενοχλεί.','','Σε διαβήτη γίνεται κάθε χρόνο, ακόμη κι αν βλέπετε καλά.'],
 ['Dilated eye exam (fundoscopy)','The retina, optic nerve and blood vessels of the eye. For diabetes, blood pressure, glaucoma, macular degeneration, detachment.','Drops open the pupil; after 20–30 minutes the doctor looks in with a light and lens.','Do not drive afterwards — bring someone or take a taxi. Bring sunglasses.','About 1 hour in total; blurring lasts 4–6 hours.','No — the drops sting a little and the light is bright.','','In diabetes it is done yearly, even if you see well.']],
['fields','eyes','✨',['Οπτικά πεδία','Αν χάνετε την περιφερική όραση (στα πλάγια) — κυρίως για γλαύκωμα και νευρολογικά προβλήματα.','Κοιτάτε ένα σημείο σε θόλο και πατάτε κουμπί κάθε φορά που βλέπετε ένα φωτάκι στα πλάγια.','Φέρτε τα γυαλιά σας. Κοιμηθείτε καλά — η κούραση χαλάει το αποτέλεσμα.','5–10 λεπτά κάθε μάτι.','Καθόλου.','','Είναι φυσιολογικό να μη βλέπετε κάποια φωτάκια. Η πρώτη φορά είναι συχνά «πρόβα» και επαναλαμβάνεται.'],
 ['Visual field test','Whether you are losing side (peripheral) vision — mainly for glaucoma and neurological problems.','You look at a point in a bowl and press a button each time you see a light at the side.','Bring your glasses. Sleep well — tiredness spoils the result.','5–10 minutes per eye.','Not at all.','','It is normal to miss some lights. The first time is often a “practice” and is repeated.']],
['oct','eyes','📸',['OCT (τομογραφία οπτικής συνοχής)','Λεπτομερή «φέτα» του αμφιβληστροειδούς και του οπτικού νεύρου. Για ωχρά κηλίδα, διαβητικό οίδημα, γλαύκωμα.','Ακουμπάτε το πηγούνι και κοιτάτε ένα φωτάκι· η συσκευή φωτογραφίζει χωρίς να αγγίξει το μάτι.','Συνήθως καμία· μερικές φορές σταγόνες μυδρίασης.','Λίγα λεπτά.','Καθόλου.','','Πολύ χρήσιμη για παρακολούθηση ενέσεων στο μάτι (ωχρά κηλίδα).'],
 ['OCT (optical coherence tomography)','A detailed “slice” of the retina and optic nerve. For macular degeneration, diabetic swelling, glaucoma.','Rest your chin and look at a light; the machine photographs without touching the eye.','Usually none; sometimes dilating drops.','A few minutes.','Not at all.','','Very useful for following eye injections (macular degeneration).']],
// ---------------- ΑΥΤΙΑ ----------------
['audiogram','ears','🎧',['Ακοόγραμμα','Πόσο καλά ακούτε χαμηλούς και ψηλούς ήχους στο κάθε αυτί.','Σε ήσυχο θάλαμο, με ακουστικά, πατάτε κουμπί ή σηκώνετε το χέρι όταν ακούτε έναν ήχο, όσο σιγανός κι αν είναι.','Αποφύγετε δυνατούς θορύβους 24 ώρες πριν. Αν έχετε κυψελίδα, καθαρίστε την πρώτα.','15–30 λεπτά.','Καθόλου.','Έως 20–25 dB: φυσιολογική ακοή · 26–40: ήπια απώλεια · 41–70: μέτρια · πάνω από 70: βαριά.','Η απώλεια ακοής στην ηλικία αυξάνει τη μοναξιά και την ξεχασιά — τα ακουστικά βοηθούν πολύ. Ξαφνική απώλεια στο ένα αυτί: γιατρός μέσα σε 1–2 μέρες.'],
 ['Audiogram (hearing test)','How well you hear low and high sounds in each ear.','In a quiet booth, with headphones, you press a button or raise a hand when you hear a sound, however faint.','Avoid loud noise for 24 hours before. If you have wax, have it cleaned first.','15–30 minutes.','Not at all.','Up to 20–25 dB: normal · 26–40: mild loss · 41–70: moderate · over 70: severe.','Hearing loss with age increases loneliness and forgetfulness — hearing aids help a lot. Sudden loss in one ear: doctor within 1–2 days.']],
['tympano','ears','👂',['Τυμπανόγραμμα','Πώς κινείται το τύμπανο — δείχνει υγρό πίσω από το τύμπανο (συχνό στα παιδιά) ή «βουλωμένη» ευσταχιανή.','Μικρό λαστιχάκι στο αυτί αλλάζει λίγο την πίεση.','Καμία.','Λίγα δευτερόλεπτα για κάθε αυτί.','Καθόλου — νιώθετε λίγη πίεση.','Φυσιολογική καμπύλη = τύπος Α.','Χρήσιμο μετά από ωτίτιδα, σε βουλωμένα αυτιά μετά από πτήση ή κρυολόγημα.'],
 ['Tympanometry','How the eardrum moves — shows fluid behind the drum (common in children) or a blocked Eustachian tube.','A small rubber tip in the ear changes the pressure slightly.','None.','A few seconds per ear.','Not at all — you feel slight pressure.','Normal curve = type A.','Useful after ear infections, blocked ears after flights or colds.']],
['earclean','ears','🧴',['Ωτοσκόπηση και αφαίρεση κυψελίδας','Ο γιατρός κοιτά μέσα στο αυτί με φως· αν υπάρχει κυψελίδα (κερί), την αφαιρεί.','Με ωτοσκόπιο· η κυψελίδα βγαίνει με πλύση, αναρρόφηση ή μικρό εργαλείο.','Βάζετε 2–3 σταγόνες ελαιόλαδο ή σταγόνες από το φαρμακείο 3–5 μέρες πριν, για να μαλακώσει.','5–15 λεπτά.','Όχι συνήθως — λίγη ζάλη ή ενόχληση.','','Μην βάζετε μπατονέτες βαθιά — σπρώχνουν το κερί μέσα. Όχι πλύση αν είχατε τρύπα στο τύμπανο.'],
 ['Ear examination and wax removal','The doctor looks in the ear with a light; if there is wax, it is removed.','With an otoscope; wax is removed by irrigation, suction or a small tool.','Put 2–3 drops of olive oil or pharmacy drops in for 3–5 days before to soften it.','5–15 minutes.','Usually not — slight dizziness or discomfort.','','Do not push cotton buds deep — they push wax in. No irrigation if you have had a hole in the eardrum.']],
// ---------------- ΠΝΕΥΜΟΝΕΣ & ΥΠΝΟΣ ----------------
['spiro','lungs','🌬️',['Σπιρομέτρηση','Πόσο αέρα βγάζετε και πόσο γρήγορα. Για άσθμα, ΧΑΠ (χρόνια αποφρακτική πνευμονοπάθεια), δύσπνοια.','Παίρνετε βαθιά ανάσα και φυσάτε όσο πιο δυνατά και πολύ μπορείτε σε ένα σωληνάκι, με κλιπ στη μύτη. Ίσως ξανά μετά από εισπνοή φαρμάκου.','Όχι κάπνισμα 1 ώρα πριν, όχι βαρύ φαγητό 2 ώρες πριν, άνετα ρούχα. Ρωτήστε αν πρέπει να μη πάρετε τα εισπνεόμενα εκείνο το πρωί.','15–30 λεπτά.','Όχι — μπορεί να ζαλιστείτε ή να βήξετε λίγο.','FEV1/FVC κάτω από 0,7 δείχνει απόφραξη (π.χ. ΧΑΠ).','Κάθε καπνιστής ή πρώην καπνιστής άνω των 40 με βήχα ή λαχάνιασμα πρέπει να το κάνει.'],
 ['Spirometry (breathing test)','How much air you blow out and how fast. For asthma, COPD, breathlessness.','You take a deep breath and blow as hard and long as you can into a tube, with a nose clip. Maybe again after an inhaler.','No smoking 1 hour before, no heavy meal 2 hours before, comfortable clothes. Ask whether to skip your inhalers that morning.','15–30 minutes.','No — you may feel dizzy or cough a little.','FEV1/FVC below 0.7 shows obstruction (e.g. COPD).','Every smoker or ex-smoker over 40 with cough or breathlessness should have it.']],
['cxr','lungs','🩻',['Ακτινογραφία θώρακα','Πνεύμονες, καρδιά, πλευρά. Για πνευμονία, υγρό, μεγάλη καρδιά, όγκους.','Στέκεστε μπροστά σε πλάκα, παίρνετε ανάσα και την κρατάτε για ένα δευτερόλεπτο.','Βγάλτε κοσμήματα και σουτιέν με μεταλλικά. Πείτε αν μπορεί να είστε έγκυος.','Λίγα λεπτά.','Καθόλου.','','Πολύ μικρή ακτινοβολία (περίπου όσο λίγες μέρες φυσικής ακτινοβολίας).'],
 ['Chest X-ray','Lungs, heart, ribs. For pneumonia, fluid, enlarged heart, masses.','You stand against a plate, take a breath and hold it for a second.','Remove jewellery and bras with metal. Say if you might be pregnant.','A few minutes.','Not at all.','','Very low radiation (about a few days of natural background).']],
['oximetry','lungs','☝️',['Οξυμετρία (κορεσμός οξυγόνου)','Πόσο οξυγόνο έχει το αίμα (SpO₂) και τους παλμούς.','Μικρή «μανταλάκι» συσκευή στο δάχτυλο. Υπάρχει και για το σπίτι.','Ζεστά χέρια· όχι βερνίκι ή ψεύτικα νύχια. Καθίστε ήσυχα 1 λεπτό.','Λίγα δευτερόλεπτα.','Καθόλου.','95–100%: φυσιολογικό · 92–94%: προσοχή, γιατρός · κάτω από 92%: επείγει γιατρός.','Σε πολύ σκούρο δέρμα ή κρύα χέρια μπορεί να δείχνει λίγο ψηλότερα από το πραγματικό. Σε ΧΑΠ ο γιατρός ορίζει τον δικό σας στόχο.'],
 ['Pulse oximetry (oxygen saturation)','How much oxygen is in the blood (SpO₂) and the pulse.','A small clip on the finger. Home devices exist too.','Warm hands; no nail polish or false nails. Sit quietly for 1 minute.','A few seconds.','Not at all.','95–100%: normal · 92–94%: caution, see a doctor · below 92%: urgent doctor.','On very dark skin or cold hands it can read slightly higher than the truth. In COPD your doctor sets your own target.']],
['sleepstudy','lungs','😴',['Μελέτη ύπνου (πολυυπνογραφία)','Αν σταματά η αναπνοή στον ύπνο (άπνοια), πόσο πέφτει το οξυγόνο, πώς κοιμάστε.','Συσκευή με αισθητήρες στη μύτη, στο στήθος και στο δάχτυλο — στο σπίτι ή ένα βράδυ σε εργαστήριο ύπνου.','Κανονική μέρα, όχι αλκοόλ ή υπνωτικά εκείνο το βράδυ (εκτός αν σας πουν). Όχι καφές το απόγευμα.','Μία νύχτα.','Καθόλου.','AHI κάτω από 5: φυσιολογικό · 5–15 ήπια · 15–30 μέτρια · πάνω από 30 βαριά άπνοια.','Ροχαλητό, πνιγμός στον ύπνο, υπνηλία τη μέρα και ψηλή πίεση → ρωτήστε γι’ αυτή. Η άπνοια θεραπεύεται (μάσκα CPAP) και η ζωή αλλάζει.'],
 ['Sleep study (polysomnography)','Whether breathing stops in sleep (apnoea), how much oxygen drops, how you sleep.','A device with sensors on the nose, chest and finger — at home, or one night in a sleep lab.','Normal day, no alcohol or sleeping pills that night (unless told). No coffee in the afternoon.','One night.','Not at all.','AHI below 5: normal · 5–15 mild · 15–30 moderate · over 30 severe apnoea.','Snoring, choking in sleep, daytime sleepiness and high blood pressure → ask about it. Apnoea is treatable (CPAP mask) and life changes.']],
// ---------------- ΣΤΟΜΑΧΙ & ΕΝΤΕΡΟ ----------------
['gastroscopy','gut','🔭',['Γαστροσκόπηση','Οισοφάγος, στομάχι και δωδεκαδάκτυλο από μέσα. Για έλκος, γαστρίτιδα, παλινδρόμηση, αιμορραγία, δυσκολία στην κατάποση. Παίρνουν και βιοψίες (π.χ. για ελικοβακτηρίδιο).','Λεπτός εύκαμπτος σωλήνας με κάμερα μπαίνει από το στόμα. Με σπρέι στον λαιμό ή ελαφριά μέθη.','Νηστεία 6–8 ωρών (νερό ως 2 ώρες πριν). Ρωτήστε για αντιπηκτικά και φάρμακα διαβήτη. Συνοδός αν κάνετε μέθη — όχι οδήγηση εκείνη τη μέρα.','10–15 λεπτά.','Όχι — ενοχλεί λίγο στον λαιμό· με μέθη δεν θυμάστε σχεδόν τίποτα.','','Ο λαιμός μπορεί να πονά λίγο 1 μέρα. Αν μετά έχετε δυνατό πόνο, πυρετό ή μαύρα κόπρανα, ειδοποιήστε αμέσως.'],
 ['Gastroscopy (upper endoscopy)','Oesophagus, stomach and duodenum from inside. For ulcer, gastritis, reflux, bleeding, swallowing trouble. Biopsies are taken too (e.g. for H. pylori).','A thin flexible tube with a camera goes in through the mouth. With throat spray or light sedation.','Fast 6–8 hours (water until 2 hours before). Ask about blood thinners and diabetes medicines. Someone with you if sedated — no driving that day.','10–15 minutes.','No — mild throat discomfort; with sedation you remember little.','','The throat may be sore for a day. If afterwards you have strong pain, fever or black stools, call at once.']],
['colonoscopy','gut','🔬',['Κολονοσκόπηση','Όλο το παχύ έντερο από μέσα. Βρίσκει και αφαιρεί πολύποδες πριν γίνουν καρκίνος. Για αίμα στα κόπρανα, αλλαγή κενώσεων, αναιμία, προληπτικά από τα 45–50.','Με ελαφριά μέθη, λεπτός σωλήνας με κάμερα μπαίνει από τον πρωκτό.','Το πιο σημαντικό: καθαρό έντερο. 2–3 μέρες πριν: όχι φρούτα με σπόρια, λαχανικά, ψωμί ολικής. Την προηγούμενη: μόνο διαυγή υγρά και το καθαρτικό διάλυμα όπως λέει ο γιατρός. Σταματήστε σίδηρο 7 μέρες πριν. Ρωτήστε για αντιπηκτικά. Συνοδός.','20–45 λεπτά.','Συνήθως όχι — με μέθη κοιμάστε. Μετά λίγα αέρια και φούσκωμα.','','Το καθαρτικό είναι το πιο κουραστικό κομμάτι — μείνετε κοντά σε τουαλέτα. Αν όλα είναι καθαρά, ξανά σε 10 χρόνια.'],
 ['Colonoscopy','The whole large bowel from inside. It finds and removes polyps before they become cancer. For blood in stool, bowel change, anaemia, screening from 45–50.','Under light sedation a thin tube with a camera goes in through the back passage.','Most important: a clean bowel. 2–3 days before: no seeded fruit, vegetables, wholemeal bread. Day before: clear fluids only and the bowel prep as instructed. Stop iron 7 days before. Ask about blood thinners. Someone to take you home.','20–45 minutes.','Usually not — sedated you doze. Afterwards some wind and bloating.','','The prep is the hardest part — stay near a toilet. If all clear, again in 10 years.']],
['abdus','gut','🌀',['Υπερηχογράφημα κοιλίας','Συκώτι, χοληδόχος (πέτρες), πάγκρεας, νεφρά, σπλήνας, ουροδόχος κύστη, αορτή.','Ξαπλώνετε· ζελέ και κεφαλή υπερήχων στην κοιλιά.','Νηστεία 6 ωρών (για να φαίνεται η χοληδόχος). Για κύστη ή προστάτη: πιείτε 4–5 ποτήρια νερό 1 ώρα πριν και μην ουρήσετε.','15–30 λεπτά.','Καθόλου.','','Χωρίς ακτινοβολία — ασφαλές και στην εγκυμοσύνη. Το «λιπώδες ήπαρ» είναι πολύ συχνό εύρημα.'],
 ['Abdominal ultrasound','Liver, gallbladder (stones), pancreas, kidneys, spleen, bladder, aorta.','You lie down; gel and an ultrasound probe on the belly.','Fast 6 hours (so the gallbladder shows). For bladder or prostate: drink 4–5 glasses of water 1 hour before and do not pass urine.','15–30 minutes.','Not at all.','','No radiation — safe even in pregnancy. “Fatty liver” is a very common finding.']],
['ubt','gut','🫧',['Breath test για ελικοβακτηρίδιο (H. pylori)','Αν έχετε το μικρόβιο του στομαχιού που φέρνει γαστρίτιδα και έλκος.','Φυσάτε σε σακουλάκι, πίνετε ένα ειδικό διάλυμα και μετά από 15–30 λεπτά φυσάτε ξανά.','Νηστεία 6 ωρών. Σταματήστε φάρμακα για το στομάχι (ομεπραζόλη κ.λπ.) 2 εβδομάδες πριν και αντιβιώσεις 4 εβδομάδες πριν — αλλιώς βγαίνει ψευδώς αρνητικό.','30–40 λεπτά.','Καθόλου.','Θετικό = υπάρχει το μικρόβιο.','Γίνεται και 4 εβδομάδες μετά τη θεραπεία, για να δούμε αν «έφυγε».'],
 ['H. pylori breath test','Whether you have the stomach germ that causes gastritis and ulcers.','You blow into a bag, drink a special solution and after 15–30 minutes blow again.','Fast 6 hours. Stop stomach medicines (omeprazole etc.) 2 weeks before and antibiotics 4 weeks before — otherwise it can be falsely negative.','30–40 minutes.','Not at all.','Positive = the germ is present.','Also done 4 weeks after treatment, to check it has gone.']],
// ---------------- ΑΠΕΙΚΟΝΙΣΗ ----------------
['xray','imaging','🩻',['Ακτινογραφία','Κόκαλα (κατάγματα, αρθρίτιδα), πνεύμονες, μερικές φορές κοιλιά.','Στέκεστε ή ξαπλώνετε ακίνητοι για ένα δευτερόλεπτο.','Βγάλτε μεταλλικά αντικείμενα. Πείτε αν μπορεί να είστε έγκυος.','Λίγα λεπτά.','Καθόλου.','','Μικρή ακτινοβολία. Δεν δείχνει καλά μαλακά μόρια (συνδέσμους, δίσκους) — γι’ αυτά χρειάζεται μαγνητική ή υπέρηχος.'],
 ['X-ray','Bones (fractures, arthritis), lungs, sometimes abdomen.','You stand or lie still for a second.','Remove metal objects. Say if you might be pregnant.','A few minutes.','Not at all.','','Low radiation. It does not show soft tissue (ligaments, discs) well — those need MRI or ultrasound.']],
['ct','imaging','🖥️',['Αξονική τομογραφία (CT)','Λεπτομερείς «φέτες» του σώματος: εγκέφαλος, θώρακας, κοιλιά, κόκαλα. Γρήγορη — χρήσιμη στα επείγοντα.','Ξαπλώνετε σε κρεβάτι που περνά από έναν «δακτύλιο». Μερικές φορές σκιαγραφικό στη φλέβα ή για να πιείτε.','Με σκιαγραφικό: νηστεία 4 ωρών, κρεατινίνη πριν, πείτε για αλλεργία, νεφρά, μεταφορμίνη, θυρεοειδή. Πείτε αν μπορεί να είστε έγκυος.','5–20 λεπτά.','Όχι — το σκιαγραφικό φέρνει ζέστη και αίσθηση ότι ουρείτε, για λίγα δευτερόλεπτα.','','Έχει περισσότερη ακτινοβολία από την ακτινογραφία — γίνεται όταν χρειάζεται. Πιείτε πολύ νερό μετά το σκιαγραφικό.'],
 ['CT scan','Detailed “slices” of the body: brain, chest, abdomen, bones. Fast — useful in emergencies.','You lie on a bed that passes through a “ring”. Sometimes contrast in a vein or to drink.','With contrast: fast 4 hours, creatinine test first, tell them about allergy, kidneys, metformin, thyroid. Say if you might be pregnant.','5–20 minutes.','No — contrast feels warm and like passing urine, for a few seconds.','','More radiation than an X-ray — done when needed. Drink plenty of water after contrast.']],
['mri','imaging','🧲',['Μαγνητική τομογραφία (MRI)','Πολύ λεπτομερείς εικόνες μαλακών ιστών: εγκέφαλος, σπονδυλική στήλη, δίσκοι, αρθρώσεις, σύνδεσμοι.','Ξαπλώνετε ακίνητοι μέσα σε «τούνελ» με δυνατούς θορύβους (σας δίνουν ωτοασπίδες). Μερικές φορές σκιαγραφικό (γαδολίνιο).','Πείτε ΟΠΩΣΔΗΠΟΤΕ αν έχετε βηματοδότη, απινιδωτή, μεταλλικά θραύσματα, εμφυτεύματα στο αυτί, αντλία. Βγάλτε όλα τα μεταλλικά. Αν έχετε κλειστοφοβία, ζητήστε ηρεμιστικό ή ανοιχτό μαγνήτη.','20–60 λεπτά.','Καθόλου — μόνο θόρυβος και ακινησία.','','Δεν έχει ακτινοβολία. Τα περισσότερα σύγχρονα εμφυτεύματα (αρθροπλαστικές) επιτρέπουν μαγνητική — φέρτε την κάρτα τους.'],
 ['MRI scan','Very detailed images of soft tissue: brain, spine, discs, joints, ligaments.','You lie still in a “tunnel” with loud noises (earplugs given). Sometimes contrast (gadolinium).','You MUST say if you have a pacemaker, defibrillator, metal fragments, ear implants, a pump. Remove all metal. If claustrophobic, ask for a relaxant or an open scanner.','20–60 minutes.','Not at all — only noise and keeping still.','','No radiation. Most modern implants (joint replacements) allow MRI — bring their card.']],
['us','imaging','📡',['Υπερηχογράφημα (γενικά)','Εικόνα με ηχητικά κύματα: θυρεοειδής, μαστοί, κοιλιά, αγγεία, μύες, εγκυμοσύνη.','Ζελέ και κεφαλή που γλιστρά στο δέρμα.','Εξαρτάται από την περιοχή (π.χ. νηστεία για κοιλιά, γεμάτη κύστη για πύελο).','10–30 λεπτά.','Καθόλου.','','Χωρίς ακτινοβολία — μπορεί να επαναλαμβάνεται χωρίς φόβο.'],
 ['Ultrasound (general)','Pictures made with sound waves: thyroid, breasts, abdomen, vessels, muscles, pregnancy.','Gel and a probe that glides over the skin.','Depends on the area (e.g. fasting for abdomen, full bladder for pelvis).','10–30 minutes.','Not at all.','','No radiation — can be repeated without worry.']],
['dexa','imaging','🦴',['Μέτρηση οστικής πυκνότητας (DEXA)','Πόσο γερά είναι τα κόκαλα — για οστεοπόρωση και κίνδυνο κατάγματος.','Ξαπλώνετε ακίνητοι ενώ ένας βραχίονας περνά πάνω από τη μέση και το ισχίο.','Μην πάρετε ασβέστιο 24 ώρες πριν. Όχι μεταλλικά (φερμουάρ, ζώνη). Όχι αν κάνατε εξέταση με σκιαγραφικό την τελευταία εβδομάδα.','10–20 λεπτά.','Καθόλου.','T-score: −1 και πάνω φυσιολογικό · −1 έως −2,5 οστεοπενία · −2,5 και κάτω οστεοπόρωση.','Πολύ μικρή ακτινοβολία. Επαναλαμβάνεται συνήθως κάθε 2 χρόνια σε θεραπεία.'],
 ['Bone density scan (DEXA)','How strong the bones are — for osteoporosis and fracture risk.','You lie still while an arm passes over the lower back and hip.','Do not take calcium 24 hours before. No metal (zips, belt). Not if you had a contrast test in the last week.','10–20 minutes.','Not at all.','T-score: −1 or above normal · −1 to −2.5 osteopenia · −2.5 or below osteoporosis.','Very low radiation. Usually repeated every 2 years on treatment.']],
// ---------------- ΓΥΝΑΙΚΑ ----------------
['mammo','women','🎀',['Μαμμογραφία','Ακτινογραφία του μαστού — βρίσκει καρκίνο πριν ψηλαφηθεί.','Κάθε μαστός πιέζεται ανάμεσα σε δύο πλάκες για λίγα δευτερόλεπτα, 2 λήψεις ο καθένας.','Όχι αποσμητικό, ταλκ ή κρέμα στις μασχάλες εκείνη τη μέρα. Καλύτερα όχι την εβδομάδα πριν την περίοδο (πιο ευαίσθητοι μαστοί). Φέρτε παλιές μαμμογραφίες.','15–20 λεπτά.','Η πίεση ενοχλεί για λίγα δευτερόλεπτα.','Αναφέρεται ως BI-RADS 1–2 (καλοήθη) έως 4–5 (χρειάζεται βιοψία).','Συχνά γίνεται μαζί και υπέρηχος μαστών, ειδικά σε πυκνούς μαστούς. Κάθε 2 χρόνια από 45–50 ως 74.'],
 ['Mammogram','An X-ray of the breast — finds cancer before it can be felt.','Each breast is pressed between two plates for a few seconds, 2 pictures each.','No deodorant, talc or cream under the arms that day. Better not the week before a period (breasts more tender). Bring old mammograms.','15–20 minutes.','The pressure is uncomfortable for a few seconds.','Reported as BI-RADS 1–2 (benign) up to 4–5 (needs biopsy).','A breast ultrasound is often done too, especially for dense breasts. Every 2 years from 45–50 to 74.']],
['pap','women','🌸',['Τεστ Παπ και HPV','Αλλαγές στα κύτταρα του τραχήλου της μήτρας ή τον ιό HPV — πριν γίνουν καρκίνος.','Ο γυναικολόγος παίρνει με ένα βουρτσάκι κύτταρα από τον τράχηλο, με κολποδιαστολέα.','Όχι στην περίοδο. 2 μέρες πριν: όχι σεξουαλική επαφή, κολπικές πλύσεις ή κολπικά φάρμακα.','Λίγα λεπτά· αποτέλεσμα σε 1–3 εβδομάδες.','Λίγη ενόχληση, όχι πόνος.','','Ένα «ύποπτο» αποτέλεσμα συνήθως σημαίνει απλώς επανάληψη ή κολποσκόπηση. Συνεχίζεται ως τα 65.'],
 ['Pap and HPV test','Changes in the cells of the cervix or the HPV virus — before they become cancer.','The gynaecologist takes cells from the cervix with a small brush, using a speculum.','Not during a period. 2 days before: no sex, douching or vaginal medicines.','A few minutes; results in 1–3 weeks.','Slight discomfort, not pain.','','An “abnormal” result usually just means a repeat or a colposcopy. Continues until 65.']],
['tvus','women','🌷',['Διακολπικό υπερηχογράφημα','Μήτρα και ωοθήκες από κοντά: ινομυώματα, κύστεις, ενδομήτριο, πρώιμη εγκυμοσύνη.','Λεπτή κεφαλή υπερήχων με προστατευτικό μπαίνει στον κόλπο.','Άδεια κύστη (ουρήστε πριν).','10–20 λεπτά.','Λίγη ενόχληση.','','Μετά την εμμηνόπαυση, κάθε αιμορραγία χρειάζεται αυτή την εξέταση για το πάχος του ενδομητρίου.'],
 ['Transvaginal ultrasound','Uterus and ovaries close up: fibroids, cysts, womb lining, early pregnancy.','A thin covered ultrasound probe goes into the vagina.','Empty bladder (pass urine before).','10–20 minutes.','Slight discomfort.','','After menopause, any bleeding needs this test to measure the womb lining.']],
// ---------------- ΑΝΔΡΑΣ ----------------
['dre','men','🔵',['Δακτυλική εξέταση προστάτη','Το μέγεθος και η υφή του προστάτη.','Ο ουρολόγος, με γάντι και λιπαντικό, ψηλαφεί τον προστάτη από τον πρωκτό.','Καμία.','Λίγα δευτερόλεπτα.','Ενοχλητικό, όχι επώδυνο.','','Γίνεται μαζί με το PSA. Μην ντρέπεστε — είναι ρουτίνα για τον ουρολόγο.'],
 ['Digital rectal exam (prostate)','The size and feel of the prostate.','The urologist, with a gloved lubricated finger, feels the prostate through the back passage.','None.','A few seconds.','Uncomfortable, not painful.','','Done together with PSA. Do not be embarrassed — it is routine for the urologist.']],
['uroflow','men','🚽',['Ουροροομετρία και υπέρηχος υπολείμματος','Πόσο δυνατά ουρείτε και αν μένουν ούρα στην κύστη. Για αδύναμη ροή, συχνουρία, προστάτη.','Ουρείτε σε ειδική τουαλέτα που μετρά τη ροή· μετά υπέρηχος στην κοιλιά για το υπόλειμμα.','Ελάτε με γεμάτη κύστη (πιείτε νερό) αλλά όχι υπερβολικά γεμάτη.','15–20 λεπτά.','Καθόλου.','Μέγιστη ροή πάνω από περίπου 15 ml/δευτ.: καλή.','Αν δεν «βγει» φυσικά από το άγχος, μπορεί να επαναληφθεί.'],
 ['Urine flow test and residual ultrasound','How strongly you pass urine and whether urine stays in the bladder. For weak stream, frequency, prostate.','You pass urine into a special toilet that measures the flow; then an ultrasound of the belly for what is left.','Come with a full bladder (drink water) but not over-full.','15–20 minutes.','Not at all.','Peak flow above about 15 ml/s: good.','If it does not come naturally because of nerves, it can be repeated.']],
// ---------------- ΕΓΚΕΦΑΛΟΣ & ΝΕΥΡΑ ----------------
['eeg','nerves','🧠',['Ηλεκτροεγκεφαλογράφημα (ΗΕΓ)','Την ηλεκτρική δραστηριότητα του εγκεφάλου — κυρίως για επιληψία και λιποθυμίες με σπασμούς.','Μικρά ηλεκτρόδια στο κεφάλι με πάστα. Κλείνετε τα μάτια, ανασαίνετε γρήγορα, κοιτάτε φώτα που αναβοσβήνουν.','Λουσμένα μαλλιά, χωρίς λάδι, λακ ή τζελ. Πάρτε τα φάρμακά σας κανονικά. Μερικές φορές ζητούν λίγο ύπνο την προηγούμενη νύχτα.','30–60 λεπτά.','Καθόλου — δεν περνά ρεύμα μέσα σας.','','Ένα φυσιολογικό ΗΕΓ δεν αποκλείει την επιληψία — η διάγνωση στηρίζεται κυρίως σε ό,τι είδαν οι γύρω.'],
 ['EEG (brain wave test)','The electrical activity of the brain — mainly for epilepsy and blackouts with jerking.','Small electrodes on the head with paste. You close your eyes, breathe fast, look at flashing lights.','Washed hair, no oil, spray or gel. Take your medicines as usual. Sometimes less sleep the night before is requested.','30–60 minutes.','Not at all — no current goes into you.','','A normal EEG does not rule out epilepsy — the diagnosis rests mainly on what witnesses saw.']],
['emg','nerves','⚡',['Ηλεκτρομυογράφημα / Νευρογράφημα','Πώς λειτουργούν τα νεύρα και οι μύες. Για σύνδρομο καρπιαίου σωλήνα, νευροπάθεια, ριζοπάθεια από δισκοκήλη.','Μικρά ηλεκτρικά ερεθίσματα στο δέρμα (σαν τσίμπημα) και, για τους μύες, πολύ λεπτή βελόνα.','Καθαρό δέρμα χωρίς κρέμες. Ζεστά χέρια και πόδια. Πείτε αν παίρνετε αντιπηκτικά.','30–60 λεπτά.','Λίγο ενοχλητικό — σύντομα τσιμπήματα.','','Χρήσιμο πριν από χειρουργείο καρπιαίου σωλήνα, για να φανεί πόσο έχει πιεστεί το νεύρο.'],
 ['EMG / nerve conduction study','How nerves and muscles work. For carpal tunnel syndrome, neuropathy, trapped nerves from a slipped disc.','Small electrical pulses on the skin (like a flick) and, for muscles, a very fine needle.','Clean skin without creams. Warm hands and feet. Say if you take blood thinners.','30–60 minutes.','A little uncomfortable — brief pricks.','','Useful before carpal tunnel surgery, to show how much the nerve is squeezed.']],
['memory','nerves','🧩',['Έλεγχος μνήμης (MMSE, MoCA)','Μνήμη, προσοχή, προσανατολισμό, λόγο. Για να ξεχωρίσει η φυσιολογική ξεχασιά από την ήπια γνωστική διαταραχή ή την άνοια.','Ερωτήσεις και μικρές ασκήσεις με χαρτί και μολύβι (π.χ. ζωγραφίζετε ρολόι, θυμάστε λέξεις).','Φέρτε τα γυαλιά και τα ακουστικά σας. Καλό να έρθει και ένας συγγενής που σας ξέρει.','10–20 λεπτά.','Καθόλου.','MoCA: 26 και πάνω (από 30) θεωρείται φυσιολογικό.','Συχνά γίνονται μαζί αιματολογικές (Β12, θυρεοειδής) και απεικόνιση εγκεφάλου — κάποιες αιτίες ξεχασιάς θεραπεύονται.'],
 ['Memory test (MMSE, MoCA)','Memory, attention, orientation, language. To tell normal forgetfulness from mild cognitive impairment or dementia.','Questions and small tasks with paper and pencil (e.g. drawing a clock, remembering words).','Bring your glasses and hearing aids. A relative who knows you well should come too.','10–20 minutes.','Not at all.','MoCA: 26 or above (out of 30) is considered normal.','Blood tests (B12, thyroid) and brain imaging are often done too — some causes of forgetfulness are treatable.']],
// ---------------- ΔΕΡΜΑ & ΑΛΛΕΡΓΙΕΣ ----------------
['dermoscopy','skin','🔍',['Δερματοσκόπηση / χαρτογράφηση σπίλων','Ο δερματολόγος εξετάζει τις ελιές με μεγεθυντικό φως για σημάδια μελανώματος. Η χαρτογράφηση τις φωτογραφίζει για σύγκριση.','Με δερματοσκόπιο ή κάμερα πάνω στο δέρμα.','Όχι μέικ-απ ή βερνίκι νυχιών. Όχι μαύρισμα ή αυτομαύρισμα πριν.','15–30 λεπτά.','Καθόλου.','','Προσέξτε μια ελιά αν: δεν είναι συμμετρική, έχει ακανόνιστα όρια, έχει πολλά χρώματα, είναι μεγαλύτερη από 6 χιλ. ή αλλάζει (κανόνας ABCDE).'],
 ['Dermoscopy / mole mapping','The dermatologist examines moles with a magnifying light for signs of melanoma. Mapping photographs them for comparison.','With a dermatoscope or camera on the skin.','No make-up or nail polish. No tanning or self-tan before.','15–30 minutes.','Not at all.','','Remember ABCDE: Asymmetry, Border irregular, Colours, Diameter over 6 mm, Evolving (changing).']],
['allergytest','skin','🤧',['Τεστ αλλεργίας (δερματικά και αίματος)','Σε τι είστε αλλεργικοί: γύρεις, ακάρεα, ζώα, τρόφιμα, τσιμπήματα.','Δερματικά (prick): μικρές σταγόνες αλλεργιογόνων στο αντιβράχιο και ελαφρύ τσίμπημα. Αίματος: ειδικές IgE.','Σταματήστε τα αντιισταμινικά 5–7 μέρες πριν τα δερματικά (ρωτήστε τον γιατρό). Για του αίματος δεν χρειάζεται.','Δερματικά: 20–30 λεπτά. Αίματος: μερικές μέρες.','Ελάχιστα — φαγούρα σαν τσίμπημα κουνουπιού.','Ένα «εξόγκωμα» μεγαλύτερο από 3 χιλ. θεωρείται θετικό.','Θετικό τεστ χωρίς συμπτώματα δεν σημαίνει πάντα αλλεργία — το αποτέλεσμα ερμηνεύεται μαζί με το ιστορικό σας.'],
 ['Allergy tests (skin and blood)','What you are allergic to: pollen, dust mites, animals, foods, stings.','Skin (prick): small drops of allergens on the forearm and a light prick. Blood: specific IgE.','Stop antihistamines 5–7 days before skin tests (ask your doctor). Not needed for blood tests.','Skin: 20–30 minutes. Blood: a few days.','Very little — itching like a mosquito bite.','A wheal larger than 3 mm is considered positive.','A positive test without symptoms does not always mean allergy — results are read together with your history.']]
];

const NOWIS = new Set(['bipolar','psychosis','eatingdis','delirium']);
let CRISIS_NOW = false;
function wisdomOf(c){
  if(CRISIS_NOW||c.sev==='emer'||NOWIS.has(c.id))return null;
  const d=D(c);const x=WIS[c.id];
  const w=d.w||(x&&x.w?L(x.w[0],x.w[1]):'');
  const ph=d.ph||(x&&x.ph?x.ph[LANG]:null)||(WISA[c.areas[0]]?WISA[c.areas[0]][LANG]:null);
  return {w,ph};
}
function wisdomHtml(c){
  const x=wisdomOf(c);if(!x)return '';
  return `${x.w?`<div class="sec friend"><b>💛 ${L('Λόγια φίλου','A friend’s words')}</b>${esc(x.w)}</div>`:''}`;
}
function sageHtml(c){
  const x=wisdomOf(c);if(!x||!x.ph)return '';const p=x.ph;
  return `<div class="sec sage"><b>🏛️ ${L('Η σοφία των αρχαίων Ελλήνων','Ancient Greek wisdom')}</b>
   <blockquote>«${esc(p.q)}»</blockquote><div class="sagewho">— ${esc(p.who)} · <i>${esc(p.src)}</i></div>
   <p class="today">🌿 <b class="in">${L('Σήμερα:','Today:')}</b> ${esc(p.t)}</p></div>`;
}

const RSETS={};
function regionConds(id){
  if(RSETS[id])return RSETS[id];
  const r=REGIONS[id];const cs=new Set((r.c||'').split(' ').filter(Boolean));const ids=new Set((r.ids||'').split(' ').filter(Boolean));
  const set=new Set();
  for(const c of COND){
    if(r.a&&c.areas.includes(r.a)){set.add(c.id);continue}
    if(ids.has(c.id)){set.add(c.id);continue}
    if(cs.size&&c.k.some((l,i)=>!c.ctx[i]&&l.some(x=>cs.has(x))))set.add(c.id);
  }
  return RSETS[id]=set;
}

COND.forEach(c=>c.k.forEach((l,i)=>l.forEach(x=>{if(x.startsWith('x:')&&!XTXT[x])XTXT[x]={el:c.el.s[i],en:c.en.s[i]}})));

function regionChips(id){

  const cnt={};
  for(const cid of set){const c=CBYID[cid];new Set(c.k.flatMap((l,i)=>c.ctx[i]?[]:l)).forEach(x=>{if(!isQ(x))cnt[x]=(cnt[x]||0)+1})}
  const main=Object.keys(cnt).filter(x=>!x.startsWith('x:'));const xs=Object.keys(cnt).filter(x=>x.startsWith('x:'));
  const first=pref.filter(x=>cnt[x]);const rest=main.filter(x=>!first.includes(x)).sort((a,b)=>cnt[b]-cnt[a]);
  return [...first,...rest,...xs.sort((a,b)=>cnt[b]-cnt[a])];
}

/* ---------------- ΣΥΜΠΤΩΜΑΤΑ ΣΗΜΕΙΟΥ ---------------- */
let SEL=new Set(),curRegion=null,FILTER='',SHOWALL=false;
function vRegion(id){
  const r=REGIONS[id];if(!r)return vBody();
  if(curRegion!==id){SEL=new Set();FILTER='';SHOWALL=false;curRegion=id}
  return header(L(r.el,r.en))+`<div class="card top">
   <h2>${r.e} ${L(r.el,r.en)}</h2>
   <p class="lead">${L('Πατήστε όσα έχετε και μετά «Έλεγχος».','Tap all that apply, then “Check”.')}</p>
   ${whoRow()}
   <input type="search" id="flt" placeholder="${t('filter')}" value="${esc(FILTER)}" oninput="FILTER=this.value;drawChips()">
   <div class="sp"></div><div class="chips" id="chips"></div>
  </div>
  <div class="dock"><button class="btn ghost small" onclick="go('body')">↩ ${t('back')}</button><button class="btn" id="chkBtn" onclick="doCheck()">🔍 ${t('check')}</button></div>`;
}
vRegion.after=()=>drawChips();
function drawChips(){
  const all=regionChips(curRegion);const f=norm(FILTER).trim();
  let list=f?all.filter(x=>{const n=norm(cLabel(x));return n.includes(f)||fuzzyHas(n,f)}):all;
  const more=!f&&!SHOWALL&&list.length>24;const shown=more?list.slice(0,24):list;
  SEL.forEach(x=>{if(!shown.includes(x))shown.unshift(x)});
  $('#chips').innerHTML=shown.map(x=>`<button class="chip${SEL.has(x)?' on':''}" onclick="togSym(this,'${x.replace(/'/g,"\\'")}')">${esc(cLabel(x))}</button>`).join('')+
   (more?`<button class="chip more" onclick="SHOWALL=true;drawChips()">➕ ${L('Περισσότερα','More')} (${list.length-24})</button>`:'')||`<p class="muted">—</p>`;
  updChk();
}
function togSym(b,k){if(SEL.has(k))SEL.delete(k);else SEL.add(k);b.classList.toggle('on');updChk()}
function updChk(){const b=$('#chkBtn');if(!b)return;b.innerHTML=`🔍 ${t('check')}${SEL.size?` (${SEL.size})`:''}`;b.disabled=!SEL.size}
function doCheck(){
  if(!SEL.size)return;
  LAST={mode:'region',region:curRegion,input:[...SEL].map(cLabel).join(', '),U:[...SEL],extra:[],who:WHO,date:Date.now()};store.set('last',LAST);go('results');
}

/* ---------------- ΥΠΟΛΟΓΙΣΜΟΣ ΑΠΟΤΕΛΕΣΜΑΤΩΝ ---------------- */
const REFQ=new Set(['one_side','both_sides','sudden','after_food','exertion','lying_down','at_night','morning','deep_breath','pressing','standing','bending','long_time']);
function compute(){
  const U=new Set([...(LAST.U||[]),...(LAST.extra||[])]);const who=LAST.who||'';
  if(who==='s')U.add('senior_hint');if(who==='c')U.add('child_hint');
  const named=LAST.mode==='text'?namedConds(COND,LAST.input):[];
  const all=rankConds(COND,U,{named,who:who==='m'||who==='f'||who==='c'?who:'',region:LAST.region?regionConds(LAST.region):null});
  const main=[...U].filter(x=>!isQ(x));
  const onlyGeneric=main.length>0&&main.every(x=>CN[x]&&CN[x].f.includes('g'));
  const top=pickTop(all,onlyGeneric?3:5);
  // ερωτήσεις διευκρίνισης
  const pool=all.slice(0,8);const sc={};
  pool.forEach(r=>{const c=CBYID[r.id];new Set(c.k.flatMap((l,i)=>c.ctx[i]&&!l.some(x=>REFQ.has(x))?[]:l)).forEach(x=>{if(U.has(x)||x.startsWith('x:'))return;if(isQ(x)&&!REFQ.has(x))return;if(['child_hint','senior_hint','pain_generic'].includes(x))return;(sc[x]=sc[x]||{s:0,n:0});sc[x].s+=r.s;sc[x].n++})});
  const ask=Object.entries(sc).filter(([x,v])=>v.n<pool.length||pool.length<=1).sort((a,b)=>b[1].s-a[1].s).slice(0,6).map(e=>e[0]);
  return {U,all,top,ask,onlyGeneric,main};
}

/* ---------------- ΑΠΟΤΕΛΕΣΜΑΤΑ ---------------- */
function condCard(r,open){
  const c=CBYID[r.id];if(!c)return '';const d=D(c);
  const bar=r.pc!=null?`<div class="fit"><div class="fitbar"><i style="width:${r.pc}%"></i></div><b>${r.pc}%</b></div>`:'';
  const ms=r.m&&r.m.length?`<div class="matched">✔️ ${t('yours')}: ${r.m.map(x=>`<mark>${esc(cLabel(x))}</mark>`).join(' ')}</div>`:'';
  return `<div class="card res ${c.sev}${r.urgent?' urgent':''}${open?' open':''}" onclick="if(!event.target.closest('a,button'))this.classList.toggle('open')">
   <div class="hd"><div style="flex:1"><h3>${esc(d.n)}</h3><span class="tag ${c.sev}">${t('sev')[c.sev]}</span>${bar}</div><span class="arrow">▼</span></div>
   ${ms}<div class="body">${condBody(c)}</div></div>`;
}

  const d=D(c);const en=c.en.n.split(/\s[—(]/)[0];
  return `${c.sev==='emer'?`<div class="urgentdoc">🚑 ${L('Επείγει η γνώμη γιατρού — πηγαίνετε αμέσως στα Επείγοντα','A doctor is needed urgently — go to the Emergency Department now')}</div>`:''}
   <div class="sec"><b>📋 ${t('syms')}</b>${d.s.map(gx).join(' · ')}</div>
   ${wisdomHtml(c)}
   <div class="sec"><b>🆘 ${t('aid')}</b>${gx(d.aid).replace(/\n/g,'<br>')}</div>
   ${sageHtml(c)}
   ${d.med?`<div class="sec warn"><b>💊 ${t('meds')}</b>${d.med.map(esc).join(' · ')}<br><small>⚠️ ${t('medwarn')}</small></div>`:''}
   <div class="sec"><b>👩‍⚕️ ${t('note')}</b>${gx(d.note)}</div>
   ${psyHelpLine(c)}

}

  if(!LAST||!LAST.U)return vDescribe();
  const R=compute();const backTo=LAST.mode==='region'?`region/${LAST.region}`:'describe';
  const rf=R.main.some(x=>CN[x]&&CN[x].f.includes('r'));const crisis=R.U.has('suicidal');CRISIS_NOW=crisis;
  const urgent=R.top.filter(r=>r.urgent),rest=R.top.filter(r=>!r.urgent);
  return header(t('results'))+`

   <p class="matched">${L('Τι είπατε:','What you said:')} ${[...R.U].filter(x=>x!=='child_hint'&&x!=='senior_hint').map(x=>`<mark>${esc(cLabel(x))}</mark>`).join(' ')||'<span class="muted">—</span>'}</p>
   ${R.top.length?`<p class="muted" style="margin-top:6px">${L('Οι πιο πιθανές αιτίες, πρώτα οι πιο πιθανές. Το ποσοστό δείχνει πόσο ταιριάζουν — δεν είναι διάγνωση. Πατήστε μια κάρτα για να δείτε τι να κάνετε.','The most likely causes, most likely first. The percentage shows how well they match — it is not a diagnosis. Tap a card to see what to do.')}</p>`:''}</div>
   ${R.onlyGeneric&&R.top.length?`<div class="card hint">💡 ${L('Αυτό το σύμπτωμα έχει πολλές πιθανές αιτίες. Πατήστε παρακάτω τι άλλο νιώθετε, για να βρούμε την πιο πιθανή.','This symptom has many possible causes. Tap below what else you feel, so we can find the most likely one.')}</div>`:''}
   ${urgent.length?`<h3 class="grp red">🚨 ${L('Πρώτα αποκλείστε αυτά (επείγοντα)','First rule these out (urgent)')}</h3>${urgent.map(r=>condCard(r,false)).join('')}`:''}
   ${rest.length?(urgent.length?`<h3 class="grp">🔎 ${L('Άλλες πιθανές αιτίες','Other possible causes')}</h3>`:'')+rest.map((r,i)=>condCard(r,i===0&&!urgent.length)).join(''):''}
   ${!R.top.length?`<div class="card"><h3>🤔 ${L('Δεν είμαστε ακόμη σίγουροι','We are not sure yet')}</h3><p>${L('Καμία πάθηση δεν ταιριάζει πάνω από 50%. Πείτε μας λίγο περισσότερα παρακάτω, ή διαλέξτε σημείο του σώματος.','No condition matches over 50%. Tell us a little more below, or choose a body area.')}</p><div class="sp"></div><button class="btn small" onclick="go('body')">🧍 ${t('t2')}</button></div>`:''}
   ${R.ask.length?`<div class="card refine"><h3>❓ ${L('Για πιο ακριβές αποτέλεσμα — έχετε μήπως και:','For a more accurate result — do you also have:')}</h3><div class="chips">${R.ask.map(x=>`<button class="chip" onclick="addExtra('${x}')">＋ ${esc(cLabel(x))}</button>`).join('')}</div>
     ${(LAST.extra||[]).length?`<p class="muted" style="margin-top:10px">${L('Προσθέσατε:','You added:')} ${LAST.extra.map(x=>`<button class="chip on small" onclick="remExtra('${x}')">✓ ${esc(cLabel(x))} ✖</button>`).join(' ')}</p>`:''}</div>`:''}
   <p class="disc">${t('disc')}</p>
   <div class="dock"><button class="btn ghost small" onclick="go('${backTo}')">↩ ${t('back')}</button><button class="btn orange" onclick="saveForDoc(this)">🗒️ ${t('savedoc')}</button></div>`;
}
function addExtra(x){LAST.extra=[...(LAST.extra||[]),x];store.set('last',LAST);render()}
function remExtra(x){LAST.extra=(LAST.extra||[]).filter(y=>y!==x);store.set('last',LAST);render()}
function crisisBox(){return `<div class="crisis" role="alert"><b class="ct">💜 ${t('crisis')}</b>
 <p style="margin-top:8px">${L('Δεν είστε μόνοι, και αξίζετε βοήθεια <b>τώρα</b>. Παρακαλούμε μιλήστε <b>σήμερα</b> με <b>ψυχίατρο</b> ή με τον γιατρό σας. Αν νιώθετε ότι κινδυνεύετε αυτή τη στιγμή, καλέστε το 112 ή πηγαίνετε στα Επείγοντα του πλησιέστερου νοσοκομείου.','You are not alone, and you deserve help <b>now</b>. Please speak <b>today</b> with a <b>psychiatrist</b> or your doctor. If you feel in danger right now, call 112 or go to the nearest hospital emergency department.')}</p>
 <a class="alert112" href="tel:112" style="margin:12px 0"><span class="n">112</span>${L('Πατήστε για κλήση τώρα','Tap to call now')}</a>
 <p>🇨🇾 ${L('Κύπρος','Cyprus')}: ${L('Σαμαρείτες','Cyprus Samaritans')} <a href="tel:80007773">8000 7773</a> <small>(${L('δωρεάν, κάθε μέρα 16:00–24:00','free, daily 16:00–24:00')})</small> · ${L('Επείγοντα','Emergency')} <a href="tel:112">112</a> / <a href="tel:199">199</a></p>
 <p style="margin-top:6px">🇬🇷 ${L('Ελλάδα','Greece')}: ${L('Γραμμή Παρέμβασης για την Αυτοκτονία','Suicide Prevention Line')} <a href="tel:1018">1018</a> · <a href="tel:112">112</a></p>
 <p style="margin-top:8px">🤝 ${L('Πείτε το και σε έναν άνθρωπο που εμπιστεύεστε, και μη μείνετε μόνοι απόψε.','Tell someone you trust too, and do not stay alone tonight.')}</p></div>`}
function saveForDoc(b){
  if(!LAST)return;const R=compute();const arr=store.get('checks',[]);
  arr.unshift({date:LAST.date,input:LAST.input+((LAST.extra||[]).length?', '+LAST.extra.map(cLabel).join(', '):''),top:R.top.slice(0,3).map(r=>r.id)});store.set('checks',arr.slice(0,8));
  const doc=store.get('doc',{});if(!doc.feel){doc.feel=LAST.input;store.set('doc',doc)}
  b.textContent=t('saved');b.disabled=true;
}

function sheet(html){closeSheet();const d=document.createElement('div');d.className='sheet';d.id='sheet';d.innerHTML=`<div class="box">${html}</div>`;d.onclick=e=>{if(e.target===d)closeSheet()};document.body.appendChild(d)}

/* ---------------- ΕΞΗΓΗΣΕΙΣ ΣΥΝΤΟΜΟΓΡΑΦΙΩΝ ---------------- */
const ABK=Object.keys(ABBR).sort((a,b)=>b.length-a.length);
const ABRE=new RegExp('(^|[^A-Za-zΑ-Ωα-ωΆ-ώ0-9])('+ABK.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![A-Za-zΑ-Ωα-ωΆ-ώ0-9])','g');
function gl(h){return h.replace(ABRE,(m,p,k)=>`${p}<button class="abbr" onclick="event.stopPropagation();explain('${k.replace(/'/g,"\\'")}')">${k}</button>`)}
const gx = s => gl(esc(s));
function explain(k){const a=ABBR[k];if(!a)return;sheet(`<h3>ℹ️ ${esc(k)}</h3><p style="font-size:1.1rem;line-height:1.55">${esc(L(a[0],a[1]))}</p><div class="sp"></div><button class="btn wide" onclick="closeSheet()">OK 👍</button>`)}

    <button class="tcard" style="--c:#e11d48" onclick="go('tool/bp')"><span class="e">🩺</span><span><b>${t('bp')}</b><small>${t('bps')}</small></span></button>

}
function startTest(id){TST={id,ans:[],step:0};go('test/'+id)}
function vTest(id){
  const x=TESTS.find(z=>z.id===id);if(!x)return vTests();
  if(!TST||TST.id!==id)TST={id,ans:[],step:0};
  const d=x[LANG];const n=x.q.length;
  if(TST.step>=n)return testResult(x);
  const q=x.q[TST.step];const qt=LANG==='el'?q.el:q.en;
  let opts;
  if(x.yn)opts=[[t('yes'),t('yes'),q.p||1,'yes'],[t('no'),t('no'),0,'no']];
  else if(x.scale)opts=x.scale.map(o=>[o[0],o[1],o[2],'']);
  else opts=q.o.map(o=>[o[0],o[1],o[2],'']);
  const cur=TST.ans[TST.step];
  return header(d.t)+`<div class="card top">
   <p class="muted">${x.i} ${d.t} · ${t('q')} ${TST.step+1} ${t('of')} ${n}</p>
   <div class="prog"><i style="width:${Math.round(100*TST.step/n)}%"></i></div>
   ${TST.step===0?`<p class="muted" style="margin-bottom:8px">${gx(d.d)}</p>`:''}
   <div class="qtext">${esc(qt)}</div>
   ${q.bmi?`<div class="grid2"><input type="number" id="bh" inputmode="decimal" placeholder="${t('height')}"><input type="number" id="bw" inputmode="decimal" placeholder="${t('weight')}"></div><button class="btn small violet" style="margin:10px 0" onclick="bmiPick()">🧮 ${t('calc')}</button>`:''}
   <div class="opts">${opts.map((o,i)=>`<button class="opt ${o[3]}${cur&&cur.i===i?' on':''}" onclick="answer(${i},${o[2]})">${esc(LANG==='el'?o[0]:o[1])}</button>`).join('')}</div>
  </div>
  <div class="dock"><button class="btn ghost small" onclick="${TST.step?'TST.step--;render()':`go('tests')`}">↩ ${TST.step?t('prev'):t('back')}</button></div>`;
}
function bmiPick(){const h=+$('#bh').value/100,w=+$('#bw').value;if(!h||!w)return;const b=w/(h*h);answer(b<25?0:b<=30?1:2,b<25?0:b<=30?1:3)}
function answer(i,p){TST.ans[TST.step]={i,p};TST.step++;render()}
function testResult(x){
  const d=x[LANG];const score=TST.ans.reduce((a,b)=>a+b.p,0);
  const r=x.r.find(z=>score>=z[0]&&score<=z[1])||x.r[x.r.length-1];const txt=LANG==='el'?r[3]:r[4];
  const res=store.get('tests',{});res[x.id]={score,txt,date:Date.now(),title:d.t};store.set('tests',res);
  const crisis=x.id==='phq9'&&x.q.some((q,i)=>q.crisis&&TST.ans[i]&&TST.ans[i].p>0);
  return header(d.t)+`
   ${crisis?crisisBox():''}
   <div class="gauge ${r[2]}"><div>${x.i} ${t('score')}</div><div class="sc">${score}</div><p>${esc(txt)}</p></div>
   <div class="card"><p>ℹ️ ${t('testnote')}</p><p class="muted" style="margin-top:6px">${gx(d.src)}</p></div>
   <div class="dock"><button class="btn ghost small" onclick="go('tests')">📋 ${t('alltests')}</button><button class="btn" onclick="startTest('${x.id}')">🔄 ${t('retake')}</button></div>`;
}
function vTool(k){
  if(k==='amsler')return header(L('Τεστ Amsler','Amsler grid'))+`<div class="card top"><h2>👁️ ${L('Τεστ Amsler — έλεγχος ωχράς κηλίδας','Amsler grid — macula check')}</h2>

const DT = {bp:'🩺',sugar:'🍬',weight:'⚖️',temp:'🌡️',pulse:'💓',spo2:'🫁',note:'📝'};
function rate(e){
  const v=e.v;
  if(e.type==='bp'){const k=bpClass(v[0],v[1]);return [['y','g','y','o','r','r'][k],t('bpRes')[k]]}
  if(e.type==='sugar'){const x=v[0],f=e.when!=='after';let k;if(x<70)k=0;else if(f?x<100:x<140)k=1;else if(f?x<126:x<200)k=2;else if(x<300)k=3;else k=4;return [['r','g','y','o','r'][k],t('sugarRes')[k]]}
  if(e.type==='temp'){const x=v[0];const k=x<35?0:x<37.5?1:x<38?2:x<39.5?3:4;return [['r','g','y','o','r'][k],t('tempRes')[k]]}
  if(e.type==='pulse'){const x=v[0];const k=x<50?0:x<=100?1:x<=130?2:3;return [['y','g','o','r'][k],t('pulseRes')[k]]}
  if(e.type==='spo2'){const x=v[0];const k=x>=95?0:x>=92?1:2;return [['g','y','r'][k],t('spo2Res')[k]]}
  if(e.type==='weight'){const h=store.get('height',0);if(h){const b=v[0]/((h/100)**2);const k=b<18.5?0:b<25?1:b<30?2:3;return [['y','g','o','r'][k],`${t('bmi')} ${b.toFixed(1)}`]}return ['n','']}
  return ['n',''];
}
const fmtV = e => e.type==='bp'?`${e.v[0]}/${e.v[1]}${e.v[2]?` · ${e.v[2]} bpm`:''}`:e.type==='note'?esc(e.txt):`${e.v[0]} ${({sugar:'mg/dL',weight:'kg',temp:'°C',pulse:'bpm',spo2:'%'})[e.type]}`;
const fmtD = ts => new Date(ts).toLocaleString(LANG==='el'?'el-GR':'en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});

function chart(list){
  const W=600,H=220,P=34;const series=DTYPE==='bp'?[list.map(e=>e.v[0]),list.map(e=>e.v[1])]:[list.map(e=>e.v[0])];
  const vals=series.flat();let mn=Math.min(...vals),mx=Math.max(...vals);if(mx===mn){mx+=1;mn-=1}const pad=(mx-mn)*.15;mn-=pad;mx+=pad;
  const X=i=>P+(W-P*2)*(list.length===1?.5:i/(list.length-1)),Y=v=>H-P-(H-P*2)*(v-mn)/(mx-mn);
  const cols=['#e11d48','#3b82f6'];
  const lines=series.map((s,k)=>`<polyline fill="none" stroke="${cols[k]}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" points="${s.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>${s.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="5" fill="${cols[k]}"/>`).join('')}`).join('');
  const grid=[0,.5,1].map(f=>{const v=mn+(mx-mn)*f;return `<line x1="${P}" x2="${W-P}" y1="${Y(v)}" y2="${Y(v)}" stroke="currentColor" opacity=".15"/><text x="4" y="${Y(v)+5}" font-size="14" fill="currentColor" opacity=".7">${Math.round(v)}</text>`}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${grid}${lines}</svg>${DTYPE==='bp'?`<p class="muted"><span style="color:#e11d48">●</span> ${t('sys')} &nbsp; <span style="color:#3b82f6">●</span> ${t('dia')}</p>`:''}`;
}

let AQ='';
function vAll(){
  return header(t('t9'))+`<div class="card top"><h2>📚 ${t('t9')} <span class="muted">(${COND.length})</span></h2><input type="search" id="aq" placeholder="${t('search')}" value="${esc(AQ)}" oninput="AQ=this.value;drawAll()"><p class="muted" style="margin-top:8px">✍️ ${L('Γράψτε όπως το ξέρετε — βρίσκει και με ορθογραφικά λάθη.','Type it as you know it — it finds results even with spelling mistakes.')}</p></div><div class="alist" id="alist"></div>`;
}
vAll.after=()=>drawAll();
function drawAll(){
  const q=norm(AQ).trim();const coll=new Intl.Collator(LANG==='el'?'el':'en');
  const dotOf=c=>({emer:'r',risk:'o',caution:'y',norm:'g'})[c.sev];
  const item=c=>`<a class="aitem" href="#c/${c.id}"><span class="dot ${dotOf(c)}"></span>${esc(D(c).n)}</a>`;
  const byName=(a,b)=>coll.compare(D(a).n,D(b).n);
  if(!q){let last='';$('#alist').innerHTML=[...COND].sort(byName).map(c=>{const l=plain(D(c).n).trim()[0].toUpperCase();const head=l!==last?`<div class="letter">${l}</div>`:'';last=l;return head+item(c)}).join('');return}
  const nameHit=c=>{const n=norm(D(c).n);return n.includes(q)||fuzzyHas(n,q)};
  const names=COND.filter(nameHit).sort(byName);
  const syms=COND.filter(c=>!nameHit(c)&&(()=>{const tx=norm(D(c).s.join(' '));return tx.includes(q)||fuzzyHas(tx,q)})()).sort(byName);
  $('#alist').innerHTML=(names.length?`<div class="letter">🎯 ${L('Στο όνομα','In the name')}</div>`+names.map(item).join(''):'')+
    (syms.length?`<div class="letter">🔎 ${L('Στα συμπτώματα','In the symptoms')}</div>`+syms.map(item).join(''):'')+
    (!names.length&&!syms.length?`<p class="muted letter">${L('Δεν βρέθηκε. Δοκιμάστε μια άλλη λέξη ή το «Περιγράψτε τι νιώθετε».','Nothing found. Try another word or “Describe how you feel”.')}</p>`:'');
}
function vCond(id){const c=CBYID[id];if(!c)return vAll();
  return header(D(c).n)+condCard({id,m:[],pc:null},true)+`<div class="dock"><button class="btn ghost small" onclick="history.back()">↩ ${t('back')}</button><button class="btn" onclick="go('all')">📚 ${t('t9')}</button></div>`}

   ['📚','Cochrane','Διεθνές ερευνητικό δίκτυο','International research network','https://www.cochranelibrary.com/'],['🇪🇺','ECDC','Ευρωπαϊκό Κέντρο Ελέγχου Νόσων','European Centre for Disease Control','https://www.ecdc.europa.eu/'],
   ['🇺🇸','CDC','Κέντρα Ελέγχου Νοσημάτων ΗΠΑ','US Centers for Disease Control','https://www.cdc.gov/'],['🇬🇷','ΕΟΔΥ','Εθνικός Οργανισμός Δημόσιας Υγείας','Greek National Public Health Organisation','https://eody.gov.gr/'],
   ['💊','ΕΟΦ','Εθνικός Οργανισμός Φαρμάκων','Greek National Medicines Agency','https://www.eof.gr/'],['🇨🇾','Υπουργείο Υγείας Κύπρου','Κυπριακή Δημοκρατία','Republic of Cyprus Ministry of Health','https://www.moh.gov.cy/']];
  return header(t('sources'))+`<div class="card top"><h2>📚 ${t('sources')}</h2><p class="lead">${t('srcLead')}</p><div class="list">${S.map(s=>`<div class="it"><span class="e">${s[0]}</span><div><b><a href="${s[4]}" target="_blank" rel="noopener">${s[1]} 🔗</a></b><span>${L(s[2],s[3])}</span></div></div>`).join('')}</div></div>
   <div class="card"><button class="btn wide" onclick="go('phones')">📞 ${L('Χρήσιμα τηλέφωνα','Useful numbers')}</button></div>
   <div class="card"><p class="muted">⚠️ ${t('limit')}</p></div>`;
}

}
function vExam(id){
  const e=EXBY[id];if(!e)return vExams();const d=LANG==='el'?e[3]:e[4];
  const F=[['🔎',L('Τι δείχνει','What it shows'),d[1]],['🛠️',L('Πώς γίνεται','How it is done'),d[2]],['📝',L('Προετοιμασία','Preparation'),d[3]],['⏱️',L('Πόσο κρατά — αποτελέσματα','How long — results'),d[4]],['😌',L('Πονάει;','Does it hurt?'),d[5]],['📊',L('Τιμές — τι σημαίνουν','Values — what they mean'),d[6]],['💡',L('Καλό να ξέρετε','Good to know'),d[7]]];
  return header(d[0])+`<div class="card top"><h2>${e[2]} ${gx(esc(d[0]))}</h2>
   ${F.filter(f=>f[2]).map((f,i)=>`<div class="sec${i===2?' warn':''}${i===5?' vals':''}"><b>${f[0]} ${f[1]}</b>${gx(esc(f[2]))}</div>`).join('')}
   <p class="muted" style="margin-top:10px">ℹ️ ${L('Γενικές πληροφορίες. Οι φυσιολογικές τιμές διαφέρουν λίγο ανά εργαστήριο — τα αποτελέσματά σας τα εξηγεί ο γιατρός σας.','General information. Normal ranges differ slightly between labs — your doctor explains your results.')}</p></div>
   <div class="dock"><button class="btn ghost small" onclick="history.length>1?history.back():go('exams')">↩ ${t('back')}</button><button class="btn violet" onclick="EXC='${e[1]}';go('exams')">🔬 ${L('Όλες οι εξετάσεις','All tests')}</button></div>`;
}
function amsler(){let g='';for(let i=0;i<=20;i++){const p=10+i*14;g+=`<line x1="10" y1="${p}" x2="290" y2="${p}"/><line x1="${p}" y1="10" x2="${p}" y2="290"/>`}
  return `<svg viewBox="0 0 300 300" class="amsler" role="img" aria-label="Amsler"><rect x="10" y="10" width="280" height="280" fill="#fff"/><g stroke="#111" stroke-width="1">${g}</g><circle cx="150" cy="150" r="5" fill="#111"/></svg>`}
