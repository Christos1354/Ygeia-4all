const MEDCLASS = {
 paracetamol:['Παυσίπονο & αντιπυρετικό','Πόνος (κεφάλι, δόντια, μύες, περίοδος, αρθρώσεις) και πυρετός.','Μειώνει το σήμα του πόνου στον εγκέφαλο και ρίχνει τον πυρετό. Δεν είναι αντιφλεγμονώδες.','Σπάνια παρενέργειες όταν παίρνεται σωστά· σπάνια εξάνθημα.','Μην ξεπερνάτε τη μέγιστη ημερήσια δόση — η υπερδοσολογία βλάπτει σοβαρά το ήπαρ. Υπάρχει και μέσα σε σκευάσματα για κρυολόγημα/γρίπη: μην παίρνετε δύο μαζί. Προσοχή με αλκοόλ και ηπατοπάθεια.','Αν πήρατε περισσότερο από όσο πρέπει, πηγαίνετε στο νοσοκομείο ακόμη κι αν νιώθετε καλά.',
  'Painkiller & fever reducer','Pain (head, teeth, muscles, periods, joints) and fever.','Reduces pain signals in the brain and lowers fever. It is not an anti-inflammatory.','Rarely any side effects when taken correctly; rarely a rash.','Never exceed the maximum daily dose — overdose seriously damages the liver. It is also inside cold/flu remedies: do not take two together. Care with alcohol and liver disease.','If you took more than you should, go to hospital even if you feel fine.'],
 nsaid:['Αντιφλεγμονώδες παυσίπονο (ΜΣΑΦ)','Πόνος με φλεγμονή: μέση, αρθρώσεις, δόντια, περίοδος, διαστρέμματα· και πυρετός.','Μειώνει τις ουσίες της φλεγμονής (προσταγλανδίνες), άρα και τον πόνο, το πρήξιμο και τον πυρετό.','Ενόχληση ή κάψιμο στο στομάχι, ναυτία, κατακράτηση υγρών, άνοδος πίεσης.','Παίρνεται μαζί με φαγητό. Αποφύγετε αν έχετε έλκος ή αιμορραγία στομάχου, νεφρική ή καρδιακή ανεπάρκεια, αν παίρνετε αντιπηκτικά, ή στο τελευταίο τρίμηνο της εγκυμοσύνης. Μειώνει την ωφέλεια φαρμάκων πίεσης. Ηλικιωμένοι: μόνο για λίγες μέρες και με συμβουλή.','Μαύρα κόπρανα, εμετός με αίμα, πρήξιμο προσώπου, δύσπνοια ή πολύ λίγα ούρα: σταματήστε και ζητήστε βοήθεια αμέσως.',
  'Anti-inflammatory painkiller (NSAID)','Pain with inflammation: back, joints, teeth, periods, sprains; also fever.','Reduces inflammatory substances (prostaglandins), easing pain, swelling and fever.','Stomach upset or burning, nausea, fluid retention, raised blood pressure.','Take with food. Avoid with stomach ulcer or bleeding, kidney or heart failure, blood thinners, or late pregnancy. Weakens blood pressure medicines. Older people: only a few days and with advice.','Black stools, vomiting blood, facial swelling, breathlessness or very little urine: stop and get help at once.'],
 cox2:['Αντιφλεγμονώδες (αναστολέας COX-2)','Πόνος αρθρίτιδας, οστεοαρθρίτιδας, ουρικής αρθρίτιδας.','Αντιφλεγμονώδες με λιγότερη επιβάρυνση στο στομάχι από τα κλασικά.','Πρήξιμο ποδιών, άνοδος πίεσης, πονοκέφαλος, ζάλη.','Όχι σε καρδιοπάθεια, εγκεφαλικό ή ανεξέλεγκτη πίεση. Προσοχή στα νεφρά.','Πόνος στο στήθος, δύσπνοια, αδυναμία στη μία πλευρά: 112.',
  'Anti-inflammatory (COX-2 inhibitor)','Pain of arthritis, osteoarthritis, gout.','An anti-inflammatory that is gentler on the stomach than classic ones.','Swollen legs, raised blood pressure, headache, dizziness.','Not with heart disease, stroke or uncontrolled blood pressure. Care with kidneys.','Chest pain, breathlessness, one-sided weakness: call 112.'],
 aspirin:['Ασπιρίνη (ακετυλοσαλικυλικό οξύ)','Μικρή δόση (75-100 mg): πρόληψη εμφράγματος και εγκεφαλικού σε όσους το έχει πει ο γιατρός. Μεγαλύτερη δόση: πόνος, πυρετός.','Κάνει τα αιμοπετάλια λιγότερο «κολλώδη», ώστε να σχηματίζονται δυσκολότερα θρόμβοι.','Ενόχληση στο στομάχι, μελανιές, ευκολότερη αιμορραγία.','Ποτέ σε παιδιά και εφήβους κάτω των 16 (σύνδρομο Reye). Προσοχή με αντιπηκτικά και αντιφλεγμονώδη. Μην τη σταματήσετε μόνοι σας αν σας την έγραψε καρδιολόγος.','Μαύρα κόπρανα, εμετός με αίμα ή αιμορραγία που δεν σταματά: γιατρός αμέσως.',
  'Aspirin','Low dose (75-100 mg): prevents heart attack and stroke when prescribed. Higher dose: pain, fever.','Makes platelets less “sticky” so clots form less easily.','Stomach upset, bruising, bleeding more easily.','Never in children and teenagers under 16 (Reye’s syndrome). Care with blood thinners and anti-inflammatories. Do not stop on your own if a cardiologist prescribed it.','Black stools, vomiting blood or bleeding that will not stop: see a doctor at once.'],
 opioid_weak:['Ισχυρό παυσίπονο (οπιοειδές)','Μέτριος έως έντονος πόνος, όταν τα απλά παυσίπονα δεν αρκούν.','Δρα στους υποδοχείς του πόνου στον εγκέφαλο και στον νωτιαίο μυελό.','Δυσκοιλιότητα, ναυτία, ζάλη, υπνηλία, ξηροστομία.','Όχι με αλκοόλ ή υπνωτικά/ηρεμιστικά (κίνδυνος αναπνοής). Μην οδηγείτε αν νυστάζετε. Μπορεί να προκαλέσει εξάρτηση — μόνο όσο χρειάζεται. Η τραμαδόλη μαζί με αντικαταθλιπτικά μπορεί να προκαλέσει σοβαρή αντίδραση.','Πολύ αργή αναπνοή, έντονη υπνηλία ή σύγχυση: 112.',
  'Strong painkiller (opioid)','Moderate to severe pain when simple painkillers are not enough.','Acts on pain receptors in the brain and spinal cord.','Constipation, nausea, dizziness, drowsiness, dry mouth.','No alcohol or sleeping pills/sedatives (breathing risk). Do not drive if drowsy. Can cause dependence — only as long as needed. Tramadol with antidepressants can cause a serious reaction.','Very slow breathing, severe drowsiness or confusion: call 112.'],
 ppi:['Γαστροπροστασία (αναστολέας αντλίας πρωτονίων)','Καούρα, παλινδρόμηση, γαστρίτιδα, έλκος, προστασία στομάχου όταν παίρνετε αντιφλεγμονώδη ή ασπιρίνη· θεραπεία ελικοβακτηρίδιου.','Μειώνει πολύ την παραγωγή οξέος στο στομάχι.','Πονοκέφαλος, διάρροια ή δυσκοιλιότητα, φούσκωμα.','Παίρνεται συνήθως 30-60 λεπτά πριν το πρωινό. Μακροχρόνια χρήση: πιθανή έλλειψη μαγνησίου και Β12 και αυξημένος κίνδυνος καταγμάτων — ζητήστε από τον γιατρό να ελέγχει αν το χρειάζεστε ακόμη. Η απότομη διακοπή μπορεί να φέρει καούρα για λίγες μέρες.','Μαύρα κόπρανα, δυσκολία στην κατάποση, απώλεια βάρους ή επίμονη διάρροια: γιατρός.',
  'Stomach protector (proton pump inhibitor)','Heartburn, reflux, gastritis, ulcer, stomach protection with anti-inflammatories or aspirin; H. pylori treatment.','Strongly reduces stomach acid production.','Headache, diarrhoea or constipation, bloating.','Usually taken 30-60 minutes before breakfast. Long-term use: possible low magnesium and B12 and more fractures — ask your doctor to review whether you still need it. Stopping suddenly can bring a few days of heartburn.','Black stools, trouble swallowing, weight loss or persistent diarrhoea: see a doctor.'],
 antacid:['Αντιόξινο','Γρήγορη ανακούφιση από καούρα και ξινίλες.','Εξουδετερώνει το οξύ ή κάνει «στρώμα» που εμποδίζει την παλινδρόμηση.','Δυσκοιλιότητα ή διάρροια, φούσκωμα.','Παίρνετε το 2 ώρες μακριά από άλλα φάρμακα (μειώνει την απορρόφησή τους). Προσοχή σε νεφρική ανεπάρκεια.','Αν τη χρειάζεστε σχεδόν κάθε μέρα για πάνω από 2 εβδομάδες: γιατρός.',
  'Antacid','Quick relief of heartburn and acid.','Neutralises acid or forms a “raft” that blocks reflux.','Constipation or diarrhoea, bloating.','Keep 2 hours apart from other medicines (it reduces their absorption). Care with kidney failure.','If needed almost daily for over 2 weeks: see a doctor.'],
 antispasmodic:['Σπασμολυτικό κοιλιάς','Κράμπες και σπασμοί στην κοιλιά, ευερέθιστο έντερο, πόνος περιόδου.','Χαλαρώνει τους μυς του εντέρου και της κύστης.','Ξηροστομία, δυσκοιλιότητα, θολή όραση, ταχυπαλμία.','Προσοχή σε γλαύκωμα, διόγκωση προστάτη και ταχυκαρδία.','Πόνος κοιλιάς που χειροτερεύει, με πυρετό ή εμετό: γιατρός — μην τον «σκεπάζετε».',
  'Stomach antispasmodic','Abdominal cramps, IBS, period pain.','Relaxes the muscles of the gut and bladder.','Dry mouth, constipation, blurred vision, palpitations.','Caution with glaucoma, enlarged prostate and fast heart rate.','Worsening abdominal pain with fever or vomiting: see a doctor — do not mask it.'],
 antiemetic:['Αντιεμετικό','Ναυτία και εμετός.','Βοηθά το στομάχι να αδειάζει και μειώνει το σήμα της ναυτίας.','Υπνηλία, διάρροια· σπάνια ακούσιες κινήσεις (κυρίως η μετοκλοπραμίδη).','Μόνο για λίγες μέρες. Η δομπεριδόνη θέλει προσοχή σε καρδιοπάθεια και με κάποια φάρμακα (κίνδυνος αρρυθμίας).','Ακούσιες κινήσεις προσώπου ή γλώσσας, ταχυπαλμία ή εμετός που δεν σταματά: γιατρός.',
  'Anti-sickness medicine','Nausea and vomiting.','Helps the stomach empty and reduces nausea signals.','Drowsiness, diarrhoea; rarely involuntary movements (mainly metoclopramide).','Only for a few days. Domperidone needs care with heart disease and some medicines (arrhythmia risk).','Involuntary face or tongue movements, palpitations or vomiting that will not stop: see a doctor.'],
 loperamide:['Αντιδιαρροϊκό','Οξεία διάρροια χωρίς πυρετό ή αίμα.','Επιβραδύνει την κίνηση του εντέρου.','Δυσκοιλιότητα, φούσκωμα, κοιλιακές κράμπες.','Όχι αν έχετε πυρετό ή αίμα στα κόπρανα, ή μετά από αντιβίωση. Όχι σε μικρά παιδιά. Πάντα και υγρά/διάλυμα ενυδάτωσης.','Διάρροια πάνω από 2 μέρες, πυρετός, αίμα ή αφυδάτωση: γιατρός.',
  'Anti-diarrhoeal','Acute diarrhoea without fever or blood.','Slows bowel movement.','Constipation, bloating, cramps.','Not with fever or blood in stool, or after antibiotics. Not for young children. Always drink fluids/rehydration solution.','Diarrhoea over 2 days, fever, blood or dehydration: see a doctor.'],
 laxative_osmotic:['Ήπιο καθαρτικό (ωσμωτικό)','Δυσκοιλιότητα, και μακροχρόνια όταν χρειάζεται.','Κρατά νερό στο έντερο και μαλακώνει τα κόπρανα.','Φούσκωμα, αέρια, κοιλιακές κράμπες.','Θέλει 1-3 μέρες για να δράσει. Πίνετε αρκετό νερό.','Δυσκοιλιότητα νέα μετά τα 50, με αίμα ή απώλεια βάρους: γιατρός.',
  'Gentle (osmotic) laxative','Constipation, including long-term use when needed.','Keeps water in the bowel and softens stools.','Bloating, wind, cramps.','Takes 1-3 days to work. Drink enough water.','New constipation after 50, or with blood or weight loss: see a doctor.'],
 laxative_stim:['Καθαρτικό (διεγερτικό)','Περιστασιακή δυσκοιλιότητα.','Διεγείρει τις κινήσεις του εντέρου.','Κράμπες κοιλιάς, διάρροια.','Μόνο για λίγες μέρες. Όχι αν υποψιάζεστε απόφραξη ή σκωληκοειδίτιδα.','Έντονος πόνος κοιλιάς ή εμετός: γιατρός.',
  'Stimulant laxative','Occasional constipation.','Stimulates bowel movements.','Abdominal cramps, diarrhoea.','Only for a few days. Not if obstruction or appendicitis is suspected.','Severe abdominal pain or vomiting: see a doctor.'],
 metformin:['Αντιδιαβητικό (μετφορμίνη)','Διαβήτης τύπου 2 (και σε προδιαβήτη ή πολυκυστικές ωοθήκες όταν το πει ο γιατρός).','Μειώνει την παραγωγή σακχάρου από το ήπαρ και βοηθά την ινσουλίνη να δουλεύει καλύτερα.','Ναυτία, διάρροια, κοιλιακή ενόχληση (συνήθως τις πρώτες εβδομάδες), μεταλλική γεύση.','Παίρνεται με το φαγητό. Μακροχρόνια μπορεί να μειώσει τη Β12. Ενημερώστε τον γιατρό πριν από αξονική με σκιαγραφικό ή χειρουργείο. Προσοχή με αλκοόλ και νεφρική ανεπάρκεια. Συνήθως δεν προκαλεί υπογλυκαιμία μόνη της.','Έντονη κόπωση, πόνοι στους μυς, γρήγορη αναπνοή ή εμετός (σπάνια γαλακτική οξέωση): γιατρός αμέσως.',
  'Diabetes medicine (metformin)','Type 2 diabetes (also prediabetes or PCOS when prescribed).','Lowers sugar production by the liver and helps insulin work better.','Nausea, diarrhoea, stomach upset (usually first weeks), metallic taste.','Take with food. Long-term it may lower B12. Tell your doctor before a contrast scan or surgery. Care with alcohol and kidney failure. Usually does not cause hypos on its own.','Severe tiredness, muscle pain, fast breathing or vomiting (rare lactic acidosis): see a doctor at once.'],
 sulfonylurea:['Αντιδιαβητικό (σουλφονυλουρία)','Διαβήτης τύπου 2.','Βοηθά το πάγκρεας να βγάζει περισσότερη ινσουλίνη.','Υπογλυκαιμία (τρέμουλο, εφίδρωση, πείνα, σύγχυση), αύξηση βάρους.','Μην παραλείπετε γεύματα. Έχετε πάντα μαζί ζάχαρη ή χυμό. Μεγαλύτερος κίνδυνος υπογλυκαιμίας στους ηλικιωμένους.','Συχνές υπογλυκαιμίες: ενημερώστε τον γιατρό για αλλαγή.',
  'Diabetes medicine (sulfonylurea)','Type 2 diabetes.','Helps the pancreas release more insulin.','Low blood sugar (shaking, sweating, hunger, confusion), weight gain.','Do not skip meals. Always carry sugar or juice. Higher hypo risk in older people.','Frequent hypos: tell your doctor for a change.'],
 dpp4:['Αντιδιαβητικό (αναστολέας DPP-4, «γλιπτίνη»)','Διαβήτης τύπου 2.','Ενισχύει τις ορμόνες του εντέρου που αυξάνουν την ινσουλίνη μετά το φαγητό.','Πονοκέφαλος, ρινοφαρυγγίτιδα· σπάνια πόνος στις αρθρώσεις.','Συνήθως δεν προκαλεί υπογλυκαιμία μόνο του.','Έντονος πόνος στο πάνω μέρος της κοιλιάς που πάει στην πλάτη (σπάνια παγκρεατίτιδα): γιατρός αμέσως.',
  'Diabetes medicine (DPP-4 inhibitor, “gliptin”)','Type 2 diabetes.','Boosts gut hormones that raise insulin after meals.','Headache, cold-like symptoms; rarely joint pain.','Usually no hypos on its own.','Severe upper abdominal pain going to the back (rare pancreatitis): see a doctor at once.'],
 sglt2:['Αντιδιαβητικό (αναστολέας SGLT2, «γλιφλοζίνη»)','Διαβήτης τύπου 2· επίσης καρδιακή ανεπάρκεια και χρόνια νεφρική νόσος.','Αποβάλλει σάκχαρο από τα ούρα και προστατεύει καρδιά και νεφρά.','Μυκητιάσεις στα γεννητικά όργανα, ουρολοιμώξεις, συχνοουρία, δίψα.','Καλή υγιεινή στην περιοχή. Πίνετε νερό. Σε οξεία ασθένεια με εμετό ή χωρίς φαγητό ή πριν από χειρουργείο, ρωτήστε αν πρέπει να το σταματήσετε προσωρινά.','Ναυτία, εμετός, κοιλιακός πόνος, βαριά αναπνοή (σπάνια κετοξέωση ακόμη και με κανονικό σάκχαρο): γιατρός αμέσως.',
  'Diabetes medicine (SGLT2 inhibitor, “gliflozin”)','Type 2 diabetes; also heart failure and chronic kidney disease.','Removes sugar through the urine and protects heart and kidneys.','Genital thrush, urine infections, passing more urine, thirst.','Keep the area clean. Drink water. During acute illness with vomiting or not eating, or before surgery, ask whether to pause it.','Nausea, vomiting, abdominal pain, heavy breathing (rare ketoacidosis even with normal sugar): see a doctor at once.'],
 glp1:['Ένεση ή χάπι για διαβήτη/βάρος (GLP-1)','Διαβήτης τύπου 2· μερικά και για απώλεια βάρους· προστατεύουν την καρδιά.','Μιμείται ορμόνη του εντέρου: αυξάνει την ινσουλίνη, κόβει την όρεξη και αργεί το άδειασμα του στομάχου.','Ναυτία, εμετός, διάρροια ή δυσκοιλιότητα (συνήθως στην αρχή), μειωμένη όρεξη.','Μικρά γεύματα, σταματήστε να τρώτε μόλις χορτάσετε. Αγοράζετε μόνο από φαρμακείο με συνταγή — όχι από το ίντερνετ (πλαστά).','Έντονος πόνος κοιλιάς που πάει στην πλάτη, πόνος δεξιά κάτω από τα πλευρά ή εμετός που δεν σταματά: γιατρός.',
  'Injection or tablet for diabetes/weight (GLP-1)','Type 2 diabetes; some also for weight loss; they protect the heart.','Mimics a gut hormone: raises insulin, reduces appetite and slows stomach emptying.','Nausea, vomiting, diarrhoea or constipation (mostly at first), less appetite.','Small meals, stop when full. Buy only from a pharmacy with a prescription — not online (fakes).','Severe abdominal pain going to the back, pain under the right ribs or non-stop vomiting: see a doctor.'],
 insulin:['Ινσουλίνη','Διαβήτης τύπου 1 και πολλές φορές τύπου 2.','Αντικαθιστά την ινσουλίνη που λείπει και ρίχνει το σάκχαρο.','Υπογλυκαιμία, αύξηση βάρους, σκληρά σημεία αν κάνετε ένεση πάντα στο ίδιο σημείο.','Μετράτε σάκχαρο όπως σας είπαν. Αλλάζετε σημεία ένεσης. Έχετε πάντα μαζί ζάχαρη. Η ανοιχτή πένα φυλάσσεται σε θερμοκρασία δωματίου, οι κλειστές στο ψυγείο — όχι κατάψυξη.','Σάκχαρο κάτω από 70 που δεν ανεβαίνει, ή πάνω από 300 με εμετό: βοήθεια αμέσως.',
  'Insulin','Type 1 and often type 2 diabetes.','Replaces missing insulin and lowers blood sugar.','Low blood sugar, weight gain, lumps if you always inject in the same spot.','Test sugar as advised. Rotate injection sites. Always carry sugar. The pen in use stays at room temperature, unopened ones in the fridge — never frozen.','Sugar below 70 that will not rise, or above 300 with vomiting: get help at once.'],
 statin:['Υπολιπιδαιμικό (στατίνη) — για τη χοληστερόλη','Υψηλή χοληστερόλη και πρόληψη εμφράγματος και εγκεφαλικού.','Μειώνει την παραγωγή χοληστερόλης στο ήπαρ και σταθεροποιεί τις πλάκες στις αρτηρίες.','Πόνοι στους μυς, κόπωση, ενόχληση στο στομάχι· μικρή άνοδος σακχάρου.','Ο χυμός γκρέιπφρουτ αυξάνει κάποιες (σιμβαστατίνη, ατορβαστατίνη). Μην τη σταματήσετε μόνοι σας.','Έντονος πόνος ή αδυναμία στους μυς με σκούρα ούρα: σταματήστε και γιατρός αμέσως.',
  'Cholesterol medicine (statin)','High cholesterol and prevention of heart attack and stroke.','Lowers cholesterol made by the liver and stabilises artery plaques.','Muscle aches, tiredness, stomach upset; a small rise in blood sugar.','Grapefruit juice increases some (simvastatin, atorvastatin). Do not stop on your own.','Severe muscle pain or weakness with dark urine: stop and see a doctor at once.'],
 ezetimibe:['Υπολιπιδαιμικό (εζετιμίμπη)','Υψηλή χοληστερόλη, συχνά μαζί με στατίνη.','Μειώνει την απορρόφηση χοληστερόλης από το έντερο.','Διάρροια, κοιλιακός πόνος, κόπωση· σπάνια πόνοι μυών.','Συνήθως καλά ανεκτό.','Πόνοι μυών με σκούρα ούρα: γιατρός.',
  'Cholesterol medicine (ezetimibe)','High cholesterol, often with a statin.','Reduces cholesterol absorption from the gut.','Diarrhoea, abdominal pain, tiredness; rarely muscle aches.','Usually well tolerated.','Muscle pain with dark urine: see a doctor.'],
 betablocker:['Β-αναστολέας (καρδιά & πίεση)','Υψηλή πίεση, στηθάγχη, μετά από έμφραγμα, καρδιακή ανεπάρκεια, ταχυκαρδίες/μαρμαρυγή· μερικοί και για ημικρανία, τρόμο, άγχος.','Επιβραδύνει την καρδιά και μειώνει τη δύναμη με την οποία χτυπά.','Κόπωση, κρύα χέρια/πόδια, αργός σφυγμός, ζάλη, εφιάλτες, στυτική δυσλειτουργία.','ΜΗΝ το σταματήσετε απότομα (κίνδυνος στηθάγχης). Προσοχή σε άσθμα. Μπορεί να «κρύψει» τα σημάδια υπογλυκαιμίας.','Σφυγμός κάτω από 50 με ζάλη ή λιποθυμία, ή νέο λαχάνιασμα/σφύριγμα: γιατρός.',
  'Beta-blocker (heart & blood pressure)','High blood pressure, angina, after heart attack, heart failure, fast rhythms/AF; some for migraine, tremor, anxiety.','Slows the heart and reduces the force of each beat.','Tiredness, cold hands/feet, slow pulse, dizziness, nightmares, erectile problems.','Do NOT stop suddenly (angina risk). Care with asthma. Can mask signs of low blood sugar.','Pulse under 50 with dizziness or fainting, or new breathlessness/wheezing: see a doctor.'],
 ccb:['Αποκλειστής διαύλων ασβεστίου (πίεση)','Υψηλή πίεση και στηθάγχη.','Χαλαρώνει και ανοίγει τις αρτηρίες.','Πρήξιμο αστραγάλων, κοκκίνισμα προσώπου, πονοκέφαλος, ζάλη.','Ο χυμός γκρέιπφρουτ αυξάνει την επίδραση κάποιων. Σηκώνεστε αργά.','Ζάλη με λιποθυμία ή πολύ χαμηλή πίεση: γιατρός.',
  'Calcium channel blocker (blood pressure)','High blood pressure and angina.','Relaxes and widens the arteries.','Ankle swelling, flushing, headache, dizziness.','Grapefruit juice increases some. Stand up slowly.','Dizziness with fainting or very low pressure: see a doctor.'],
 acei:['Αναστολέας ΜΕΑ (πίεση, καρδιά, νεφρά)','Υψηλή πίεση, καρδιακή ανεπάρκεια, μετά από έμφραγμα, προστασία νεφρών στον διαβήτη.','Χαλαρώνει τα αγγεία μειώνοντας μια ορμόνη που τα σφίγγει.','Ξηρός ερεθιστικός βήχας, ζάλη, αύξηση καλίου.','Εξετάσεις αίματος (νεφρά, κάλιο) όπως πει ο γιατρός. Όχι σε εγκυμοσύνη. Προσοχή με αντιφλεγμονώδη και υποκατάστατα αλατιού με κάλιο. Σε έντονη διάρροια ή εμετό ρωτήστε αν πρέπει να το σταματήσετε προσωρινά.','Πρήξιμο χειλιών, γλώσσας ή λαιμού (αγγειοοίδημα): 112. Επίμονος βήχας: πείτε το στον γιατρό — υπάρχει εναλλακτική.',
  'ACE inhibitor (blood pressure, heart, kidneys)','High blood pressure, heart failure, after heart attack, kidney protection in diabetes.','Relaxes blood vessels by lowering a hormone that tightens them.','Dry tickly cough, dizziness, raised potassium.','Blood tests (kidneys, potassium) as advised. Not in pregnancy. Care with anti-inflammatories and potassium salt substitutes. With severe diarrhoea or vomiting ask whether to pause it.','Swelling of lips, tongue or throat (angioedema): call 112. Persistent cough: tell your doctor — there are alternatives.'],
 arb:['Αποκλειστής υποδοχέα αγγειοτασίνης («σαρτάνη») — πίεση','Υψηλή πίεση, καρδιακή ανεπάρκεια, προστασία νεφρών. Κάποια σκευάσματα περιέχουν και διουρητικό ή αμλοδιπίνη.','Εμποδίζει την ορμόνη που σφίγγει τα αγγεία.','Ζάλη, κόπωση, αύξηση καλίου· σπάνια βήχας.','Εξετάσεις για νεφρά και κάλιο. Όχι σε εγκυμοσύνη. Προσοχή με αντιφλεγμονώδη. Σε έντονη διάρροια ή εμετό ρωτήστε τον γιατρό.','Πρήξιμο προσώπου ή λαιμού: 112. Λιποθυμία ή πολύ χαμηλή πίεση: γιατρός.',
  'Angiotensin receptor blocker (“sartan”) — blood pressure','High blood pressure, heart failure, kidney protection. Some products also contain a diuretic or amlodipine.','Blocks the hormone that tightens blood vessels.','Dizziness, tiredness, raised potassium; rarely cough.','Kidney and potassium tests. Not in pregnancy. Care with anti-inflammatories. With severe diarrhoea or vomiting ask your doctor.','Swelling of face or throat: call 112. Fainting or very low pressure: see a doctor.'],
 thiazide:['Διουρητικό (θειαζιδικό)','Υψηλή πίεση, πρήξιμο.','Βοηθά τα νεφρά να αποβάλλουν αλάτι και νερό.','Συχνοουρία, ζάλη, χαμηλό κάλιο ή νάτριο, άνοδος ουρικού οξέος (ουρική αρθρίτιδα).','Παίρνεται το πρωί. Εξετάσεις αίματος. Πίνετε αρκετά υγρά στη ζέστη. Προσοχή σε ηλιοφάνεια (ευαισθησία δέρματος).','Σύγχυση, μεγάλη αδυναμία ή κράμπες (χαμηλό νάτριο/κάλιο): γιατρός.',
  'Diuretic (thiazide)','High blood pressure, swelling.','Helps the kidneys remove salt and water.','Passing more urine, dizziness, low potassium or sodium, raised uric acid (gout).','Take in the morning. Blood tests. Drink enough in hot weather. Skin may be sun-sensitive.','Confusion, great weakness or cramps (low sodium/potassium): see a doctor.'],
 loop:['Διουρητικό (της αγκύλης) — «χάπι για τα νερά»','Κατακράτηση υγρών: καρδιακή ανεπάρκεια, πρήξιμο ποδιών, νεφρά, ήπαρ.','Κάνει τα νεφρά να βγάζουν πολύ νερό και αλάτι.','Πολλή ούρηση, ζάλη, χαμηλό κάλιο, αφυδάτωση.','Παίρνεται το πρωί (για να μην ξυπνάτε τη νύχτα). Ζυγιστείτε κάθε μέρα αν έχετε καρδιακή ανεπάρκεια. Εξετάσεις αίματος.','Ζάλη, λιποθυμία, σύγχυση ή πολύ λίγα ούρα: γιατρός.',
  'Loop diuretic — “water tablet”','Fluid retention: heart failure, swollen legs, kidney or liver disease.','Makes the kidneys pass a lot of water and salt.','Lots of urine, dizziness, low potassium, dehydration.','Take in the morning (so you do not wake at night). Weigh daily if you have heart failure. Blood tests.','Dizziness, fainting, confusion or very little urine: see a doctor.'],
 mra:['Διουρητικό που κρατά κάλιο (σπιρονολακτόνη)','Καρδιακή ανεπάρκεια, δύσκολη υπέρταση, κίρρωση με υγρά, ακμή/τριχοφυΐα σε γυναίκες.','Εμποδίζει την αλδοστερόνη· αποβάλλει νερό αλλά κρατά κάλιο.','Αύξηση καλίου, ζάλη, διόγκωση στήθους στους άνδρες.','Εξετάσεις καλίου και νεφρών. Όχι υποκατάστατα αλατιού με κάλιο. Προσοχή με αναστολείς ΜΕΑ/σαρτάνες.','Μυϊκή αδυναμία ή ακανόνιστος σφυγμός (υψηλό κάλιο): γιατρός αμέσως.',
  'Potassium-sparing diuretic (spironolactone)','Heart failure, resistant hypertension, cirrhosis with fluid, acne/excess hair in women.','Blocks aldosterone; removes water but keeps potassium.','Raised potassium, dizziness, breast enlargement in men.','Potassium and kidney tests. No potassium salt substitutes. Care with ACE inhibitors/sartans.','Muscle weakness or irregular pulse (high potassium): see a doctor at once.'],
 doac:['Αντιπηκτικό (νεότερο, από το στόμα)','Πρόληψη εγκεφαλικού σε κολπική μαρμαρυγή· θεραπεία και πρόληψη θρόμβωσης (φλέβες ποδιών, πνευμονική εμβολή).','Εμποδίζει έναν παράγοντα πήξης, ώστε να μη σχηματίζονται θρόμβοι.','Μελανιές, αιμορραγία ούλων ή μύτης, πιο βαριά περίοδος.','Μην παραλείπετε δόσεις και μην το σταματάτε μόνοι σας. Ενημερώνετε κάθε γιατρό και οδοντίατρο. Όχι αντιφλεγμονώδη ή ασπιρίνη χωρίς συμβουλή. Ρωτάτε πριν από βότανα ή συμπληρώματα.','Μαύρα κόπρανα, αίμα σε ούρα/εμετό/βήχα, αιμορραγία που δεν σταματά ή χτύπημα στο κεφάλι: Επείγοντα.',
  'Anticoagulant (newer, oral)','Stroke prevention in atrial fibrillation; treatment and prevention of clots (leg veins, pulmonary embolism).','Blocks a clotting factor so clots do not form.','Bruising, bleeding gums or nose, heavier periods.','Do not miss doses or stop on your own. Tell every doctor and dentist. No anti-inflammatories or aspirin without advice. Ask before herbs or supplements.','Black stools, blood in urine/vomit/cough, bleeding that will not stop, or a head injury: go to A&E.'],
 vka:['Αντιπηκτικό (ανταγωνιστής βιταμίνης Κ)','Πρόληψη θρόμβων: μαρμαρυγή, μηχανικές βαλβίδες, θρομβώσεις.','Μειώνει τους παράγοντες πήξης που χρειάζονται βιταμίνη Κ.','Μελανιές, αιμορραγίες.','Χρειάζεται τακτική εξέταση INR. Σταθερή ποσότητα πράσινων λαχανικών (βιταμίνη Κ). Πάρα πολλά φάρμακα και αντιβιοτικά αλλάζουν τη δράση του — ρωτάτε πάντα. Όχι αλκοόλ σε υπερβολή.','Μαύρα κόπρανα, αίμα στα ούρα, έντονη αιμορραγία ή χτύπημα στο κεφάλι: Επείγοντα.',
  'Anticoagulant (vitamin K antagonist)','Clot prevention: atrial fibrillation, mechanical valves, thromboses.','Lowers clotting factors that need vitamin K.','Bruising, bleeding.','Needs regular INR tests. Keep green vegetables (vitamin K) steady. Very many medicines and antibiotics change its effect — always ask. No heavy drinking.','Black stools, blood in urine, heavy bleeding or a head injury: go to A&E.'],
 antiplatelet:['Αντιαιμοπεταλιακό','Μετά από έμφραγμα, στεντ ή εγκεφαλικό· περιφερική αρτηριοπάθεια.','Εμποδίζει τα αιμοπετάλια να κολλούν και να φτιάχνουν θρόμβους.','Μελανιές, αιμορραγία, ενόχληση στο στομάχι· η τικαγρελόρη μπορεί να δώσει αίσθημα δύσπνοιας.','ΜΗΝ το σταματήσετε χωρίς τον καρδιολόγο, ιδίως μετά από στεντ. Ενημερώνετε τον οδοντίατρο.','Μαύρα κόπρανα, αίμα σε εμετό ή ούρα: Επείγοντα.',
  'Antiplatelet','After heart attack, stent or stroke; peripheral artery disease.','Stops platelets sticking and forming clots.','Bruising, bleeding, stomach upset; ticagrelor can cause a feeling of breathlessness.','Do NOT stop without your cardiologist, especially after a stent. Tell your dentist.','Black stools, blood in vomit or urine: go to A&E.'],
 nitrate:['Νιτρώδες (για στηθάγχη)','Ανακούφιση ή πρόληψη πόνου στηθάγχης.','Ανοίγει γρήγορα τα αγγεία και μειώνει το φορτίο της καρδιάς.','Πονοκέφαλος, ζάλη, κοκκίνισμα.','Το σπρέι/υπογλώσσιο παίρνεται καθιστός. ΠΟΤΕ μαζί με σιλδεναφίλη ή ταδαλαφίλη (επικίνδυνη πτώση πίεσης).','Πόνος στο στήθος που δεν περνά 5 λεπτά μετά την πρώτη δόση: 112.',
  'Nitrate (for angina)','Relief or prevention of angina pain.','Rapidly widens vessels and reduces heart workload.','Headache, dizziness, flushing.','Use the spray/under-tongue tablet sitting down. NEVER with sildenafil or tadalafil (dangerous pressure drop).','Chest pain not gone 5 minutes after the first dose: call 112.'],
 antiarrhythmic:['Αντιαρρυθμικό (αμιωδαρόνη)','Κολπική μαρμαρυγή και άλλες αρρυθμίες.','Σταθεροποιεί τον ηλεκτρικό ρυθμό της καρδιάς.','Ευαισθησία στον ήλιο, αλλαγές θυρεοειδούς, ναυτία· σπάνια προβλήματα πνευμόνων ή ήπατος.','Αντηλιακό. Τακτικές εξετάσεις θυρεοειδούς, ήπατος, πνευμόνων. Πολλές αλληλεπιδράσεις (π.χ. με αντιπηκτικά και διγοξίνη).','Νέο λαχάνιασμα ή βήχας, λιποθυμία: γιατρός.',
  'Antiarrhythmic (amiodarone)','Atrial fibrillation and other arrhythmias.','Stabilises the heart’s electrical rhythm.','Sun sensitivity, thyroid changes, nausea; rarely lung or liver problems.','Sunscreen. Regular thyroid, liver, lung checks. Many interactions (e.g. blood thinners, digoxin).','New breathlessness or cough, fainting: see a doctor.'],
 digoxin:['Διγοξίνη (καρδιά)','Κολπική μαρμαρυγή (έλεγχος σφυγμού) και καρδιακή ανεπάρκεια.','Επιβραδύνει και δυναμώνει τον καρδιακό παλμό.','Ναυτία, ανορεξία, κόπωση.','Η σωστή δόση είναι λεπτή — εξετάσεις αίματος. Προσοχή σε νεφρά και χαμηλό κάλιο.','Ναυτία, εμετός, σύγχυση, θολή ή κιτρινωπή όραση, πολύ αργός σφυγμός (τοξικότητα): γιατρός αμέσως.',
  'Digoxin (heart)','Atrial fibrillation (rate control) and heart failure.','Slows and strengthens the heartbeat.','Nausea, poor appetite, tiredness.','The right dose is delicate — blood tests. Care with kidneys and low potassium.','Nausea, vomiting, confusion, blurred or yellowish vision, very slow pulse (toxicity): see a doctor at once.'],
 levothyroxine:['Θυρεοειδική ορμόνη (θυροξίνη)','Υποθυρεοειδισμός και μετά από αφαίρεση θυρεοειδούς.','Αντικαθιστά την ορμόνη που δεν φτιάχνει αρκετά ο θυρεοειδής.','Σωστή δόση: καμία. Πολύ μεγάλη δόση: ταχυπαλμία, τρέμουλο, αϋπνία, απώλεια βάρους.','Το πρωί με άδειο στομάχι, μόνο με νερό, 30-60 λεπτά πριν τον καφέ/φαγητό. 4 ώρες μακριά από σίδηρο, ασβέστιο, αντιόξινα. Έλεγχος TSH 6-8 εβδομάδες μετά από κάθε αλλαγή.','Ταχυπαλμία ή πόνος στο στήθος: γιατρός.',
  'Thyroid hormone (levothyroxine)','Underactive thyroid and after thyroid removal.','Replaces the hormone the thyroid does not make enough of.','At the right dose: none. Too high: palpitations, tremor, insomnia, weight loss.','Morning, empty stomach, water only, 30-60 minutes before coffee/food. 4 hours apart from iron, calcium, antacids. TSH check 6-8 weeks after each change.','Palpitations or chest pain: see a doctor.'],
 antithyroid:['Αντιθυρεοειδικό','Υπερθυρεοειδισμός.','Μειώνει την παραγωγή θυρεοειδικών ορμονών.','Εξάνθημα, φαγούρα, ναυτία, πόνοι αρθρώσεων.','Τακτικές εξετάσεις αίματος.','Πυρετός, πονόλαιμος ή στοματικές πληγές (σπάνια πτώση λευκών αιμοσφαιρίων): σταματήστε και γενική αίματος ΑΜΕΣΑ.',
  'Antithyroid medicine','Overactive thyroid.','Reduces thyroid hormone production.','Rash, itch, nausea, joint aches.','Regular blood tests.','Fever, sore throat or mouth ulcers (rare drop in white cells): stop and get a blood count AT ONCE.'],
 saba:['Εισπνεόμενο ανακούφισης (βρογχοδιασταλτικό)','Γρήγορη ανακούφιση από δύσπνοια και σφύριγμα σε άσθμα και ΧΑΠ.','Χαλαρώνει τους μυς των βρόγχων μέσα σε λίγα λεπτά.','Τρέμουλο, ταχυπαλμία, νευρικότητα.','Χρησιμοποιήστε θάλαμο εισπνοών για καλύτερο αποτέλεσμα. Αν το χρειάζεστε πάνω από 2-3 φορές την εβδομάδα, το άσθμα δεν είναι ελεγχόμενο — γιατρός.','Δεν βοηθά, δεν μπορείτε να μιλήσετε, μπλε χείλη: 112.',
  'Reliever inhaler (bronchodilator)','Quick relief of breathlessness and wheeze in asthma and COPD.','Relaxes airway muscles within minutes.','Tremor, palpitations, jitteriness.','Use a spacer for best effect. If you need it more than 2-3 times a week, asthma is not controlled — see a doctor.','Not helping, cannot speak, blue lips: call 112.'],
 ics_laba:['Εισπνεόμενο πρόληψης (κορτιζόνη + βρογχοδιασταλτικό)','Καθημερινός έλεγχος άσθματος και ΧΑΠ.','Η κορτιζόνη μειώνει τη φλεγμονή στους βρόγχους, το βρογχοδιασταλτικό τους κρατά ανοιχτούς για ώρες.','Βραχνάδα, μυκητίαση στο στόμα, πονόλαιμος, τρέμουλο.','Ξεπλύνετε το στόμα μετά από κάθε χρήση. Παίρνεται κάθε μέρα ακόμη κι αν είστε καλά.','Λευκές πλάκες στο στόμα ή συχνές κρίσεις: γιατρός.',
  'Preventer inhaler (steroid + bronchodilator)','Daily control of asthma and COPD.','The steroid calms airway inflammation; the bronchodilator keeps them open for hours.','Hoarseness, oral thrush, sore throat, tremor.','Rinse your mouth after each use. Use every day even when well.','White patches in the mouth or frequent attacks: see a doctor.'],
 lama:['Εισπνεόμενο μακράς δράσης (αντιχολινεργικό)','ΧΑΠ (και κάποιες μορφές άσθματος).','Κρατά τους βρόγχους ανοιχτούς για 24 ώρες.','Ξηροστομία, δυσκοιλιότητα, δυσκολία στην ούρηση.','Προσοχή σε γλαύκωμα και προστάτη. Η σκόνη να μην μπει στα μάτια.','Πόνος στο μάτι ή θολή όραση, ή κατακράτηση ούρων: γιατρός.',
  'Long-acting inhaler (antimuscarinic)','COPD (and some asthma).','Keeps the airways open for 24 hours.','Dry mouth, constipation, difficulty passing urine.','Care with glaucoma and prostate. Keep the powder out of the eyes.','Eye pain or blurred vision, or urine retention: see a doctor.'],
 montelukast:['Αντιλευκοτριενικό','Άσθμα (πρόληψη) και αλλεργική ρινίτιδα.','Μπλοκάρει ουσίες της αλλεργικής φλεγμονής.','Πονοκέφαλος, κοιλιακός πόνος.','Δεν είναι για κρίση άσθματος.','Αλλαγές διάθεσης, εφιάλτες, ανησυχία ή κατάθλιψη (και στα παιδιά): γιατρός.',
  'Leukotriene blocker','Asthma (prevention) and allergic rhinitis.','Blocks substances of allergic inflammation.','Headache, abdominal pain.','Not for an asthma attack.','Mood changes, nightmares, agitation or depression (also in children): see a doctor.'],
 antihistamine:['Αντιισταμινικό (αντιαλλεργικό)','Αλλεργική ρινίτιδα, κνίδωση, φαγούρα, αλλεργίες.','Μπλοκάρει την ισταμίνη που προκαλεί τα αλλεργικά συμπτώματα.','Ελαφριά υπνηλία (σε κάποιους), ξηροστομία, πονοκέφαλος.','Προσοχή στην οδήγηση αν νυστάζετε. Λιγότερο αλκοόλ.','Πρήξιμο χειλιών ή λαιμού, δύσπνοια: 112 (αναφυλαξία — το αντιισταμινικό δεν αρκεί).',
  'Antihistamine (anti-allergy)','Hay fever, hives, itching, allergies.','Blocks histamine, which causes allergy symptoms.','Mild drowsiness (in some), dry mouth, headache.','Care driving if drowsy. Less alcohol.','Swelling of lips or throat, breathlessness: call 112 (anaphylaxis — antihistamine is not enough).'],
 sedating_ah:['Αντιισταμινικό που φέρνει νύστα','Φαγούρα, άγχος (βραχυπρόθεσμα), ναυτία ταξιδιού, δυσκολία ύπνου.','Μπλοκάρει την ισταμίνη και ηρεμεί τον εγκέφαλο.','Υπνηλία, ξηροστομία, δυσκοιλιότητα, ζάλη.','Όχι οδήγηση. Όχι αλκοόλ. Ηλικιωμένοι: κίνδυνος σύγχυσης και πτώσεων.','Σύγχυση ή κατακράτηση ούρων: γιατρός.',
  'Sedating antihistamine','Itching, short-term anxiety, travel sickness, sleep problems.','Blocks histamine and calms the brain.','Drowsiness, dry mouth, constipation, dizziness.','No driving. No alcohol. Older people: risk of confusion and falls.','Confusion or urine retention: see a doctor.'],
 nasal_steroid:['Ρινικό σπρέι κορτιζόνης','Αλλεργική ρινίτιδα, χρόνια ρινίτιδα, ρινικοί πολύποδες.','Μειώνει τη φλεγμονή στη μύτη· θέλει μερικές μέρες για πλήρες αποτέλεσμα.','Ξηρότητα, τσούξιμο, λίγο αίμα στη μύτη.','Κατευθύνετε το σπρέι προς τα έξω (όχι στο διάφραγμα). Μπορεί να χρησιμοποιείται για μήνες.','Συχνή ρινορραγία ή πόνος στη μύτη: γιατρός.',
  'Steroid nasal spray','Hay fever, chronic rhinitis, nasal polyps.','Reduces nasal inflammation; full effect takes a few days.','Dryness, stinging, small nosebleeds.','Aim the spray outwards (away from the septum). Can be used for months.','Frequent nosebleeds or nasal pain: see a doctor.'],
 decongestant:['Αποσυμφορητικό σπρέι μύτης','Βουλωμένη μύτη σε κρυολόγημα.','Συσπά τα αγγεία της μύτης και την «ανοίγει» γρήγορα.','Τσούξιμο, ξηρότητα.','ΟΧΙ πάνω από 5-7 μέρες — μετά η μύτη βουλώνει χειρότερα («εθισμός»). Προσοχή σε υψηλή πίεση και γλαύκωμα. Όχι σε μικρά παιδιά χωρίς συμβουλή.','Αν δεν μπορείτε να το σταματήσετε: γιατρός ή φαρμακοποιός.',
  'Decongestant nasal spray','Blocked nose with a cold.','Narrows nasal vessels and quickly opens the nose.','Stinging, dryness.','NO more than 5-7 days — then the nose blocks worse (“rebound”). Care with high blood pressure and glaucoma. Not for young children without advice.','If you cannot stop using it: see a doctor or pharmacist.'],
 benzo:['Αγχολυτικό (βενζοδιαζεπίνη) — «ηρεμιστικό»','Έντονο άγχος, κρίσεις πανικού, αϋπνία — μόνο για λίγο διάστημα· μερικά για σπασμούς ή στέρηση αλκοόλ.','Ενισχύει το «φρένο» του εγκεφάλου (GABA) και ηρεμεί γρήγορα.','Υπνηλία, αστάθεια, μειωμένη μνήμη και συγκέντρωση.','Μπορεί να προκαλέσει εξάρτηση — όσο το δυνατόν μικρότερο διάστημα. ΜΗΝ το σταματήσετε απότομα μετά από καιρό. ΟΧΙ με αλκοόλ ή οπιοειδή (κίνδυνος αναπνοής). Όχι οδήγηση. Ηλικιωμένοι: μεγάλος κίνδυνος πτώσεων και σύγχυσης.','Πολύ αργή αναπνοή, βαθιά υπνηλία ή σύγχυση: 112.',
  'Anxiolytic (benzodiazepine) — “tranquilliser”','Severe anxiety, panic attacks, insomnia — short-term only; some for seizures or alcohol withdrawal.','Boosts the brain’s “brake” (GABA) and calms quickly.','Drowsiness, unsteadiness, poorer memory and concentration.','Can cause dependence — shortest time possible. Do NOT stop suddenly after long use. NO alcohol or opioids (breathing risk). No driving. Older people: high risk of falls and confusion.','Very slow breathing, deep drowsiness or confusion: call 112.'],
 zdrug:['Υπνωτικό','Αϋπνία — για λίγες μέρες ή εβδομάδες.','Βοηθά να κοιμηθείτε γρηγορότερα επηρεάζοντας το GABA του εγκεφάλου.','Υπνηλία το πρωί, ζάλη· σπάνια «υπνοβασία» ή πράξεις χωρίς ανάμνηση.','Παίρνεται ακριβώς πριν τον ύπνο, με 7-8 ώρες διαθέσιμες. Όχι αλκοόλ. Όχι οδήγηση το πρωί αν νυστάζετε. Εξάρτηση με μακρά χρήση.','Παράξενη συμπεριφορά στον ύπνο: σταματήστε και γιατρός.',
  'Sleeping pill','Insomnia — for a few days or weeks.','Helps you fall asleep faster by acting on brain GABA.','Morning drowsiness, dizziness; rarely “sleep-walking” or actions without memory.','Take right before bed with 7-8 hours available. No alcohol. No driving in the morning if drowsy. Dependence with long use.','Strange behaviour during sleep: stop and see a doctor.'],
 ssri:['Αντικαταθλιπτικό (SSRI)','Κατάθλιψη, άγχος, κρίσεις πανικού, ιδεοψυχαναγκαστική διαταραχή, μετατραυματικό στρες.','Αυξάνει τη σεροτονίνη στον εγκέφαλο· το όφελος φαίνεται σε 2-6 εβδομάδες.','Ναυτία, πονοκέφαλος, αϋπνία ή υπνηλία, εφίδρωση, σεξουαλικές δυσκολίες (συχνά βελτιώνονται σε λίγες εβδομάδες).','ΜΗΝ το σταματήσετε απότομα — η διακοπή γίνεται σταδιακά με τον γιατρό. Προσοχή με αντιφλεγμονώδη/αντιπηκτικά (αιμορραγία), τραμαδόλη, τριπτάνες, βαλσαμόχορτο. Ηλικιωμένοι: έλεγχος νατρίου.','Σκέψεις αυτοτραυματισμού (ιδίως στην αρχή ή σε νέους), ταραχή, υψηλός πυρετός με ρίγη και σύγχυση: γιατρός αμέσως ή 112.',
  'Antidepressant (SSRI)','Depression, anxiety, panic, OCD, PTSD.','Raises serotonin in the brain; benefit appears in 2-6 weeks.','Nausea, headache, insomnia or drowsiness, sweating, sexual problems (often improve within weeks).','Do NOT stop suddenly — taper with your doctor. Care with anti-inflammatories/blood thinners (bleeding), tramadol, triptans, St John’s wort. Older people: sodium check.','Thoughts of self-harm (especially early on or in young people), agitation, high fever with shivering and confusion: see a doctor at once or call 112.'],
 snri:['Αντικαταθλιπτικό (SNRI)','Κατάθλιψη, άγχος· η ντουλοξετίνη και για νευροπαθητικό πόνο και ινομυαλγία.','Αυξάνει σεροτονίνη και νοραδρεναλίνη.','Ναυτία, εφίδρωση, ξηροστομία, άνοδος πίεσης, ζάλη.','Σταδιακή διακοπή μόνο. Έλεγχος πίεσης. Ίδιες αλληλεπιδράσεις με τα SSRI.','Σκέψεις αυτοτραυματισμού ή έντονη ταραχή: γιατρός αμέσως.',
  'Antidepressant (SNRI)','Depression, anxiety; duloxetine also for nerve pain and fibromyalgia.','Raises serotonin and noradrenaline.','Nausea, sweating, dry mouth, raised blood pressure, dizziness.','Taper only. Check blood pressure. Same interactions as SSRIs.','Thoughts of self-harm or severe agitation: see a doctor at once.'],
 sedating_ad:['Αντικαταθλιπτικό που βοηθά και τον ύπνο','Κατάθλιψη με αϋπνία ή κακή όρεξη.','Επηρεάζει σεροτονίνη και ισταμίνη· φέρνει νύστα.','Υπνηλία, αύξηση όρεξης και βάρους, ζάλη.','Παίρνεται το βράδυ. Όχι αλκοόλ. Σταδιακή διακοπή.','Σκέψεις αυτοτραυματισμού ή πυρετός με πονόλαιμο: γιατρός.',
  'Antidepressant that also helps sleep','Depression with insomnia or poor appetite.','Acts on serotonin and histamine; causes drowsiness.','Drowsiness, increased appetite and weight, dizziness.','Take at night. No alcohol. Taper to stop.','Thoughts of self-harm or fever with sore throat: see a doctor.'],
 antipsychotic:['Αντιψυχωσικό','Σχιζοφρένεια, διπολική διαταραχή· σε μικρές δόσεις μερικές φορές για ύπνο, ταραχή ή κατάθλιψη.','Ρυθμίζει ντοπαμίνη και σεροτονίνη στον εγκέφαλο.','Υπνηλία, αύξηση βάρους και σακχάρου, ζάλη όταν σηκώνεστε, δυσκαμψία ή τρέμουλο.','Έλεγχος βάρους, σακχάρου, λιπιδίων. Στους ηλικιωμένους με άνοια αυξάνει τον κίνδυνο εγκεφαλικού — μόνο με αυστηρή ένδειξη.','Πολύ υψηλός πυρετός με δυσκαμψία και σύγχυση, ή ακούσιες κινήσεις: γιατρός αμέσως.',
  'Antipsychotic','Schizophrenia, bipolar disorder; low doses sometimes for sleep, agitation or depression.','Regulates dopamine and serotonin in the brain.','Drowsiness, weight and sugar gain, dizziness on standing, stiffness or tremor.','Monitor weight, sugar, lipids. In older people with dementia it raises stroke risk — only with strict need.','Very high fever with stiffness and confusion, or involuntary movements: see a doctor at once.'],
 dementia:['Φάρμακο για την άνοια','Νόσος Αλτσχάιμερ (και άλλες άνοιες).','Βοηθά τη χημική επικοινωνία στον εγκέφαλο· μπορεί να επιβραδύνει την επιδείνωση για κάποιο διάστημα.','Ναυτία, διάρροια, ζωηρά όνειρα, αργός σφυγμός, ζάλη.','Παίρνεται συνήθως το βράδυ ή το πρωί όπως πει ο γιατρός.','Λιποθυμία ή πολύ αργός σφυγμός: γιατρός.',
  'Dementia medicine','Alzheimer’s disease (and other dementias).','Helps chemical signalling in the brain; may slow decline for a time.','Nausea, diarrhoea, vivid dreams, slow pulse, dizziness.','Usually taken at night or morning as advised.','Fainting or very slow pulse: see a doctor.'],
 parkinson:['Φάρμακο για Πάρκινσον','Νόσος Πάρκινσον· μερικά και για σύνδρομο ανήσυχων ποδιών.','Αντικαθιστά ή μιμείται την ντοπαμίνη που λείπει.','Ναυτία, ζάλη όταν σηκώνεστε, υπνηλία, ακούσιες κινήσεις, παραισθήσεις.','Παίρνετε στις ίδιες ώρες κάθε μέρα. Η πρωτεΐνη του φαγητού μπορεί να μειώσει την απορρόφηση της λεβοντόπα. Οι αγωνιστές ντοπαμίνης μπορεί να φέρουν παρορμητική συμπεριφορά (τζόγος, αγορές). Μην σταματάτε απότομα.','Ξαφνική νύστα στην οδήγηση, παραισθήσεις ή παρορμητικότητα: γιατρός.',
  'Parkinson’s medicine','Parkinson’s disease; some also for restless legs.','Replaces or mimics missing dopamine.','Nausea, dizziness on standing, drowsiness, involuntary movements, hallucinations.','Take at the same times daily. Dietary protein can reduce levodopa absorption. Dopamine agonists can cause impulsive behaviour (gambling, shopping). Do not stop suddenly.','Sudden sleepiness while driving, hallucinations or impulsivity: see a doctor.'],
 antiepileptic:['Αντιεπιληπτικό','Επιληψία· μερικά και για διπολική διαταραχή, νευραλγία ή ημικρανία.','Ηρεμεί την υπερβολική ηλεκτρική δραστηριότητα του εγκεφάλου.','Υπνηλία, ζάλη, κόπωση· αλλαγές διάθεσης (λεβετιρακετάμη).','Μην παραλείπετε δόσεις και μην το σταματάτε απότομα. Πολλά αλληλεπιδρούν με αντισυλληπτικά και άλλα φάρμακα. Το βαλπροϊκό είναι επικίνδυνο στην εγκυμοσύνη — γυναίκες σε αναπαραγωγική ηλικία: συζήτηση με τον γιατρό.','Εξάνθημα με πυρετό ή πληγές στο στόμα (ιδίως λαμοτριγίνη/καρβαμαζεπίνη), ή σκέψεις αυτοτραυματισμού: γιατρός αμέσως.',
  'Anti-epileptic','Epilepsy; some also for bipolar disorder, neuralgia or migraine.','Calms excessive electrical activity in the brain.','Drowsiness, dizziness, tiredness; mood changes (levetiracetam).','Do not miss doses or stop suddenly. Many interact with contraceptives and other medicines. Valproate is dangerous in pregnancy — women of child-bearing age: discuss with your doctor.','Rash with fever or mouth sores (especially lamotrigine/carbamazepine), or thoughts of self-harm: see a doctor at once.'],
 gabapentinoid:['Φάρμακο για νευροπαθητικό πόνο','Νευροπαθητικός πόνος (διαβητική νευροπάθεια, μετά τον έρπη, ισχιαλγία), επιληψία· η πρεγκαμπαλίνη και για άγχος.','Ηρεμεί τα «ερεθισμένα» νεύρα που στέλνουν σήματα πόνου.','Ζάλη, υπνηλία, αστάθεια, πρήξιμο ποδιών, αύξηση βάρους, θολή όραση.','Όχι αλκοόλ ή οπιοειδή (κίνδυνος αναπνοής). Προσοχή στην οδήγηση. Μπορεί να προκαλέσει εξάρτηση. Σταδιακή διακοπή. Χαμηλότερη δόση σε νεφρική ανεπάρκεια.','Δυσκολία στην αναπνοή ή έντονη υπνηλία: 112.',
  'Nerve-pain medicine','Nerve pain (diabetic neuropathy, after shingles, sciatica), epilepsy; pregabalin also for anxiety.','Calms “irritated” nerves that send pain signals.','Dizziness, drowsiness, unsteadiness, swollen legs, weight gain, blurred vision.','No alcohol or opioids (breathing risk). Care driving. Can cause dependence. Taper to stop. Lower dose with kidney failure.','Breathing difficulty or severe drowsiness: call 112.'],
 triptan:['Ειδικό φάρμακο ημικρανίας (τριπτάνη)','Κρίση ημικρανίας (όχι για πρόληψη).','Συσπά τα διογκωμένα αγγεία και μπλοκάρει ουσίες του πόνου στο κεφάλι.','Αίσθημα σφιξίματος ή βάρους στο στήθος/λαιμό, μυρμήγκιασμα, ζάλη, υπνηλία.','Παίρνεται στην αρχή του πόνου. Όχι σε στεφανιαία νόσο, εγκεφαλικό ή ανεξέλεγκτη πίεση. Μην το παίρνετε πάνω από 10 μέρες τον μήνα (πονοκέφαλος από υπερβολικά φάρμακα).','Πόνος στο στήθος που δεν περνά: 112.',
  'Migraine-specific medicine (triptan)','Migraine attacks (not prevention).','Narrows swollen vessels and blocks pain substances in the head.','Tightness or heaviness in chest/throat, tingling, dizziness, drowsiness.','Take at the start of the pain. Not with coronary disease, stroke or uncontrolled blood pressure. Not more than 10 days a month (medication-overuse headache).','Chest pain that does not pass: call 112.'],
 alpha_blocker:['Φάρμακο για τον προστάτη (α-αναστολέας)','Δυσκολία στην ούρηση από διόγκωση προστάτη· βοηθά και στην αποβολή πέτρας από τον ουρητήρα.','Χαλαρώνει τους μυς του προστάτη και της κύστης, για καλύτερη ροή.','Ζάλη όταν σηκώνεστε, βουλωμένη μύτη, λιγότερο ή καθόλου σπέρμα στην εκσπερμάτιση.','Πάρτε το μετά το φαγητό. Σηκώνεστε αργά. Πριν από επέμβαση καταρράκτη ενημερώστε τον οφθαλμίατρο.','Λιποθυμία: γιατρός.',
  'Prostate medicine (alpha-blocker)','Urinary difficulty from an enlarged prostate; also helps pass a ureteric stone.','Relaxes prostate and bladder muscles for better flow.','Dizziness on standing, blocked nose, little or no semen on ejaculation.','Take after food. Stand up slowly. Tell your eye surgeon before cataract surgery.','Fainting: see a doctor.'],
 fiveari:['Φάρμακο που μικραίνει τον προστάτη (αναστολέας 5-α-αναγωγάσης)','Μεγάλη διόγκωση προστάτη (μακροχρόνια)· μικρή δόση φιναστερίδης και για ανδρική τριχόπτωση.','Μειώνει την ορμόνη που μεγαλώνει τον προστάτη· θέλει μήνες για αποτέλεσμα.','Μειωμένη επιθυμία, στυτική δυσλειτουργία, ευαισθησία στο στήθος.','Μειώνει την τιμή του PSA στο μισό — ενημερώνετε τον γιατρό. Οι έγκυες δεν πρέπει να πιάνουν σπασμένα χάπια.','Ογκίδιο ή υγρό από τη θηλή, ή κακή διάθεση: γιατρός.',
  'Prostate-shrinking medicine (5-alpha-reductase inhibitor)','Large enlarged prostate (long-term); low-dose finasteride also for male hair loss.','Reduces the hormone that enlarges the prostate; takes months to work.','Lower libido, erectile problems, breast tenderness.','Halves the PSA value — tell your doctor. Pregnant women should not handle broken tablets.','Breast lump or nipple discharge, or low mood: see a doctor.'],
 bladder:['Φάρμακο για υπερδραστήρια κύστη','Συχνοουρία, επιτακτική ανάγκη, ακράτεια επιτακτικού τύπου.','Χαλαρώνει τον μυ της κύστης ώστε να κρατά περισσότερα ούρα.','Ξηροστομία, δυσκοιλιότητα, θολή όραση (τα αντιχολινεργικά)· άνοδος πίεσης (μιραμπεγκρόνη).','Τα αντιχολινεργικά μπορεί να επιδεινώσουν μνήμη και σύγχυση στους ηλικιωμένους — ρωτήστε τον γιατρό. Προσοχή σε γλαύκωμα και δυσκολία ούρησης.','Δεν μπορείτε να ουρήσετε: Επείγοντα.',
  'Overactive bladder medicine','Frequency, urgency, urge incontinence.','Relaxes the bladder muscle so it holds more.','Dry mouth, constipation, blurred vision (antimuscarinics); raised blood pressure (mirabegron).','Antimuscarinics can worsen memory and confusion in older people — ask your doctor. Care with glaucoma and difficulty passing urine.','Cannot pass urine: go to A&E.'],
 pde5:['Φάρμακο για στυτική δυσλειτουργία (αναστολέας PDE5)','Στυτική δυσλειτουργία· η ταδαλαφίλη και για διόγκωση προστάτη.','Αυξάνει τη ροή αίματος στο πέος όταν υπάρχει διέγερση.','Πονοκέφαλος, κοκκίνισμα, βουλωμένη μύτη, δυσπεψία, πόνοι στη μέση.','ΠΟΤΕ με νιτρώδη (σπρέι/χάπι στηθάγχης) — επικίνδυνη πτώση πίεσης. Ρωτήστε τον γιατρό αν έχετε καρδιοπάθεια. Μην αγοράζετε από το ίντερνετ.','Στύση πάνω από 4 ώρες ή ξαφνική απώλεια όρασης/ακοής: Επείγοντα.',
  'Erectile dysfunction medicine (PDE5 inhibitor)','Erectile dysfunction; tadalafil also for enlarged prostate.','Increases blood flow to the penis when aroused.','Headache, flushing, blocked nose, indigestion, back ache.','NEVER with nitrates (angina spray/tablet) — dangerous pressure drop. Ask your doctor if you have heart disease. Do not buy online.','Erection over 4 hours or sudden loss of vision/hearing: go to A&E.'],
 bisphosphonate:['Φάρμακο για οστεοπόρωση','Οστεοπόρωση — πρόληψη καταγμάτων.','Επιβραδύνει τη φθορά του οστού.','Καούρα, ενόχληση στον οισοφάγο, πόνοι σε οστά/μυς.','Το εβδομαδιαίο χάπι: το πρωί με άδειο στομάχι, με γεμάτο ποτήρι νερό, και μένετε ΟΡΘΙΟΙ 30 λεπτά πριν φάτε. Καλή υγιεινή δοντιών — ενημερώστε τον οδοντίατρο πριν από εξαγωγή. Ασβέστιο και βιταμίνη D όπως πει ο γιατρός.','Πόνος στην κατάποση, πόνος στο σαγόνι ή νέος πόνος στον μηρό/βουβωνική χώρα: γιατρός.',
  'Osteoporosis medicine','Osteoporosis — fracture prevention.','Slows bone loss.','Heartburn, gullet irritation, bone/muscle aches.','Weekly tablet: in the morning on an empty stomach, with a full glass of water, and stay UPRIGHT for 30 minutes before eating. Good dental care — tell your dentist before extractions. Calcium and vitamin D as advised.','Pain on swallowing, jaw pain, or new thigh/groin pain: see a doctor.'],
 calcium_d:['Ασβέστιο & βιταμίνη D','Οστεοπόρωση, έλλειψη βιταμίνης D, μαζί με φάρμακα οστεοπόρωσης.','Δίνει υλικό για τα οστά· η βιταμίνη D βοηθά την απορρόφηση ασβεστίου.','Δυσκοιλιότητα, φούσκωμα.','Μην ξεπερνάτε τη δόση (υπερβολή = πέτρες στα νεφρά, υψηλό ασβέστιο). Χωριστά από θυροξίνη και κάποια αντιβιοτικά.','Ναυτία, μεγάλη δίψα, σύγχυση (υψηλό ασβέστιο): γιατρός.',
  'Calcium & vitamin D','Osteoporosis, vitamin D deficiency, alongside osteoporosis medicines.','Provides building material for bone; vitamin D helps calcium absorption.','Constipation, bloating.','Do not exceed the dose (excess = kidney stones, high calcium). Keep apart from levothyroxine and some antibiotics.','Nausea, great thirst, confusion (high calcium): see a doctor.'],
 steroid_oral:['Κορτιζόνη από το στόμα','Φλεγμονές και αλλεργίες: άσθμα/ΧΑΠ σε έξαρση, ρευματικά, δέρμα, αλλεργικές αντιδράσεις κ.ά.','Ισχυρή αντιφλεγμονώδης δράση· καταστέλλει το ανοσοποιητικό.','Αύξηση όρεξης, αϋπνία, ανησυχία, άνοδος σακχάρου και πίεσης, ενόχληση στο στομάχι.','Παίρνεται το πρωί με φαγητό. Μετά από πάνω από 3 εβδομάδες ΜΗΝ τη σταματήσετε απότομα. Διαβητικοί: μετράτε σάκχαρο συχνότερα. Μακροχρόνια: οστεοπόρωση, καταρράκτης, λοιμώξεις.','Μαύρα κόπρανα, πολύ υψηλό σάκχαρο, έντονες αλλαγές διάθεσης ή πυρετός: γιατρός.',
  'Oral steroid','Inflammation and allergy: asthma/COPD flare, rheumatic disease, skin, allergic reactions etc.','Strong anti-inflammatory; suppresses the immune system.','Increased appetite, insomnia, restlessness, raised sugar and pressure, stomach upset.','Take in the morning with food. After more than 3 weeks do NOT stop suddenly. Diabetics: check sugar more often. Long-term: osteoporosis, cataract, infections.','Black stools, very high sugar, severe mood changes or fever: see a doctor.'],
 penicillin:['Αντιβιοτικό (πενικιλίνη)','Μικροβιακές λοιμώξεις: αυτιά, λαιμός (στρεπτόκοκκος), ιγμορίτιδα, πνευμονία, δόντια, δέρμα, ούρα.','Σκοτώνει τα βακτήρια καταστρέφοντας το τοίχωμά τους. ΔΕΝ δρα στους ιούς (κρυολόγημα, γρίπη).','Διάρροια, ναυτία, μυκητίαση (στόμα/κόλπος), εξάνθημα.','ΟΧΙ αν έχετε αλλεργία στην πενικιλίνη. Ολοκληρώνετε τη θεραπεία όπως σας είπαν. Η αμοξυκιλλίνη με κλαβουλανικό παίρνεται στην αρχή του γεύματος.','Πρήξιμο προσώπου, δύσπνοια, κνίδωση: 112. Πολλή υδαρής διάρροια με πυρετό: γιατρός.',
  'Antibiotic (penicillin)','Bacterial infections: ear, throat (strep), sinusitis, pneumonia, teeth, skin, urine.','Kills bacteria by breaking their wall. Does NOT work on viruses (colds, flu).','Diarrhoea, nausea, thrush (mouth/vagina), rash.','NOT if allergic to penicillin. Finish the course as advised. Co-amoxiclav is taken at the start of a meal.','Facial swelling, breathlessness, hives: call 112. Lots of watery diarrhoea with fever: see a doctor.'],
 macrolide:['Αντιβιοτικό (μακρολίδη)','Λοιμώξεις αναπνευστικού (πνευμονία, βρογχίτιδα, κοκκύτης), δέρματος· ελικοβακτηρίδιο· σε αλλεργία στην πενικιλίνη.','Σταματά τα βακτήρια να φτιάχνουν πρωτεΐνες.','Ναυτία, διάρροια, κοιλιακός πόνος, αλλοίωση γεύσης.','Πολλές αλληλεπιδράσεις (η κλαριθρομυκίνη με στατίνες, αντιπηκτικά κ.ά.) — ρωτήστε τον φαρμακοποιό. Προσοχή σε προβλήματα καρδιακού ρυθμού.','Αίσθημα παλμών ή λιποθυμία: γιατρός.',
  'Antibiotic (macrolide)','Respiratory infections (pneumonia, bronchitis, whooping cough), skin; H. pylori; penicillin allergy.','Stops bacteria making proteins.','Nausea, diarrhoea, abdominal pain, taste change.','Many interactions (clarithromycin with statins, blood thinners etc.) — ask your pharmacist. Care with heart rhythm problems.','Palpitations or fainting: see a doctor.'],
 quinolone:['Αντιβιοτικό (κινολόνη)','Σοβαρές ουρολοιμώξεις, προστατίτιδα, κάποιες πνευμονίες — όταν δεν κάνουν άλλα αντιβιοτικά.','Εμποδίζει τα βακτήρια να αντιγράψουν το DNA τους.','Ναυτία, διάρροια, ζάλη· σπάνια φλεγμονή ή ρήξη τενόντων, νευροπάθεια, ευαισθησία στον ήλιο.','Κίνδυνος τενοντίτιδας/ρήξης αχίλλειου (μεγαλύτερος σε ηλικιωμένους και με κορτιζόνη). 2-4 ώρες μακριά από ασβέστιο, σίδηρο, μαγνήσιο, γάλα. Αντηλιακό.','Πόνος ή πρήξιμο σε τένοντα (ιδίως φτέρνα), μούδιασμα, ταχυπαλμία ή σύγχυση: σταματήστε και γιατρός.',
  'Antibiotic (quinolone)','Serious urine infections, prostatitis, some pneumonias — when others are not suitable.','Stops bacteria copying their DNA.','Nausea, diarrhoea, dizziness; rarely tendon inflammation or rupture, nerve damage, sun sensitivity.','Risk of tendinitis/Achilles rupture (higher in older people and with steroids). 2-4 hours apart from calcium, iron, magnesium, milk. Sunscreen.','Tendon pain or swelling (especially heel), numbness, palpitations or confusion: stop and see a doctor.'],
 cephalosporin:['Αντιβιοτικό (κεφαλοσπορίνη)','Λοιμώξεις αναπνευστικού, ούρων, δέρματος, αυτιών.','Καταστρέφει το τοίχωμα των βακτηρίων.','Διάρροια, ναυτία, εξάνθημα, μυκητίαση.','Προσοχή αν έχετε σοβαρή αλλεργία στην πενικιλίνη — ρωτήστε τον γιατρό. Ολοκληρώνετε τη θεραπεία.','Κνίδωση, πρήξιμο ή δύσπνοια: 112.',
  'Antibiotic (cephalosporin)','Respiratory, urine, skin and ear infections.','Breaks down bacterial walls.','Diarrhoea, nausea, rash, thrush.','Care if you have a serious penicillin allergy — ask your doctor. Finish the course.','Hives, swelling or breathlessness: call 112.'],
 uti_ab:['Αντιβιοτικό για ουρολοίμωξη','Απλή κυστίτιδα (ουρολοίμωξη χωρίς πυρετό) σε γυναίκες.','Συγκεντρώνεται στα ούρα και σκοτώνει τα βακτήρια της κύστης.','Διάρροια, ναυτία· η νιτροφουραντοΐνη κάνει τα ούρα σκουρόχρωμα.','Η φωσφομυκίνη (φακελάκι) συνήθως μία δόση, το βράδυ με άδεια κύστη. Η νιτροφουραντοΐνη όχι σε νεφρική ανεπάρκεια.','Πυρετός, ρίγη, πόνος στο πλάι (λοίμωξη νεφρού) ή αν δεν βελτιωθείτε σε 2-3 μέρες: γιατρός.',
  'Urine-infection antibiotic','Simple cystitis (bladder infection without fever) in women.','Concentrates in urine and kills bladder bacteria.','Diarrhoea, nausea; nitrofurantoin darkens urine.','Fosfomycin (sachet) is usually one dose, at night with an empty bladder. Nitrofurantoin not with kidney failure.','Fever, chills, side pain (kidney infection) or no better in 2-3 days: see a doctor.'],
 tetracycline:['Αντιβιοτικό (δοξυκυκλίνη)','Αναπνευστικές λοιμώξεις, ακμή, ροδόχρους, λοιμώξεις από τσιμπούρι, κάποια ΣΜΝ.','Σταματά τα βακτήρια να φτιάχνουν πρωτεΐνες.','Ναυτία, ευαισθησία στον ήλιο, ερεθισμός οισοφάγου.','Με γεμάτο ποτήρι νερό, όρθιοι, όχι πριν τον ύπνο. Μακριά από γάλα, ασβέστιο, σίδηρο, αντιόξινα. Αντηλιακό. Όχι σε εγκυμοσύνη και παιδιά κάτω των 12.','Πόνος στην κατάποση ή έντονο ηλιακό έγκαυμα: γιατρός.',
  'Antibiotic (doxycycline)','Respiratory infections, acne, rosacea, tick-borne infections, some STIs.','Stops bacteria making proteins.','Nausea, sun sensitivity, gullet irritation.','With a full glass of water, upright, not just before bed. Apart from milk, calcium, iron, antacids. Sunscreen. Not in pregnancy or under 12.','Pain on swallowing or severe sunburn: see a doctor.'],
 antiviral_herpes:['Αντιικό (έρπης)','Έρπης ζωστήρας, επιχείλιος και γεννητικός έρπης, ανεμοβλογιά σε ενήλικες.','Εμποδίζει τον ιό του έρπη να πολλαπλασιαστεί — δρα καλύτερα όσο νωρίτερα ξεκινήσει.','Πονοκέφαλος, ναυτία, διάρροια.','Πίνετε αρκετό νερό. Μικρότερη δόση σε νεφρική ανεπάρκεια.','Ζωστήρας κοντά στο μάτι ή στο μέτωπο: οφθαλμίατρος ή γιατρός ΣΗΜΕΡΑ.',
  'Antiviral (herpes)','Shingles, cold sores and genital herpes, chickenpox in adults.','Stops the herpes virus multiplying — works best when started early.','Headache, nausea, diarrhoea.','Drink enough water. Lower dose with kidney failure.','Shingles near the eye or on the forehead: see an eye doctor or GP TODAY.'],
 antiviral_flu:['Αντιικό γρίπης','Γρίπη — ιδιαίτερα σε ευπαθείς (ηλικιωμένοι, έγκυες, χρόνια νοσήματα), ή για πρόληψη σε επαφή.','Εμποδίζει τον ιό της γρίπης να απλωθεί· δρα καλύτερα τις πρώτες 48 ώρες.','Ναυτία, εμετός, πονοκέφαλος.','Παίρνεται με φαγητό για λιγότερη ναυτία.','Δύσπνοια, πόνος στο στήθος, σύγχυση: 112.',
  'Flu antiviral','Flu — especially in vulnerable people (older, pregnant, chronic illness), or prevention after contact.','Stops the flu virus spreading; best in the first 48 hours.','Nausea, vomiting, headache.','Take with food for less nausea.','Breathlessness, chest pain, confusion: call 112.'],
 antifungal_oral:['Αντιμυκητιασικό από το στόμα','Κολπική μυκητίαση, μυκητίαση στόματος, μύκητες νυχιών ή δέρματος.','Σταματά την ανάπτυξη των μυκήτων.','Ναυτία, κοιλιακός πόνος, πονοκέφαλος· η τερμπιναφίνη μπορεί να αλλάξει τη γεύση.','Πολλές αλληλεπιδράσεις (στατίνες, αντιπηκτικά κ.ά.) — ρωτήστε τον φαρμακοποιό. Η θεραπεία για τα νύχια διαρκεί μήνες.','Κιτρίνισμα, σκούρα ούρα ή μεγάλη κόπωση (ήπαρ): σταματήστε και γιατρός.',
  'Oral antifungal','Vaginal thrush, oral thrush, nail or skin fungus.','Stops fungal growth.','Nausea, abdominal pain, headache; terbinafine may change taste.','Many interactions (statins, blood thinners etc.) — ask your pharmacist. Nail treatment lasts months.','Yellowing, dark urine or great tiredness (liver): stop and see a doctor.'],
 antifungal_top:['Αντιμυκητιασική κρέμα','Μύκητες δέρματος (πόδι αθλητή, δακτυλίτιδα, πτυχές), κολπική μυκητίαση (κρέμα/υπόθετο).','Σταματά την ανάπτυξη των μυκήτων στο δέρμα.','Ελαφρύ τσούξιμο ή κοκκίνισμα.','Συνεχίστε 1-2 εβδομάδες αφού καθαρίσει το δέρμα. Στεγνώνετε καλά την περιοχή.','Αν δεν βελτιωθεί σε 2-4 εβδομάδες: γιατρός.',
  'Antifungal cream','Skin fungus (athlete’s foot, ringworm, skin folds), vaginal thrush (cream/pessary).','Stops fungal growth on the skin.','Mild stinging or redness.','Continue 1-2 weeks after the skin clears. Dry the area well.','No better in 2-4 weeks: see a doctor.'],
 antibiotic_top:['Αντιβιοτική κρέμα','Μικρές μολυσμένες πληγές, μολυσματικό κηρίο.','Σκοτώνει τα βακτήρια στο δέρμα.','Ελαφρύς ερεθισμός.','Μόνο για λίγες μέρες (έως 7-10) για να μη γίνει αντοχή.','Κοκκίνισμα που απλώνεται ή πυρετός: γιατρός.',
  'Antibiotic cream','Small infected wounds, impetigo.','Kills bacteria on the skin.','Mild irritation.','Only for a few days (up to 7-10) to avoid resistance.','Spreading redness or fever: see a doctor.'],
 steroid_top:['Κρέμα κορτιζόνης','Έκζεμα, δερματίτιδα, ψωρίαση, τσιμπήματα με φαγούρα.','Μειώνει τη φλεγμονή, το κοκκίνισμα και τη φαγούρα στο δέρμα.','Λέπτυνση δέρματος με μακροχρόνια χρήση, ραγάδες.','Λεπτό στρώμα, μόνο στα σημεία, για λίγο. Προσοχή στο πρόσωπο και στις πτυχές. Όχι σε μολυσμένο δέρμα ή μυκητίαση (χειροτερεύει).','Αν δεν βελτιωθεί σε 1-2 εβδομάδες ή απλώνεται: γιατρός.',
  'Steroid cream','Eczema, dermatitis, psoriasis, itchy bites.','Reduces skin inflammation, redness and itch.','Skin thinning with long use, stretch marks.','Thin layer, only on the patches, for a short time. Care on the face and folds. Not on infected skin or fungus (makes it worse).','No better in 1-2 weeks or spreading: see a doctor.'],
 urate:['Φάρμακο για ουρικό οξύ (πρόληψη ουρικής αρθρίτιδας)','Πρόληψη κρίσεων ουρικής αρθρίτιδας και πέτρες ουρικού.','Μειώνει την παραγωγή ουρικού οξέος.','Εξάνθημα, ενόχληση στο στομάχι· στην αρχή μπορεί να πυροδοτήσει κρίση.','Παίρνεται κάθε μέρα, και όταν δεν πονάτε. Πολλά υγρά. Αλληλεπίδραση με αζαθειοπρίνη.','Εξάνθημα με πυρετό ή πληγές στο στόμα: σταματήστε και γιατρός αμέσως.',
  'Uric acid medicine (gout prevention)','Preventing gout attacks and uric acid stones.','Reduces uric acid production.','Rash, stomach upset; can trigger an attack at first.','Take daily, even when pain-free. Plenty of fluids. Interacts with azathioprine.','Rash with fever or mouth sores: stop and see a doctor at once.'],
 colchicine:['Κολχικίνη','Κρίση ουρικής αρθρίτιδας· περικαρδίτιδα· οικογενής μεσογειακός πυρετός.','Μειώνει τη φλεγμονή από τους κρυστάλλους.','Διάρροια, ναυτία, κοιλιακός πόνος.','Η δόση είναι πολύ σημαντική — ποτέ περισσότερο από ό,τι έγραψε ο γιατρός. Αλληλεπιδράσεις με κλαριθρομυκίνη, κάποιες στατίνες, αντιμυκητιασικά.','Έντονη διάρροια, εμετός, μυϊκή αδυναμία ή μούδιασμα: σταματήστε και γιατρός.',
  'Colchicine','Gout attack; pericarditis; familial Mediterranean fever.','Reduces crystal-driven inflammation.','Diarrhoea, nausea, abdominal pain.','The dose matters greatly — never more than prescribed. Interactions with clarithromycin, some statins, antifungals.','Severe diarrhoea, vomiting, muscle weakness or numbness: stop and see a doctor.'],
 iron:['Σίδηρος (συμπλήρωμα)','Σιδηροπενία και σιδηροπενική αναιμία.','Δίνει σίδηρο για να φτιαχτεί αιμοσφαιρίνη.','Μαύρα κόπρανα (αθώο), δυσκοιλιότητα ή διάρροια, ναυτία.','Καλύτερη απορρόφηση με άδειο στομάχι ή με βιταμίνη C. Όχι με τσάι, καφέ, γάλα, αντιόξινα. 4 ώρες μακριά από θυροξίνη. Φυλάσσεται μακριά από παιδιά (επικίνδυνο σε υπερβολή).','Παιδί που κατάπιε χάπια σιδήρου: Κέντρο Δηλητηριάσεων ή 112.',
  'Iron supplement','Iron deficiency and iron-deficiency anaemia.','Provides iron to make haemoglobin.','Black stools (harmless), constipation or diarrhoea, nausea.','Best absorbed on an empty stomach or with vitamin C. Not with tea, coffee, milk, antacids. 4 hours apart from levothyroxine. Keep away from children (dangerous in overdose).','Child swallowed iron tablets: Poison Centre or call 112.'],
 vitb12_folic:['Βιταμίνη Β12 / Φυλλικό οξύ','Έλλειψη Β12 ή φυλλικού· φυλλικό πριν και στην αρχή της εγκυμοσύνης.','Απαραίτητα για τα ερυθρά αιμοσφαίρια και τα νεύρα.','Σπάνια παρενέργειες.','Η Β12 μπορεί να χρειαστεί ενέσεις αν δεν απορροφάται.','Μούδιασμα ή αστάθεια που χειροτερεύει: γιατρός.',
  'Vitamin B12 / Folic acid','B12 or folate deficiency; folic acid before and in early pregnancy.','Needed for red blood cells and nerves.','Rarely any side effects.','B12 may need injections if not absorbed.','Worsening numbness or unsteadiness: see a doctor.'],
 glaucoma:['Σταγόνες για γλαύκωμα','Γλαύκωμα και υψηλή πίεση ματιού.','Μειώνουν την πίεση μέσα στο μάτι.','Κοκκίνισμα, τσούξιμο· οι προσταγλανδίνες σκουραίνουν την ίριδα και μακραίνουν βλεφαρίδες· η τιμολόλη μπορεί να αργήσει τον σφυγμό ή να δυσκολέψει την αναπνοή.','Κάθε μέρα, στην ίδια ώρα — το γλαύκωμα δεν πονά αλλά χαλά την όραση. Μετά τη σταγόνα πιέστε την εσωτερική γωνία του ματιού 1-2 λεπτά. Ενημερώστε τον γιατρό αν έχετε άσθμα.','Σφύριγμα, δύσπνοια ή πολύ αργός σφυγμός (τιμολόλη): γιατρός.',
  'Glaucoma eye drops','Glaucoma and high eye pressure.','Lower the pressure inside the eye.','Redness, stinging; prostaglandins darken the iris and lengthen lashes; timolol can slow the pulse or worsen breathing.','Every day at the same time — glaucoma is painless but damages sight. After the drop press the inner corner of the eye for 1-2 minutes. Tell your doctor if you have asthma.','Wheezing, breathlessness or very slow pulse (timolol): see a doctor.'],
 tears:['Τεχνητά δάκρυα','Ξηροφθαλμία, κούραση ματιών.','Ενυδατώνουν και προστατεύουν την επιφάνεια του ματιού.','Θόλωση για λίγα λεπτά (οι πηχτές μορφές).','Προτιμήστε χωρίς συντηρητικά αν τα βάζετε συχνά.','Πόνος, κόκκινο μάτι ή πτώση όρασης: οφθαλμίατρος.',
  'Artificial tears','Dry eye, tired eyes.','Moisturise and protect the eye surface.','Brief blurring (thicker gels).','Prefer preservative-free if used often.','Pain, red eye or vision loss: eye doctor.'],
 venotonic:['Φλεβοτονωτικό','Βάρος και πρήξιμο ποδιών από φλέβες, κιρσοί, αιμορροΐδες.','Δυναμώνει το τοίχωμα των φλεβών.','Ενόχληση στο στομάχι, πονοκέφαλος.','Βοηθά τα συμπτώματα — δεν εξαφανίζει τους κιρσούς. Περπάτημα και κάλτσες συμπίεσης βοηθούν επίσης.','Πρήξιμο σε ένα μόνο πόδι με πόνο (θρόμβωση): γιατρός σήμερα.',
  'Vein tonic','Heavy, swollen legs from veins, varicose veins, haemorrhoids.','Strengthens vein walls.','Stomach upset, headache.','Eases symptoms — does not remove varicose veins. Walking and compression stockings also help.','Swelling of only one leg with pain (clot): see a doctor today.'],
 hrt:['Ορμονική θεραπεία εμμηνόπαυσης','Εξάψεις, νυχτερινές εφιδρώσεις, ξηρότητα κόλπου, πρόληψη οστεοπόρωσης.','Αντικαθιστά τα οιστρογόνα (και την προγεστερόνη) που μειώνονται.','Ευαισθησία στο στήθος, ναυτία, κολπική αιμορραγία στην αρχή, πονοκέφαλος.','Εξατομικευμένη απόφαση με τον γυναικολόγο (κίνδυνοι θρόμβωσης, καρκίνου μαστού). Μαστογραφίες κανονικά.','Πόνος και πρήξιμο σε ένα πόδι, δύσπνοια, ογκίδιο στο στήθος ή αιμορραγία που συνεχίζει: γιατρός.',
  'Menopause hormone therapy','Hot flushes, night sweats, vaginal dryness, osteoporosis prevention.','Replaces falling oestrogen (and progestogen).','Breast tenderness, nausea, early vaginal bleeding, headache.','A personal decision with your gynaecologist (clot and breast cancer risks). Keep having mammograms.','Pain and swelling in one leg, breathlessness, breast lump or continuing bleeding: see a doctor.'],
 contraceptive:['Αντισυλληπτικό χάπι','Αντισύλληψη· και για ακανόνιστες ή επώδυνες περιόδους, ακμή.','Εμποδίζει την ωορρηξία με ορμόνες.','Ναυτία, ευαισθησία στο στήθος, πονοκέφαλος, σταγονίδια αίματος στην αρχή.','Κάπνισμα μετά τα 35 και ημικρανία με αύρα αυξάνουν κίνδυνο θρόμβωσης/εγκεφαλικού. Εμετός ή διάρροια, και κάποια φάρμακα, μειώνουν την προστασία.','Πόνος και πρήξιμο σε ένα πόδι, πόνος στο στήθος, δύσπνοια, ξαφνικός έντονος πονοκέφαλος ή διαταραχή όρασης: Επείγοντα.',
  'Contraceptive pill','Contraception; also irregular or painful periods, acne.','Stops ovulation with hormones.','Nausea, breast tenderness, headache, early spotting.','Smoking over 35 and migraine with aura raise clot/stroke risk. Vomiting, diarrhoea and some medicines reduce protection.','Pain and swelling in one leg, chest pain, breathlessness, sudden severe headache or vision change: go to A&E.'],
 methotrexate:['Μεθοτρεξάτη (ρευματολογικό)','Ρευματοειδής αρθρίτιδα, ψωρίαση και άλλα αυτοάνοσα.','Ηρεμεί το υπερδραστήριο ανοσοποιητικό.','Ναυτία, κόπωση, πληγές στο στόμα.','ΜΙΑ ΦΟΡΑ ΤΗΝ ΕΒΔΟΜΑΔΑ — όχι κάθε μέρα (θανατηφόρο λάθος). Φυλλικό οξύ όπως πει ο γιατρός. Τακτικές εξετάσεις αίματος. Όχι αλκοόλ. Όχι σε εγκυμοσύνη (και για τους άνδρες σχεδιασμός).','Πυρετός, πονόλαιμος, βήχας με δύσπνοια, πληγές στο στόμα ή μελανιές: γιατρός αμέσως.',
  'Methotrexate (rheumatology)','Rheumatoid arthritis, psoriasis and other autoimmune diseases.','Calms an overactive immune system.','Nausea, tiredness, mouth sores.','ONCE A WEEK — not daily (fatal error). Folic acid as advised. Regular blood tests. No alcohol. Not in pregnancy (men too need planning).','Fever, sore throat, cough with breathlessness, mouth sores or bruising: see a doctor at once.'],
 hydroxychloroquine:['Υδροξυχλωροκίνη','Λύκος, ρευματοειδής αρθρίτιδα.','Ρυθμίζει το ανοσοποιητικό.','Ναυτία, διάρροια, εξάνθημα.','Ετήσιος οφθαλμολογικός έλεγχος (αμφιβληστροειδής) μετά από 5 χρόνια ή νωρίτερα με παράγοντες κινδύνου.','Αλλαγές στην όραση: οφθαλμίατρος.',
  'Hydroxychloroquine','Lupus, rheumatoid arthritis.','Regulates the immune system.','Nausea, diarrhoea, rash.','Yearly eye (retina) checks after 5 years, or earlier with risk factors.','Vision changes: see an eye doctor.'],
 betahistine:['Φάρμακο για ίλιγγο (βηταϊστίνη)','Νόσος Ménière: κρίσεις ιλίγγου, βουητό.','Βελτιώνει την κυκλοφορία στο εσωτερικό αυτί.','Ενόχληση στο στομάχι, πονοκέφαλος.','Παίρνεται με φαγητό. Προσοχή σε άσθμα και έλκος.','Ίλιγγος με αδυναμία, διπλωπία ή δυσκολία στην ομιλία: 112.',
  'Vertigo medicine (betahistine)','Ménière’s disease: vertigo attacks, tinnitus.','Improves inner-ear circulation.','Stomach upset, headache.','Take with food. Care with asthma and ulcer.','Vertigo with weakness, double vision or speech trouble: call 112.'],

const G2L=[['ου','u'],['αυ','av'],['ευ','ev'],['μπ','b'],['ντ','d'],['γκ','g'],['γγ','g'],['ει','i'],['οι','i'],['αι','e']];
const GM={α:'a',β:'v',γ:'g',δ:'d',ε:'e',ζ:'z',η:'i',θ:'t',ι:'i',κ:'k',λ:'l',μ:'m',ν:'n',ξ:'ks',ο:'o',π:'p',ρ:'r',σ:'s',τ:'t',υ:'i',φ:'f',χ:'k',ψ:'ps',ω:'o'};

  let x=plain(s);G2L.forEach(([a,b])=>{x=x.split(a).join(b)});x=x.replace(/[α-ω]/g,c=>GM[c]||c);
  x=x.replace(/ph/g,'f').replace(/th/g,'t').replace(/ch/g,'k').replace(/ck/g,'k').replace(/qu/g,'kv').replace(/[cq]/g,'k').replace(/x/g,'ks').replace(/y/g,'i').replace(/w/g,'v').replace(/h/g,'')
   .replace(/au/g,'av').replace(/eu/g,'ev').replace(/ou/g,'u').replace(/ee/g,'i').replace(/([a-z])\1+/g,'$1');

const MIDX=MEDS.map((m,i)=>({i,keys:[m[1],m[2],...m[3].split('|')].map(n=>({n,k:medKey(n)})).filter(o=>o.k.length>=2)}));

  const k=medKey(q);if(k.length<2)return [];
  const res=[];
  for(const e of MIDX){let best=0;
    for(const o of e.keys){let s=0;
      if(o.k===k)s=4;else if(k.length>=3&&o.k.startsWith(k))s=3;else if(k.length>=4&&o.k.includes(k))s=2;
      else if(k.length>=5){const mx=k.length>=8?2:1;if(o.k[0]===k[0]&&edits(o.k.slice(0,k.length),k,mx)<=mx)s=1.5;else if(edits(o.k,k,mx)<=mx)s=1.2}

}

  const AL={ζαχαρ:'διαβιτ',ζαχαρο:'διαβιτ',ζαχαρι:'διαβιτ',σακχαρ:'διαβιτ',σακχαρο:'διαβιτ',sugar:'diabet',ιπερτασι:'πιεσ'};const AL_V=new Set(Object.values(AL));const al=w=>{for(const k in AL)if(w.startsWith(k))return AL[k];return w};const st=ws.map(al).map(w=>AL_V.has(w)?w:w.length>5?w.slice(0,w.length-2):w.slice(0,Math.max(3,w.length-1)));
  const out=[];MEDS.forEach((m,i)=>{const c=MEDCLASS[m[0]];const tx=norm(c[0]+' '+c[1]+' '+c[6]+' '+c[7]);if(st.every(s=>tx.includes(s)||(s.length>=6&&fuzzyHas(tx,s))))out.push(i)});

const IRULES=[
 [['nsaid','cox2','aspirin'],['doac','vka','antiplatelet'],'Αντιφλεγμονώδες/ασπιρίνη μαζί με αντιπηκτικό ή αντιαιμοπεταλιακό: μεγαλύτερος κίνδυνος αιμορραγίας.','Anti-inflammatory/aspirin with a blood thinner: higher bleeding risk.'],
 [['ssri','snri'],['nsaid','aspirin','doac','vka','antiplatelet'],'Αντικαταθλιπτικό μαζί με αντιφλεγμονώδες ή αντιπηκτικό: μεγαλύτερος κίνδυνος αιμορραγίας (κυρίως στομάχου).','Antidepressant with an anti-inflammatory or blood thinner: higher bleeding risk (mainly stomach).'],
 [['ssri','snri','sedating_ad'],['opioid_weak','triptan'],'Αντικαταθλιπτικό μαζί με τραμαδόλη ή τριπτάνη: σπάνια «σεροτονινικό σύνδρομο» (ταραχή, εφίδρωση, τρέμουλο, πυρετός).','Antidepressant with tramadol or a triptan: rare “serotonin syndrome” (agitation, sweating, tremor, fever).'],
 [['pde5'],['nitrate'],'ΕΠΙΚΙΝΔΥΝΟ: φάρμακο στύσης μαζί με νιτρώδες για στηθάγχη — μεγάλη πτώση πίεσης. Μην τα παίρνετε μαζί.','DANGEROUS: erection medicine with an angina nitrate — severe pressure drop. Never together.'],
 [['acei','arb'],['mra'],'Φάρμακο πίεσης μαζί με σπιρονολακτόνη: κίνδυνος υψηλού καλίου — χρειάζονται εξετάσεις.','Blood pressure medicine with spironolactone: risk of high potassium — needs blood tests.'],
 [['acei'],['arb'],'Αναστολέας ΜΕΑ μαζί με σαρτάνη: συνήθως αποφεύγεται — ρωτήστε τον γιατρό.','ACE inhibitor with a sartan: usually avoided — ask your doctor.'],
 [['statin','colchicine'],['macrolide','antifungal_oral'],'Στατίνη ή κολχικίνη μαζί με κλαριθρομυκίνη ή αντιμυκητιασικό: κίνδυνος πόνων/βλάβης μυών.','Statin or colchicine with clarithromycin or an antifungal: risk of muscle damage.'],
 [['vka'],['penicillin','macrolide','quinolone','cephalosporin','tetracycline','antifungal_oral','antiarrhythmic'],'Sintrom/βαρφαρίνη με αντιβιοτικό ή αμιωδαρόνη: αλλάζει το INR — χρειάζεται συχνότερη εξέταση.','Warfarin-type medicine with an antibiotic or amiodarone: changes the INR — test more often.'],
 [['levothyroxine'],['calcium_d','iron','antacid','ppi'],'Θυροξίνη με ασβέστιο, σίδηρο ή αντιόξινα: κρατήστε απόσταση 4 ωρών.','Levothyroxine with calcium, iron or antacids: keep 4 hours apart.'],
 [['quinolone','tetracycline'],['calcium_d','iron','antacid'],'Αντιβιοτικό με ασβέστιο, σίδηρο ή αντιόξινα: απορροφάται λιγότερο — απόσταση 2-4 ωρών.','Antibiotic with calcium, iron or antacids: less absorbed — keep 2-4 hours apart.'],
 [['digoxin'],['antiarrhythmic','loop','thiazide'],'Διγοξίνη με αμιωδαρόνη ή διουρητικό: κίνδυνος τοξικότητας — εξετάσεις αίματος.','Digoxin with amiodarone or a diuretic: toxicity risk — blood tests.'],
 [['bladder'],['dementia'],'Φάρμακο κύστης (αντιχολινεργικό) με φάρμακο άνοιας: δρουν αντίθετα και μπορεί να επιδεινώσουν τη μνήμη.','Bladder medicine (antimuscarinic) with a dementia medicine: opposite effects, may worsen memory.'],
 [['antiepileptic'],['contraceptive'],'Κάποια αντιεπιληπτικά μειώνουν την προστασία του αντισυλληπτικού — ρωτήστε τον γιατρό.','Some anti-epileptics reduce contraceptive protection — ask your doctor.']
];
const SEDATE=['benzo','zdrug','opioid_weak','gabapentinoid','sedating_ah','antipsychotic','sedating_ad'];
function interactions(my){
  const cls=my.map(i=>MEDS[i]&&MEDS[i][0]).filter(Boolean);const out=[];
  IRULES.forEach(([a,b,el,en])=>{if(cls.some(x=>a.includes(x))&&cls.some(x=>b.includes(x)))out.push(L(el,en))});
  if(cls.filter(x=>SEDATE.includes(x)).length>=2)out.push(L('Δύο ή περισσότερα φάρμακα που φέρνουν νύστα (ηρεμιστικά, υπνωτικά, παυσίπονα οπιοειδή, πρεγκαμπαλίνη κ.ά.): κίνδυνος υπνηλίας, πτώσεων και αργής αναπνοής. Όχι αλκοόλ.','Two or more sedating medicines (tranquillisers, sleeping pills, opioids, pregabalin etc.): risk of drowsiness, falls and slow breathing. No alcohol.'));
  if(cls.some(x=>['nsaid','cox2'].includes(x))&&cls.some(x=>['acei','arb'].includes(x))&&cls.some(x=>['loop','thiazide','mra'].includes(x)))out.push(L('Αντιφλεγμονώδες + φάρμακο πίεσης + διουρητικό μαζί («τριπλό χτύπημα»): κίνδυνος για τα νεφρά, ιδίως σε αφυδάτωση.','Anti-inflammatory + blood pressure medicine + diuretic (“triple whammy”): kidney risk, especially when dehydrated.'));
  const dup={};cls.forEach(x=>dup[x]=(dup[x]||0)+1);Object.entries(dup).filter(([x,n])=>n>1).forEach(([x])=>out.push(L('Δύο φάρμακα της ίδιας κατηγορίας','Two medicines of the same group')+': '+L(MEDCLASS[x][0],MEDCLASS[x][6])+' — '+L('ελέγξτε με τον φαρμακοποιό αν χρειάζονται και τα δύο.','check with your pharmacist whether both are needed.')));
  if(my.length<2)return '';
  return out.length?`<div class="sec warn" style="margin-top:12px"><b>⚠️ ${L('Προσοχή στους συνδυασμούς','Watch these combinations')}</b>${out.map(x=>'• '+gx(x)).join('<br>')}<br><small>${L('Ενημερωτικό — μην αλλάξετε τίποτα χωρίς τον γιατρό ή τον φαρμακοποιό σας.','For information — change nothing without your doctor or pharmacist.')}</small></div>`:`<p class="muted" style="margin-top:10px">✔️ ${L('Δεν βρήκαμε γνωστό σοβαρό συνδυασμό στη λίστα μας. Ο φαρμακοποιός σας μπορεί να ελέγξει πιο αναλυτικά.','No known serious combination found in our list. Your pharmacist can check in more detail.')}</p>`;
}

function startTest(id){TST={id,ans:[],step:0};go('test/'+id)}
function vTest(id){
  const x=TESTS.find(z=>z.id===id);if(!x)return vTests();
  if(!TST||TST.id!==id)TST={id,ans:[],step:0};
  const d=x[LANG];const n=x.q.length;
  if(TST.step>=n)return testResult(x);
  const q=x.q[TST.step];const qt=LANG==='el'?q.el:q.en;
  let opts;
  if(x.yn)opts=[[t('yes'),t('yes'),q.p||1,'yes'],[t('no'),t('no'),0,'no']];
  else if(x.scale)opts=x.scale.map(o=>[o[0],o[1],o[2],'']);
  else opts=q.o.map(o=>[o[0],o[1],o[2],'']);
  const cur=TST.ans[TST.step];
  return header(d.t)+`<div class="card top">
   <p class="muted">${x.i} ${d.t} · ${t('q')} ${TST.step+1} ${t('of')} ${n}</p>
   <div class="prog"><i style="width:${Math.round(100*TST.step/n)}%"></i></div>
   ${TST.step===0?`<p class="muted" style="margin-bottom:8px">${gx(d.d)}</p>`:''}
   <div class="qtext">${esc(qt)}</div>
   ${q.bmi?`<div class="grid2"><input type="number" id="bh" inputmode="decimal" placeholder="${t('height')}"><input type="number" id="bw" inputmode="decimal" placeholder="${t('weight')}"></div><button class="btn small violet" style="margin:10px 0" onclick="bmiPick()">🧮 ${t('calc')}</button>`:''}
   <div class="opts">${opts.map((o,i)=>`<button class="opt ${o[3]}${cur&&cur.i===i?' on':''}" onclick="answer(${i},${o[2]})">${esc(LANG==='el'?o[0]:o[1])}</button>`).join('')}</div>
  </div>
  <div class="dock"><button class="btn ghost small" onclick="${TST.step?'TST.step--;render()':`go('tests')`}">↩ ${TST.step?t('prev'):t('back')}</button></div>`;
}
function bmiPick(){const h=+$('#bh').value/100,w=+$('#bw').value;if(!h||!w)return;const b=w/(h*h);answer(b<25?0:b<=30?1:2,b<25?0:b<=30?1:3)}
function answer(i,p){TST.ans[TST.step]={i,p};TST.step++;render()}
function testResult(x){
  const d=x[LANG];const score=TST.ans.reduce((a,b)=>a+b.p,0);
  const r=x.r.find(z=>score>=z[0]&&score<=z[1])||x.r[x.r.length-1];const txt=LANG==='el'?r[3]:r[4];
  const res=store.get('tests',{});res[x.id]={score,txt,date:Date.now(),title:d.t};store.set('tests',res);
  const crisis=x.id==='phq9'&&x.q.some((q,i)=>q.crisis&&TST.ans[i]&&TST.ans[i].p>0);
  return header(d.t)+`
   ${crisis?`<div class="crisis"><b>💜 ${t('crisis')}</b><p style="margin-top:8px">📞 <a href="tel:112">112</a> · 🇬🇷 ${L('Γραμμή Παρέμβασης για την Αυτοκτονία','Suicide Prevention Line')} <a href="tel:1018">1018</a> · 🇨🇾 Cyprus Samaritans <a href="tel:80007773">8000 7773</a></p></div>`:''}
   <div class="gauge ${r[2]}"><div>${x.i} ${t('score')}</div><div class="sc">${score}</div><p>${esc(txt)}</p></div>
   <div class="card"><p>ℹ️ ${t('testnote')}</p><p class="muted" style="margin-top:6px">${gx(d.src)}</p></div>
   <div class="dock"><button class="btn ghost small" onclick="go('tests')">📋 ${t('alltests')}</button><button class="btn" onclick="startTest('${x.id}')">🔄 ${t('retake')}</button></div>`;
}

function calcBMI(){const hc=+$('#h').value,w=+$('#w').value;if(!hc||!w)return;store.set('height',hc);const b=w/((hc/100)**2);
  const k=b<18.5?0:b<25?1:b<30?2:3;const cls=['y','g','o','r'][k];
  $('#out').innerHTML=`<div class="gauge ${cls}"><div>${t('bmi')}</div><div class="sc">${b.toFixed(1)}</div><p>${t('bmiRes')[k]}</p></div>`}
function bpClass(s,d){if(s>=180||d>=120)return 5;if(s<90||d<60)return 0;if(s>=140||d>=90)return 4;if(s>=130||d>=80)return 3;if(s>=120)return 2;return 1}
function calcBP(){const s=+$('#s').value,d=+$('#d').value;if(!s||!d)return;const k=bpClass(s,d);const cls=['y','g','y','o','r','r'][k];
  $('#out').innerHTML=`${k===5?`<a class="alert112" href="tel:112"><span class="n">112</span>${t('bpAdvice')[5]}</a>`:''}<div class="gauge ${cls}"><div>${t('bp')}</div><div class="sc">${s}/${d}</div><p>${t('bpRes')[k]}</p><p style="font-weight:600;font-size:1rem">${k<5?t('bpAdvice')[k]:''}</p></div>`}

const DT = {bp:'🩺',sugar:'🍬',weight:'⚖️',temp:'🌡️',pulse:'💓',spo2:'🫁',note:'📝'};
function rate(e){
  const v=e.v;
  if(e.type==='bp'){const k=bpClass(v[0],v[1]);return [['y','g','y','o','r','r'][k],t('bpRes')[k]]}
  if(e.type==='sugar'){const x=v[0],f=e.when!=='after';let k;if(x<70)k=0;else if(f?x<100:x<140)k=1;else if(f?x<126:x<200)k=2;else if(x<300)k=3;else k=4;return [['r','g','y','o','r'][k],t('sugarRes')[k]]}
  if(e.type==='temp'){const x=v[0];const k=x<35?0:x<37.5?1:x<38?2:x<39.5?3:4;return [['r','g','y','o','r'][k],t('tempRes')[k]]}
  if(e.type==='pulse'){const x=v[0];const k=x<50?0:x<=100?1:x<=130?2:3;return [['y','g','o','r'][k],t('pulseRes')[k]]}
  if(e.type==='spo2'){const x=v[0];const k=x>=95?0:x>=92?1:2;return [['g','y','r'][k],t('spo2Res')[k]]}
  if(e.type==='weight'){const h=store.get('height',0);if(h){const b=v[0]/((h/100)**2);const k=b<18.5?0:b<25?1:b<30?2:3;return [['y','g','o','r'][k],`${t('bmi')} ${b.toFixed(1)}`]}return ['n','']}
  return ['n',''];
}
const fmtV = e => e.type==='bp'?`${e.v[0]}/${e.v[1]}${e.v[2]?` · ${e.v[2]} bpm`:''}`:e.type==='note'?esc(e.txt):`${e.v[0]} ${({sugar:'mg/dL',weight:'kg',temp:'°C',pulse:'bpm',spo2:'%'})[e.type]}`;
const fmtD = ts => new Date(ts).toLocaleString(LANG==='el'?'el-GR':'en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
function vDiary(){

function addEntry(){
  const all=store.get('diary',[]);const e={type:DTYPE,ts:Date.now()};
  if(DTYPE==='note'){e.txt=$('#vt').value.trim();if(!e.txt)return}
  else{const v0=parseFloat(($('#v0').value||'').replace(',','.'));if(!v0)return;e.v=[v0];
    if(DTYPE==='bp'){const v1=+$('#v1').value;if(!v1)return;e.v.push(v1);const p=+$('#v2').value;if(p)e.v.push(p)}

function delEntry(ts){if(!confirm(t('confirmDel')))return;store.set('diary',store.get('diary',[]).filter(e=>e.ts!==ts));render()}
function chart(list){
  const W=600,H=220,P=34;const series=DTYPE==='bp'?[list.map(e=>e.v[0]),list.map(e=>e.v[1])]:[list.map(e=>e.v[0])];
  const vals=series.flat();let mn=Math.min(...vals),mx=Math.max(...vals);if(mx===mn){mx+=1;mn-=1}const pad=(mx-mn)*.15;mn-=pad;mx+=pad;
  const X=i=>P+(W-P*2)*(list.length===1?.5:i/(list.length-1)),Y=v=>H-P-(H-P*2)*(v-mn)/(mx-mn);
  const cols=['#e11d48','#3b82f6'];
  const lines=series.map((s,k)=>`<polyline fill="none" stroke="${cols[k]}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" points="${s.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>${s.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="5" fill="${cols[k]}"/>`).join('')}`).join('');
  const grid=[0,.5,1].map(f=>{const v=mn+(mx-mn)*f;return `<line x1="${P}" x2="${W-P}" y1="${Y(v)}" y2="${Y(v)}" stroke="currentColor" opacity=".15"/><text x="4" y="${Y(v)+5}" font-size="14" fill="currentColor" opacity=".7">${Math.round(v)}</text>`}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${grid}${lines}</svg>${DTYPE==='bp'?`<p class="muted"><span style="color:#e11d48">●</span> ${t('sys')} &nbsp; <span style="color:#3b82f6">●</span> ${t('dia')}</p>`:''}`;
}
