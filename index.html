<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ygeia-4all — Οδηγός Υγείας για όλους</title>
<meta name="description" content="Δωρεάν οδηγός υγείας στα ελληνικά: περιγράψτε τι νιώθετε, σημάδια κινδύνου, τεστ αυτοελέγχου, προληπτικές εξετάσεις ανά ηλικία, ημερολόγιο πίεσης και σακχάρου.">
<meta name="theme-color" content="#3b82f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ygeia-4all">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="Ygeia-4all — Οδηγός Υγείας για όλους">
<meta property="og:description" content="Συμπτώματα, σημάδια κινδύνου, τεστ, εξετάσεις ανά ηλικία, ημερολόγιο υγείας.">
<meta property="og:image" content="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f0f9ff;--card:#ffffff;--text:#0f172a;--soft:#334155;--muted:#64748b;--border:#cbd5e1;--chip:#f1f5f9;
  --blue:#3b82f6;--indigo:#6366f1;--violet:#8b5cf6;--pink:#ec4899;--orange:#f97316;--amber:#f59e0b;--green:#10b981;--teal:#0891b2;--red:#e11d48;
  --rainbow:linear-gradient(120deg,#06b6d4 0%,#3b82f6 30%,#8b5cf6 60%,#ec4899 85%,#f97316 100%);
  --r:22px;--fs:clamp(17px,0.5vw + 15px,19px);
  --shadow:0 8px 24px rgba(15,23,42,.10);
  --g:#16a34a;--y:#ca8a04;--o:#ea580c;--rr:#dc2626;
}
html{background:
  radial-gradient(circle at 0% 0%,rgba(34,211,238,.28),transparent 40%),
  radial-gradient(circle at 100% 15%,rgba(236,72,153,.20),transparent 40%),
  radial-gradient(circle at 50% 100%,rgba(250,204,21,.20),transparent 45%),#f0f9ff fixed;min-height:100%}
html.dark{--bg:#0b1026;--card:#151c3b;--text:#f8fafc;--soft:#cbd5e1;--muted:#94a3b8;--border:#2e3a6b;--chip:#1e2650;
  --shadow:0 8px 24px rgba(0,0,0,.45);
  background:radial-gradient(circle at 0% 0%,rgba(6,182,212,.22),transparent 40%),radial-gradient(circle at 100% 15%,rgba(168,85,247,.22),transparent 40%),#0b1026 fixed}
body{font-family:'Commissioner','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;font-size:var(--fs);line-height:1.5;color:var(--text);
  max-width:1100px;margin:0 auto;min-height:100vh;min-height:100dvh;
  padding:0 max(12px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--blue)}
html.dark .card a:not(.alert112):not(.btn){color:#93c5fd}
.aitem{color:var(--text);text-decoration:none}
.tile,.sosbig,.alert112{color:#fff!important}

/* ---------- ΚΕΦΑΛΙΔΑ ---------- */
.bar{position:sticky;top:0;z-index:50;margin:0 -4px 14px;padding:calc(10px + env(safe-area-inset-top)) 10px 10px;
  background:var(--rainbow);background-size:200% 200%;animation:shift 16s ease infinite;
  border-radius:0 0 24px 24px;box-shadow:0 8px 24px rgba(59,130,246,.30);display:flex;align-items:center;gap:8px}
@keyframes shift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.bar .home{display:flex;align-items:center;gap:6px;background:#fff;color:#1d4ed8;font-weight:800;border-radius:16px;padding:8px 14px;min-height:50px;font-size:1rem;box-shadow:0 4px 10px rgba(0,0,0,.15);white-space:nowrap}
.bar .brand{flex:1;display:flex;align-items:center;gap:10px;color:#fff;min-width:0}
.bar .brand>div{min-width:0}
.bar .brand img{width:46px;height:46px;border-radius:14px;box-shadow:0 4px 10px rgba(0,0,0,.2);flex-shrink:0}
.bar .brand b{font-size:clamp(1.05rem,3.2vw,1.45rem);font-weight:800;text-shadow:0 2px 5px rgba(0,0,0,.25);line-height:1.15;overflow:hidden;text-overflow:ellipsis}
.bar .brand small{display:block;font-weight:600;font-size:.78rem;opacity:.95}
.bar .ic{min-width:50px;min-height:50px;border-radius:16px;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.55);color:#fff;font-weight:800;font-size:1.05rem;display:flex;align-items:center;justify-content:center;padding:0 8px}
.bar .sos{background:#fff;color:#dc2626;border:none;font-size:1rem;gap:4px;padding:0 12px;box-shadow:0 4px 10px rgba(0,0,0,.2);text-decoration:none}
.bar.inner .brand img{display:none}
.bar.inner .brand small{display:none}

/* ---------- ΓΕΝΙΚΑ ---------- */
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:14px;position:relative;overflow:hidden}
.card.top::before{content:'';position:absolute;left:0;right:0;top:0;height:7px;background:var(--rainbow)}
h2{font-size:1.35rem;font-weight:800;margin-bottom:10px;line-height:1.25}
h3{font-size:1.15rem;font-weight:800;margin-bottom:6px}
.lead{color:var(--soft);margin-bottom:12px}
.muted{color:var(--muted);font-size:.92rem}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:58px;padding:10px 20px;border-radius:18px;font-weight:800;font-size:1.08rem;color:#fff;
  background:linear-gradient(135deg,#10b981,#0891b2,#3b82f6);box-shadow:0 8px 18px rgba(8,145,178,.35);transition:transform .15s,filter .15s;text-decoration:none;text-align:center}
.btn:hover{transform:translateY(-2px);filter:brightness(1.07)}
.btn:active{transform:scale(.97)}
.btn.wide{width:100%}
.btn.ghost{background:var(--card);color:var(--text);border:3px solid var(--border);box-shadow:none}
.btn.red{background:linear-gradient(135deg,#ef4444,#be123c);box-shadow:0 8px 18px rgba(225,29,72,.35)}
.btn.violet{background:linear-gradient(135deg,#8b5cf6,#6366f1)}
.btn.orange{background:linear-gradient(135deg,#f97316,#ec4899)}
.btn.small{min-height:46px;font-size:.98rem;padding:8px 14px;border-radius:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{width:100%;border:3px solid #93c5fd;border-radius:16px;padding:12px 14px;background:var(--card);font-size:1.08rem;min-height:56px}
html.dark input,html.dark select,html.dark textarea{border-color:#3b4a8a;background:#0f1533}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 5px rgba(99,102,241,.25)}
textarea{min-height:130px;resize:vertical;line-height:1.5}
label.f{display:block;font-weight:800;margin:12px 0 6px}
.sp{height:10px}
.hide{display:none!important}

/* ---------- 112 ---------- */
.sosbig{display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff;border-radius:24px;padding:14px 18px;margin-bottom:14px;
  background:linear-gradient(135deg,#ef4444,#be123c);box-shadow:0 10px 26px rgba(225,29,72,.40);animation:beat 2.6s ease-in-out infinite}
.sosbig .n{font-size:2.1rem;font-weight:900;background:#fff;color:#dc2626;border-radius:16px;padding:2px 14px;line-height:1.3}
.sosbig b{font-size:1.25rem;display:block}
.sosbig span{font-size:.95rem;opacity:.95}
@keyframes beat{0%,100%{box-shadow:0 10px 26px rgba(225,29,72,.35)}50%{box-shadow:0 10px 34px rgba(225,29,72,.65)}}

/* ---------- ΠΛΑΚΙΔΙΑ ΑΡΧΙΚΗΣ ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{position:relative;border-radius:24px;padding:16px 12px;color:#fff;text-align:center;min-height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  box-shadow:0 10px 22px rgba(0,0,0,.16);transition:transform .15s;text-decoration:none;overflow:hidden}
.tile::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 25% 15%,rgba(255,255,255,.35),transparent 50%);pointer-events:none}
.tile:hover{transform:translateY(-3px) scale(1.02)}
.tile:active{transform:scale(.97)}
.tile .e{font-size:2.4rem;line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.2))}
.tile b{font-size:1.05rem;line-height:1.2;text-shadow:0 1px 3px rgba(0,0,0,.25)}
.tile small{font-size:.82rem;opacity:.95;line-height:1.25}
.t1{background:linear-gradient(135deg,#3b82f6,#6366f1)}
.t2{background:linear-gradient(135deg,#10b981,#0891b2)}
.t3{background:linear-gradient(135deg,#ef4444,#f97316)}
.t4{background:linear-gradient(135deg,#f59e0b,#ea580c)}
.t5{background:linear-gradient(135deg,#06b6d4,#3b82f6)}
.t6{background:linear-gradient(135deg,#8b5cf6,#a855f7)}
.t7{background:linear-gradient(135deg,#ec4899,#db2777)}
.t8{background:linear-gradient(135deg,#f97316,#ec4899)}
.t9{background:linear-gradient(135deg,#14b8a6,#2563eb)}
.minilinks{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.minilinks button{background:var(--card);border-radius:14px;padding:10px 16px;font-weight:700;box-shadow:var(--shadow);min-height:48px}
.disc{text-align:center;color:var(--muted);font-size:.88rem;margin-top:12px;line-height:1.45}

/* ---------- ΠΕΡΙΟΧΕΣ ---------- */
.bodywrap{display:grid;grid-template-columns:minmax(0,200px) 1fr;gap:14px;align-items:start}
.bodysvg{width:100%;height:auto;max-height:420px}
.bodysvg .z{cursor:pointer;transition:filter .15s,opacity .15s}
.bodysvg .z:hover{filter:brightness(1.12) drop-shadow(0 0 6px rgba(59,130,246,.6))}
.areas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.area{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;border-radius:18px;padding:10px 12px;min-height:60px;text-align:left;font-size:1rem;line-height:1.2;box-shadow:0 5px 12px rgba(0,0,0,.14)}
.area .e{font-size:1.6rem;flex-shrink:0}
.area small{display:block;font-weight:600;opacity:.9;font-size:.78rem}

/* ---------- ΣΥΜΠΤΩΜΑΤΑ ---------- */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--chip);border:3px solid var(--border);font-weight:700;min-height:52px;text-align:left;line-height:1.25;font-size:1rem}
.chip.on{background:linear-gradient(135deg,#10b981,#0891b2);color:#fff;border-color:transparent;box-shadow:0 5px 14px rgba(8,145,178,.35)}
.chip.on::before{content:'✓';font-weight:900}
.chipbox{max-height:calc(100dvh - 330px);min-height:220px;overflow:auto;padding:4px 2px 8px;border-radius:14px;overscroll-behavior:contain}
.quick .chip{color:#fff;border:none}
.quick .chip:nth-child(8n+1){background:linear-gradient(135deg,#ef4444,#f97316)}
.quick .chip:nth-child(8n+2){background:linear-gradient(135deg,#f97316,#f59e0b)}
.quick .chip:nth-child(8n+3){background:linear-gradient(135deg,#ca8a04,#65a30d)}
.quick .chip:nth-child(8n+4){background:linear-gradient(135deg,#22c55e,#10b981)}
.quick .chip:nth-child(8n+5){background:linear-gradient(135deg,#06b6d4,#3b82f6)}
.quick .chip:nth-child(8n+6){background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.quick .chip:nth-child(8n+7){background:linear-gradient(135deg,#a855f7,#ec4899)}
.quick .chip:nth-child(8n+8){background:linear-gradient(135deg,#ec4899,#f43f5e)}
.dock{position:sticky;bottom:0;z-index:20;padding:12px 0 max(6px,env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;gap:10px}
html.dark .dock{background:linear-gradient(to top,#0b1026 70%,transparent)}
.dock .btn{flex:1}
.dock .btn.small{flex:0 0 auto;min-width:64px}

/* ---------- ΑΠΟΤΕΛΕΣΜΑΤΑ ---------- */
.res{border-left:10px solid var(--border);padding:14px 16px;cursor:pointer}
.res.emer{border-color:#e11d48;background:linear-gradient(135deg,rgba(254,226,226,.7),var(--card) 60%)}
.res.risk{border-color:#f97316}
.res.caution{border-color:#eab308}
.res.norm{border-color:#22c55e}
html.dark .res.emer{background:linear-gradient(135deg,rgba(127,29,29,.5),var(--card) 60%)}
.res .hd{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.res .hd h3{margin:0}
.res .arrow{font-size:1.3rem;transition:transform .2s;flex-shrink:0}
.res.open .arrow{transform:rotate(180deg)}
.res .body{display:none;margin-top:10px}
.res.open .body{display:block}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:999px;font-size:.88rem;font-weight:800;margin:6px 6px 0 0;color:#fff}
.tag.emer{background:#e11d48}.tag.risk{background:#ea580c}.tag.caution{background:#ca8a04}.tag.norm{background:#16a34a}
.tag.pc{background:var(--chip);color:var(--text);border:2px solid var(--border)}
.sec{margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--chip)}
.sec b{display:block;margin-bottom:4px}
.sec.warn{background:#fff7ed;border:2px solid #fdba74}
html.dark .sec.warn{background:#431407;border-color:#9a3412}
.matched{margin-top:6px;color:var(--soft);font-size:.95rem}
.matched mark{background:#d1fae5;color:#065f46;border-radius:8px;padding:0 6px;font-weight:700}
html.dark .matched mark{background:#064e3b;color:#a7f3d0}
.srcs a{display:inline-block;margin:4px 10px 0 0;font-weight:700}
.alert112{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#ef4444,#be123c);color:#fff;border-radius:20px;padding:14px 16px;margin-bottom:14px;text-decoration:none;font-weight:700}
.alert112 .n{background:#fff;color:#dc2626;border-radius:12px;padding:2px 10px;font-size:1.5rem;font-weight:900}

/* ---------- ΚΑΡΤΕΛΕΣ ---------- */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.seg button{min-height:58px;border-radius:18px;font-weight:800;background:var(--card);border:3px solid var(--border);font-size:1.02rem;padding:6px 8px;line-height:1.2}
.seg button.on{color:#fff;border-color:transparent}
.seg button.on.r{background:linear-gradient(135deg,#ef4444,#be123c)}
.seg button.on.b{background:linear-gradient(135deg,#f59e0b,#ea580c)}
.seg button.on.g{background:linear-gradient(135deg,#10b981,#0891b2)}
.signs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sign{background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start}
.sign .e{font-size:1.8rem;line-height:1}
.sign b{display:block;line-height:1.25}
.sign span{font-size:.92rem;color:var(--soft);line-height:1.35;display:block;margin-top:2px}
.signs.now .sign{border-left:7px solid #e11d48}
.signs.soon .sign{border-left:7px solid #f59e0b}

/* ---------- ΤΕΣΤ ---------- */
.tcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tcard{background:var(--card);border-radius:22px;padding:14px;box-shadow:var(--shadow);text-align:left;display:flex;gap:12px;align-items:center;border-left:8px solid var(--c);min-height:84px}
.tcard .e{font-size:2rem}
.tcard b{display:block;font-size:1.05rem;line-height:1.2}
.tcard small{color:var(--muted);line-height:1.25;display:block;margin-top:2px}
.prog{height:12px;border-radius:999px;background:var(--chip);overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--rainbow);border-radius:999px;transition:width .3s}
.qtext{font-size:1.3rem;font-weight:800;line-height:1.3;margin-bottom:16px;min-height:3.2em}
.opts{display:grid;gap:10px}
.opt{min-height:62px;border-radius:18px;background:var(--chip);border:3px solid var(--border);font-weight:800;font-size:1.08rem;text-align:left;padding:10px 16px;line-height:1.3}
.opt:hover{border-color:var(--blue)}
.opt.on{background:linear-gradient(135deg,#6366f1,#3b82f6);color:#fff;border-color:transparent}
.opt.yes.on{background:linear-gradient(135deg,#f97316,#e11d48)}
.opt.no.on{background:linear-gradient(135deg,#10b981,#0891b2)}
.gauge{border-radius:22px;padding:20px;color:#fff;text-align:center;margin-bottom:14px}
.gauge .sc{font-size:3rem;font-weight:900;line-height:1}
.gauge.g{background:linear-gradient(135deg,#22c55e,#0d9488)}
.gauge.y{background:linear-gradient(135deg,#eab308,#f59e0b)}
.gauge.o{background:linear-gradient(135deg,#f97316,#ea580c)}
.gauge.r{background:linear-gradient(135deg,#ef4444,#be123c)}
.gauge p{font-size:1.15rem;font-weight:800;margin-top:8px}
.crisis{background:#fff1f2;border:3px solid #e11d48;color:#881337;border-radius:20px;padding:16px;margin-bottom:14px}
html.dark .crisis{background:#4c0519;color:#ffe4e6}
.crisis a{font-weight:900;color:inherit;font-size:1.15rem}

/* ---------- ΕΞΕΤΑΣΕΙΣ ---------- */
.ages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ages button,.sex button{min-height:56px;border-radius:16px;background:var(--card);border:3px solid var(--border);font-weight:800}
.ages button.on,.sex button.on{background:linear-gradient(135deg,#06b6d4,#3b82f6);color:#fff;border-color:transparent}
.sex{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.list .it{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:2px dashed var(--border)}
.list .it:last-child{border-bottom:none}
.list .it .e{font-size:1.7rem;line-height:1}
.list .it span{display:block;color:var(--soft);font-size:.95rem}

/* ---------- ΗΜΕΡΟΛΟΓΙΟ ---------- */
.types{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.types button{min-height:70px;border-radius:18px;background:var(--card);border:3px solid var(--border);font-weight:800;font-size:.9rem;line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
.types button .e{font-size:1.5rem}
.types button.on{background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.entry{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2px dashed var(--border)}
.entry .v{font-weight:900;font-size:1.15rem}
.entry .d{color:var(--muted);font-size:.88rem}
.entry .x{margin-left:auto;min-width:44px;min-height:44px;border-radius:12px;background:var(--chip);font-size:1.1rem}
.dot{width:16px;height:16px;border-radius:50%;flex-shrink:0}
.dot.g{background:var(--g)}.dot.y{background:var(--y)}.dot.o{background:var(--o)}.dot.r{background:var(--rr)}.dot.n{background:var(--muted)}
.lbl{display:inline-block;padding:2px 10px;border-radius:999px;color:#fff;font-weight:800;font-size:.85rem}
.lbl.g{background:var(--g)}.lbl.y{background:var(--y)}.lbl.o{background:var(--o)}.lbl.r{background:var(--rr)}.lbl.n{background:var(--muted)}
.chart{width:100%;height:auto;background:var(--chip);border-radius:16px}

/* ---------- ΦΩΤΟΓΡΑΦΙΕΣ ---------- */
.abcde{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;text-align:center}
.abcde div{background:var(--chip);border-radius:14px;padding:8px 4px;font-size:.82rem;line-height:1.2}
.abcde b{display:block;font-size:1.4rem;color:var(--orange)}
.pgroup h3{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pic{position:relative;border-radius:16px;overflow:hidden;background:var(--chip)}
.pic img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pic span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:.82rem;padding:4px 8px;font-weight:700}
.pic button{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);color:#fff;border-radius:10px;min-width:36px;min-height:36px}

/* ---------- Α-Ω ---------- */
.alist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.aitem{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);text-align:left;font-weight:700;min-height:56px;line-height:1.25}
.letter{grid-column:1/-1;font-size:1.3rem;font-weight:900;color:var(--indigo);margin-top:8px}

/* ---------- ΠΑΡΑΘΥΡΟ ---------- */
.sheet{position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px}
.sheet .box{background:var(--card);border-radius:26px;padding:20px;width:100%;max-width:520px;box-shadow:0 -10px 40px rgba(0,0,0,.3);animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet .box .opts{margin-top:10px}

/* ---------- ΕΚΤΥΠΩΣΗ ---------- */
#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block;position:absolute;left:0;top:0;width:100%;color:#000;font-size:13pt;padding:10mm}
  #printArea h1{font-size:18pt;margin-bottom:6pt}
  #printArea h2{font-size:14pt;margin:12pt 0 4pt;border-bottom:1pt solid #888}
  #printArea table{border-collapse:collapse;width:100%}
  #printArea td,#printArea th{border:1pt solid #aaa;padding:3pt 6pt;text-align:left}
  html,body{background:#fff!important}
}

/* ---------- ΚΙΝΗΤΑ ---------- */
@media(max-width:760px){
  .bodywrap{grid-template-columns:1fr;gap:6px}
  .bodysvg{max-height:300px;display:block;margin:0 auto}
  .signs,.tcards,.alist{grid-template-columns:1fr}
  .ages{grid-template-columns:repeat(2,minmax(0,1fr))}
  .types{grid-template-columns:repeat(4,minmax(0,1fr))}
  .types button{font-size:.8rem;min-height:66px}
  .areas{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .area{min-height:58px;font-size:.92rem;padding:8px 10px;gap:8px}
  .area .e{font-size:1.4rem}
  .bar .brand small{display:none}
}
@media(max-width:600px){
  .tile{min-height:112px;padding:12px 6px}
  .tile .e{font-size:2.1rem}
  .tile b{font-size:.95rem}
  .tile small{display:none}
  .bar .home span{display:none}
  .bar .home{padding:8px 12px}
  .abcde{grid-template-columns:1fr;gap:5px;text-align:left}
  .abcde div{display:flex;align-items:center;gap:12px;font-size:1rem;padding:6px 12px}
  .abcde b{font-size:1.3rem;width:22px}
}
@media(max-width:380px){
  .tiles{gap:9px}
  .tile b{font-size:.88rem}
  .bar .brand b{font-size:1rem}
  .bar .ic{min-width:46px}
  .bodysvg{max-height:240px}
  .area{font-size:.85rem}
}
@media(max-width:340px){ .tiles{gap:7px} .tile{padding:10px 4px;min-height:104px;border-radius:20px} .tile .e{font-size:1.8rem} .tile b{font-size:.8rem} .sosbig{padding:12px} .sosbig .n{font-size:1.7rem} .sosbig b{font-size:1.1rem} .sosbig span{font-size:.85rem} }
@media(min-width:900px){
  .tile{min-height:150px}
  .tile .e{font-size:3rem}
  .areas{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(prefers-reduced-motion:reduce){.bar,.sosbig{animation:none}}
@media(max-width:380px){ .dock{gap:8px} .dock .btn{padding:8px 10px;font-size:1rem} .dock .btn.small{min-width:54px} }

</style>

glycerin if prescribed","med":["Do NOT take aspirin unless advised by doctor"],"note":"🔴 Time-critical — Hospital only"},"sev":"emer","areas":["cardio","senior"]},{"id":"angina","el":{"n":"Στηθάγχη","s":["Πόνος στο στήθος με σωματική προσπάθεια","Υποχωρεί εντός 5 λεπτών με ανάπαυση","Αίσθημα σφιξίματος"],"aid":"• Σταματήστε αμέσως κάθε δραστηριότητα\n• Αναπαυτείτε μέχρι υποχώρησης\n• Επισκεφτείτε γιατρό για έλεγχο","med":["Νιτρογλυκερίνη ΜΟΝΟ με συνταγή"],"note":"Καρδιολόγος — έλεγχος στεφανιαίων αγγείων αναγκαίος"},"en":{"n":"Angina","s":["Chest pain on exertion/exercise","Relieves within 5 minutes at rest","Squeezing sensation"],"aid":"• Stop all activity immediately\n• Rest until fully resolved\n• See doctor for assessment","med":["Nitroglycerin prescription only"],"note":"Cardiologist — coronary evaluation needed"},"sev":"risk","areas":["cardio","senior"]},{"id":"hypertension","el":{"n":"Υπέρταση","s":["Πονοκέφαλος στον αυχένα πρωί","Ζάλη","Βουή στα αυτιά","Συχνά ΔΕΝ έχει συμπτώματα"],"aid":"• Μέτρηση πίεσης σε ήρεμη κατάσταση\n• Μειώστε αλάτι, καφέ, αλκοόλ, στρες\n• Βαθιές αργές αναπνοές","med":["Κανένα χωρίς συνταγή — συνεχής αγωγή απαιτεί παρακολούθηση"],"note":"Τακτικός έλεγχος — η \"σιωπηλή\" νόσος δεν γίνεται να εντοπιστεί μόνο από συμπτώματα"},"en":{"n":"High Blood Pressure","s":["Morning back-of-head headache","Dizziness","Ringing in ears","Often NO symptoms at all"],"aid":"• Measure BP when calm\n• Reduce salt, coffee, alcohol, stress\n• Slow deep breathing","med":["No OTC treatment — maintenance therapy needs monitoring"],"note":"Regular checks essential — \"silent\" condition cannot be self-diagnosed"},"sev":"risk","areas":["cardio","senior"]},{"id":"arrhythmia","el":{"n":"Αρρυθμία","s":["Αίσθημα χτυποκάρδου ή \"παράλειψης\" χτυπήματος","Ακανόνιστος σφυγμός","Ζάλη/αστάθεια","Δύσπνοια σε προσπάθεια"],"aid":"• Καταγράψτε σφυγμό και διάρκεια\n• Αποφυγή καφεΐνης, ενεργειακών ποτών, αλκοόλ, καπνού\n• Ήρεμη σταθερή αναπνοή","med":["Κανένα χωρίς συνταγή"],"note":"Καρδιολόγος — ΗΚΓ, μελέτη 24ώρου (Χόλτερ) ίσως χρειαστεί"},"en":{"n":"Arrhythmia","s":["Palpitations or skipped beats","Irregular pulse","Dizziness/unsteadiness","Breathlessness on exertion"],"aid":"• Note pulse rate and duration\n• Cut caffeine, energy drinks, alcohol, tobacco\n• Steady calm breathing","med":["No OTC treatment"],"note":"Cardiologist — ECG, possibly 24h Holter monitor"},"sev":"caution","areas":["cardio"]},{"id":"anemia","el":{"n":"Αναιμία","s":["Επίμονη κόπωση και αδυναμία","Χλωμό δέρμα/βλεννογόνοι","Δύσπνοια με μικρή προσπάθεια","Ζάλη","Τριχόπτωση/εύθραυστα νύχια"],"aid":"• Διατροφή πλούσια σε σίδηρο — κρέας, συκώτι, όσπρια, σπανάκι\n• Συνδυάστε με βιταμίνη C (πορτοκάλι, πιπέρι) για καλύτερη απορρόφηση\n• Αποφύγετε τσάι/καφέ κατά το γεύμα","med":["Συμπληρώματα σιδήρου χωρίς συνταγή — ΜΟΝΟ αν επιβεβαιωθεί έλλειψη με εξέταση αίματος"],"note":"Αιτία πρέπει να βρεθεί — απώλεια αίματος, έλλειψη, ή άλλη πάθηση"},"en":{"n":"Anemia","s":["Persistent fatigue and weakness","Pale skin/lips/conjunctiva","Breathlessness on mild exertion","Dizziness","Brittle hair/nails"],"aid":"• Iron-rich diet — red meat, liver, pulses, spinach\n• Combine with vitamin C (citrus, peppers) to boost absorption\n• Avoid tea/coffee with meals","med":["Iron supplements OTC — ONLY after confirmed deficiency via blood test"],"note":"Root cause must be found — blood loss, malabsorption, or underlying condition"},"sev":"caution","areas":["cardio","gen"]},{"id":"highchol","el":{"n":"Υψηλή Χοληστερόλη","s":["Συνήθως ΧΩΡΙΣ συμπτώματα"],"aid":"• Μειώστε κορεσμένα λιπαρά και τηγανητά\n• Αυξήστε ψάρι, ελαιόλαδο, βρώμη, όσπρια, φυτικές ίνες\n• Τακτική φυσική άσκηση","med":["Ορισμένα συμπληρώματα φυτοστερολών/φυτικών ινών χωρίς συνταγή βοηθητικά μόνο"],"note":"Εξέταση αίματος — γιατρός αποφασίζει για στατίνες αν χρειάζεται"},"en":{"n":"High Cholesterol","s":["Usually NO symptoms"],"aid":"• Reduce saturated fats and fried foods\n• Increase fish, olive oil, oats, legumes, soluble fiber\n• Regular physical activity","med":["Plant sterol/fiber supplements OTC — supportive only"],"note":"Blood test — doctor decides on statin therapy if needed"},"sev":"caution","areas":["cardio","endo"]},{"id":"phlebitis","el":{"n":"Επιφανειακή Θρομβοφλεβίτιδα","s":["Ερυθρότητα και θερμότητα κατά μήκος φλέβας","Πόνος κατά την αφή","Σκληρή, ευπαθής δέσμη κάτω από το δέρμα"],"aid":"• Ανύψωση του άκρου πάνω από επίπεδο καρδιάς\n• Ελαστική επίδεση/κάλτσα συμπίεσης\n• ΜΗΝ κάνετε μασάζ — κίνδυνος μετακίνησης θρόμβου","med":["Παρακεταμόλη/Ιβουπροφαίνη για πόνο και φλεγμονή"],"note":"Αν εμφανιστεί πρήξιμο ή δύσπνοια → ΕΠΕΙΓΟΝ — πιθανή εν τω βάθει θρόμβωση"},"en":{"n":"Superficial Thrombophlebitis","s":["Redness and warmth along a vein","Tenderness to touch","Hard tender cord under skin"],"aid":"• Elevate limb above heart level\n• Compression bandage/stockings\n• NO massage — risk of clot dislodgement","med":["Paracetamol/Ibuprofen for pain and inflammation"],"note":"Swelling or breathlessness → EMERGENCY — possible DVT"},"sev":"risk","areas":["cardio"]},{"id":"dvt","el":{"n":"Εν Τω Βάθει Θρόμβωση","s":["Πρήξιμο συνήθως στο ένα σκέλος","Θερμότητα/ερυθρότητα στην περιοχή","Πόνος στη γάμβο που εντείνεται με έκταση του ποδιού"],"aid":"• Αποφύγετε μετακίνηση του άκρου\n• ΚΑΛΕΣΤΕ ΓΙΑΤΡΟ ΑΜΕΣΑ\n• Μην χορηγήσετε τίποτα μόνοι σας","med":["Κανένα — μπορεί να συγκαλύψει σύμπτωμα"],"note":"🔴 Κίνδυνος πνευμονικής εμβολής — νοσοκομείο"},"en":{"n":"Deep Vein Thrombosis","s":["Swelling usually in one leg","Warmth/redness over area","Calf pain worse when foot pulled up"],"aid":"• Minimise movement of limb\n• CALL DOCTOR NOW\n• Do not self-medicate","med":["None — may mask symptom"],"note":"🔴 Risk of pulmonary embolism — Hospital"},"sev":"emer","areas":["cardio"]},{"id":"cold","el":{"n":"Κρυολόγημα","s":["Συμφόρηση μύτης","Καταρροή","Ήπιος βήχας","Πονοκέφαλος","Χωρίς πυρετό ή πολύ ήπιος"],"aid":"• Ανάπαυση\n• Πολλά υγρά — νερό, τσάι, σούπες\n• Υγραντήρας ή δοχείο με νερό στο δωμάτιο","med":["Παρακεταμόλη για πόνο/πυρετό","Αποσυμφορητικά ρινικά σπρέι/σταγόνες — όχι πάνω από 5 μέρες","Σιρόπι βήχα"],"note":"Βελτίωση 5-7 μέρες. Αν επιδεινωθεί ή διαρκέσει περισσότερο → γιατρός"},"en":{"n":"Common Cold","s":["Nasal congestion","Runny nose","Mild cough","Headache","No or very mild fever"],"aid":"• Rest\n• Plenty of fluids — water, tea, soups\n• Humidifier or water bowl in room","med":["Paracetamol for pain/fever","Nasal decongestant sprays — max 5 days use","Cough syrup"],"note":"Improvement 5-7 days. Worsening or longer → see doctor"},"sev":"norm","areas":["resp"]},{"id":"flu","el":{"n":"Γρίπη","s":["Απότομη έναρξη μέσα σε ώρες","Υψηλός πυρετός","Μυαλγίες σε όλο το σώμα","Έντονη κόπωση/αδυναμία","Ξηρός βήχας"],"aid":"• Ανάπαυση στο κρεβάτι\n• Πολλά υγρά για πρόληψη αφυδάτωσης\n• Απομόνωση από άλλους","med":["Παρακεταμόλη — ΑΠΟΦΥΓΗ ασπιρίνης σε παιδιά και νέους κάτω των 18 ετών","Αντιγριπικά σκευάσματα για συμπτώματα"],"note":"Ετήσιος εμβολιασμός προστατεύει. Διάρκεια 7-14 μέρες"},"en":{"n":"Influenza","s":["Sudden onset within hours","High fever","Generalized body aches","Severe fatigue/weakness","Dry cough"],"aid":"• Bed rest\n• Plenty of fluids to prevent dehydration\n• Isolate from others","med":["Paracetamol — AVOID aspirin in children and under 18s","Combination flu remedies for symptom relief"],"note":"Annual vaccination recommended. Recovery 7-14 days"},"sev":"caution","areas":["resp","gen"]},{"id":"covid","el":{"n":"COVID-19","s":["Πυρετός","Βήχας συνήθως ξηρός","Απώλεια ή αλλαγή γεύσης/όσφρησης","Κόπωση","Πονόλαιμος","Μυαλγίες"],"aid":"• Απομόνωση σύμφωνα με τοπικές οδηγίες\n• Ενυδάτωση και ανάπαυση\n• Παρακολούθηση αναπνοής και κορεσμού οξυγόνου","med":["Παρακεταμόλη για πυρετό/πόνο","Συμπτωματική αγωγή"],"note":"Αν δύσπνοια ή κορεσμός οξυγόνου <94% → νοσοκομείο"},"en":{"n":"COVID-19","s":["Fever","Cough usually dry","Loss or change in taste/smell","Fatigue","Sore throat","Body aches"],"aid":"• Isolate per local guidelines\n• Hydrate and rest\n• Monitor breathing and oxygen saturation","med":["Paracetamol for fever/pain","Symptomatic care"],"note":"Breathlessness or O2 sat <94% → Hospital"},"sev":"risk","areas":["resp","gen"]},{"id":"bronchitis","el":{"n":"Βρογχίτιδα","s":["Παραγωγικός βήχας με φλέματα (διαυγή ή κιτρινωπά)","Σφίξιμο στο στήθος","Ήπιος πυρετός"],"aid":"• Ενυδάτωση — αραιώνει τα φλέματα και ευκολύνει την αποβολή\n• Εισπνοή ατμού\n• Αποφυγή καπνού και ερεθιστικών","med":["Παρακεταμόλη για πόνο/πυρετό","Αποχρεμπτικά για ευκολότερη εκκένωση φλεμάτων"],"note":"Συνήθως ιογενής — αντιβιοτικά μόνο αν αποδειχθεί βακτηριακή. Πάνω από 3 εβδομάδες → γιατρός"},"en":{"n":"Bronchitis","s":["Productive cough with clear/yellowish phlegm","Chest tightness","Mild fever"],"aid":"• Hydration thins mucus and eases clearance\n• Steam inhalation\n• Avoid smoke and irritants","med":["Paracetamol for pain/fever","Expectorants help clear phlegm"],"note":"Usually viral — antibiotics only if bacterial. >3 weeks → see doctor"},"sev":"caution","areas":["resp"]},{"id":"pneumonia","el":{"n":"Πνευμονία","s":["Υψηλός πυρετός >38.5°C","Πόνος στο στήθος κατά την αναπνοή/βήχα","Βήχας με πυώδη ή αιματηρά φλέματα","Δύσπνοια ακόμα και σε ανάπαυση","Ρίγη"],"aid":"• Ανάπαυση\n• ΚΑΛΕΣΤΕ ΓΙΑΤΡΟ — ακτινογραφία θώρακος αναγκαία\n• Ενυδάτωση","med":["Παρακεταμόλη μειώνει πυρετό — ΔΕΝ θεραπεύει την λοίμωξη"],"note":"🔴 Απαιτεί αντιβίωση με συνταγή — μην αμελείτε"},"en":{"n":"Pneumonia","s":["High fever >38.5°C","Chest pain breathing/coughing","Cough with thick/bloody phlegm","Shortness of breath even at rest","Chills"],"aid":"• Rest\n• SEE DOCTOR — chest X-ray essential\n• Hydrate","med":["Paracetamol lowers fever — does NOT cure infection"],"note":"🔴 Prescription antibiotics required — do not delay"},"sev":"risk","areas":["resp","senior"]},{"id":"asthma","el":{"n":"Άσθμα","s":["Δύσπνοια με συρίγμο","Σφίξιμο στο στήθος","Βήχας ιδιαίτερα τη νύχτα/νωρίς πρωί"],"aid":"• Καθιστή θέση, ήρεμη και αργή αναπνοή\n• Χρήση συσκευής διάσωσης (σαλβουταμόλη) αν συνταγογραφήθηκε\n• Αποφυγή γνωστών ερεθιστικών","med":["Δεν υπάρχει θεραπεία χωρίς συνταγή — συντήρηση απαιτεί ιατρική παρακολούθηση"],"note":"Αν δεν βελτιώνεται με τη συσκευή διάσωσης → ΕΠΕΙΓΟΝ"},"en":{"n":"Asthma","s":["Wheezing breathlessness","Chest tightness","Cough especially at night/early morning"],"aid":"• Sit upright, breathe slowly and calmly\n• Use rescue inhaler (salbutamol) if prescribed\n• Avoid known triggers","med":["No maintenance treatment without prescription — requires medical monitoring"],"note":"No improvement with reliever → EMERGENCY"},"sev":"risk","areas":["resp"]},{"id":"pleurisy","el":{"n":"Πλευρίτιδα","s":["Οξύς πόνος στο στήθος που εντείνεται με την εισπνοή/βήχα","Επιφανειακή, γρήγορη αναπνοή για αποφυγή πόνου"],"aid":"• Ρηχή αναπνοή μειώνει τον πόνο αλλά δεν είναι θεραπεία — αναφέρετε στον γιατρό\n• Ανάπαυση","med":["Παρακεταμόλη/Ιβουπροφαίνη για ανακούφιση από τον πόνο"],"note":"Η υποκείμενη αιτία πρέπει να εντοπιστεί — γιατρός αναγκαίος"},"en":{"n":"Pleurisy","s":["Sharp chest pain worsens breathing in/coughing","Shallow rapid breathing to avoid pain"],"aid":"• Shallow breathing eases pain temporarily — seek medical cause\n• Rest","med":["Paracetamol/Ibuprofen for pain relief"],"note":"Underlying cause must be diagnosed — see doctor"},"sev":"risk","areas":["resp"]},{"id":"hayfever","el":{"n":"Αλλεργική Ρινίτιδα","s":["Επαναλαμβανόμενο φτέρνισμα","Καταρροή ή συμφόρηση","Φαγούρα μύτης/ματιών/ουρανίσκου","Επιδείνωση ανάλογα εποχή"],"aid":"• Κλείνετε παράθυρα σε περιόδους υψηλής γύρης\n• Πλένετε πρόσωπο και μαλλιά μετά από έξοδο\n• Αποφυγή εξόδου τις πρωινές ώρες","med":["Αντιισταμινικά (σετιριζίνη, λοραταδίνη) χωρίς συνταγή","Ρινικά σπρέι χωρίς στεροειδή"],"note":"Επίμονη → ανοσοθεραπεία με παραπομπή σε αλλεργιολόγο"},"en":{"n":"Hay Fever / Allergic Rhinitis","s":["Repeated sneezing","Runny or blocked nose","Itchy nose/palate/eyes","Seasonal pattern"],"aid":"• Keep windows closed during high pollen\n• Wash face and hair after being outdoors\n• Avoid early morning outdoor exposure","med":["Antihistamines (cetirizine, loratadine) OTC","Non-steroidal nasal sprays"],"note":"Persistent → immunotherapy via allergist referral"},"sev":"norm","areas":["resp","gen"]},{"id":"pe","el":{"n":"Πνευμονική Εμβολή — ΕΠΕΙΓΟΝ","s":["Απότομη δύσπνοια χωρίς προφανή αιτία","Οξύς πόνος στο στήθος που εντείνεται με αναπνοή","Ταχυκαρδία/ακανόνιστος σφυγμός","Βήχας με αίμα"],"aid":"• ΚΑΛΕΣΤΕ 112 ΑΜΕΣΑ\n• Καθίστε, αποφύγετε προσπάθεια","med":["Κανένα"],"note":"🔴 Θρόμβος από πόδια προς πνεύμονες — νοσοκομείο ΜΟΝΟ"},"en":{"n":"Pulmonary Embolism — EMERGENCY","s":["Sudden unexplained breathlessness","Sharp chest pain worse breathing in","Rapid/irregular pulse","Coughing up blood"],"aid":"• CALL 112 NOW\n• Sit, avoid exertion","med":["None"],"note":"🔴 Blood clot from legs to lungs — Hospital only"},"sev":"emer","areas":["resp"]},{"id":"gastritis","el":{"n":"Γαστρίτιδα","s":["Κάψιμο στο άνω μέρος της κοιλιάς","Οξινότητα/αναγωγή","Πόνος που εντείνεται ή υποχωρεί μετά το φαγητό","Φούσκωμα"],"aid":"• Αποφυγή πικάντικων, λιπαρών, καφέ, αλκοόλ, καπνού\n• Μικρά και συχνά γεύματα\n• Μην ξαπλώνετε για 2-3 ώρες μετά το φαγητό","med":["Αντιόξινα (αλγινικά, ανθρακικό ασβέστιο) — άμεση ανακούφιση","Αναστολείς Η2 (φαμοτιδίνη) — χωρίς συνταγή βραχυχρόνια","Αντλίες πρωτονίων (ομεπραζόλη) — βραχυχρόνια χωρίς συνταγή"],"note":"Πάνω από 2 εβδομάδες ή αίμα/μαύρα κόπρανα → ενδοσκόπηση από γαστρεντερολόγο"},"en":{"n":"Gastritis","s":["Burning upper abdomen","Acid reflux","Pain better/worse after eating","Bloating"],"aid":"• Avoid spicy, fatty foods, coffee, alcohol, smoking\n• Eat smaller, more frequent meals\n• Stay upright 2-3h after eating","med":["Antacids (alginate, calcium carbonate) — immediate relief","H2 blockers (famotidine) — short-term OTC","Proton pump inhibitors (omeprazole) — short-term OTC"],"note":">2 weeks or blood/black stools → gastroscopy by gastroenterologist"},"sev":"caution","sources":["ΠΟΥ / WHO","Mayo Clinic","NHS"],"areas":["gastro"]},{"id":"reflux","el":{"n":"Γαστροοισοφαγική Παλινδρόμηση (ΓΟΠ)","s":["Καύση πίσω από το στέρνο","Όξινη γεύση στο στόμα ιδιαίτερα το βράδυ/πρωί","Βήχας που επιμένει χωρίς φλέματα"],"aid":"• Ανύψωση του κεφαλιού του κρεβατιού κατά 15-20cm\n• Δείπνο τουλάχιστον 3 ώρες πριν τον ύπνο\n• Χαλαρά ρούχα — αποφυγή στενής ζώνης","med":["Αντιόξινα για άμεση ανακούφιση","Αναστολείς Η2","Αντλίες πρωτονίων για 4-8 εβδομάδες"],"note":"Πάνω από 8 εβδομάδες ή δυσκολία κατάποσης → ενδοσκόπηση"},"en":{"n":"GERD / Acid Reflux","s":["Burning behind breastbone","Sour taste especially at night/morning","Persistent dry cough"],"aid":"• Raise bed head 15-20cm\n• Dinner at least 3h before bed\n• Loose clothing — no tight belts","med":["Antacids for quick relief","H2 blockers","PPIs for 4-8 weeks"],"note":">8 weeks or difficulty swallowing → endoscopy"},"sev":"caution","sources":["NHS","MedlinePlus","UpToDate"],"areas":["gastro"]},{"id":"ulcer","el":{"n":"Έλκος Στομάχου/Δωδεκαδακτύλου","s":["Πόνος άνω κοιλιάς — υποχωρεί με φαγητό (δωδεκαδάκτυλο) ή εντείνεται (στομάχι)","Ανεξήγητη απώλεια βάρους","Αίμα σε εμετό ή μαύρα κόπρανα"],"aid":"• ΔΙΑΚΟΠΤΕ ασπιρίνη, ιβουπροφαίνη, ναπροξένη — επιδεινώνουν\n• Τακτικά, ήπια γεύματα\n• Καταγράψτε όλα για τον γιατρό","med":["Αντιόξινα προσωρινή ανακούφιση μόνο — ΔΕΝ θεραπεύουν το έλκος"],"note":"🔴 Αιτία συνήθως Ελικοβακτηρίδιο του πυλωρού — εξέταση αναπνοής/κοπράνων και αγωγή από γιατρό"},"en":{"n":"Stomach/Duodenal Ulcer","s":["Upper abdominal pain — better eating (duodenal) / worse eating (stomach)","Unexplained weight loss","Blood in vomit or black stools"],"aid":"• STOP aspirin, ibuprofen, naproxen — worsen condition\n• Regular gentle meals\n• Document everything for doctor","med":["Antacids give temporary relief only — do NOT cure ulcer"],"note":"🔴 Usually H. pylori — breath/stool test + treatment prescribed"},"sev":"risk","sources":["WHO","Mayo Clinic","Cochrane Library"],"areas":["gastro"]},{"id":"gastroent","el":{"n":"Γαστρεντερίτιδα","s":["Κοιλόπονος/κράμπες","Διάρροια","Έμετος","Ήπιος πυρετός"],"aid":"• Ενυδάτωση με διαλύματα επανυδάτωσης\n• Νηστεία στερεών μέχρι υποχώρηση εμέτου\n• Σταδιακή επιστροφή σε ρύζι, ψωμί, πατάτα, μπανάνα","med":["Δισκοσμικόλη για διάρροια — ΑΠΑΓΟΡΕΥΕΤΑΙ αν υπάρχει αίμα ή πυρετός","Παρακεταμόλη — αποφυγή ιβουπροφαίνης"],"note":"Σημάδια αφυδάτωσης ή >3 μέρες → γιατρός"},"en":{"n":"Gastroenteritis","s":["Abdominal cramps","Diarrhea","Vomiting","Mild fever"],"aid":"• Oral rehydration solutions\n• No solids until vomiting stops\n• Gradual return: rice, bread, potato, banana","med":["Loperamide for diarrhea — FORBIDDEN if blood or fever present","Paracetamol — avoid ibuprofen"],"note":"Dehydration signs or >3 days → see doctor"},"sev":"caution","sources":["NHS","WHO","MedlinePlus"],"areas":["gastro","child"]},{"id":"foodpoison","el":{"n":"Τροφική Δηλητηρίαση","s":["Απότομη έναρξη ωρών μετά γεύμα — έμετος, διάρροια, πόνος","Μερικές φορές πυρετός"],"aid":"• Ενυδάτωση — προτεραιότητα αριθμός 1\n• Μη τρώτε στερεά μέχρι να ηρεμήσει το στομάχι\n• Καταγράψτε τι φάγατε για τον γιατρό","med":["Δισκοσμικόλη ΜΟΝΟ αν δεν υπάρχει πυρετός/αίμα και δεν είναι σοβαρή"],"note":"Συνήθως 1-3 μέρες. Επιμένει ή σοβαρά συμπτώματα → δείγμα κοπράνων"},"en":{"n":"Food Poisoning","s":["Sudden onset hours after meal — vomiting, diarrhea, pain","Sometimes fever"],"aid":"• Hydration — priority #1\n• No solids until settled\n• Log what you ate for doctor","med":["Anti-diarrheals ONLY if NO fever/blood and mild symptoms"],"note":"Usually 1-3 days. Persistent or severe → stool sample"},"sev":"caution","sources":["CDC","NHS","Mayo Clinic"],"areas":["gastro","gen"]},{"id":"appendicitis","el":{"n":"Σκωληκοειδίτιδα — ΚΙΝΔΥΝΟΣ","s":["Πόνος αρχικά γύρω από τον αφαλό → μετακινείται δεξιά κάτω κοιλιά","Ευαισθησία στο άγγιγμα και ιδιαίτερα κατά την απομάκρυνση του χεριού","Πυρετός","Ναυτία/έμετος"],"aid":"• ΜΗΝ τρώτε/πίνετε — πιθανή χειρουργική επέμβαση\n• ΜΗΝ καθαρτικά/αναλγητικά — συγκαλύπτουν συμπτώματα\n• ΜΗΝ ζεστές επιθέσεις — αυξάνουν φλεγμονή\n• Πηγαίνετε αμέσως","med":["Κανένα — καθυστέρηση αυξάνει κίνδυνο διάρρηξης"],"note":"🔴 Χειρουργική συνήθως αναγκαία — κάθε ώρα μετράει"},"en":{"n":"Appendicitis — RISK","s":["Pain starts around navel → moves lower right","Tender to touch — worse when hand released","Fever","Nausea/vomiting"],"aid":"• Do NOT eat/drink — likely surgery\n• NO laxatives/painkillers — mask symptoms\n• NO heat packs — increase inflammation\n• Go NOW","med":["None — delay increases rupture risk"],"note":"🔴 Usually requires surgery — every hour counts"},"sev":"emer","sources":["WHO","Mayo Clinic","NHS"],"areas":["gastro"]},{"id":"IBS","el":{"n":"Ευερέθιστο Έντερο","s":["Εναλλαγή διάρροιας και δυσκοιλιότητας","Πόνος που υποχωρεί με κένωση","Φούσκωμα/αίσθημα διάτασης"],"aid":"• Καταγραφή τροφών που το προκαλούν (γαλακτοκομικά, σιτάρι, οσπρια, καφές)\n• Τακτικά γεύματα, αργή μάσηση\n• Διαχείριση άγχους — συχνά επιδεινώνει","med":["Αντισπασμωδικά χωρίς συνταγή σε ορισμένες χώρες για πόνο","Διαιτοφυΐες για το φούσκωμα"],"note":"Χρειάζεται διάγνωση — αποκλεισμός άλλων παθήσεων πρώτα από γαστρεντερολόγο"},"en":{"n":"Irritable Bowel Syndrome","s":["Alternating diarrhea and constipation","Pain relieved by passing stool","Bloating/distension"],"aid":"• Identify trigger foods (dairy, wheat, legumes, coffee)\n• Regular meals, chew slowly\n• Stress management — often worsens condition","med":["Antispasmodics OTC in some countries for pain","Probiotics for bloating"],"note":"Diagnosis of exclusion — see gastroenterologist to rule out other conditions"},"sev":"caution","sources":["NHS","UpToDate","Cochrane Library"],"areas":["gastro"]},{"id":"gallstones","el":{"n":"Χολόλιθοι","s":["Πόνος δεξιά άνω κοιλιά που ανταποδίδει στον δεξιό ώμο/πλάτη","Εμφάνιση 1-3 ώρες μετά λιπαρό/βαρύ γεύμα","Ναυτία/αναγωγή"],"aid":"• Αποφυγή λιπαρών, τηγανητών, βουτύρου, τυριών με πολλά λιπαρά\n• Ελαφριά, συχνά γεύματα\n• Καταγραφή για τον γιατρό","med":["Παρακεταμόλη για πόνο — ΑΠΟΦΥΓΗ ιβουπροφαίνης αν υπάρχει δυσλειτουργία ήπατος"],"note":"Υπερηχογράφημα επιβεβαιώνει. Επίμονη ή επαναλαμβανόμενη → χειρουργική αφαίρεση χολής"},"en":{"n":"Gallstones","s":["Right upper abdominal pain radiates to right shoulder/back","Occurs 1-3h after fatty/heavy meal","Nausea/reflux"],"aid":"• Avoid fatty, fried foods, butter, high-fat cheese\n• Light, frequent meals\n• Log symptoms for doctor","med":["Paracetamol for pain — AVOID ibuprofen if liver function uncertain"],"note":"Ultrasound confirms. Recurrent → gallbladder removal surgery"},"sev":"risk","sources":["Mayo Clinic","NHS","MedlinePlus"],"areas":["hepat"]},{"id":"hepatitisA","el":{"n":"Ηπατίτιδα Α","s":["Κόπωση","Απώλεια όρεξης","Ναυτία","Πόνος δεξιά άνω κοιλιά","Κιτρινωπό χρώμα δέρματος/ματιών","Σκουρά ούρα/ανοιχτά κόπρανα"],"aid":"• Απολύτη ανάπαυση\n• Πολλά υγρά, ελαφριά διατροφή\n• Αποφυγή αλκοόλ και φαρμάκων που επιβαρύνουν το ήπαρ\n• Απομόνωση — μεταδίδεται μέσω τροφής/νερού/επαφής","med":["Κανένα ειδικό — υποστηρικτική αγωγή μόνο"],"note":"Συνήθως υποχωρεί σε 1-2 μήνες. Εμβόλιο διαθέσιμο για πρόληψη"},"en":{"n":"Hepatitis A","s":["Fatigue","Loss of appetite","Nausea","Right upper abdominal pain","Yellow skin/eyes","Dark urine/pale stools"],"aid":"• Complete rest\n• Hydration, light diet\n• No alcohol or liver-stressing drugs\n• Isolate — spreads via food/water/contact","med":["No specific treatment — supportive care only"],"note":"Usually resolves in 1-2 months. Vaccine available for prevention"},"sev":"caution","sources":["WHO","CDC","NHS"],"areas":["hepat"]},{"id":"fattyliver","el":{"n":"Λιπώδης Νόσος του Ήπατος","s":["Συχνά χωρίς συμπτώματα αρχικά","Κόπωση","Ελαφρύς πόνος δεξιά κοιλιά","Αύξηση βάρους"],"aid":"• Απώλεια βάρους με υγιή τρόπο — όχι αυστηρές δίαιτες\n• Διακοπή αλκοόλ\n• Άσκηση 30λεπτα/ημέρα","med":["Κανένα χωρίς συνταγή — αλλαγή τρόπου ζωής είναι η αγωγή"],"note":"Εξέταση αίματος και υπερηχογράφημα. Ελέγχου χοληστερόλης και σακχάρου"},"en":{"n":"Fatty Liver Disease","s":["Often no symptoms early","Fatigue","Mild right-sided pain","Weight gain"],"aid":"• Healthy weight loss — not crash diets\n• Stop alcohol completely\n• Exercise 30min daily","med":["No OTC medicine — lifestyle change IS the treatment"],"note":"Blood tests + ultrasound. Monitor cholesterol and blood sugar"},"sev":"caution","sources":["Mayo Clinic","UpToDate","NHS"],"areas":["hepat"]},{"id":"kidneystone","el":{"n":"Λίθος Νεφρού","s":["Έντονος πόνος στην οσφυϊκή χώρα που μετακινείται προς την κοιλιά/βουβώνα","Αίμα στα ούρα (ορατό ή μικροσκοπικό)","Συχνουρία/αίσθημα ανεξόδου","Ναυτία/έμετος"],"aid":"• Πολλά υγρά — 2.5-3 λίτρα την ημέρα αν μπορείς\n• Ανακούφιση με ζεστά επιθέματα στην οσφύ\n• Πηγαίνετε στον γιατρό — υπερηχογράφημα/αξονική","med":["Παρακεταμόλη για πόνο — ισχυρά αναλγητικά με συνταγή συχνά αναγκαία"],"note":"🔴 Αν ο πόνος δεν υποχωρεί ή πυρετός → ΕΠΕΙΓΟΝ — κίνδυνος απόφραξης ουρητήρα"},"en":{"n":"Kidney Stone","s":["Severe flank pain radiating to abdomen/groin","Blood in urine (visible or microscopic)","Frequent urge/incomplete emptying","Nausea/vomiting"],"aid":"• Plenty of fluids — 2.5-3L daily if possible\n• Warm compresses to lower back\n• See doctor — ultrasound/CT scan","med":["Paracetamol for pain — stronger painkillers often prescribed"],"note":"🔴 Unrelieved pain or fever → EMERGENCY — risk of blockage"},"sev":"risk","sources":["Mayo Clinic","NHS","UpToDate"],"areas":["urine"]},{"id":"uti","el":{"n":"Λοίμωξη Ουροποιητικού","s":["Συχνή και επώδυνη ούρηση","Αίσθημα καύσου","Θολά/δύσοσμα ούρα","Πόνος κάτω κοιλιά"],"aid":"• Πολλά νερά — ξεπλένουν το σύστημα\n• Σόδα με νερό μπορεί να ανακουφίσει προσωρινά\n• Ούριζε αμέσως μόλις νιώσεις την ανάγκη","med":["Παρακεταμόλη για πόνο — αντιβιοτικά ΜΟΝΟ με συνταγή"],"note":"Αν πυρετός ή πόνος οσφύ → έχει ανέβει στα νεφρά — επείγον"},"en":{"n":"Urinary Tract Infection","s":["Frequent painful urination","Burning sensation","Cloudy/smelly urine","Lower abdominal pain"],"aid":"• Drink plenty of water — flushes system\n• Baking soda in water may temporarily reduce burning\n• Urinate promptly when urge felt","med":["Paracetamol for pain — antibiotics prescription only"],"note":"Fever or back pain → infection reached kidneys — urgent"},"sev":"caution","sources":["NHS","Mayo Clinic","MedlinePlus"],"areas":["urine","gyn","senior"]},{"id":"cystitis","el":{"n":"Κυστίτιδα","s":["Καύσος κατά την ούρηση","Συχνουρία με λίγα ούρα κάθε φορά","Πόνος υπερηβική περιοχή"],"aid":"• Πολλά υγρά — νερό, χυμός βακκινίου βοηθά στην πρόληψη υποτροπών\n• Αποφυγή καφεΐνης, αλκοόλ, πικάντικων\n• Μην καθυστερείς την ούρηση","med":["Παρακεταμόλη","Αντιβιοτικά με συνταγή"],"note":"Αν επιμένει ή υποτροπιάζει → καλλιέργεια ούρων από γιατρό"},"en":{"n":"Cystitis","s":["Burning when urinating","Frequent small-volume urination","Pain above pubic bone"],"aid":"• Hydrate well — water, cranberry juice helps prevent recurrence\n• Avoid caffeine, alcohol, spicy foods\n• Do not delay urination","med":["Paracetamol","Antibiotics prescription"],"note":"Persistent or recurrent → urine culture by doctor"},"sev":"caution","sources":["NHS","UpToDate","Cochrane Library"],"areas":["urine","gyn"]},{"id":"prostate","el":{"n":"Διόγκωση Προστάτη","s":["Δυσκολία έναρξης ούρησης","Ασθενής ροή/διακοπτόμενη","Ανεξόδου ούρα","Συχνουρία ιδιαίτερα το βράδυ"],"aid":"• Μην πίνεις πολλά υγρά πριν τον ύπνο\n• Αποφυγή αντισυμφορητικών και διουρητικών το βράδυ\n• Ούριζε δύο φορές (επανάληψη μετά λίγα λεπτά)","med":["Φυτικά σκευάσματα (σερενοά) χωρίς συνταγή — περιορισμένη τεκμηρίωση"],"note":"Αξιολόγηση από ουρολόγο — έλεγχος και αποκλεισμός καρκίνου προστάτη"},"en":{"n":"Enlarged Prostate","s":["Difficulty starting urine stream","Weak/interrupted flow","Incomplete emptying","Frequent urination especially night"],"aid":"• Limit fluids before bed\n• Avoid decongestants and diuretics at night\n• Double voiding — urinate, wait, go again","med":["Plant extracts (saw palmetto) OTC — limited evidence"],"note":"Urologist assessment — examination and cancer screening essential"},"sev":"caution","sources":["NHS","Mayo Clinic","UpToDate"],"areas":["urine","male","senior"]},{"id":"periodpain","el":{"n":"Πόνος Περιόδου","s":["Κράμπες κάτω κοιλιά πριν/κατά την περίοδο","Ακτινοβολία σε οσφύ/πόδια","Ναυτία/κόπωση"],"aid":"• Ζεστές επιθέσεις στην κοιλιά\n• Ήπια άσκηση — βελτιώνει κυκλοφορία\n• Χαλαρά ρούχα","med":["Παρακεταμόλη","Ιβουπροφαίνη/ναπροξένη — καλύτερα να ξεκινήσουν 1-2 μέρες πριν"],"note":"Αν ο πόνος είναι ασυνήθιστα έντονος ή αυξάνεται → γυναικολόγος"},"en":{"n":"Period Pain / Dysmenorrhea","s":["Lower abdominal cramps before/during period","Radiates to back/legs","Nausea/fatigue"],"aid":"• Warm heat packs on abdomen\n• Gentle exercise — improves circulation\n• Loose clothing","med":["Paracetamol","Ibuprofen/naproxen — best started 1-2 days before period"],"note":"Unusually severe or worsening pain → gynecologist"},"sev":"norm","sources":["NHS","Mayo Clinic"],"areas":["gyn"]},{"id":"ovariancyst","el":{"n":"Κύστη Ωοθήκης","s":["Πόνος μία πλευρά κάτω κοιλιάς","Αίσθημα βάρους/διάτασης","Αλλαγή συχνότητας ούρησης"],"aid":"• Παρακολούθηση\n• Ζεστή ανακούφιση\n• Καταγραφή κύκλου και συμπτωμάτων","med":["Παρακεταμόλη για πόνο"],"note":"Υπερηχογράφημα επιβεβαιώνει. Έντονος πόνος → μπορεί να έσπασε/στράφηκε — ΕΠΕΙΓΟΝ"},"en":{"n":"Ovarian Cyst","s":["One-sided lower abdominal pain","Heaviness/bloating","Urinary frequency change"],"aid":"• Monitor symptoms\n• Warmth eases discomfort\n• Track cycle and symptoms","med":["Paracetamol for pain"],"note":"Ultrasound confirms. Sudden severe pain → rupture/torsion — EMERGENCY"},"sev":"risk","sources":["Mayo Clinic","NHS"],"areas":["gyn"]},{"id":"vaginalinf","el":{"n":"Κολπίτιδα","s":["Αλλαγή έκκριματος — χρώμα, οσμή, ποσότητα","Φαγούρα/ερυθρότητα","Πόνος κατά την επαφή/ούρηση"],"aid":"• Μην πλένεις εντός του κόλπου — διαταράσσει την ισορροπία\n• Βαμβακερά εσώρουχα, χωρίς στενά τζιν\n• Αποφυγή αρωματικών σαπουνιών","med":["Αντιμυκητιασικές κρέμες/υπόθετρα χωρίς συνταγή για μυκητίαση"],"note":"Αν δεν βελτιωθεί σε 3 μέρες ή άλλη έκκριμα → καλλιέργεια από γυναικολόγο"},"en":{"n":"Vaginal Infection","s":["Discharge change — color, odor, amount","Itching/redness","Pain on contact/urination"],"aid":"• Do NOT douche — disrupts natural balance\n• Cotton underwear, no tight jeans\n• Avoid scented soaps","med":["Antifungal creams/suppositories OTC for yeast infection"],"note":"No improvement in 3 days or different discharge → swab by gynecologist"},"sev":"caution","sources":["NHS","UpToDate","MedlinePlus"],"areas":["gyn"]},{"id":"pregwarning","el":{"n":"Προειδοποίηση Εγκυμοσύνης","s":["Κολπική αιμορραγία","Πόνος κάτω κοιλιάς/οσφύος","Συμπτώματα που υποχωρούν και επιστρέφουν"],"aid":"• Ανάπαυση\n• Μην ανυψώνεις βαριά\n• ΚΑΛΕΣΕ ΓΥΝΑΙΚΟΛΟΓΟ ΑΜΕΣΑ","med":["Κανένα φάρμακο χωρίς σύσταση μαιευτήρα"],"note":"🔴 Αιμορραγία ή έντονος πόνος → πιθανή αποβολή ή έκτοπη — νοσοκομείο"},"en":{"n":"Pregnancy Warning Signs","s":["Vaginal bleeding","Lower abdominal/back pain","Symptoms disappearing then returning"],"aid":"• Rest\n• Do NOT lift heavy objects\n• CALL OBSTETRICIAN NOW","med":["NO medicine without obstetrician advice"],"note":"🔴 Bleeding or severe pain → miscarriage or ectopic — Hospital"},"sev":"emer","sources":["WHO","Mayo Clinic","NHS"],"areas":["gyn"]},{"id":"testicularpain","el":{"n":"Πόνος Όρχεως","s":["Απότομος έντονος πόνος σε ένα όρχι","Πρήξιμο/αίσθημα βάρους","Πόνος που ανταποδίδει στην κοιλιά"],"aid":"• ΚΑΛΕΣΤΕ ΓΙΑΤΡΟ ΑΜΕΣΑ — αν είναι στρέψη χρειάζεται επέμβαση εντός 6 ωρών\n• Ανύψωση με υποστήριγμα","med":["Κανένα — μην καθυστερείς"],"note":"🔴 Στρέψη όρχεως — κάθε λεπτό μετράει για να σωθεί το όργανο"},"en":{"n":"Testicular Pain","s":["Sudden severe pain in one testicle","Swelling/heaviness","Pain radiates to abdomen"],"aid":"• SEE DOCTOR IMMEDIATELY — torsion needs surgery within 6 hours\n• Wear supportive underwear","med":["None — do not delay"],"note":"🔴 Testicular torsion — every minute counts to save organ"},"sev":"emer","sources":["NHS","Mayo Clinic"],"areas":["male"]},{"id":"epididymitis","el":{"n":"Επιδιδυμίτιδα","s":["Σταδιακός πόνος/πρήξιμο ενός όρχεως","Ευαισθησία πίσω από τον όρχι","Μερικές φορές πυρετός/ούρηση"],"aid":"• Ανύψωση και υποστήριξη\n• Κρύες επιθέσεις\n• Ανάπαυση","med":["Παρακεταμόλη/Ιβουπροφαίνη — αντιβιοτικά με συνταγή"],"note":"Αξιολόγηση από ουρολόγο — αποκλεισμός στρέψης πρώτα"},"en":{"n":"Epididymitis","s":["Gradual pain/swelling one testicle","Tenderness behind testicle","Sometimes fever/urinary symptoms"],"aid":"• Support and elevate\n• Cold compresses\n• Rest","med":["Paracetamol/Ibuprofen — antibiotics prescribed"],"note":"Urologist assessment — rule out torsion first"},"sev":"caution","sources":["NHS","UpToDate"],"areas":["male"]},{"id":"backpain","el":{"n":"Οσφυαλγία","s":["Πόνος στην οσφυϊκή χώρα","Χειροτερεύει με όρθια/κάμψη","Βελτιώνεται με ανάπαυση"],"aid":"• Θερμότητα τις πρώτες 48-72 ώρες, μετά εναλλαγή με κρύο\n• Διατήρηση κίνησης — η παραμονή στο κρεβάτι επιδεινώνει\n• Σωστή στάση και ανύψωση","med":["Παρακεταμόλη","Ιβουπροφαίνη/ναπροξένη","Τοπικές γέλες/επιθέματα"],"note":"Αν ακτινοβολεί σε πόδια, αδυναμία ή μούδιασμα → ορθοπεδικός/νευρολόγος"},"en":{"n":"Lower Back Pain","s":["Lumbar area pain","Worse standing/bending","Better with rest"],"aid":"• Heat first 48-72h, then alternate with cold\n• Keep moving — bed rest worsens recovery\n• Good posture and lifting technique","med":["Paracetamol","Ibuprofen/naproxen","Topical gels/patches"],"note":"Pain radiating to legs, weakness, numbness → orthopedist/neurologist"},"sev":"norm","sources":["NHS","Mayo Clinic","Cochrane Library"],"areas":["musc"]},{"id":"arthritis","el":{"n":"Αρθρίτιδα","s":["Πόνος στις αρθρώσεις","Πρήξιμο/θερμότητα","Πρωινή δυσκαμψία πάνω από 30 λεπτά"],"aid":"• Ήπια άσκηση — διατήρηση κινητικότητας είναι προτεραιότητα\n• Θερμότητα πριν από δραστηριότητα, κρύο μετά\n• Απώλεια βάρους μειώνει επιβάρυνση","med":["Παρακεταμόλη για πόνο","Ιβουπροφαίνη/ναπροξένη για φλεγμονή"],"note":"Χρόνια πάθηση — ρευματολόγος για σωστή διάγνωση και αγωγή"},"en":{"n":"Arthritis","s":["Joint pain","Swelling/warmth","Morning stiffness over 30 min"],"aid":"• Gentle exercise — preserving mobility is priority\n• Heat before activity, cold after\n• Weight loss reduces load on joints","med":["Paracetamol for pain","Ibuprofen/naproxen for inflammation"],"note":"Chronic condition — rheumatologist for proper diagnosis and treatment"},"sev":"caution","sources":["Mayo Clinic","NHS","UpToDate"],"areas":["musc","senior"]},{"id":"sprain","el":{"n":"Διάστρεμμα","s":["Πόνος/πρήξιμο μετά από στρέψη/πτώση","Δυσκολία βάσης βάρους","Μελανιάση"],"aid":"• ΑΝΑΣΤΟΛΗ — Ανάπαυση, Κρύο, Επίδεση, Ανύψωση\n• Κρύο 15-20 λεπτά κάθε 2-3 ώρες τις πρώτες 24-48 ώρες\n• ΜΗΝ θερμότητα τις πρώτες μέρες","med":["Παρακεταμόλη/Ιβουπροφαίνη για πόνο"],"note":"Αν αδυναμία ή αδυναμία βάσης → ακτινογραφία για κάταγμα"},"en":{"n":"Sprain","s":["Pain/swelling after twist/fall","Difficulty bearing weight","Bruising"],"aid":"• R.I.C.E. — Rest, Ice, Compression, Elevation\n• Ice 15-20min every 2-3h first 24-48h\n• NO heat first few days","med":["Paracetamol/Ibuprofen for pain"],"note":"Inability to bear weight → X-ray to rule out fracture"},"sev":"caution","sources":["NHS","Mayo Clinic"],"areas":["musc"]},{"id":"cramp","el":{"n":"Μυϊκή Κράμπα","s":["Απότομος έντονος πόνος σε γάμβα/πόδι","Σκλήρυνση του μυός"],"aid":"• Απαλή διάταση του μυός κατά τη διάρκεια\n• Θερμότητα και μασάζ μετά την υποχώρηση\n• Ενυδάτωση με άλατα αν συχνή","med":["Μαγνήσιο/κάλιο συμπληρώματα χωρίς συνταγή αν συχνή"],"note":"Αν συχνή και επίμονη → έλεγχος αιμάτων"},"en":{"n":"Muscle Cramp","s":["Sudden intense pain calf/foot","Hardening of muscle"],"aid":"• Gentle stretch DURING cramp\n• Heat and massage after it passes\n• Hydrate with electrolytes if frequent","med":["Magnesium/potassium supplements OTC if recurrent"],"note":"Frequent persistent → blood tests"},"sev":"norm","sources":["NHS","Mayo Clinic"],"areas":["musc"]},{"id":"eczema","el":{"n":"Έκζεμα","s":["Ξηρότητα","Ερυθρότητα","Έντονη φαγούρα","Απολέπιση/σχισίματα"],"aid":"• Ενυδάτωση 2 φορές την ημέρα χωρίς άρωμα\n• Υποκατάστατα καθαρισμού αντί σαπουνιού\n• Μαλακά βαμβακερά ρούχα","med":["Υδροκορτιζόνη 1% κρέμα — βραχυχρόνια χωρίς συνταγή","Ενυδατικές αλοιφές/κρέμες"],"note":"Αν εξαπλώνεται, φλεγμαίνει ή δεν βελτιώνεται → δερματολόγος"},"en":{"n":"Eczema","s":["Dryness","Redness","Intense itching","Scaling/cracks"],"aid":"• Fragrance-free moisturizer twice daily\n• Soap substitutes instead of regular soap\n• Soft cotton clothing","med":["Hydrocortisone 1% cream — short-term OTC only","Emollients/moisturizers"],"note":"Spreading, infected, or unimproving → dermatologist"},"sev":"caution","sources":["NHS","Mayo Clinic","MedlinePlus"],"areas":["skin"]},{"id":"urticaria","el":{"n":"Κνίδωση","s":["Εξάνθημα με λευκά κέντρα και ερυθρές ζώνες","Έντονη φαγούρα","Εμφάνιση-εξαφάνιση"],"aid":"• Αποφυγή πιθανής αιτίας (τροφή, φάρμακο, έντομο)\n• Κρύες επιθέσεις/λουτρό\n• Μην ξύνεις","med":["Αντιισταμινικά (σετιριζίνη, λοραταδίνη) χωρίς συνταγή"],"note":"Αν πρήξιμο λαιμού/χειλιών ή δύσπνοια → 112 ΑΜΕΣΑ"},"en":{"n":"Hives / Urticaria","s":["Rash with white centers and red weals","Intense itching","Appear and fade"],"aid":"• Avoid trigger (food, medicine, insect)\n• Cold compresses/bath\n• Do NOT scratch","med":["Antihistamines (cetirizine, loratadine) OTC"],"note":"Swelling of throat/lips or breathlessness → CALL 112 NOW"},"sev":"caution","sources":["NHS","Mayo Clinic"],"areas":["skin"]},{"id":"melanoma","el":{"n":"Μελάνωμα — ΚΙΝΔΥΝΟΣ","s":["Ασυμμετρία σχήματος ελιάς","Ακανόνιστες άκρες","Πολλά χρώματα","Μεγαλύτερη από 6mm","Αλλάζει μέγεθος/σχήμα/χρώμα/αιμορραγεί"],"aid":"• Μην αγγίζετε/κόβετε μόνοι σας\n• Φωτογραφήστε για σύγκριση\n• ΔΕΡΜΑΤΟΛΟΓΟΣ ΑΜΕΣΑ","med":["Κανένα φάρμακο δεν βοηθά"],"note":"🔴 Η έγκαιρη διάγνωση σώζει ζωές — μην καθυστερείς"},"en":{"n":"Melanoma — DANGER","s":["Asymmetrical mole shape","Irregular borders","Multiple colours","Larger than 6mm","Changing size/shape/colour/bleeding"],"aid":"• Do NOT touch or cut yourself\n• Photograph for reference\n• SEE DERMATOLOGIST NOW","med":["No medicine will help"],"note":"🔴 Early diagnosis saves lives — do not delay"},"sev":"emer","sources":["WHO","Mayo Clinic","NHS"],"areas":["skin"]},{"id":"acne","el":{"n":"Ακμή","s":["Σπυράκια","Μαύρα/λευκά στίγματα","Φλύκταινες","Ερυθρότητα"],"aid":"• Καθαρισμός προσώπου 2 φορές την ημέρα με ήπιο καθαριστικό\n• Μην πιέζεις — δημιουργεί ουλές\n• Αποφυγή λιπαρών προϊόντων προσώπου","med":["Κρέμες με βενζοϊλο υπεροξείδιο/σαλικυλικό οξύ χωρίς συνταγή"],"note":"Επίμονη ή βαθιά ακμή → δερματολόγος για αγωγή"},"en":{"n":"Acne","s":["Pimples","Blackheads/whiteheads","Pustules","Redness"],"aid":"• Wash face twice daily with gentle cleanser\n• Do NOT squeeze — causes scarring\n• Avoid oily face products","med":["Benzoyl peroxide/salicylic acid creams OTC"],"note":"Persistent or deep cystic acne → dermatologist"},"sev":"norm","sources":["NHS","Mayo Clinic"],"areas":["skin"]},{"id":"ringworm","el":{"n":"Δακτυλίτιδα","s":["Δακτυλιοειδές εξάνθημα με ανυψωμένες άκρες","Φαγούρα","Εξαπλώνεται"],"aid":"• Διατήρηση καθαρό και στεγνό\n• Μην μοιράζεσαι πετσέτες/ρούχα\n• Αποφύγετε επαφή με ζώα","med":["Αντιμυκητιασικές κρέμες (κλοτριμαζόλη) χωρίς συνταγή — εφαρμογή 2 εβδομάδες μετά την εξαφάνιση"],"note":"Αν στο τριχωτό ή εκτεταμένη → από του στόματος αγωγή με συνταγή"},"en":{"n":"Ringworm","s":["Ring-shaped rash with raised edge","Itching","Spreading"],"aid":"• Keep clean and dry\n• Do not share towels/clothes\n• Check pets for infection","med":["Antifungal creams (clotrimazole) OTC — continue 2 weeks after clear"],"note":"Scalp or widespread → oral prescription treatment"},"sev":"caution","sources":["NHS","Mayo Clinic"],"areas":["skin"]},{"id":"conj","el":{"n":"Επιπεφυκίτιδα","s":["Ερυθρότητα λευκού ματιού","Έκκριμα που κολλάει τις βλέφαρες πρωί","Φαγούρα/αίσθημα ξένου σώματος"],"aid":"• Καθαρισμός από έξω προς τα μέσα με αλατόνερο\n• Κρύες επιθέσεις\n• Μην αγγίζετε με χέρια","med":["Τεχνητά δάκρυα","Αντιβιοτικές σταγόνες χωρίς συνταγή σε ορισμένες περιπτώσεις"],"note":"Πόνος, μείωση όρασης ή φωτοφοβία → ΟΦΘΑΛΜΙΑΤΡΟΣ"},"en":{"n":"Conjunctivitis","s":["Redness of white eye","Discharge sticking lids in morning","Itching/gritty sensation"],"aid":"• Wipe eyes outward with saline solution\n• Cold compresses\n• Do not touch with hands","med":["Artificial tears","Antibiotic drops OTC in some cases"],"note":"Pain, vision loss, or light sensitivity → OPHTHALMOLOGIST"},"sev":"caution","sources":["NHS","Mayo Clinic"],"areas":["eye"]},{"id":"stye","el":{"n":"Χαλάζιο","s":["Πύωδης όγκος σε βλέφαρο","Πόνος/ερυθρότητα","Ευαισθησία"],"aid":"• Ζεστές υγρές επιθέσεις 10-15 λεπτά 3-4 φορές την ημέρα\n• Μην πιέζεις/ανοίγεις\n• Καθαρισμός βλεφαρίδων","med":["Τεχνητά δάκρυα για ανακούφιση"],"note":"Αν μεγαλώνει ή επανέρχεται → οφθαλμίατρος"},"en":{"n":"Stye","s":["Painful lump on eyelid","Redness/swelling","Tenderness"],"aid":"• Warm moist compresses 10-15min 3-4× daily\n• Do NOT squeeze/pop\n• Clean lash line gently","med":["Artificial tears for comfort"],"note":"Growing or recurrent → ophthalmologist"},"sev":"norm","sources":["NHS","Mayo Clinic"],"areas":["eye"]},{"id":"glaucoma","el":{"n":"Γλαύκωμα","s":["Συχνά χωρίς πόνο — σταδιακή απώλεια περιφερικής όρασης"],"aid":"• Δεν υπάρχει πρώτη βοήθεια — ΕΤΗΣΙΟΣ ΕΛΕΓΧΟΣ","med":["Κανένα χωρίς συνταγή — σταγόνες για μείωση πίεσης"],"note":"🔴 Οφθαλμίατρος — μη αναστρέψιμη βλάβη αν καθυστερήσει"},"en":{"n":"Glaucoma","s":["Often painless — gradual loss of side vision"],"aid":"No first aid — ANNUAL EYE EXAMINATION","med":["No OTC treatment — pressure-lowering drops prescribed"],"note":"🔴 Ophthalmologist — damage irreversible if delayed"},"sev":"risk","sources":["WHO","Mayo Clinic","NHS"],"areas":["eye","senior"]},{"id":"stress","el":{"n":"Στρες / Άγχος","s":["Δυσκολία ύπνου","Συνεχής ανησυχία","Μυϊκή ένταση","Κόπωση","Αλλαγή όρεξης"],"aid":"• Βαθιές αναπνοές 4-7-8: εισπνοή 4, αναμονή 7, εκπνοή 8\n• Φυσική άσκηση 30λεπτα/ημέρα — απελευθερώνει ενδορφίνες\n• Τεχνικές χαλάρωσης/διαλογισμού","med":["Κανένα φάρμακο χωρίς συνταγή — βιταμίνες Β/μαγνήσιο βοηθητικά"],"note":"Επιμένει και επιδεινώνεται → ψυχολόγος/ψυχίατρος"},"en":{"n":"Stress / Anxiety","s":["Sleep difficulty","Persistent worry","Muscle tension","Fatigue","Appetite change"],"aid":"• 4-7-8 breathing: inhale 4, hold 7, exhale 8\n• Daily exercise 30min — releases endorphins\n• Relaxation/meditation practices","med":["No OTC treatment — B vitamins/magnesium supportive only"],"note":"Persistent and worsening → psychologist/psychiatrist"},"sev":"caution","sources":["NHS","Mayo Clinic","UpToDate"],"areas":["psy"]},{"id":"depression","el":{"n":"Κατάθλιψη","s":["Επίμονη λύπη/αδιαφορία","Απώλεια ενδιαφερόντων","Αλλαγή ύπνου/βάρους","Αίσθημα αχρειότητας","Σκέψεις για τέλος"],"aid":"• Μιλήστε σε κάποιον — μην απομονώνεστε\n• Σταδιακή επιστροφή σε δραστηριότητες\n• Αναζητήστε βοήθεια — δεν είναι αδυναμία","med":["Κανένα χωρίς συνταγή"],"note":"🔴 Αν σκέψεις για αυτοβλάβη — καλέστε γραμμή βοήθειας ή 112 ΑΜΕΣΑ"},"en":{"n":"Depression","s":["Persistent sadness/numbness","Loss of interest","Sleep/weight change","Worthlessness","Thoughts of ending life"],"aid":"• Talk to someone — do not isolate\n• Gradual return to activities\n• Seek help — NOT a sign of weakness","med":["No OTC treatment"],"note":"🔴 Self-harm/suicidal thoughts — call helpline or 112 NOW"},"sev":"risk","sources":["WHO","NHS","Mayo Clinic"],"areas":["psy","senior"]},{"id":"feverchild","el":{"n":"Πυρετός σε Παιδί","s":["Θερμοκρασία >37.5°C (υπόγεια)","Αλλαγή διάθεσης/δραστηριότητας","Ερυθρότητα"],"aid":"• Ελαφριά ρούχα — ΜΗΝ σκέπασμα\n• Συχνά μικρές ποσότητες υγρών\n• Ελεγχος κάθε 4-6 ώρες","med":["Παρακεταμόλη σε δόση ανάλογη βάρους — ΑΠΟΦΥΓΗ ασπιρίνης"],"note":"Βρέφος <3 μηνών με πυρετό → ΝΟΣΟΚΟΜΕΙΟ ΑΜΕΣΑ"},"en":{"n":"Fever in Child","s":["Temp >37.5°C (underarm)","Mood/activity change","Flushed skin"],"aid":"• Light clothing — NO bundling\n• Small frequent sips of fluid\n• Check every 4-6h","med":["Paracetamol dose by weight — AVOID aspirin completely"],"note":"Infant <3 months with fever → HOSPITAL NOW"},"sev":"risk","sources":["NHS","WHO","Mayo Clinic"],"areas":["child"]},{"id":"chickenpox","el":{"n":"Ανεμοβλογία","s":["Εξάνθημα με κηλίδες → φυσαλίδες → κρούστες","Κυκλικά σε εξέλιξη","Πυρετός"],"aid":"• Ανακούφιση με ψύξη\n• Κοντά νύχια για αποφυγή γρατζουνιών/ουλών\n• Απομόνωση μέχρι στεγνώσουν όλες οι κρούστες","med":["Παρακεταμόλη — ΑΠΟΦΥΓΗ ασπιρίνης","Κρεμά καλαμίνης"],"note":"Εμβόλιο διαθέσιμο. Ενήλικες συχνά πιο σοβαρά"},"en":{"n":"Chickenpox","s":["Rash spots → blisters → crusts","Appears in crops over days","Fever"],"aid":"• Cool environment soothes\n• Short nails to prevent scratching/scars\n• Isolate until all crusts dry","med":["Paracetamol — AVOID aspirin","Calamine lotion"],"note":"Vaccine available. Adults often more severely affected"},"sev":"caution","sources":["NHS","CDC","Mayo Clinic"],"areas":["child","skin"]},{"id":"fever","el":{"n":"Πυρετός","s":["Θερμοκρασία 37.5-38°C: ήπια","38-39°C: μέτρια",">39°C: υψηλή","Ρίγη, κόπωση"],"aid":"• Ελαφριά ρούχα, αερισμός χώρου\n• Πολλά υγρά — 2-3 λίτρα\n• Ανάπαυση","med":["Παρακεταμόλη ή ιβουπροφαίνη για μείωση"],"note":"Πάνω από 3 μέρες ή >39°C → γιατρός"},"en":{"n":"Fever","s":["37.5-38°C: mild","38-39°C: moderate",">39°C: high","Chills, fatigue"],"aid":"• Light clothing, ventilate room\n• Plenty of fluids — 2-3L daily\n• Rest","med":["Paracetamol or ibuprofen to lower"],"note":"Over 3 days or >39°C → see doctor"},"sev":"caution","sources":["NHS","WHO","Mayo Clinic"],"areas":["gen"]},{"id":"emergency","el":{"n":"ΕΠΕΙΓΟΝ — Άμεση Βοήθεια","s":["Αναπνευστική δυσκολία/απόφραξη","Απώλεια αισθήσεων που δεν επανέρχεται","Αιμορραγία που δεν σταματά σε 10 λεπτά","Έντονος πόνος χωρίς εξήγηση","Αλλαγή συνείδησης/σύγχυση"],"aid":"• ΚΑΛΕΣΤΕ 112 ΑΜΕΣΑ\n• Θέση ανάπαυσης αν αναπνέει και συνείδηση έχει\n• Μην δίνετε τίποτα από το στόμα","med":["Κανένα — καθυστέρηση επικίνδυνη"],"note":"🔴 Μην διστάζετε — κάθε δευτερόλεπτο μετράει"},"en":{"n":"EMERGENCY — Immediate Help","s":["Breathing difficulty/blocked airway","Unconsciousness not recovering","Uncontrolled bleeding >10min","Unexplained severe pain","Confusion/altered consciousness"],"aid":"• CALL 112 NOW\n• Recovery position if breathing and conscious\n• Nothing by mouth","med":["None — delay dangerous"],"note":"🔴 Do not hesitate — every second counts"},"sev":"emer","sources":["WHO","NHS","Mayo Clinic"],"areas":["gen"]},{"id":"bppv","areas":["head","ent","senior"],"sev":"caution","el":{"n":"Ίλιγγος θέσης (καλοήθης)","s":["Ζάλη που γυρίζει το δωμάτιο","Ξεκινά όταν γυρίζετε στο κρεβάτι ή σκύβετε","Διαρκεί λίγα δευτερόλεπτα","Ναυτία"],"aid":"• Καθίστε αμέσως για να μην πέσετε\n• Σηκώνεστε αργά από το κρεβάτι\n• Ο γιατρός μπορεί να κάνει απλή θεραπευτική κίνηση κεφαλιού (Epley)","note":"Ωτορινολαρυγγολόγος ή Νευρολόγος. Αν μαζί υπάρχει αδυναμία, διπλωπία ή δυσκολία στην ομιλία: 112"},"en":{"n":"Positional vertigo (BPPV)","s":["Spinning dizziness","Starts when turning in bed or bending","Lasts seconds","Nausea"],"aid":"• Sit down at once to avoid falling\n• Get up slowly from bed\n• A doctor can perform a simple head manoeuvre (Epley)","note":"ENT or Neurologist. If weakness, double vision or speech trouble: call 112"}},{"id":"labyrinth","areas":["head","ent"],"sev":"caution","el":{"n":"Λαβυρινθίτιδα / Αιθουσαία νευρίτιδα","s":["Έντονος ίλιγγος για ώρες ή μέρες","Ναυτία και εμετός","Αστάθεια στο περπάτημα","Μερικές φορές βουητό ή μειωμένη ακοή"],"aid":"• Ξεκούραση σε ήσυχο χώρο\n• Νερό σε μικρές γουλιές\n• Αποφυγή οδήγησης","note":"Γιατρός εντός 1-2 ημερών. Αιφνίδια απώλεια ακοής: Ωτορινολαρυγγολόγος την ίδια μέρα"},"en":{"n":"Labyrinthitis / Vestibular neuritis","s":["Severe vertigo for hours or days","Nausea and vomiting","Unsteady walking","Sometimes ringing or reduced hearing"],"aid":"• Rest in a quiet place\n• Sip water\n• Do not drive","note":"See a doctor within 1-2 days. Sudden hearing loss: ENT the same day"}},{"id":"tia","areas":["head","senior","cardio"],"sev":"emer","el":{"n":"Παροδικό ισχαιμικό επεισόδιο (μικρό εγκεφαλικό)","s":["Ξαφνική αδυναμία χεριού ή ποδιού που περνά","Στραβό στόμα για λίγα λεπτά","Δυσκολία στην ομιλία που υποχωρεί","Ξαφνική απώλεια όρασης στο ένα μάτι"],"aid":"• ΚΑΛΕΣΤΕ 112 ακόμη κι αν πέρασε\n• Σημειώστε την ώρα που ξεκίνησε\n• Μη δίνετε φαγητό ή φάρμακα από το στόμα","note":"Είναι προειδοποίηση για μεγάλο εγκεφαλικό. Χρειάζεται εξέταση την ίδια ώρα"},"en":{"n":"Transient ischaemic attack (mini-stroke)","s":["Sudden arm or leg weakness that passes","Drooping mouth for minutes","Speech trouble that resolves","Sudden loss of vision in one eye"],"aid":"• CALL 112 even if it has passed\n• Note the time it started\n• Give nothing by mouth","note":"It is a warning sign of a major stroke. Needs assessment immediately"}},{"id":"meningitis","areas":["head","gen","child"],"sev":"emer","el":{"n":"Μηνιγγίτιδα","s":["Υψηλός πυρετός","Πολύ έντονος πονοκέφαλος","Δυσκαμψία αυχένα (δεν ακουμπά το πηγούνι στο στήθος)","Ενόχληση από το φως","Εξάνθημα που δεν ξεθωριάζει με πίεση ποτηριού","Υπνηλία ή σύγχυση"],"aid":"• ΚΑΛΕΣΤΕ 112 ΑΜΕΣΑ\n• Δοκιμή ποτηριού: αν τα σημάδια φαίνονται μέσα από το ποτήρι, είναι επείγον","note":"Θανατηφόρα αν καθυστερήσει. Υπάρχουν εμβόλια — ρωτήστε τον γιατρό"},"en":{"n":"Meningitis","s":["High fever","Very severe headache","Stiff neck (cannot touch chin to chest)","Dislike of light","Rash that does not fade under a glass","Drowsiness or confusion"],"aid":"• CALL 112 NOW\n• Glass test: if spots stay visible through a glass, it is an emergency","note":"Can be fatal if delayed. Vaccines exist — ask your doctor"}},{"id":"seizure","areas":["head"],"sev":"risk","el":{"n":"Επιληπτική κρίση","s":["Ξαφνικοί σπασμοί σώματος","Απώλεια αισθήσεων","Δάγκωμα γλώσσας","Σύγχυση μετά την κρίση","Κενά απουσίας (κοιτάζει στο κενό)"],"aid":"• Απομακρύνετε αντικείμενα γύρω του\n• Βάλτε κάτι μαλακό κάτω από το κεφάλι\n• ΜΗ βάζετε τίποτα στο στόμα\n• Μετά, γυρίστε τον στο πλάι\n• Μετρήστε τη διάρκεια","note":"112 αν διαρκεί πάνω από 5 λεπτά, αν είναι η πρώτη κρίση ή αν τραυματίστηκε. Μετά: Νευρολόγος"},"en":{"n":"Epileptic seizure","s":["Sudden jerking of the body","Loss of consciousness","Tongue biting","Confusion afterwards","Absence spells (staring blankly)"],"aid":"• Move objects away\n• Put something soft under the head\n• Put NOTHING in the mouth\n• Afterwards, turn on the side\n• Time the seizure","note":"Call 112 if over 5 minutes, first-ever seizure, or injured. Then: Neurologist"}},{"id":"parkinson","areas":["head","senior"],"sev":"risk","el":{"n":"Νόσος Πάρκινσον","s":["Τρέμουλο χεριού σε ηρεμία","Αργές κινήσεις","Δυσκαμψία μυών","Μικρά βήματα και αστάθεια","Μικρότερα γράμματα στο γράψιμο","Ανέκφραστο πρόσωπο"],"aid":"• Ασφαλές σπίτι χωρίς χαλάκια\n• Καθημερινό περπάτημα ή ήπια άσκηση\n• Σημειώστε πότε ξεκίνησαν τα συμπτώματα","note":"Νευρολόγος. Υπάρχουν θεραπείες που βοηθούν πολύ"},"en":{"n":"Parkinson’s disease","s":["Hand tremor at rest","Slow movements","Muscle stiffness","Small steps and unsteadiness","Smaller handwriting","Less facial expression"],"aid":"• Make the home safe, remove loose rugs\n• Daily walking or gentle exercise\n• Note when symptoms began","note":"Neurologist. Effective treatments exist"}},{"id":"dementia","areas":["head","senior","psy"],"sev":"risk","el":{"n":"Άνοια / Προβλήματα μνήμης","s":["Ξεχνά πρόσφατα γεγονότα","Ρωτά τα ίδια ξανά και ξανά","Χάνεται σε γνώριμα μέρη","Δυσκολία με λογαριασμούς ή συνταγές","Αλλαγές στη συμπεριφορά ή τη διάθεση"],"aid":"• Σταθερό καθημερινό πρόγραμμα\n• Σημειώσεις και ημερολόγιο στον τοίχο\n• Ελέγξτε ακοή, όραση και φάρμακα — μπορεί να μοιάζουν με άνοια","note":"Γιατρός ή Νευρολόγος. Μερικές αιτίες θεραπεύονται (θυρεοειδής, Β12, φάρμακα). Ξαφνική σύγχυση: δείτε «Οξεία σύγχυση»"},"en":{"n":"Dementia / memory problems","s":["Forgets recent events","Asks the same questions repeatedly","Gets lost in familiar places","Trouble with bills or recipes","Changes in behaviour or mood"],"aid":"• Keep a steady daily routine\n• Notes and a wall calendar\n• Check hearing, eyesight and medicines — they can mimic dementia","note":"GP or Neurologist. Some causes are treatable (thyroid, B12, medicines). Sudden confusion: see “Delirium”"}},{"id":"bells","areas":["head"],"sev":"risk","el":{"n":"Παράλυση προσωπικού νεύρου (Bell)","s":["Το μισό πρόσωπο πέφτει ξαφνικά","Δεν κλείνει καλά το ένα μάτι","Το φαγητό ή το νερό ξεφεύγει από το στόμα","Πόνος πίσω από το αυτί"],"aid":"• Προστατέψτε το μάτι (τεχνητά δάκρυα, κάλυμμα τη νύχτα)\n• Δείτε γιατρό το ίδιο 24ωρο — η θεραπεία βοηθά περισσότερο νωρίς","note":"Πρώτα αποκλείεται εγκεφαλικό: αν υπάρχει και αδυναμία χεριού/ποδιού ή δυσκολία ομιλίας, 112"},"en":{"n":"Bell’s palsy (facial nerve)","s":["One side of the face suddenly droops","Cannot close one eye fully","Food or water escapes the mouth","Pain behind the ear"],"aid":"• Protect the eye (artificial tears, cover at night)\n• See a doctor within 24 hours — early treatment works best","note":"Stroke must be ruled out first: if arm/leg weakness or speech trouble too, call 112"}},{"id":"trigeminal","areas":["head"],"sev":"caution","el":{"n":"Νευραλγία τριδύμου","s":["Πόνος σαν ηλεκτρικό σοκ στο πρόσωπο","Διαρκεί δευτερόλεπτα","Ξεκινά με άγγιγμα, μάσημα ή ξύρισμα","Μόνο στη μία πλευρά"],"aid":"• Σημειώστε τι τον προκαλεί\n• Αποφύγετε κρύο αέρα στο πρόσωπο","note":"Νευρολόγος — υπάρχουν ειδικά φάρμακα. Οι κοινοί παυσίπονοι συχνά δεν αρκούν"},"en":{"n":"Trigeminal neuralgia","s":["Electric-shock-like face pain","Lasts seconds","Triggered by touch, chewing or shaving","One side only"],"aid":"• Note what triggers it\n• Avoid cold wind on the face","note":"Neurologist — specific medicines exist. Ordinary painkillers often do not help"}},{"id":"neuropathy","areas":["head","endo","senior"],"sev":"caution","el":{"n":"Περιφερική νευροπάθεια","s":["Μούδιασμα στα πόδια ή χέρια","Κάψιμο ή τσιμπήματα","Δεν νιώθει καλά το έδαφος","Πόνος τη νύχτα","Πληγές στα πόδια που δεν τις καταλαβαίνει"],"aid":"• Ελέγχετε τα πόδια σας κάθε μέρα\n• Άνετα κλειστά παπούτσια\n• Ελέγξτε σάκχαρο και βιταμίνη Β12","note":"Γιατρός. Συχνότερη αιτία ο διαβήτης, μετά η έλλειψη Β12 και το αλκοόλ"},"en":{"n":"Peripheral neuropathy","s":["Numbness in feet or hands","Burning or pins and needles","Cannot feel the ground well","Pain at night","Foot sores not noticed"],"aid":"• Check your feet every day\n• Comfortable closed shoes\n• Check blood sugar and vitamin B12","note":"See a doctor. Most common cause is diabetes, then B12 deficiency and alcohol"}},{"id":"carpal","areas":["musc","head"],"sev":"norm","el":{"n":"Σύνδρομο καρπιαίου σωλήνα","s":["Μούδιασμα αντίχειρα, δείκτη, μέσου δαχτύλου","Χειρότερο τη νύχτα","Αδύναμο πιάσιμο","Πέφτουν πράγματα από το χέρι"],"aid":"• Νάρθηκας καρπού τη νύχτα\n• Διαλείμματα στη δουλειά με τα χέρια\n• Ήπιες ασκήσεις καρπού","note":"Ορθοπαιδικός ή Νευρολόγος αν επιμένει ή αδυνατίζει το χέρι"},"en":{"n":"Carpal tunnel syndrome","s":["Numb thumb, index and middle finger","Worse at night","Weak grip","Dropping things"],"aid":"• Wrist splint at night\n• Breaks from hand work\n• Gentle wrist exercises","note":"Orthopaedist or Neurologist if it persists or the hand weakens"}},{"id":"ms","areas":["head"],"sev":"risk","el":{"n":"Σκλήρυνση κατά πλάκας","s":["Θόλωση ή πόνος στο ένα μάτι","Μούδιασμα ή αδυναμία που έρχεται για μέρες","Αστάθεια","Έντονη κόπωση","Προβλήματα ούρησης"],"aid":"• Σημειώστε τα επεισόδια και πόσο κράτησαν\n• Αποφύγετε την υπερθέρμανση","note":"Νευρολόγος. Συνήθως ξεκινά σε νεαρούς ενήλικες. Οι σύγχρονες θεραπείες βοηθούν πολύ"},"en":{"n":"Multiple sclerosis","s":["Blurred or painful vision in one eye","Numbness or weakness lasting days","Unsteadiness","Severe fatigue","Bladder problems"],"aid":"• Note episodes and how long they lasted\n• Avoid overheating","note":"Neurologist. Usually starts in young adults. Modern treatments help a lot"}},{"id":"syncope","areas":["head","cardio","gen","senior"],"sev":"caution","el":{"n":"Λιποθυμία","s":["Σκοτείνιασμα ματιών","Εφίδρωση και ωχρότητα","Σύντομη απώλεια αισθήσεων","Ανάκτηση μέσα σε λίγα λεπτά"],"aid":"• Ξαπλώστε τον με πόδια ψηλά\n• Χαλαρώστε ρούχα\n• Μη σηκωθεί απότομα\n• Νερό όταν συνέλθει πλήρως","note":"112 αν δεν συνέρχεται, αν λιποθύμησε στην άσκηση, με πόνο στο στήθος ή αίσθημα παλμών. Πάντα έλεγχος από γιατρό (ΗΚΓ)"},"en":{"n":"Fainting (syncope)","s":["Vision going dark","Sweating and pallor","Brief loss of consciousness","Recovers within minutes"],"aid":"• Lie them down with legs raised\n• Loosen clothing\n• Do not let them stand up quickly\n• Water once fully awake","note":"Call 112 if not recovering, if fainting during exercise, with chest pain or palpitations. Always see a doctor (ECG)"}},{"id":"medoveruse","areas":["head"],"sev":"caution","el":{"n":"Πονοκέφαλος από υπερβολικά παυσίπονα","s":["Πονοκέφαλος σχεδόν κάθε μέρα","Παίρνετε παυσίπονα πάνω από 10-15 μέρες τον μήνα","Χειρότερα το πρωί","Βελτίωση μόνο για λίγο"],"aid":"• Κρατήστε ημερολόγιο πονοκεφάλων και χαπιών\n• Μη σταματήσετε απότομα ισχυρά φάρμακα χωρίς γιατρό","note":"Γιατρός ή Νευρολόγος — η σωστή διακοπή φέρνει μεγάλη βελτίωση"},"en":{"n":"Medication-overuse headache","s":["Headache almost every day","Painkillers on more than 10-15 days a month","Worse in the morning","Relief lasts only briefly"],"aid":"• Keep a headache and pill diary\n• Do not stop strong medicines abruptly without a doctor","note":"GP or Neurologist — a supervised stop brings great improvement"}},{"id":"gca","areas":["head","senior"],"sev":"risk","el":{"n":"Κροταφική αρτηρίτιδα","s":["Νέος πονοκέφαλος μετά τα 50","Πόνος στους κροτάφους στο άγγιγμα","Πόνος στο σαγόνι όταν μασάτε","Θόλωση ή διπλή όραση","Κόπωση, πυρετός"],"aid":"• Δείτε γιατρό ΤΗΝ ΙΔΙΑ ΜΕΡΑ\n• Αλλαγή όρασης: Τμήμα επειγόντων","note":"Απειλεί την όραση. Χρειάζεται εξέταση αίματος και γρήγορη θεραπεία"},"en":{"n":"Giant cell (temporal) arteritis","s":["New headache after age 50"
