 el:{n:'Θυμός και εκρήξεις οργής',s:['Θυμώνετε γρήγορα και έντονα','Φωνάζετε ή λέτε λόγια που μετά μετανιώνετε','Η καρδιά χτυπά δυνατά, ζεσταίνεται το πρόσωπο','Πονοκέφαλος ή σφιγμένοι ώμοι μετά τον καβγά','Ένταση στο σπίτι ή στη δουλειά'],
  w:'Ο θυμός δεν σας κάνει κακό άνθρωπο. Είναι σήμα ότι κάτι σας πόνεσε ή σας φάνηκε άδικο. Το ζητούμενο δεν είναι να μη θυμώνετε ποτέ, αλλά να μη σας κυβερνά ο θυμός.',
  aid:'• Όταν νιώσετε τη φωτιά να ανεβαίνει, σταματήστε και μετρήστε αργά ως το 10\n• Πάρτε 5 αργές ανάσες: εισπνοή 4 δευτερόλεπτα, εκπνοή 6\n• Βγείτε λίγο από το δωμάτιο ή κάντε περίπατο 10 λεπτών\n• Μιλήστε όταν ηρεμήσετε, με «εγώ νιώθω…» αντί για «εσύ πάντα…»\n• Λιγότερος καφές και αλκοόλ — ανάβουν τον θυμό',
  note:'Αν ο θυμός φέρνει βία, σπάσιμο πραγμάτων ή φόβο στους δικούς σας → ψυχολόγος ή ψυχίατρος. Αν έχετε υψηλή πίεση, πείτε στον γιατρό σας πόσο συχνά θυμώνετε.',
  ph:{who:'Αριστοτέλης',src:'Ηθικά Νικομάχεια, Β΄ 9',q:'Το να θυμώσει κανείς είναι εύκολο, το μπορεί ο καθένας. Το να θυμώσει όμως με τον σωστό άνθρωπο, όσο πρέπει, την κατάλληλη στιγμή, για τον σωστό λόγο και με τον σωστό τρόπο — αυτό δεν είναι εύκολο.',t:'Σήμερα, πριν απαντήσετε θυμωμένα, ρωτήστε τον εαυτό σας: «Είναι η σωστή στιγμή; Είναι το σωστό μέτρο;» Αν όχι, αφήστε την απάντηση για αύριο.'}},
 en:{n:'Anger and outbursts',s:['You get angry quickly and strongly','You shout or say things you regret later','Pounding heart, hot face','Headache or tight shoulders after a row','Tension at home or at work'],
  w:'Anger does not make you a bad person. It is a signal that something hurt you or seemed unfair. The aim is not never to be angry, but not to be ruled by anger.',
  aid:'• When you feel the fire rising, stop and count slowly to 10\n• Take 5 slow breaths: in for 4 seconds, out for 6\n• Leave the room for a while or take a 10-minute walk\n• Talk once you are calm, with “I feel…” instead of “you always…”\n• Less coffee and alcohol — they fuel anger',
  note:'If anger leads to violence, breaking things or fear in your family → psychologist or psychiatrist. If you have high blood pressure, tell your doctor how often you get angry.',
  ph:{who:'Aristotle',src:'Nicomachean Ethics, II 9',q:'Anyone can become angry — that is easy. But to be angry with the right person, to the right degree, at the right time, for the right reason and in the right way — that is not easy.',t:'Today, before answering in anger, ask yourself: “Is this the right moment? Is this the right measure?” If not, leave the answer for tomorrow.'}}},

{id:'healthanx',areas:['psy'],sev:'norm',f:2,req:['health_worry'],
 k:[['health_worry'],['anxiety','panic'],['tests_normal'],['palpitations','insomnia']],ctx:[0,0,0,0],
 el:{n:'Άγχος για την υγεία (υποχονδρία)',s:['Φόβος ότι έχετε σοβαρή αρρώστια','Ψάχνετε συχνά συμπτώματα στο ίντερνετ','Ελέγχετε συνεχώς το σώμα σας (σφυγμό, πίεση, ελιές)','Οι καλές εξετάσεις σας ηρεμούν μόνο για λίγο','Άγχος, ταχυπαλμία, αϋπνία'],
  w:'Ο φόβος για την υγεία είναι πολύ ανθρώπινος — συνήθως τον έχουν άνθρωποι που αγαπούν τη ζωή. Ο φόβος όμως μεγαλώνει όσο τον «ταΐζουμε» με ψάξιμο και ελέγχους.',
  aid:'• Ένας σταθερός οικογενειακός γιατρός με τακτικά ραντεβού — όχι πολλοί γιατροί για το ίδιο θέμα\n• Ορίστε «ώρα ανησυχίας»: 15 λεπτά τη μέρα, όχι όλη μέρα\n• Βάλτε όριο στο ψάξιμο συμπτωμάτων στο ίντερνετ\n• Μετράτε πίεση ή σφυγμό μόνο όσες φορές σας είπε ο γιατρός\n• Περπάτημα και ασχολίες που σας απορροφούν',
  note:'Αν ο φόβος σάς κόβει τη ζωή (δουλειά, ύπνο, έξοδο) → ψυχολόγος ή ψυχίατρος· η γνωσιακή-συμπεριφορική θεραπεία βοηθά πολύ. Κάθε νέο, επίμονο σύμπτωμα → πάντα γιατρός.',
  ph:{who:'Επίκτητος',src:'Διατριβές, Β΄ 13',q:'Όταν βλέπω άνθρωπο να αγωνιά, λέω: τι άραγε θέλει αυτός; Αν δεν ήθελε κάτι που δεν εξαρτάται από τον ίδιο, πώς θα αγωνιούσε;',t:'Χωρίστε ένα χαρτί σε δύο στήλες: «Εξαρτάται από μένα» (περίπατος, φαγητό, ραντεβού στον γιατρό) και «Δεν εξαρτάται από μένα». Σήμερα δουλέψτε μόνο την πρώτη στήλη.'}},
 en:{n:'Health anxiety',s:['Fear that you have a serious illness','You often search symptoms online','You keep checking your body (pulse, blood pressure, moles)','Good test results calm you only for a short time','Worry, racing heart, poor sleep'],
  w:'Fear about health is very human — it is often felt by people who love life. But fear grows the more we “feed” it with searching and checking.',
  aid:'• One regular family doctor with planned visits — not many doctors for the same thing\n• Set a “worry time”: 15 minutes a day, not all day\n• Limit searching symptoms online\n• Measure blood pressure or pulse only as often as your doctor said\n• Walking and absorbing activities',
  note:'If the fear stops you living (work, sleep, going out) → psychologist or psychiatrist; cognitive behavioural therapy helps a lot. Any new, persistent symptom → always see a doctor.',
  ph:{who:'Epictetus',src:'Discourses, II 13',q:'When I see a man anxious, I ask: what does he want? If he did not want something outside his control, how could he still be anxious?',t:'Divide a page in two columns: “Up to me” (a walk, food, a doctor’s appointment) and “Not up to me”. Today, work only on the first column.'}}},

{id:'deathfear',areas:['psy','senior'],sev:'norm',f:2,req:['death_fear'],
 k:[['death_fear'],['anxiety','panic'],['insomnia','overthinking']],ctx:[0,0,0],
 el:{n:'Φόβος για τα γηρατειά και τον θάνατο',s:['Σκέψεις και φόβος για το τέλος της ζωής','Ανησυχία για τα γηρατειά, την αρρώστια, τη μοναξιά','Αϋπνία ή ξύπνημα με αγωνία τη νύχτα','Θλίψη όταν φεύγουν φίλοι ή συνομήλικοι'],
  w:'Κάθε σκεπτόμενος άνθρωπος έχει σταθεί μπροστά σε αυτό το ερώτημα. Δεν είστε αδύναμοι — είστε άνθρωπος που αγαπά τη ζωή. Και η ζωή που έχετε τώρα είναι πολύτιμη.',
  aid:'• Κάθε βράδυ γράψτε τρία καλά της ημέρας\n• Μιλήστε για τον φόβο σας με φίλο, ιερέα ή ψυχολόγο\n• Τακτοποιήστε όσα σας βαραίνουν (χαρτιά, επιθυμίες) — φέρνει ηρεμία\n• Μοιραστείτε ιστορίες και γνώσεις με νεότερους\n• Κίνηση, φύση, μουσική, προσευχή ή διαλογισμός — ό,τι σας γαληνεύει',
  note:'Αν ο φόβος φέρνει κρίσεις πανικού ή σας κρατά κλεισμένους στο σπίτι → γιατρός ή ψυχολόγος.',
  ph:{who:'Επίκουρος',src:'Επιστολή προς Μενοικέα, 122',q:'Να φιλοσοφούν και ο νέος και ο ηλικιωμένος: ο ηλικιωμένος, για να μένει νέος στα αγαθά με την ευγνωμοσύνη για όσα έζησε· ο νέος, για να μη φοβάται το μέλλον.',t:'Θυμηθείτε σήμερα μια όμορφη στιγμή της ζωής σας και πείτε την σε κάποιον. Η ευγνωμοσύνη για όσα ζήσαμε είναι, κατά τον Επίκουρο, φάρμακο για τον φόβο.'}},
 en:{n:'Fear of ageing and death',s:['Thoughts and fear about the end of life','Worry about old age, illness, loneliness','Poor sleep or waking up anxious at night','Sadness when friends or peers pass away'],
  w:'Every thinking person has stood before this question. You are not weak — you are a person who loves life. And the life you have now is precious.',
  aid:'• Every evening write three good things from the day\n• Talk about your fear with a friend, a priest or a psychologist\n• Put in order what weighs on you (papers, wishes) — it brings peace\n• Share stories and knowledge with younger people\n• Movement, nature, music, prayer or meditation — whatever calms you',
  note:'If the fear brings panic attacks or keeps you shut in at home → doctor or psychologist.',
  ph:{who:'Epicurus',src:'Letter to Menoeceus, 122',q:'Let both young and old pursue wisdom: the old, so that they stay young in good things through gratitude for what has been; the young, so that they do not fear what is to come.',t:'Today, recall a beautiful moment of your life and tell it to someone. Gratitude for what we have lived is, for Epicurus, a medicine for fear.'}}},

{id:'retirement',areas:['psy','senior'],sev:'norm',f:2,req:['retired'],
 k:[['retired'],['sadness','apathy'],['meaningless','loneliness'],['family_conflict']],ctx:[0,0,0,1],
 el:{n:'Δυσκολία μετά τη σύνταξη',s:['Νιώθετε άχρηστοι ή χωρίς ρόλο','Οι μέρες μοιάζουν άδειες και ίδιες','Κούραση, βαρεμάρα, κακή διάθεση','Περισσότερες εντάσεις στο σπίτι','Λιγότερη επαφή με ανθρώπους'],
  w:'Η σύνταξη δεν είναι το τέλος της χρησιμότητας — είναι η πρώτη φορά που ο χρόνος σας ανήκει. Η αξία σας δεν ήταν ποτέ ο μισθός ή η θέση, αλλά αυτό που είστε.',
  aid:'• Φτιάξτε πρόγραμμα: ώρα ξυπνήματος, περίπατος, μια ασχολία, μια συνάντηση\n• Εθελοντισμός, σύλλογοι, ενορία, χορωδία, κήπος\n• Μάθετε κάτι νέο: γλώσσα, μουσικό όργανο, υπολογιστή\n• Μοιραστείτε την πείρα σας με νέους\n• Δώστε χώρο και στον σύντροφό σας — ο καθένας και κάτι δικό του',
  note:'Αν η κακή διάθεση κρατά πάνω από 2 εβδομάδες ή χάσατε κάθε ενδιαφέρον → οικογενειακός γιατρός (μπορεί να είναι κατάθλιψη, που θεραπεύεται).',
  ph:{who:'Σόλων',src:'Απόσπασμα 18',q:'Γερνώ και πάντα μαθαίνω πολλά.',t:'Διαλέξτε σήμερα κάτι που θέλατε πάντα να μάθετε και κάντε το πρώτο μικρό βήμα — ένα βίντεο, ένα βιβλίο, ένα τηλεφώνημα.'}},
 en:{n:'Difficulty after retirement',s:['You feel useless or without a role','Days feel empty and all the same','Tiredness, boredom, low mood','More tension at home','Less contact with people'],
  w:'Retirement is not the end of being useful — it is the first time your time belongs to you. Your worth was never your salary or your title, but who you are.',
  aid:'• Make a routine: wake-up time, a walk, an activity, a meeting\n• Volunteering, clubs, parish, choir, garden\n• Learn something new: a language, an instrument, the computer\n• Share your experience with young people\n• Give your partner space too — each of you something of your own',
  note:'If low mood lasts over 2 weeks or you have lost all interest → family doctor (it may be depression, which can be treated).',
  ph:{who:'Solon',src:'Fragment 18',q:'I grow old always learning many things.',t:'Choose something you always wanted to learn and take the first small step today — a video, a book, a phone call.'}}},

{id:'emptynest',areas:['psy'],sev:'norm',f:2,req:['empty_nest'],
 k:[['empty_nest'],['sadness','loneliness'],['meaningless','family_conflict']],ctx:[0,0,0],
 el:{n:'«Άδεια φωλιά» (τα παιδιά έφυγαν από το σπίτι)',s:['Το σπίτι μοιάζει άδειο και σιωπηλό','Λύπη, νοσταλγία, δάκρυα','Αίσθηση ότι τελείωσε ο ρόλος σας','Ανησυχία για τα παιδιά','Νέα «απόσταση» ή εντάσεις στο ζευγάρι'],
  w:'Η λύπη σας δείχνει πόση αγάπη δώσατε. Τα παιδιά που φεύγουν για να ζήσουν τη ζωή τους είναι η επιτυχία σας, όχι η απώλειά σας.',
  aid:'• Ορίστε σταθερή μέρα για τηλεφώνημα ή βιντεοκλήση — χωρίς πίεση\n• Ξαναβρείτε τον σύντροφό σας: βόλτες, ταξίδια, κοινά ενδιαφέροντα\n• Αφιερώστε χρόνο σε ό,τι είχατε αφήσει για «αργότερα»\n• Νέες φιλίες και ομάδες\n• Κάντε ένα δωμάτιο χώρο για χόμπι',
  note:'Αν η λύπη δεν υποχωρεί σε μερικές εβδομάδες ή χάνετε τον ύπνο και την όρεξη → γιατρός ή ψυχολόγος.',
  ph:{who:'Πλούταρχος',src:'Περί ευθυμίας',q:'Οι πολλοί προσπερνούν όσα έχουν και κοιτάζουν μόνο όσα τους λείπουν. Ο φρόνιμος χαίρεται με ευγνωμοσύνη τα αγαθά που ήδη υπάρχουν στη ζωή του.',t:'Γράψτε σήμερα πέντε καλά που έχετε τώρα — ανάμεσά τους και ότι τα παιδιά σας στέκονται στα πόδια τους.'}},
 en:{n:'“Empty nest” (the children have left home)',s:['The house feels empty and silent','Sadness, nostalgia, tears','A sense that your role has ended','Worry about the children','New “distance” or tension in the couple'],
  w:'Your sadness shows how much love you gave. Children leaving to live their own lives are your success, not your loss.',
  aid:'• Set a regular day for a call or video call — without pressure\n• Rediscover your partner: walks, trips, shared interests\n• Give time to what you had left for “later”\n• New friendships and groups\n• Turn a room into a space for a hobby',
  note:'If the sadness does not ease in a few weeks, or you lose sleep and appetite → doctor or psychologist.',
  ph:{who:'Plutarch',src:'On Tranquillity of Mind',q:'Most people overlook what they have and look only at what they lack. The wise enjoy with gratitude the good things already present in their life.',t:'Write down today five good things you have now — among them, that your children stand on their own feet.'}}},

{id:'selfesteem',areas:['psy'],sev:'norm',f:3,req:['low_self'],
 k:[['low_self'],['sadness','shame_blush'],['anxiety','loneliness']],ctx:[0,0,0],
 el:{n:'Χαμηλή αυτοεκτίμηση',s:['Νιώθετε ότι δεν αξίζετε ή ότι «δεν είστε αρκετοί»','Συγκρίνεστε συνεχώς με τους άλλους','Δύσκολα λέτε «όχι»','Ντροπή, φόβος κριτικής','Αυστηρή εσωτερική φωνή'],
  w:'Αν ένας φίλος σας μιλούσε όπως μιλάτε εσείς στον εαυτό σας, θα τον σταματούσατε. Αξίζετε την ίδια καλοσύνη που δίνετε στους άλλους.',
  aid:'• Κάθε βράδυ γράψτε ένα πράγμα που κάνατε καλά\n• Όταν ακούτε την αυστηρή φωνή, ρωτήστε: «Θα το έλεγα αυτό σε φίλο;»\n• Πείτε ένα μικρό «όχι» αυτή την εβδομάδα\n• Λιγότερα κοινωνικά δίκτυα — δείχνουν μόνο τη βιτρίνα των άλλων\n• Κάντε κάτι που ξέρετε καλά και βοηθά άλλους',
  note:'Αν η χαμηλή αυτοεκτίμηση φέρνει θλίψη, απομόνωση ή σκέψεις αυτοτιμωρίας → ψυχολόγος ή ψυχίατρος.',
  ph:{who:'Επίκτητος',src:'Εγχειρίδιο, 44',q:'Αυτά τα λόγια δεν στέκουν: «Είμαι πλουσιότερος από σένα, άρα είμαι καλύτερος» ή «Μιλώ καλύτερα από σένα, άρα είμαι καλύτερος». Εσύ δεν είσαι ούτε τα αποκτήματά σου ούτε τα λόγια σου.',t:'Σήμερα, κάθε φορά που συγκρίνεστε, πείτε: «Ο άλλος έχει άλλα πράγματα — όχι μεγαλύτερη αξία ως άνθρωπος».'}},
 en:{n:'Low self-esteem',s:['You feel you are worthless or “not enough”','You constantly compare yourself with others','You find it hard to say “no”','Shame, fear of criticism','A harsh inner voice'],
  w:'If a friend spoke to you the way you speak to yourself, you would stop them. You deserve the same kindness you give to others.',
  aid:'• Every evening write one thing you did well\n• When you hear the harsh voice, ask: “Would I say this to a friend?”\n• Say one small “no” this week\n• Less social media — it only shows other people’s shop window\n• Do something you are good at that helps others',
  note:'If low self-esteem brings sadness, isolation or thoughts of punishing yourself → psychologist or psychiatrist.',
  ph:{who:'Epictetus',src:'Enchiridion, 44',q:'These reasonings do not hold: “I am richer than you, so I am better than you” or “I speak better than you, so I am better than you.” You are neither your possessions nor your speech.',t:'Today, each time you compare yourself, say: “They have different things — not greater worth as a person.”'}}},

{id:'perfection',areas:['psy'],sev:'norm',f:2,req:['perfectionist'],
 k:[['perfectionist'],['anxiety','overthinking'],['fatigue','insomnia','apathy']],ctx:[0,0,0],
 el:{n:'Τελειομανία',s:['Όλα πρέπει να γίνουν τέλεια','Ξανακάνετε και ξαναελέγχετε τα πράγματα','Αναβάλλετε από φόβο μήπως δεν βγει τέλειο','Κούραση, ένταση, αϋπνία','Δύσκολα χαίρεστε ό,τι πετύχατε'],
  w:'Η φροντίδα σας για το καλό είναι αρετή. Όταν όμως γίνεται απαίτηση για το τέλειο, σας κλέβει τη χαρά. Το «αρκετά καλό» είναι συχνά το σοφό.',
  aid:'• Πριν ξεκινήσετε, ορίστε τι είναι «αρκετά καλό»\n• Βάλτε χρονικό όριο σε κάθε δουλειά\n• Αφήστε επίτηδες ένα μικρό λάθος χωρίς διόρθωση — δείτε ότι ο κόσμος δεν χάλασε\n• Χαρείτε τα βήματα, όχι μόνο το τέλος\n• Ζητήστε βοήθεια και μοιράστε δουλειές',
  note:'Αν η τελειομανία φέρνει ελέγχους που δεν σταματούν ή μεγάλη αγωνία → ψυχολόγος (μπορεί να σχετίζεται με ιδεοψυχαναγκαστική διαταραχή, που θεραπεύεται).',
  ph:{who:'Κλεόβουλος ο Λίνδιος (ένας από τους Επτά Σοφούς)',src:'Διογένης Λαέρτιος, Α΄ 93',q:'Μέτρον άριστον — το μέτρο είναι το καλύτερο.',t:'Σε μια δουλειά σήμερα σταματήστε όταν φτάσει «στο 80%» — και παρατηρήστε ότι ήταν αρκετό.'}},
 en:{n:'Perfectionism',s:['Everything must be perfect','You redo and re-check things','You put things off for fear they will not be perfect','Tiredness, tension, poor sleep','You hardly enjoy what you achieve'],
  w:'Your care for doing things well is a virtue. But when it becomes a demand for perfection, it steals your joy. “Good enough” is often the wise choice.',
  aid:'• Before you start, decide what “good enough” means\n• Put a time limit on each task\n• Leave one small mistake uncorrected on purpose — see that the world did not fall apart\n• Enjoy the steps, not only the end\n• Ask for help and share tasks',
  note:'If perfectionism brings endless checking or great distress → psychologist (it may relate to obsessive-compulsive disorder, which is treatable).',
  ph:{who:'Cleobulus of Lindos (one of the Seven Sages)',src:'Diogenes Laertius, I 93',q:'Measure is best.',t:'In one task today, stop when it is “80% done” — and notice that it was enough.'}}},

{id:'guilt',areas:['psy'],sev:'norm',f:2,req:['guilt_feel'],
 k:[['guilt_feel'],['sadness'],['overthinking','insomnia']],ctx:[0,0,0],
 el:{n:'Ενοχές που βαραίνουν',s:['Σκέφτεστε ξανά και ξανά ένα λάθος σας','Νιώθετε ότι «φταίτε» για πολλά','Δύσκολα συγχωρείτε τον εαυτό σας','Αϋπνία, βάρος στο στήθος','Λύπη'],
  w:'Η ενοχή δείχνει ότι έχετε συνείδηση και καρδιά. Δεν είναι όμως ισόβια ποινή. Το λάθος είναι μάθημα — και μετά το μάθημα έρχεται η συγχώρεση.',
  aid:'• Γράψτε τι ακριβώς έγινε και τι μερίδιο είχατε πραγματικά (όχι όλο)\n• Αν μπορείτε, επανορθώστε: μια συγγνώμη, μια πράξη καλοσύνης\n• Πείτε στον εαυτό σας: «Τότε ήξερα λιγότερα από όσα ξέρω τώρα»\n• Μιλήστε με άνθρωπο εμπιστοσύνης ή με τον πνευματικό σας\n• Κάντε κάτι καλό για κάποιον άλλον',
  note:'Αν οι ενοχές είναι συνεχείς, χωρίς πραγματικό λόγο, ή φέρνουν σκέψεις αυτοτιμωρίας → ψυχίατρος ή ψυχολόγος σήμερα.',
  ph:{who:'Πυθαγόρειοι',src:'Χρυσά Έπη, 40–44',q:'Μην αφήσεις τον ύπνο να κλείσει τα μάτια σου πριν εξετάσεις τις πράξεις της ημέρας: Πού έσφαλα; Τι έκανα; Τι παρέλειψα; Για τα κακά, επίπληξε τον εαυτό σου· για τα καλά, χάρηκε.',t:'Απόψε κάντε την εξέταση μία φορά — δίκαια: ένα λάθος για να το διορθώσετε, ένα καλό για να το χαρείτε. Και μετά κλείστε το βιβλίο της ημέρας.'}},
 en:{n:'Burdening guilt',s:['You go over a mistake again and again','You feel you are “to blame” for many things','You find it hard to forgive yourself','Poor sleep, a weight on your chest','Sadness'],
  w:'Guilt shows that you have a conscience and a heart. But it is not a life sentence. A mistake is a lesson — and after the lesson comes forgiveness.',
  aid:'• Write what exactly happened and what share was really yours (not all of it)\n• If you can, make amends: an apology, an act of kindness\n• Tell yourself: “Back then I knew less than I know now”\n• Talk with someone you trust or your spiritual guide\n• Do something good for someone else',
  note:'If guilt is constant, without real reason, or brings thoughts of punishing yourself → psychiatrist or psychologist today.',
  ph:{who:'The Pythagoreans',src:'Golden Verses, 40–44',q:'Do not let sleep close your eyes before you have reviewed the day’s deeds: Where did I go wrong? What did I do? What did I leave undone? For the bad, rebuke yourself; for the good, rejoice.',t:'Tonight, do the review once — fairly: one mistake to correct, one good thing to enjoy. Then close the book of the day.'}}},

{id:'envy',areas:['psy'],sev:'norm',f:2,req:['envy'],
 k:[['envy'],['irritable','sadness','anger'],['low_self','phone_addict']],ctx:[0,0,0],
 el:{n:'Ζήλια και φθόνος',s:['Πικραίνεστε με την επιτυχία ή την ευτυχία άλλων','Συγκρίνεστε συνεχώς','Θυμός ή λύπη μετά τα κοινωνικά δίκτυα','Ζήλια στη σχέση, δυσπιστία','Χαμένος ύπνος από σκέψεις'],
  w:'Η ζήλια είναι συνηθισμένο ανθρώπινο συναίσθημα — δεν σας κάνει κακό άνθρωπο. Συχνά δείχνει κάτι που επιθυμείτε για τον εαυτό σας. Ας την κάνουμε πυξίδα, όχι δηλητήριο.',
  aid:'• Ρωτήστε: «Τι μου δείχνει η ζήλια για το τι θέλω;» και κάντε ένα βήμα προς αυτό\n• Λιγότερα κοινωνικά δίκτυα\n• Ευγνωμοσύνη: τρία καλά της μέρας\n• Στη σχέση: μιλήστε ήρεμα για τον φόβο σας, χωρίς έλεγχο του κινητού του άλλου\n• Πείτε ένα ειλικρινές «μπράβο» σε κάποιον',
  note:'Αν η ζήλια στη σχέση φέρνει ελέγχους, απειλές ή φόβο → ζητήστε βοήθεια από ψυχολόγο.',
  ph:{who:'Δημόκριτος',src:'Απόσπασμα Β 191',q:'Μην έχεις τον νου σου διαρκώς σε όσους ζηλεύονται και θαυμάζονται· κοίτα και τη ζωή όσων δυσκολεύονται. Τότε όσα έχεις θα σου φανούν μεγάλα, και η ψυχή σου θα πάψει να υποφέρει από τον φθόνο.',t:'Ευχαριστήστε σήμερα για τρία πράγματα στη ζωή σας που άλλοι θα ήθελαν να έχουν.'}},
 en:{n:'Jealousy and envy',s:['Others’ success or happiness makes you bitter','You constantly compare yourself','Anger or sadness after social media','Jealousy in the relationship, mistrust','Lost sleep from thoughts'],
  w:'Envy is a common human feeling — it does not make you a bad person. It often points to something you want for yourself. Let us make it a compass, not a poison.',
  aid:'• Ask: “What does envy show me about what I want?” and take a step towards it\n• Less social media\n• Gratitude: three good things each day\n• In the relationship: speak calmly about your fear, without checking the other’s phone\n• Say a sincere “well done” to someone',
  note:'If jealousy in the relationship brings checking, threats or fear → seek help from a psychologist.',
  ph:{who:'Democritus',src:'Fragment B 191',q:'Do not keep your mind on those who are envied and admired; look also at the lives of those who struggle. Then what you have will seem great, and your soul will stop suffering from envy.',t:'Today, give thanks for three things in your life that others would wish to have.'}}},

{id:'resentment',areas:['psy'],sev:'norm',f:2,req:['resentment'],
 k:[['resentment'],['anger','irritable'],['overthinking','insomnia'],['family_conflict']],ctx:[0,0,0,1],
 el:{n:'Πικρία και δυσκολία συγχώρεσης',s:['Ξαναζείτε μια αδικία που σας έκαναν','Θυμός όταν σκέφτεστε τον άνθρωπο','Σφίξιμο στο στομάχι ή στο στήθος','Αϋπνία από σκέψεις','Απομάκρυνση από δικούς σας ανθρώπους'],
  w:'Ο πόνος από την αδικία είναι αληθινός. Η πικρία όμως είναι σαν πέτρα που κουβαλάτε και βαραίνει μόνο εσάς. Συγχώρεση δεν σημαίνει ότι εκείνο ήταν σωστό — σημαίνει ότι εσείς απελευθερώνεστε.',
  aid:'• Γράψτε ένα γράμμα που δεν θα στείλετε — πείτε τα όλα\n• Χωρίστε: τι έγινε, και τι λέτε εσείς στον εαυτό σας ξανά και ξανά\n• Βάλτε όρια: συγχώρεση δεν σημαίνει ότι επιτρέπετε να ξανασυμβεί\n• Όταν έρθει η σκέψη, στρέψτε τον νου σε μια ασχολία\n• Αν θέλετε, μιλήστε με πνευματικό ή ψυχολόγο',
  note:'Αν υπήρξε ή συνεχίζεται κακοποίηση → μιλήστε με ειδικό. Κύπρος: γραμμή 1440 για βία στην οικογένεια (24 ώρες).',
  ph:{who:'Επίκτητος',src:'Εγχειρίδιο, 43',q:'Κάθε πράγμα έχει δύο λαβές: από τη μία σηκώνεται, από την άλλη όχι. Αν ο αδελφός σου σε αδικεί, μην τον πιάνεις από τη λαβή «με αδικεί» — αυτή δεν σηκώνεται. Πιάσε τον από την άλλη: «είναι αδελφός μου, μεγαλώσαμε μαζί». Από εκεί θα σηκωθεί.',t:'Βρείτε σήμερα τη «δεύτερη λαβή» για έναν άνθρωπο που σας πίκρανε — κάτι αληθινό που μπορείτε να κρατήσετε χωρίς να πονάτε.'}},
 en:{n:'Bitterness and difficulty forgiving',s:['You relive an injustice done to you','Anger when you think of the person','Tightness in the stomach or chest','Sleepless from thoughts','Drifting away from your own people'],
  w:'The pain of injustice is real. But bitterness is like a stone you carry that weighs only on you. Forgiveness does not mean it was right — it means you set yourself free.',
  aid:'• Write a letter you will not send — say everything\n• Separate: what happened, and what you tell yourself again and again\n• Set boundaries: forgiving does not mean allowing it to happen again\n• When the thought comes, turn your mind to an activity\n• If you wish, talk with a spiritual guide or psychologist',
  note:'If there was or still is abuse → talk to a specialist. Cyprus: 1440 helpline for domestic violence (24 hours).',
  ph:{who:'Epictetus',src:'Enchiridion, 43',q:'Everything has two handles: by one it can be carried, by the other it cannot. If your brother wrongs you, do not take it by the handle “he wrongs me” — that one cannot be carried. Take it by the other: “he is my brother, we grew up together”. By that it can be carried.',t:'Find today the “second handle” for someone who hurt you — something true you can hold without pain.'}}},

{id:'breakup',areas:['psy'],sev:'norm',f:2,req:['breakup'],
 k:[['breakup'],['sadness','loneliness'],['insomnia','appetite_loss','overthinking']],ctx:[0,0,0],
 el:{n:'Χωρισμός ή διαζύγιο',s:['Θλίψη, δάκρυα, κενό','Σκέψεις που γυρίζουν στο παρελθόν','Αϋπνία, χωρίς όρεξη','Θυμός ή ενοχές','Φόβος για το μέλλον και τη μοναξιά'],
  w:'Ο χωρισμός πονά όσο ένα πένθος — γιατί είναι πένθος. Δώστε χρόνο στον εαυτό σας. Η καρδιά θεραπεύεται πιο αργά απ’ όσο θα θέλαμε, αλλά θεραπεύεται.',
  aid:'• Κρατήστε πρόγραμμα: ύπνος, φαγητό, περίπατος — ακόμη κι αν δεν έχετε όρεξη\n• Περιορίστε τον έλεγχο του πρώην στα κοινωνικά δίκτυα\n• Περιβάλλετε τον εαυτό σας με φίλους και οικογένεια\n• Αν υπάρχουν παιδιά: προστατέψτε τα από τις διαμάχες\n• Μικρά νέα βήματα: ένα μάθημα, μια βόλτα σε νέο μέρος',
  note:'Αν η θλίψη κρατά πάνω από 2 εβδομάδες με αϋπνία και απώλεια ενδιαφέροντος → γιατρός. Αν σκεφτείτε να κάνετε κακό στον εαυτό σας → ψυχίατρος ή γιατρός αμέσως.',
  ph:{who:'Ηράκλειτος',src:'Απόσπασμα Β 91',q:'Δεν μπορείς να μπεις δύο φορές στο ίδιο ποτάμι.',t:'Ούτε εσείς είστε πια ο ίδιος άνθρωπος που ήσασταν στην αρχή της σχέσης. Γράψτε σήμερα ένα πράγμα που μάθατε και θα πάρετε μαζί σας στο νέο κομμάτι της ζωής σας.'}},
 en:{n:'Break-up or divorce',s:['Sadness, tears, emptiness','Thoughts going back to the past','Poor sleep, no appetite','Anger or guilt','Fear of the future and of loneliness'],
  w:'A break-up hurts like a bereavement — because it is one. Give yourself time. The heart heals more slowly than we would like, but it does heal.',
  aid:'• Keep a routine: sleep, meals, a walk — even if you do not feel like it\n• Limit checking your ex on social media\n• Surround yourself with friends and family\n• If there are children: protect them from the conflict\n• Small new steps: a class, a walk somewhere new',
  note:'If sadness lasts over 2 weeks with poor sleep and loss of interest → doctor. If you think of harming yourself → psychiatrist or doctor immediately.',
  ph:{who:'Heraclitus',src:'Fragment B 91',q:'You cannot step into the same river twice.',t:'You are not the same person you were at the start of the relationship. Write today one thing you learned that you will take into the new chapter of your life.'}}},

{id:'nervstomach',areas:['psy','gastro'],sev:'norm',f:3,req:['anxiety','stress_worse','tests_normal'],
 k:[['stomach_pain','nausea','indigestion','bloating'],['anxiety','stress_worse'],['tests_normal'],['diarrhea','bowel_change','heartburn']],ctx:[0,0,0,0],
 el:{n:'Νευρικό στομάχι (στομάχι από άγχος)',s:['Πόνος, σφίξιμο ή «κόμπος» στο στομάχι όταν αγχώνεστε','Ναυτία, βαρυστομαχιά, καούρα','Διάρροια ή δυσκοιλιότητα σε στιγμές έντασης','Οι εξετάσεις συνήθως βγαίνουν καλές'],
  w:'Το στομάχι έχει τόσα νεύρα που το λένε «δεύτερο εγκέφαλο» — νιώθει κάθε ανησυχία μας. Δεν το φαντάζεστε: ο πόνος είναι αληθινός, και η ηρεμία βοηθά πραγματικά.',
  aid:'• Τρώτε αργά, καθιστοί, χωρίς οθόνη και χωρίς βιασύνη\n• Μικρά, συχνά γεύματα· λιγότερος καφές, αλκοόλ, λιπαρά\n• Κοιλιακή αναπνοή 5 λεπτά: το χέρι στην κοιλιά, φουσκώνει στην εισπνοή\n• Περπάτημα μετά το φαγητό\n• Ζεστό χαμομήλι ή μέντα',
  note:'Πρώτα γιατρός, για να αποκλειστούν άλλες αιτίες — ειδικά αν είστε άνω των 50 με νέο σύμπτωμα, χάνετε βάρος, κάνετε εμετό, έχετε μαύρα κόπρανα ή αίμα. Αν το άγχος επιμένει → ψυχολόγος.',
  ph:{who:'Πλάτων',src:'Χαρμίδης, 156e',q:'Όπως δεν πρέπει να θεραπεύουμε τα μάτια χωρίς το κεφάλι, ούτε το κεφάλι χωρίς το σώμα, έτσι δεν πρέπει να θεραπεύουμε το σώμα χωρίς την ψυχή.',t:'Στο επόμενο γεύμα θεραπεύστε «ψυχή και σώμα μαζί»: τρώτε αργά, σε ήρεμο χώρο, και πείτε ένα ευχαριστώ για το φαγητό.'}},
 en:{n:'Nervous stomach (stomach upset from stress)',s:['Pain, tightness or a “knot” in the stomach when anxious','Nausea, indigestion, heartburn','Diarrhoea or constipation at tense times','Tests usually come back normal'],
  w:'The gut has so many nerves that it is called the “second brain” — it feels every worry. You are not imagining it: the pain is real, and calm truly helps.',
  aid:'• Eat slowly, sitting down, without screens or hurry\n• Small, frequent meals; less coffee, alcohol, fatty food\n• Belly breathing for 5 minutes: hand on the belly, it rises as you breathe in\n• A walk after meals\n• Warm chamomile or mint tea',
  note:'See a doctor first to rule out other causes — especially if you are over 50 with a new symptom, losing weight, vomiting, or have black stools or blood. If the anxiety persists → psychologist.',
  ph:{who:'Plato',src:'Charmides, 156e',q:'Just as we should not treat the eyes without the head, nor the head without the body, so we should not treat the body without the soul.',t:'At your next meal, treat “body and soul together”: eat slowly, in a calm place, and give thanks for the food.'}}},

{id:'stressheart',areas:['psy','cardio'],sev:'caution',f:3,req:['anxiety','stress_worse','panic','tests_normal'],
 k:[['palpitations'],['anxiety','stress_worse','panic'],['tests_normal'],['chest_pain','fast_breathing']],ctx:[0,0,0,1],
 el:{n:'Καρδιά που χτυπά από το άγχος',s:['Ταχυπαλμία ή «χτύποι που χάνονται» σε στιγμές άγχους','Σφίξιμο στο στήθος με την ένταση','Γρήγορη ανάσα','Ο καρδιολογικός έλεγχος είναι καλός'],
  w:'Η καρδιά αντιδρά σε κάθε συγκίνηση — γι’ αυτό λέμε «χτυποκάρδι». Όταν ο γιατρός έχει πει ότι η καρδιά σας είναι γερή, μπορείτε να της μιλήσετε ήρεμα: «Σε ακούω, είμαι καλά».',
  aid:'• Αργή αναπνοή: εισπνοή 4 δευτερόλεπτα, εκπνοή 6 — για 3 λεπτά\n• Κρύο νερό στο πρόσωπο\n• Λιγότερος καφές, ενεργειακά ποτά, τσιγάρο, αλκοόλ\n• Τακτικός περίπατος — δυναμώνει την καρδιά και ηρεμεί τα νεύρα\n• Ημερολόγιο: πότε συμβαίνει και τι σκεφτόσασταν',
  note:'Πόνος στο στήθος που πάει σε χέρι, σαγόνι ή πλάτη, δύσπνοια, λιποθυμία ή κρύος ιδρώτας → ΑΜΕΣΑ στα Επείγοντα. Κάθε νέα ταχυπαλμία → πρώτα καρδιολόγος (καρδιογράφημα). Αν όλα είναι καλά και το άγχος επιμένει → ψυχολόγος.',
  ph:{who:'Γοργίας',src:'Ελένης Εγκώμιον, 14',q:'Η δύναμη του λόγου πάνω στην ψυχή είναι ίδια με τη δύναμη των φαρμάκων πάνω στο σώμα. Άλλα λόγια λυπούν, άλλα ευφραίνουν, άλλα φοβίζουν και άλλα δίνουν θάρρος.',t:'Γράψτε μια ήρεμη φράση για τις δύσκολες στιγμές, π.χ. «Η καρδιά μου είναι γερή. Είναι άγχος. Θα περάσει.» Διαβάστε την αργά όταν έρθει η ταχυπαλμία.'}},
 en:{n:'Heart racing from stress',s:['Racing heart or “skipped beats” at anxious moments','Chest tightness with tension','Fast breathing','Heart check-ups are normal'],
  w:'The heart reacts to every emotion. Once your doctor has said your heart is healthy, you can speak to it calmly: “I hear you, I am all right.”',
  aid:'• Slow breathing: in for 4 seconds, out for 6 — for 3 minutes\n• Cold water on the face\n• Less coffee, energy drinks, smoking, alcohol\n• Regular walking — strengthens the heart and calms the nerves\n• A diary: when it happens and what you were thinking',
  note:'Chest pain spreading to the arm, jaw or back, breathlessness, fainting or cold sweat → urgent doctor (A&E) now. Any new palpitations → see a cardiologist first (ECG). If all is fine and anxiety persists → psychologist.',
  ph:{who:'Gorgias',src:'Encomium of Helen, 14',q:'The power of speech over the soul is like the power of drugs over the body. Some words bring grief, some delight, some fear, and some give courage.',t:'Write a calm sentence for hard moments, e.g. “My heart is healthy. This is anxiety. It will pass.” Read it slowly when the racing starts.'}}},

{id:'whitecoat',areas:['psy','cardio'],sev:'caution',f:3,req:['anxiety','stress_worse','tests_normal'],
 k:[['high_bp'],['anxiety','stress_worse'],['palpitations','headache'],['morning']],ctx:[0,0,0,1],
 el:{n:'Πίεση που ανεβαίνει με το άγχος',s:['Η πίεση ανεβαίνει όταν αγχώνεστε ή στο ιατρείο','Στο σπίτι, ήρεμοι, είναι χαμηλότερη','Ταχυπαλμία, ζέστη στο πρόσωπο','Πονοκέφαλος στον αυχένα','Άγχος τη στιγμή της μέτρησης'],
  w:'Είναι πολύ συχνό: μόνο η ιδέα της μέτρησης ανεβάζει την πίεση. Η ηρεμία βοηθά πραγματικά — αλλά τα φάρμακα που έδωσε ο γιατρός δεν τα σταματάμε ποτέ μόνοι μας.',
  aid:'• Μετράτε σωστά: καθιστοί, 5 λεπτά ηρεμία πριν, χωρίς καφέ ή τσιγάρο 30 λεπτά πριν, το χέρι στο ύψος της καρδιάς\n• Κάντε 2 μετρήσεις με 1 λεπτό διαφορά και γράψτε τον μέσο όρο\n• Μετράτε πρωί (πριν τα φάρμακα) και βράδυ για 7 μέρες — δείξτε τα στον γιατρό\n• Αργή αναπνοή 5 λεπτά, δύο φορές τη μέρα\n• Λιγότερο αλάτι· περπάτημα 30 λεπτά τις περισσότερες μέρες',
  note:'Πίεση πάνω από 180/120 (18/12) με πονοκέφαλο, πόνο στο στήθος, θολή όραση ή αδυναμία → επείγει γιατρός (Επείγοντα). Αν η πρωινή πίεση μένει ψηλή παρά τα φάρμακα, ο γιατρός σας μπορεί να αλλάξει ώρα ή φάρμακο ή να προτείνει 24ωρη καταγραφή (Holter πίεσης). Μην αλλάζετε μόνοι σας δόση.',
  ph:{who:'Ιπποκράτης',src:'Επιδημίαι, ΣΤ΄ 5.1',q:'Η φύση είναι ο γιατρός των νόσων.',t:'Βοηθήστε σήμερα τη φύση να κάνει τη δουλειά της: ήσυχος περίπατος, λιγότερο αλάτι, μία ώρα χωρίς ειδήσεις — μαζί με τα φάρμακα του γιατρού σας.'}},
 en:{n:'Blood pressure that rises with stress',s:['Pressure rises when anxious or at the surgery','At home, when calm, it is lower','Racing heart, hot face','Headache at the back of the neck','Anxiety at the moment of measuring'],
  w:'Very common: the very idea of measuring raises the pressure. Calm truly helps — but we never stop the medicines the doctor gave us on our own.',
  aid:'• Measure correctly: seated, 5 minutes of rest first, no coffee or smoking for 30 minutes before, arm at heart level\n• Take 2 readings 1 minute apart and note the average\n• Measure in the morning (before tablets) and evening for 7 days — show your doctor\n• Slow breathing for 5 minutes, twice a day\n• Less salt; walk 30 minutes most days',
  note:'Pressure above 180/120 with headache, chest pain, blurred vision or weakness → urgent doctor (A&E). If morning pressure stays high despite tablets, your doctor may change the timing or medicine, or suggest 24-hour monitoring. Do not change your dose yourself.',
  ph:{who:'Hippocrates',src:'Epidemics, VI 5.1',q:'Nature is the physician of diseases.',t:'Help nature do its work today: a quiet walk, less salt, an hour without the news — together with your doctor’s medicines.'}}},

{id:'stressskin',areas:['psy','skin'],sev:'norm',f:2,req:['anxiety','stress_worse'],
 k:[['itch','rash','hives','skin_patches','dry_skin'],['anxiety','stress_worse'],['hair_loss']],ctx:[0,0,0],
 el:{n:'Δέρμα που «μιλά» από το στρες',s:['Φαγούρα που χειροτερεύει με το άγχος','Έκζεμα, ψωρίαση ή κνίδωση που φουντώνουν σε δύσκολες περιόδους','Ξύσιμο ή τσίμπημα του δέρματος χωρίς να το καταλαβαίνετε','Τριχόπτωση μετά από μεγάλο στρες'],
  w:'Δέρμα και νεύρα συνδέονται στενά — γι’ αυτό το δέρμα κοκκινίζει, φαγουρίζει και φουντώνει όταν η ψυχή βαραίνει. Δεν φταίτε εσείς· μπορούμε όμως να βοηθήσουμε και τα δύο.',
  aid:'• Ενυδατική κρέμα χωρίς άρωμα, δύο φορές τη μέρα\n• Χλιαρό, όχι ζεστό, νερό στο μπάνιο\n• Όταν θέλετε να ξυστείτε: κρύα κομπρέσα ή απαλό πάτημα αντί για νύχια\n• Κοντά νύχια, βαμβακερά ρούχα\n• Χαλάρωση: αναπνοές, περίπατος, καλός ύπνος',
  note:'Δερματολόγος για το δέρμα. Αν το άγχος ή το ξύσιμο δεν ελέγχονται → ψυχολόγος. Πρήξιμο χειλιών ή γλώσσας ή δύσπνοια → επείγει γιατρός (Επείγοντα).',
  ph:{who:'Δημόκριτος',src:'Απόσπασμα Β 31',q:'Η ιατρική θεραπεύει τις αρρώστιες του σώματος· η σοφία απαλλάσσει την ψυχή από τα πάθη.',t:'Συνδυάστε τα δύο σήμερα: την κρέμα του γιατρού για το δέρμα, και 10 λεπτά ησυχίας για την ψυχή.'}},
 en:{n:'Skin that “speaks” under stress',s:['Itching that gets worse with stress','Eczema, psoriasis or hives flaring in hard times','Scratching or picking the skin without noticing','Hair loss after a big stress'],
  w:'Skin and nerves are closely linked — that is why the skin reddens, itches and flares when the soul is heavy. It is not your fault; we can help both.',
  aid:'• Unscented moisturiser twice a day\n• Lukewarm, not hot, water when bathing\n• When you want to scratch: a cold compress or gentle pressing instead of nails\n• Short nails, cotton clothes\n• Relaxation: breathing, walks, good sleep',
  note:'Dermatologist for the skin. If stress or scratching cannot be controlled → psychologist. Swollen lips or tongue or difficulty breathing → urgent doctor (A&E).',
  ph:{who:'Democritus',src:'Fragment B 31',q:'Medicine heals the diseases of the body; wisdom frees the soul from its passions.',t:'Combine both today: the doctor’s cream for the skin, and 10 quiet minutes for the soul.'}}},

{id:'tensionpain',areas:['psy','musc'],sev:'norm',f:3,req:['anxiety','stress_worse','muscle_tension'],
 k:[['neck_pain','back_pain','shoulder_pain','low_back_pain','muscle_tension'],['anxiety','stress_worse'],['headache','jaw_pain'],['muscle_tension','fatigue']],ctx:[0,0,0,0],
 el:{n:'Πόνοι από σφιγμένους μυς (αυχένας, ώμοι, μέση)',s:['Σφιγμένοι ώμοι και αυχένας','Πόνος στη μέση ή στην πλάτη που χειροτερεύει με το στρες','Πονοκέφαλος που ξεκινά από τον αυχένα','Σφίξιμο στο σαγόνι, τρίξιμο δοντιών','Κούραση'],
  w:'Όταν κουβαλάμε βάρη στην ψυχή, τα κουβαλάμε και στους ώμους. Δεν είναι φαντασία — οι μύες σφίγγονται πραγματικά. Και μπορούν να μάθουν ξανά να χαλαρώνουν.',
  aid:'• Κάθε ώρα: σηκώστε τους ώμους ψηλά, κρατήστε 5 δευτερόλεπτα, αφήστε τους να πέσουν\n• Ζεστή κομπρέσα ή ζεστό ντους στον αυχένα\n• Ήπιες διατάσεις και περπάτημα — η κίνηση είναι φάρμακο\n• Προοδευτική χαλάρωση: σφίξτε και χαλαρώστε κάθε μυ, από τα πόδια ως το κεφάλι\n• Σωστό μαξιλάρι και καρέκλα, διαλείμματα από την οθόνη',
  note:'Γιατρός αν: ο πόνος πηγαίνει στο χέρι ή στο πόδι με μούδιασμα ή αδυναμία, έχετε πυρετό, χάνετε βάρος, ή δεν βελτιώνεται σε 4–6 εβδομάδες. Ο φυσικοθεραπευτής βοηθά πολύ.',
  ph:{who:'Πλάτων',src:'Τίμαιος, 88b',q:'Να μην κινούμε ούτε την ψυχή χωρίς το σώμα ούτε το σώμα χωρίς την ψυχή, ώστε, στηρίζοντας το ένα το άλλο, να γίνουν ισόρροπα και υγιή.',t:'Συνδυάστε σήμερα κίνηση και ηρεμία: 10 λεπτά περπάτημα με αργές, βαθιές ανάσες.'}},
 en:{n:'Pain from tense muscles (neck, shoulders, back)',s:['Tight shoulders and neck','Low or upper back pain worse with stress','Headache starting from the neck','Clenched jaw, teeth grinding','Tiredness'],
  w:'When we carry weights in the soul, we carry them in our shoulders too. It is not imagination — muscles really tighten. And they can learn to relax again.',
  aid:'• Every hour: lift your shoulders high, hold 5 seconds, let them drop\n• Warm compress or a warm shower on the neck\n• Gentle stretches and walking — movement is medicine\n• Progressive relaxation: tense and relax each muscle, from feet to head\n• Proper pillow and chair, breaks from screens',
  note:'See a doctor if the pain spreads to an arm or leg with numbness or weakness, you have a fever, lose weight, or it does not improve in 4–6 weeks. A physiotherapist helps a lot.',
  ph:{who:'Plato',src:'Timaeus, 88b',q:'Do not exercise the soul without the body, nor the body without the soul, so that, each supporting the other, they become balanced and healthy.',t:'Combine movement and calm today: a 10-minute walk with slow, deep breaths.'}}},

{id:'chronicpain',areas:['psy','musc'],sev:'caution',f:2,req:['sadness','irritable','apathy','anxiety','insomnia'],
 k:[['body_aches','pain_generic','joint_pain','back_pain','low_back_pain'],['sadness','irritable','apathy','anxiety'],['insomnia','fatigue']],ctx:[0,0,0],
 el:{n:'Χρόνιος πόνος που βαραίνει την ψυχή',s:['Πόνος που κρατά μήνες','Κακή διάθεση, νεύρα, απελπισία','Κακός ύπνος που κάνει τον πόνο χειρότερο','Φόβος να κινηθείτε','Λιγότερες έξοδοι και χαρές'],
  w:'Ο χρόνιος πόνος κουράζει σώμα και ψυχή, και αξίζετε κατανόηση — όχι «είναι στο μυαλό σου». Ο πόνος είναι αληθινός. Η ψυχή όμως μπορεί να γίνει σύμμαχος, ώστε να πονάτε λιγότερο.',
  aid:'• Λίγη κίνηση κάθε μέρα, που αυξάνεται σιγά σιγά — ακόμη και 5 λεπτά\n• Μοιράστε τις δουλειές σε μικρά κομμάτια με διαλείμματα\n• Ζέστη, ήπιο μασάζ, χαλάρωση\n• Σταθερή ώρα ύπνου\n• Κρατήστε μία χαρά κάθε μέρα — ο πόνος δεν πρέπει να παίρνει όλο τον χώρο',
  note:'Ζητήστε από τον γιατρό σας παραπομπή σε ιατρείο πόνου, φυσικοθεραπεία ή ψυχολόγο (η γνωσιακή θεραπεία για τον πόνο βοηθά). Μην αυξάνετε μόνοι σας τα παυσίπονα.',
  ph:{who:'Επίκουρος',src:'Διογένης Λαέρτιος, Ι΄ 22',q:'Σε μέρες μεγάλου πόνου από την αρρώστια του, έγραφε σε φίλο: «Σε όλους αυτούς τους πόνους αντιστεκόταν η χαρά της ψυχής μου, με την ανάμνηση των συζητήσεών μας».',t:'Τηλεφωνήστε σήμερα σε έναν φίλο και θυμηθείτε μαζί μια ωραία στιγμή. Η χαρά της ψυχής δεν σβήνει τον πόνο, αλλά τον κάνει πιο ελαφρύ.'}},
 en:{n:'Chronic pain that weighs on the soul',s:['Pain lasting months','Low mood, irritability, hopelessness','Poor sleep that makes pain worse','Fear of moving','Fewer outings and joys'],
  w:'Chronic pain wears out body and soul, and you deserve understanding — not “it is all in your head”. The pain is real. But the mind can become an ally so that you hurt less.',
  aid:'• A little movement every day, increased slowly — even 5 minutes\n• Split tasks into small pieces with breaks\n• Warmth, gentle massage, relaxation\n• A regular bedtime\n• Keep one joy every day — pain should not take all the space',
  note:'Ask your doctor for referral to a pain clinic, physiotherapy or a psychologist (cognitive therapy for pain helps). Do not increase painkillers on your own.',
  ph:{who:'Epicurus',src:'Diogenes Laertius, X 22',q:'In days of great pain from his illness he wrote to a friend: “Against all these pains stood the joy of my soul at the memory of our conversations.”',t:'Call a friend today and remember a lovely moment together. The joy of the soul does not erase pain, but it makes it lighter.'}}},

{id:'somatic',areas:['psy','gen'],sev:'caution',f:2,req:['tests_normal'],
 k:[['tests_normal'],['pain_generic','body_aches','fatigue','dizziness','palpitations','stomach_pain','headache'],['anxiety','stress_worse','health_worry','sadness']],ctx:[0,0,0],
 el:{n:'Συμπτώματα χωρίς εύρημα στις εξετάσεις',s:['Πόνοι, κούραση, ζάλη ή ενοχλήσεις που μετακινούνται','Πολλές εξετάσεις — όλες καλές','Ανησυχία ότι «κάτι δεν βρέθηκε»','Χειροτερεύουν με το άγχος και τη στενοχώρια'],
  w:'Το ότι οι εξετάσεις είναι καλές δεν σημαίνει ότι «τα φαντάζεστε». Σημαίνει ότι το σώμα σας μιλά για κάτι που δεν φαίνεται στο αίμα ή στις ακτινογραφίες: κούραση, φόρτο, λύπη ή άγχος.',
  aid:'• Ένας σταθερός οικογενειακός γιατρός που σας ξέρει\n• Ημερολόγιο: πότε έρχονται τα συμπτώματα και τι συνέβαινε τότε\n• Καθημερινή κίνηση, σταθερός ύπνος\n• Μιλήστε για ό,τι σας βαραίνει — με φίλο ή ειδικό\n• Μικρές χαρές κάθε μέρα',
  note:'Νέο ή διαφορετικό σύμπτωμα → πάντα γιατρός. Αν τα συμπτώματα επηρεάζουν πολύ τη ζωή σας → ψυχολόγος ή ψυχίατρος· υπάρχει αποτελεσματική θεραπεία.',
  ph:{who:'Πλάτων',src:'Χαρμίδης, 157a',q:'Η ψυχή θεραπεύεται με κάποιες «επωδές» — και οι επωδές αυτές είναι τα καλά λόγια. Από τέτοια λόγια γεννιέται στην ψυχή η σωφροσύνη· κι όταν υπάρχει αυτή, εύκολα έρχεται η υγεία και στο κεφάλι και σε όλο το σώμα.',t:'Βρείτε σήμερα τα δικά σας «καλά λόγια»: μια κουβέντα με αγαπημένο πρόσωπο, ένα βιβλίο, μια προσευχή.'}},
 en:{n:'Symptoms with normal test results',s:['Pains, tiredness, dizziness or discomfort that move around','Many tests — all normal','Worry that “something was missed”','Worse with stress and sorrow'],
  w:'Normal tests do not mean you are “imagining it”. They mean your body is speaking about something that does not show in blood tests or X-rays: exhaustion, overload, sorrow or anxiety.',
  aid:'• One regular family doctor who knows you\n• A diary: when the symptoms come and what was happening then\n• Daily movement, regular sleep\n• Talk about what weighs on you — with a friend or a specialist\n• Small joys every day',
  note:'A new or different symptom → always see a doctor. If symptoms affect your life a lot → psychologist or psychiatrist; there is effective treatment.',
  ph:{who:'Plato',src:'Charmides, 157a',q:'The soul is healed by certain “charms” — and these charms are beautiful words. From such words, balance is born in the soul; and when it is there, health comes easily to the head and to the whole body.',t:'Find your own “beautiful words” today: a talk with a loved one, a book, a prayer.'}}},

{id:'anxdizzy',areas:['psy','head'],sev:'caution',f:2,req:['anxiety','stress_worse','panic','tests_normal'],
 k:[['dizziness','unsteady'],['anxiety','stress_worse','panic'],['tests_normal']],ctx:[0,0,0],
 el:{n:'Ζάλη από άγχος',s:['Αίσθηση αστάθειας ή «κουνήματος» — όχι γύρισμα','Χειρότερα σε πολυκοσμία, σούπερ μάρκετ, κινούμενες εικόνες','Φόβος μήπως πέσετε','Οι εξετάσεις αυτιών και εγκεφάλου είναι καλές'],
  w:'Αυτή η ζάλη είναι συχνή και πραγματική: μετά από άγχος ή μια παλιά ζάλη, ο εγκέφαλος μένει «σε επιφυλακή». Η καλή είδηση: μαθαίνει ξανά να νιώθει σταθερός.',
  aid:'• Μην αποφεύγετε τις κινήσεις — η σταδιακή έκθεση βοηθά τον εγκέφαλο να προσαρμοστεί\n• Περπάτημα κάθε μέρα, με το βλέμμα μπροστά\n• Αργή αναπνοή όταν ξεκινά\n• Πίνετε νερό, τρώτε τακτικά\n• Φυσικοθεραπεία ισορροπίας (αιθουσαία αποκατάσταση)',
  note:'Ξαφνική ζάλη με δυσκολία στην ομιλία, στραβό στόμα, αδυναμία σε χέρι ή πόδι ή διπλή όραση → επείγει γιατρός (Επείγοντα). Νέα ζάλη → πρώτα γιατρός (πίεση, φάρμακα, αυτιά). Ζάλη που επιμένει μήνες → ΩΡΛ ή νευρολόγος, και ψυχολόγος.',
  ph:{who:'Επίκτητος',src:'Διατριβές, Α΄ 15',q:'Τίποτα μεγάλο δεν γίνεται ξαφνικά, ούτε το σταφύλι ούτε το σύκο. Αν μου πεις «θέλω ένα σύκο», θα σου πω: «θέλει χρόνο· άφησέ το πρώτα να ανθίσει, έπειτα να δέσει καρπό, έπειτα να ωριμάσει».',t:'Κάντε σήμερα έναν περίπατο λίγο μεγαλύτερο από χθες. Η σταθερότητα ωριμάζει σιγά σιγά, όπως το σύκο.'}},
 en:{n:'Dizziness from anxiety',s:['A sense of unsteadiness or “rocking” — not spinning','Worse in crowds, supermarkets, moving images','Fear of falling','Ear and brain tests are normal'],
  w:'This dizziness is common and real: after anxiety or an old dizzy spell, the brain stays “on alert”. The good news: it can learn to feel steady again.',
  aid:'• Do not avoid movement — gradual exposure helps the brain adapt\n• Walk daily, looking ahead\n• Slow breathing when it starts\n• Drink water, eat regularly\n• Balance physiotherapy (vestibular rehabilitation)',
  note:'Sudden dizziness with trouble speaking, a drooping mouth, weakness in an arm or leg, or double vision → urgent doctor (A&E). New dizziness → see a doctor first (blood pressure, medicines, ears). Dizziness lasting months → ENT or neurologist, and a psychologist.',
  ph:{who:'Epictetus',src:'Discourses, I 15',q:'Nothing great comes into being suddenly, not even a bunch of grapes or a fig. If you tell me “I want a fig”, I will answer: “It needs time; let it first blossom, then bear fruit, then ripen.”',t:'Take a walk today a little longer than yesterday. Steadiness ripens slowly, like the fig.'}}},

{id:'overthink',areas:['psy'],sev:'norm',f:3,req:['overthinking'],
 k:[['overthinking'],['insomnia'],['anxiety','stress_worse'],['fatigue','concentration']],ctx:[0,0,0,0],
 el:{n:'Σκέψεις που δεν σταματούν (υπερανάλυση)',s:['Το μυαλό γυρίζει τα ίδια ξανά και ξανά','Δύσκολα αποφασίζετε','Αϋπνία από σκέψεις','Κούραση, δεν συγκεντρώνεστε','Σενάρια για το τι θα πάει στραβά'],
  w:'Ένα μυαλό που σκέφτεται πολύ είναι συνήθως έξυπνο και ευαίσθητο. Χρειάζεται απλώς να μάθει πότε να κλείνει την πόρτα. Οι σκέψεις δεν είναι πάντα γεγονότα.',
  aid:'• Γράψτε τις σκέψεις στο χαρτί — το χαρτί τις κρατά για εσάς\n• Ρωτήστε: «Μπορώ να κάνω κάτι γι’ αυτό σήμερα;» Αν ναι, ένα βήμα. Αν όχι, αφήστε το\n• «Ώρα σκέψης» 15 λεπτά τη μέρα — έξω από αυτήν: «θα το σκεφτώ αργότερα»\n• Βάλτε τα χέρια σε δουλειά: κήπος, μαγείρεμα, περπάτημα\n• Πριν τον ύπνο: όχι ειδήσεις, όχι οθόνες',
  note:'Αν οι σκέψεις είναι τρομακτικές και επίμονες και σας σπρώχνουν σε επαναλαμβανόμενες πράξεις, ή φέρνουν θλίψη και αϋπνία για εβδομάδες → ψυχολόγος ή ψυχίατρος.',
  ph:{who:'Επίκτητος',src:'Εγχειρίδιο, 5',q:'Δεν ταράζουν τους ανθρώπους τα πράγματα, αλλά οι γνώμες τους για τα πράγματα.',t:'Πάρτε μία σκέψη που σας βασανίζει σήμερα και γράψτε δίπλα: «Τι έγινε πραγματικά;» και «Τι λέω εγώ γι’ αυτό;». Συχνά το βάρος είναι στο δεύτερο.'}},
 en:{n:'Thoughts that will not stop (overthinking)',s:['The mind goes round the same things again and again','Hard to make decisions','Sleepless from thoughts','Tired, cannot concentrate','Imagining what will go wrong'],
  w:'A mind that thinks a lot is usually clever and sensitive. It just needs to learn when to close the door. Thoughts are not always facts.',
  aid:'• Write your thoughts on paper — the paper holds them for you\n• Ask: “Can I do something about this today?” If yes, one step. If not, let it go\n• A 15-minute “thinking time” each day — outside it: “I will think about it later”\n• Keep your hands busy: gardening, cooking, walking\n• Before bed: no news, no screens',
  note:'If the thoughts are frightening and persistent and push you into repeated actions, or bring sadness and sleeplessness for weeks → psychologist or psychiatrist.',
  ph:{who:'Epictetus',src:'Enchiridion, 5',q:'People are disturbed not by things, but by their opinions about things.',t:'Take one thought that troubles you today and write next to it: “What really happened?” and “What am I telling myself about it?”. The weight is often in the second.'}}},

{id:'apathy',areas:['psy'],sev:'norm',f:2,req:['apathy','anhedonia'],
 k:[['apathy','anhedonia'],['fatigue','sleepy'],['phone_addict','loneliness']],ctx:[0,0,0],
 el:{n:'Απάθεια και έλλειψη κινήτρου',s:['Δεν έχετε όρεξη να ξεκινήσετε τίποτα','Αναβάλλετε συνεχώς','Ώρες χωρίς σκοπό (π.χ. στην οθόνη)','Κούραση χωρίς λόγο','Λίγη χαρά από όσα παλιά σας άρεσαν'],
  w:'Το κίνητρο σπάνια έρχεται πρώτο — συνήθως έρχεται μετά την πράξη. Δεν χρειάζεται να νιώσετε έτοιμοι. Αρκεί ένα πολύ μικρό βήμα.',
  aid:'• Κανόνας των 5 λεπτών: ξεκινήστε κάτι μόνο για 5 λεπτά\n• Μία μικρή δουλειά το πρωί — στρώστε το κρεβάτι\n• Φως ημέρας και περπάτημα το πρωί\n• Σταθερή ώρα ύπνου και ξυπνήματος\n• Κανονίστε συναντήσεις με άλλους — η δέσμευση βοηθά',
  note:'Αν η απάθεια κρατά πάνω από 2 εβδομάδες μαζί με θλίψη, ή χάσατε κάθε χαρά → γιατρός· μπορεί να είναι κατάθλιψη ή θυρεοειδής, που θεραπεύονται.',
  ph:{who:'Αριστοτέλης',src:'Ηθικά Νικομάχεια, Β΄ 1',q:'Γινόμαστε δίκαιοι κάνοντας δίκαιες πράξεις, σώφρονες κάνοντας σώφρονες πράξεις, γενναίοι κάνοντας γενναίες πράξεις.',t:'Μην περιμένετε να νιώσετε δραστήριοι για να δράσετε — δράστε λίγο, και θα γίνετε δραστήριοι. Ένα μικρό βήμα σήμερα.'}},
 en:{n:'Apathy and lack of motivation',s:['No wish to start anything','You keep putting things off','Hours without purpose (e.g. on screens)','Tiredness without reason','Little joy from what you used to like'],
  w:'Motivation rarely comes first — it usually comes after action. You do not need to feel ready. One very small step is enough.',
  aid:'• The 5-minute rule: start something for just 5 minutes\n• One small task in the morning — make the bed\n• Daylight and a walk in the morning\n• Regular times for sleep and waking\n• Arrange to meet others — commitment helps',
  note:'If apathy lasts over 2 weeks with sadness, or you have lost all joy → doctor; it may be depression or the thyroid, both treatable.',
  ph:{who:'Aristotle',src:'Nicomachean Ethics, II 1',q:'We become just by doing just acts, temperate by doing temperate acts, brave by doing brave acts.',t:'Do not wait to feel active before acting — act a little, and you will become active. One small step today.'}}},

{id:'screens',areas:['psy'],sev:'norm',f:3,req:['phone_addict'],
 k:[['phone_addict'],['insomnia','concentration'],['apathy','loneliness','anxiety']],ctx:[0,0,0],
 el:{n:'Εξάρτηση από κινητό και οθόνες',s:['Πιάνετε το κινητό χωρίς λόγο, ξανά και ξανά','Ώρες στα κοινωνικά δίκτυα ή στα βίντεο','Κακός ύπνος, κουρασμένα μάτια','Ανησυχία όταν δεν έχετε το κινητό','Λιγότερος χρόνος με ανθρώπους'],
  w:'Τα κινητά είναι φτιαγμένα από ειδικούς ώστε να μας κρατούν. Δεν φταίει η θέλησή σας. Μπορείτε όμως να ξαναγίνετε εσείς ο αφέντης του χρόνου σας.',
  aid:'• Κλείστε τις ειδοποιήσεις που δεν χρειάζεστε\n• Όχι κινητό στο τραπέζι και στο υπνοδωμάτιο — ξυπνητήρι ρολόι\n• Μία ώρα πριν τον ύπνο, οθόνες κλειστές\n• Βάλτε όριο χρόνου στις εφαρμογές (ρυθμίσεις του κινητού)\n• Αντικαταστήστε: βιβλίο, βόλτα, τηλεφώνημα σε φίλο',
  note:'Αν δεν μπορείτε να μειώσετε παρά τις προσπάθειες, ή η οθόνη έχει πάρει τη θέση της δουλειάς, του ύπνου και των σχέσεων → ψυχολόγος.',
  ph:{who:'Επίκτητος',src:'κατά τον Αύλο Γέλλιο, Αττικαί Νύκτες 17.19',q:'Ανέχου και απέχου — υπόμενε τα δύσκολα και κράτα απόσταση από όσα σε σκλαβώνουν.',t:'Διαλέξτε σήμερα μία ώρα «αποχής»: το κινητό σε άλλο δωμάτιο. Παρατηρήστε τι κερδίζετε.'}},
 en:{n:'Dependence on phone and screens',s:['You pick up the phone without reason, again and again','Hours on social media or videos','Poor sleep, tired eyes','Uneasy when you do not have your phone','Less time with people'],
  w:'Phones are designed by experts to hold on to us. It is not a failure of your will. But you can become the master of your time again.',
  aid:'• Turn off the notifications you do not need\n• No phone at the table or in the bedroom — use a clock for the alarm\n• Screens off one hour before bed\n• Set time limits for apps (phone settings)\n• Replace: a book, a walk, a call to a friend',
  note:'If you cannot cut down despite trying, or the screen has taken the place of work, sleep and relationships → psychologist.',
  ph:{who:'Epictetus',src:'as reported by Aulus Gellius, Attic Nights 17.19',q:'Bear and forbear — endure what is hard and keep away from what enslaves you.',t:'Choose one hour of “forbearing” today: the phone in another room. Notice what you gain.'}}},

{id:'meaning',areas:['psy'],sev:'caution',f:2,req:['meaningless'],
 k:[['meaningless'],['apathy','anhedonia','sadness'],['retired','life_change','loneliness']],ctx:[0,0,0],
 el:{n:'Υπαρξιακό κενό — όταν χάνεται το νόημα',s:['Ερωτήματα «ποιο το νόημα;»','Αίσθηση κενού μέσα σας','Όλα μοιάζουν ίδια και άχρωμα','Συχνά μετά από αλλαγή: σύνταξη, απώλεια, ασθένεια'],
  w:'Το ερώτημα για το νόημα δεν είναι αρρώστια — είναι η αρχή της φιλοσοφίας. Οι πιο σοφοί άνθρωποι πέρασαν από εδώ. Το νόημα συχνά δεν το βρίσκουμε έτοιμο· το χτίζουμε, με αγάπη και προσφορά.',
  aid:'• Γράψτε: πότε στη ζωή μου ένιωσα πιο ζωντανός;\n• Προσφορά: βοηθήστε κάποιον σήμερα — το νόημα γεννιέται στη σχέση\n• Μοιραστείτε σκέψεις με ανθρώπους που σέβεστε\n• Φύση, τέχνη, μουσική, πίστη — ό,τι σας ανοίγει την καρδιά\n• Ένας μικρός στόχος για αυτή την εβδομάδα',
  note:'Αν το κενό συνοδεύεται από βαθιά θλίψη, ή από σκέψεις ότι δεν αξίζει να ζείτε → μιλήστε σήμερα με ψυχίατρο ή τον γιατρό σας.',
  ph:{who:'Αριστοτέλης',src:'Ηθικά Νικομάχεια, Α΄ 7',q:'Το ανθρώπινο αγαθό είναι ενέργεια της ψυχής σύμφωνα με την αρετή — και σε όλη τη ζωή· γιατί ένα χελιδόνι δεν φέρνει την άνοιξη, ούτε μία μέρα.',t:'Για τον Αριστοτέλη η ευτυχία δεν είναι συναίσθημα που περιμένουμε, αλλά κάτι που κάνουμε. Κάντε σήμερα ένα καλό που αξιοποιεί ένα δικό σας χάρισμα.'}},
 en:{n:'Existential emptiness — when meaning is lost',s:['Questions like “what is the point?”','A sense of emptiness inside','Everything looks the same and colourless','Often after a change: retirement, loss, illness'],
  w:'Asking about meaning is not an illness — it is the beginning of philosophy. The wisest people passed this way. Meaning is rarely found ready-made; we build it, with love and giving.',
  aid:'• Write: when in my life did I feel most alive?\n• Giving: help someone today — meaning is born in relationship\n• Share thoughts with people you respect\n• Nature, art, music, faith — whatever opens your heart\n• One small goal for this week',
  note:'If the emptiness comes with deep sadness, or thoughts that life is not worth living → speak today with a psychiatrist or your doctor.',
  ph:{who:'Aristotle',src:'Nicomachean Ethics, I 7',q:'The human good is activity of the soul in accordance with virtue — over a whole life; for one swallow does not make a spring, nor does one day.',t:'For Aristotle, happiness is not a feeling we wait for but something we do. Today, do one good thing that uses a gift of yours.'}}},

{id:'lifechange',areas:['psy'],sev:'norm',f:2,req:['life_change'],
 k:[['life_change'],['anxiety','sadness'],['loneliness','insomnia']],ctx:[0,0,0],
 el:{n:'Δυσκολία προσαρμογής σε μεγάλη αλλαγή',s:['Μετά από μετακόμιση, νέα δουλειά, ξενιτιά ή αλλαγή υγείας','Άγχος, ανησυχία, κλάμα','Αίσθηση ότι «δεν ανήκετε»','Αϋπνία, κούραση','Νοσταλγία για το παλιό'],
  w:'Κάθε μεγάλη αλλαγή, ακόμη και καλή, ταράζει. Είναι φυσιολογικό να χρειάζεστε χρόνο — συνήθως μερικούς μήνες. Δεν σημαίνει ότι κάνατε λάθος επιλογή.',
  aid:'• Κρατήστε μερικές παλιές συνήθειες — δίνουν σταθερότητα\n• Κάθε εβδομάδα ένα νέο μικρό βήμα στο νέο περιβάλλον\n• Επαφή με αγαπημένους (βιντεοκλήση)\n• Γνωρίστε ανθρώπους: σύλλογοι, ενορία, γειτονιά\n• Υπομονή με τον εαυτό σας',
  note:'Αν μετά από 3 μήνες η δυσφορία μένει έντονη ή σας εμποδίζει να λειτουργήσετε → ψυχολόγος.',
  ph:{who:'Ηράκλειτος',src:'Απόσπασμα Β 84a',q:'Μεταβάλλον αναπαύεται — αυτό που αλλάζει, βρίσκει ανάπαυση.',t:'Η αλλαγή είναι ο τρόπος του κόσμου. Βρείτε σήμερα κάτι μικρό που σας αρέσει στη νέα σας ζωή και σημειώστε το.'}},
 en:{n:'Difficulty adjusting to a big change',s:['After a move, a new job, emigration or a change in health','Anxiety, worry, crying','A feeling that you “do not belong”','Poor sleep, tiredness','Longing for the old'],
  w:'Every big change, even a good one, unsettles us. It is normal to need time — usually a few months. It does not mean you made the wrong choice.',
  aid:'• Keep some old habits — they give stability\n• Each week one small new step in the new place\n• Stay in touch with loved ones (video calls)\n• Meet people: clubs, parish, neighbourhood\n• Be patient with yourself',
  note:'If after 3 months the distress is still strong or stops you functioning → psychologist.',
  ph:{who:'Heraclitus',src:'Fragment B 84a',q:'In changing, it finds rest.',t:'Change is the way of the world. Find something small you like in your new life today and note it down.'}}},

{id:'diagnosis',areas:['psy'],sev:'caution',f:2,req:['diagnosis_news'],
 k:[['diagnosis_news'],['anxiety','sadness','anger'],['insomnia','overthinking']],ctx:[0,0,0],
 el:{n:'Συναισθήματα μετά από σοβαρή ή χρόνια διάγνωση',s:['Σοκ, άρνηση, θυμός ή φόβος μετά τη διάγνωση','Σκέψεις που δεν σταματούν για το μέλλον','Αϋπνία, κακή διάθεση','Ανησυχία για την οικογένεια','Δυσκολία να μιλήσετε στους δικούς σας'],
  w:'Μια διάγνωση αλλάζει τον κόσμο σας μέσα σε μια στιγμή. Όλα όσα νιώθετε είναι φυσιολογικά. Δεν χρειάζεται να είστε «δυνατοί» όλη την ώρα — χρειάζεται να μην είστε μόνοι.',
  aid:'• Γράψτε τις ερωτήσεις σας και πάρτε μαζί σας κάποιον στο ραντεβού\n• Πληροφορίες από τον γιατρό σας, όχι από τυχαίες σελίδες\n• Σύλλογοι ασθενών — η εμπειρία άλλων βοηθά πολύ\n• Μοιραστείτε το βάρος με αγαπημένους\n• Κρατήστε μικρές χαρές και συνήθειες',
  note:'Πολλά νοσοκομεία έχουν ψυχολόγο για ασθενείς — ζητήστε τον. Αν η θλίψη ή ο φόβος σας παραλύουν → ψυχίατρος ή ψυχολόγος.',
  ph:{who:'Αριστοτέλης',src:'Ηθικά Νικομάχεια, Θ΄ 4 και Η΄ 1',q:'Ο φίλος είναι ένας άλλος εαυτός. Στη φτώχεια και στις άλλες δυστυχίες, οι άνθρωποι θεωρούν τους φίλους το μόνο καταφύγιο.',t:'Πείτε σήμερα σε έναν φίλο: «Θέλω απλώς να μου κάνεις παρέα». Δεν χρειάζεται να σας λύσει τίποτα.'}},
 en:{n:'Emotions after a serious or chronic diagnosis',s:['Shock, denial, anger or fear after the diagnosis','Thoughts about the future that will not stop','Poor sleep, low mood','Worry about the family','Hard to talk to your loved ones'],
  w:'A diagnosis changes your world in a moment. Everything you feel is normal. You do not need to be “strong” all the time — you need not to be alone.',
  aid:'• Write down your questions and take someone with you to appointments\n• Get information from your doctor, not random websites\n• Patient associations — others’ experience helps a lot\n• Share the weight with loved ones\n• Keep small joys and routines',
  note:'Many hospitals have a psychologist for patients — ask for one. If sadness or fear paralyses you → psychiatrist or psychologist.',
  ph:{who:'Aristotle',src:'Nicomachean Ethics, IX 4 and VIII 1',q:'A friend is another self. In poverty and other misfortunes, people think friends their only refuge.',t:'Tell a friend today: “I just want you to keep me company.” They do not need to solve anything.'}}},

{id:'nervbladder',areas:['psy','urine'],sev:'norm',f:2,req:['anxiety','stress_worse','tests_normal'],
 k:[['frequent_urination','urgency'],['anxiety','stress_worse'],['tests_normal']],ctx:[0,0,0],
 el:{n:'Νευρική κύστη (συχνοουρία από άγχος)',s:['Συχνή ανάγκη για ούρηση όταν αγχώνεστε','Χειρότερα πριν από έξοδο, ταξίδι ή σημαντική στιγμή','Λίγα ούρα κάθε φορά','Οι εξετάσεις ούρων είναι καλές'],
  w:'Η κύστη αντιδρά στα νεύρα, όπως και το στομάχι. Είναι ενοχλητικό, αλλά δεν είναι επικίνδυνο — και με εξάσκηση ηρεμεί.',
  aid:'• Μην πηγαίνετε στην τουαλέτα «για σιγουριά» — περιμένετε λίγο\n• Εκπαίδευση κύστης: μεγαλώνετε σιγά σιγά τον χρόνο ανάμεσα\n• Ασκήσεις πυελικού εδάφους (Kegel)\n• Λιγότερος καφές, τσάι, αναψυκτικά, αλκοόλ\n• Αργή αναπνοή όταν έρχεται η ανάγκη',
  note:'Πρώτα γιατρός, για να αποκλειστούν λοίμωξη, σάκχαρο ή προστάτης — ειδικά αν τσούζει, βλέπετε αίμα, διψάτε πολύ ή ξυπνάτε πολλές φορές τη νύχτα.',
  ph:{who:'Ζήνων ο Κιτιεύς (Κύπριος, ιδρυτής της Στοάς)',src:'Διογένης Λαέρτιος, Ζ΄ 26',q:'Το «ευ» γίνεται λίγο λίγο — αλλά δεν είναι καθόλου μικρό πράγμα.',t:'Η βελτίωση έρχεται σταδιακά. Σήμερα κερδίστε μόνο 5 λεπτά ακόμη ανάμεσα στις επισκέψεις στην τουαλέτα.'}},
 en:{n:'Nervous bladder (frequent urination from anxiety)',s:['Frequent need to pass urine when anxious','Worse before going out, travelling or an important moment','Small amounts each time','Urine tests are normal'],
  w:'The bladder reacts to nerves, just like the stomach. It is annoying, but not dangerous — and with practice it calms down.',
  aid:'• Do not go to the toilet “just in case” — wait a little\n• Bladder training: slowly lengthen the time between visits\n• Pelvic floor exercises (Kegel)\n• Less coffee, tea, fizzy drinks, alcohol\n• Slow breathing when the urge comes',
  note:'See a doctor first to rule out infection, diabetes or prostate problems — especially if it stings, you see blood, you are very thirsty or you wake many times at night.',
  ph:{who:'Zeno of Citium (a Cypriot, founder of Stoicism)',src:'Diogenes Laertius, VII 26',q:'Well-being comes little by little — yet it is no little thing.',t:'Improvement comes gradually. Today, gain just 5 more minutes between toilet visits.'}}},

{id:'perfanx',areas:['psy','male'],sev:'norm',f:2,req:['performance_anx','anxiety','stress_worse'],
 k:[['performance_anx'],['erection','low_libido'],['anxiety','stress_worse']],ctx:[0,0,0],
 el:{n:'Άγχος επίδοσης στην ερωτική ζωή',s:['Φόβος ότι «δεν θα τα καταφέρετε»','Δυσκολία στη στύση ή στη διέγερση όταν αγχώνεστε','Αποφυγή της επαφής','Ντροπή, ένταση στο ζευγάρι'],
  w:'Είναι από τα πιο συχνά προβλήματα — και από τα πιο θεραπεύσιμα. Όσο πιο πολύ «προσπαθούμε», τόσο πιο πολύ ξεφεύγει. Η τρυφερότητα χωρίς πίεση είναι το κλειδί.',
  aid:'• Μιλήστε ειλικρινά με τον/τη σύντροφό σας — η σιωπή μεγαλώνει το άγχος\n• Τρυφερότητα χωρίς στόχο: χάδια, αγκαλιά, χωρίς «πρέπει»\n• Λιγότερο αλκοόλ και τσιγάρο\n• Κίνηση, καλός ύπνος, λιγότερο στρες\n• Αναπνοή και χαλάρωση πριν',
  note:'Γιατρός (παθολόγος, ουρολόγος ή γυναικολόγος) για έλεγχο σακχάρου, πίεσης, καρδιάς, ορμονών και φαρμάκων — η δυσκολία στη στύση μπορεί να είναι πρώιμο σημάδι για την καρδιά. Ψυχολόγος ή σεξολόγος βοηθούν πολύ.',
  ph:{who:'Επίκτητος',src:'Εγχειρίδιο, 8',q:'Μη ζητάς να γίνονται τα πράγματα όπως θέλεις, αλλά να θέλεις να γίνονται όπως γίνονται — και η ζωή σου θα κυλά ομαλά.',t:'Αφήστε σήμερα το «αποτέλεσμα» και κρατήστε τη στιγμή: την τρυφερότητα, τη συντροφιά, το γέλιο.'}},
 en:{n:'Performance anxiety in sex',s:['Fear that you “will not manage”','Difficulty with erection or arousal when anxious','Avoiding intimacy','Shame, tension in the couple'],
  w:'It is one of the most common problems — and one of the most treatable. The harder we “try”, the more it slips away. Tenderness without pressure is the key.',
  aid:'• Talk honestly with your partner — silence feeds anxiety\n• Tenderness without a goal: caresses, hugs, no “must”\n• Less alcohol and smoking\n• Exercise, good sleep, less stress\n• Breathing and relaxation beforehand',
  note:'See a doctor (GP, urologist or gynaecologist) to check sugar, blood pressure, heart, hormones and medicines — erection problems can be an early sign of heart disease. A psychologist or sex therapist helps a lot.',
  ph:{who:'Epictetus',src:'Enchiridion, 8',q:'Do not seek for things to happen as you wish, but wish them to happen as they do, and your life will flow well.',t:'Let go of the “result” today and keep the moment: tenderness, companionship, laughter.'}}},

{id:'blushing',areas:['psy','skin'],sev:'norm',f:2,req:['shame_blush'],
 k:[['shame_blush'],['anxiety','sweats'],['low_self','loneliness']],ctx:[0,0,0],
 el:{n:'Κοκκίνισμα και ντροπή',s:['Κοκκινίζετε εύκολα μπροστά σε άλλους','Ιδρώνετε ή τρέμει η φωνή','Φόβος μήπως σας κρίνουν','Αποφεύγετε να μιλήσετε ή να φανείτε'],
  w:'Το κοκκίνισμα είναι σημάδι ευαισθησίας και ειλικρίνειας. Οι άλλοι το προσέχουν πολύ λιγότερο απ’ όσο νομίζετε — και συχνά τους κάνει πιο συμπαθείς.',
  aid:'• Μην παλεύετε το κοκκίνισμα — όσο το πολεμάτε, τόσο μεγαλώνει\n• Στρέψτε την προσοχή στον άλλον και στη συζήτηση, όχι στο πρόσωπό σας\n• Αργή αναπνοή, δροσερό νερό\n• Μικρά βήματα: πείτε μια γνώμη σε μικρή παρέα\n• Χαμογελάστε και πείτε απλά: «κοκκίνισα!»',
  note:'Αν η ντροπή σάς κρατά μακριά από δουλειά, φίλους ή ζωή → ψυχολόγος (κοινωνικό άγχος, που θεραπεύεται).',
  ph:{who:'Πλούταρχος',src:'Περί δυσωπίας',q:'Η υπερβολική ντροπή μοιάζει με αρετή, αλλά μας βλάπτει. Θεραπεύεται με άσκηση, ξεκινώντας από τα μικρά και τα εύκολα.',t:'Ασκηθείτε σήμερα σε κάτι μικρό: ζητήστε μια πληροφορία από έναν άγνωστο ή πείτε τη γνώμη σας σε μια κουβέντα.'}},
 en:{n:'Blushing and shame',s:['You blush easily in front of others','Sweating or a shaky voice','Fear of being judged','You avoid speaking up or being seen'],
  w:'Blushing is a sign of sensitivity and honesty. Others notice it much less than you think — and it often makes you more likeable.',
  aid:'• Do not fight the blush — the more you fight it, the more it grows\n• Focus on the other person and the conversation, not on your face\n• Slow breathing, cool water\n• Small steps: give an opinion in a small group\n• Smile and simply say: “I’m blushing!”',
  note:'If shame keeps you away from work, friends or life → psychologist (social anxiety, which is treatable).',
  ph:{who:'Plutarch',src:'On Compliancy (De vitioso pudore)',q:'Excessive shame looks like a virtue but harms us. It is cured by practice, starting with small and easy things.',t:'Practise something small today: ask a stranger for directions, or say your opinion in a conversation.'}}},

{id:'money',areas:['psy'],sev:'norm',f:3,req:['money_worry'],
 k:[['money_worry'],['anxiety','insomnia'],['overthinking','irritable','family_conflict']],ctx:[0,0,0],
 el:{n:'Οικονομικό άγχος',s:['Συνεχής σκέψη για λογαριασμούς, δάνεια, χρέη','Αϋπνία, ξύπνημα με αγωνία','Ένταση και καβγάδες στο σπίτι','Ντροπή, απομόνωση','Πονοκέφαλος, στομάχι, ταχυπαλμία'],
  w:'Τα οικονομικά βάρη είναι από τα πιο βαριά — και δεν μετρούν την αξία σας ως άνθρωπος. Το να τα κοιτάξετε κατάματα, με ένα σχέδιο, φέρνει ανακούφιση πιο γρήγορα από την αποφυγή.',
  aid:'• Γράψτε σε χαρτί όλα τα έσοδα και τα έξοδα — η ομίχλη φοβίζει περισσότερο από τα νούμερα\n• Ένα πράγμα τη φορά: ποιος λογαριασμός είναι πιο επείγων;\n• Μιλήστε με την τράπεζα πριν καθυστερήσετε — συχνά υπάρχουν ρυθμίσεις\n• Ζητήστε δωρεάν συμβουλή (υπηρεσίες κοινωνικής πρόνοιας, σύλλογοι καταναλωτών)\n• Μοιραστείτε το με την οικογένεια — όχι μόνοι',
  note:'Αν το άγχος φέρνει αϋπνία για εβδομάδες, κατάθλιψη ή σκέψεις απελπισίας → γιατρός ή ψυχίατρος σήμερα. Οι καταστάσεις αλλάζουν· η ζωή σας είναι πολύτιμη.',
  ph:{who:'Επίκουρος',src:'Κύριαι Δόξαι, 15',q:'Ο πλούτος που ζητά η φύση έχει όριο και αποκτάται εύκολα· ο πλούτος των κενών επιθυμιών δεν έχει τέλος.',t:'Γράψτε σήμερα τι χρειάζεστε πραγματικά για να ζείτε καλά — συχνά είναι λιγότερα από όσα φοβόμαστε. Και ένα πράγμα που σας δίνει χαρά χωρίς να κοστίζει.'}},
 en:{n:'Money worries',s:['Constant thoughts about bills, loans, debts','Poor sleep, waking with dread','Tension and rows at home','Shame, isolation','Headache, stomach upset, racing heart'],
  w:'Money burdens are among the heaviest — and they do not measure your worth as a person. Facing them squarely, with a plan, brings relief faster than avoiding them.',
  aid:'• Write all income and expenses on paper — fog frightens more than numbers\n• One thing at a time: which bill is most urgent?\n• Talk to the bank before you fall behind — there are often arrangements\n• Ask for free advice (social welfare services, consumer associations)\n• Share it with the family — not alone',
  note:'If the worry brings weeks of poor sleep, depression or thoughts of despair → doctor or psychiatrist today. Situations change; your life is precious.',
  ph:{who:'Epicurus',src:'Principal Doctrines, 15',q:'The wealth nature asks for is limited and easily obtained; the wealth of empty desires has no end.',t:'Write today what you really need to live well — often less than we fear. And one thing that gives you joy and costs nothing.'}}},

{id:'family',areas:['psy'],sev:'norm',f:3,req:['family_conflict'],
 k:[['family_conflict'],['anger','irritable','sadness'],['anxiety','insomnia','headache']],ctx:[0,0,0],
 el:{n:'Ένταση και συγκρούσεις στην οικογένεια',s:['Συχνοί καβγάδες ή σιωπηλή ένταση','Θυμός, πίκρα, λύπη','Πονοκέφαλος, στομάχι, κακός ύπνος','Δεν μιλάτε με κάποιον δικό σας','Τα παιδιά στη μέση'],
  w:'Οι οικογένειες πονάνε γιατί αγαπιούνται — αλλιώς δεν θα μας ένοιαζε. Δεν χρειάζεται να κερδίσει κανείς. Χρειάζεται να ακουστούν όλοι.',
  aid:'• Μιλήστε όταν είστε ήρεμοι, όχι πάνω στον θυμό\n• Ακούστε πρώτα — επαναλάβετε με δικά σας λόγια τι καταλάβατε ότι είπε ο άλλος\n• «Εγώ νιώθω… όταν…» αντί για «εσύ πάντα…»\n• Ένα πρώτο βήμα: ένα μήνυμα, ένα «σε σκέφτομαι»\n• Οικογενειακή θεραπεία ή διαμεσολάβηση',
  note:'Αν υπάρχει βία, απειλή ή φόβος → ζητήστε βοήθεια αμέσως: επείγει γιατρός (Επείγοντα) · Κύπρος: 1440 (γραμμή για βία στην οικογένεια, 24 ώρες).',
  ph:{who:'Ζήνων ο Κιτιεύς (Κύπριος, ιδρυτής της Στοάς)',src:'Διογένης Λαέρτιος, Ζ΄ 23',q:'Γι’ αυτό έχουμε δύο αυτιά και ένα στόμα: για να ακούμε περισσότερα και να μιλάμε λιγότερα.',t:'Στην επόμενη κουβέντα με τον δικό σας άνθρωπο, ακούστε διπλάσια ώρα απ’ όση μιλάτε.'}},
 en:{n:'Tension and conflict in the family',s:['Frequent rows or silent tension','Anger, bitterness, sadness','Headache, stomach upset, poor sleep','Not speaking with a family member','Children caught in the middle'],
  w:'Families hurt because they love each other — otherwise we would not care. Nobody needs to win. Everyone needs to be heard.',
  aid:'• Talk when you are calm, not in the heat of anger\n• Listen first — repeat in your own words what you understood the other said\n• “I feel… when…” instead of “you always…”\n• A first step: a message, an “I’m thinking of you”\n• Family therapy or mediation',
  note:'If there is violence, threat or fear → seek help now (see “📞 Useful numbers”).',
  ph:{who:'Zeno of Citium (a Cypriot, founder of Stoicism)',src:'Diogenes Laertius, VII 23',q:'We have two ears and one mouth, so that we may listen more and speak less.',t:'In your next talk with your loved one, listen twice as long as you speak.'}}}
];

['cbc','blood','🩸',['Γενική αίματος','Τα κύτταρα του αίματος: ερυθρά (αιμοσφαιρίνη), λευκά και αιμοπετάλια. Δείχνει αναιμία, λοιμώξεις, φλεγμονή, προβλήματα πήξης.','Αιμοληψία από τη φλέβα του χεριού.','Δεν χρειάζεται νηστεία.','Αποτελέσματα συνήθως την ίδια ή την επόμενη μέρα.','Ένα μικρό τσίμπημα.','Αιμοσφαιρίνη: άνδρες περίπου 13,5–17,5 · γυναίκες 12–15,5 g/dL. Λευκά: περίπου 4.000–10.000. Αιμοπετάλια: περίπου 150.000–400.000.','Χαμηλή αιμοσφαιρίνη = αναιμία· ψάχνουμε την αιτία (σίδηρος, Β12, απώλεια αίματος). Μικρά ερυθρά (χαμηλό MCV) στην Κύπρο και την Ελλάδα συχνά σημαίνουν στίγμα μεσογειακής αναιμίας — όχι έλλειψη σιδήρου. Οι τιμές διαφέρουν λίγο από εργαστήριο σε εργαστήριο.'],
