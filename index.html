πριν\n• Όχι καφές μετά το μεσημέρι\n• Αν δεν κοιμηθείτε σε 20 λεπτά, σηκωθείτε και ξαναπροσπαθήστε","note":"Γιατρός αν κρατά πάνω από 3 μήνες. Ελέγξτε για άπνοια, κατάθλιψη, φάρμακα"},"en":{"n":"Insomnia","s":["Trouble falling asleep","Waking often or too early","Tired in the day","Worrying about sleep"],"aid":"• Same bed and wake time\n• No screens 1 hour before\n• No coffee after noon\n• If not asleep in 20 minutes, get up and try again","note":"See a doctor if over 3 months. Check for apnoea, depression, medicines"}},{"id":"burnout","areas":["psy"],"sev":"norm","el":{"n":"Επαγγελματική εξουθένωση (burnout)","s":["Εξάντληση που δεν φεύγει με ξεκούραση","Κυνισμός για τη δουλειά","Μειωμένη απόδοση","Ευερεθιστότητα"],"aid":"• Όρια στο ωράριο\n• Διαλείμματα και διακοπές\n• Κίνηση και ύπνος\n• Μιλήστε με προϊστάμενο ή άνθρωπο εμπιστοσύνης","note":"Γιατρός ή ψυχολόγος — ελέγξτε και για κατάθλιψη"},"en":{"n":"Burnout","s":["Exhaustion that rest does not fix","Cynicism about work","Lower performance","Irritability"],"aid":"• Limits on working hours\n• Breaks and holidays\n• Activity and sleep\n• Talk to a manager or trusted person","note":"GP or psychologist — check for depression too"}},{"id":"ptsd","areas":["psy"],"sev":"caution","el":{"n":"Μετατραυματικό στρες","s":["Αναμνήσεις ή εφιάλτες από τραυματικό γεγονός","Αποφυγή υπενθυμίσεων","Συνεχής επαγρύπνηση","Ευερεθιστότητα"],"aid":"• Ρουτίνα και ασφάλεια\n• Ασκήσεις γείωσης (ονομάστε 5 πράγματα που βλέπετε)","note":"Ψυχολόγος ή ψυχίατρος — υπάρχουν αποτελεσματικές θεραπείες"},"en":{"n":"Post-traumatic stress (PTSD)","s":["Flashbacks or nightmares of a traumatic event","Avoiding reminders","Always on guard","Irritability"],"aid":"• Routine and safety\n• Grounding exercises (name 5 things you see)","note":"Psychologist or psychiatrist — effective treatments exist"}},{"id":"ocd","areas":["psy"],"sev":"caution","el":{"n":"Ιδεοψυχαναγκαστική διαταραχή","s":["Ενοχλητικές σκέψεις που επανέρχονται","Επαναλαμβανόμενες πράξεις (έλεγχοι, πλύσιμο)","Χάνετε ώρα κάθε μέρα"],"aid":"• Μην κρίνετε τον εαυτό σας — είναι πάθηση, όχι χαρακτήρας","note":"Ψυχίατρος ή ψυχολόγος (γνωσιακή-συμπεριφορική θεραπεία)"},"en":{"n":"Obsessive-compulsive disorder (OCD)","s":["Unwanted recurring thoughts","Repeated actions (checking, washing)","Losing time every day"],"aid":"• Do not judge yourself — it is an illness, not character","note":"Psychiatrist or psychologist (CBT)"}},{"id":"bipolar","areas":["psy"],"sev":"risk","el":{"n":"Διπολική διαταραχή","s":["Περίοδοι υπερδιέγερσης με λίγο ύπνο και μεγάλα σχέδια","Ριψοκίνδυνες αποφάσεις, σπατάλες","Εναλλαγή με περιόδους κατάθλιψης"],"aid":"• Σταθερό πρόγραμμα ύπνου\n• Όχι αλκοόλ\n• Οικογένεια ενημερωμένη","note":"Ψυχίατρος. Σκέψεις αυτοτραυματισμού: βοήθεια αμέσως (δείτε τηλέφωνα στήριξης)"},"en":{"n":"Bipolar disorder","s":["Periods of high energy with little sleep and big plans","Risky decisions, overspending","Alternating with periods of depression"],"aid":"• Steady sleep schedule\n• No alcohol\n• Family informed","note":"Psychiatrist. Thoughts of self-harm: get help at once (see support numbers)"}},{"id":"grief","areas":["psy","senior"],"sev":"norm","el":{"n":"Πένθος","s":["Βαθιά λύπη μετά από απώλεια","Κλάματα, αϋπνία","Δυσκολία συγκέντρωσης","Σκέψη του ανθρώπου που χάθηκε"],"aid":"• Επιτρέψτε στον εαυτό σας να θρηνήσει\n• Μιλήστε για τον άνθρωπό σας\n• Μικρές καθημερινές ρουτίνες","note":"Γιατρός ή ψυχολόγος αν μετά από μήνες δεν μπορείτε να λειτουργήσετε ή χάνετε την ελπίδα"},"en":{"n":"Grief","s":["Deep sadness after a loss","Crying, insomnia","Poor concentration","Thinking about the person lost"],"aid":"• Allow yourself to grieve\n• Talk about your loved one\n• Small daily routines","note":"GP or psychologist if after months you cannot function or lose hope"}},{"id":"loneliness","areas":["psy","senior"],"sev":"norm","el":{"n":"Μοναξιά και απομόνωση","s":["Λίγες επαφές με ανθρώπους","Αίσθημα ότι δεν σας καταλαβαίνουν","Λύπη, ανία","Λιγότερη κίνηση"],"aid":"• Ένα τηλεφώνημα κάθε μέρα σε κάποιον\n• Σύλλογοι, ΚΑΠΗ, εθελοντισμός, ενορία\n• Περπάτημα σε κοινόχρηστους χώρους","note":"Η μοναξιά βλάπτει την υγεία όσο και το κάπνισμα. Μιλήστε στον γιατρό σας"},"en":{"n":"Loneliness and isolation","s":["Few contacts with people","Feeling misunderstood","Sadness, boredom","Less activity"],"aid":"• Phone someone every day\n• Clubs, senior centres, volunteering, community groups\n• Walk in shared spaces","note":"Loneliness harms health as much as smoking. Talk to your doctor"}},{"id":"alcohol","areas":["psy","hepat"],"sev":"caution","el":{"n":"Προβληματική χρήση αλκοόλ","s":["Πίνετε περισσότερο από ό,τι θέλατε","Χρειάζεστε ποτό για να ηρεμήσετε","Οι δικοί σας ανησυχούν","Τρέμουλο το πρωί"],"aid":"• Κάντε το τεστ AUDIT-C στην εφαρμογή\n• Μέρες χωρίς αλκοόλ κάθε εβδομάδα","note":"Γιατρός — μη σταματήσετε απότομα αν πίνετε πολύ καθημερινά (κίνδυνος σπασμών)"},"en":{"n":"Problem drinking","s":["Drinking more than intended","Needing a drink to calm down","Family is worried","Morning shakes"],"aid":"• Take the AUDIT-C test in this app\n• Alcohol-free days every week","note":"See a doctor — do not stop suddenly if you drink heavily every day (seizure risk)"}},{"id":"smoking","areas":["psy","resp"],"sev":"norm","el":{"n":"Εξάρτηση από το κάπνισμα","s":["Τσιγάρο μέσα σε 30 λεπτά από το ξύπνημα","Νευρικότητα χωρίς τσιγάρο","Αποτυχημένες προσπάθειες διακοπής"],"aid":"• Ορίστε ημερομηνία διακοπής\n• Υποκατάστατα νικοτίνης από φαρμακείο\n• Αποφύγετε τις «συνήθειες-σκανδάλη»","note":"Γιατρός ή ιατρείο διακοπής καπνίσματος — διπλασιάζει την επιτυχία"},"en":{"n":"Tobacco dependence","s":["Cigarette within 30 minutes of waking","Restless without one","Failed attempts to quit"],"aid":"• Set a quit date\n• Nicotine replacement from the pharmacy\n• Avoid trigger habits","note":"GP or stop-smoking clinic — doubles your chance of success"}},{"id":"delirium","areas":["psy","senior"],"sev":"emer","el":{"n":"Οξεία σύγχυση (παραλήρημα)","s":["Ξαφνική σύγχυση μέσα σε ώρες ή μέρες","Δεν ξέρει πού βρίσκεται","Υπνηλία ή ανησυχία","Βλέπει πράγματα που δεν υπάρχουν"],"aid":"• Γιατρός ή Επείγοντα ΣΗΜΕΡΑ\n• Ήρεμο περιβάλλον, γνώριμα πρόσωπα","note":"Σε ηλικιωμένους συχνά οφείλεται σε λοίμωξη (ουρολοίμωξη, πνευμονία), αφυδάτωση ή φάρμακα. Είναι επείγον"},"en":{"n":"Delirium (sudden confusion)","s":["Sudden confusion over hours or days","Does not know where they are","Drowsy or agitated","Seeing things that are not there"],"aid":"• See a doctor or A&E TODAY\n• Calm setting, familiar faces","note":"In older people often caused by infection (urine, chest), dehydration or medicines. It is urgent"}},{"id":"adhd","areas":["psy"],"sev":"caution","el":{"n":"ΔΕΠΥ σε ενήλικες","s":["Δυσκολία συγκέντρωσης από παιδί","Ξεχνάτε και χάνετε πράγματα","Παρορμητικότητα","Ανυπομονησία","Αναβλητικότητα"],"aid":"• Λίστες και υπενθυμίσεις στο κινητό\n• Μικρά βήματα με διαλείμματα","note":"Ψυχίατρος για αξιολόγηση"},"en":{"n":"Adult ADHD","s":["Trouble focusing since childhood","Forgetting and losing things","Impulsivity","Restlessness","Procrastination"],"aid":"• Lists and phone reminders\n• Small steps with breaks","note":"Psychiatrist for assessment"}},{"id":"eatingdis","areas":["psy"],"sev":"caution","el":{"n":"Διατροφικές διαταραχές","s":["Έντονη ενασχόληση με το φαγητό ή το σώμα","Παράλειψη γευμάτων ή κρυφό φαγητό","Ενοχές μετά το φαγητό","Αλλαγές βάρους"],"aid":"• Μιλήστε σε άνθρωπο εμπιστοσύνης\n• Η βοήθεια νωρίς κάνει μεγάλη διαφορά","note":"Γιατρός ή ειδικός ψυχικής υγείας — υπάρχει θεραπεία και ανάρρωση"},"en":{"n":"Eating disorders","s":["Intense focus on food or body","Skipping meals or secret eating","Guilt after eating","Weight changes"],"aid":"• Talk to someone you trust\n• Early help makes a big difference","note":"GP or mental health specialist — treatment and recovery are possible"}},{"id":"croup","areas":["child","resp"],"sev":"caution","el":{"n":"Ψευδοκρούπ (λαρυγγίτιδα παιδιού)","s":["Βήχας σαν «γάβγισμα φώκιας»","Βραχνή φωνή","Θόρυβος στην εισπνοή","Χειρότερα τη νύχτα"],"aid":"• Κρατήστε το παιδί ήρεμο στην αγκαλιά\n• Δροσερός αέρας (μπαλκόνι, ανοιχτό παράθυρο)","note":"Παιδίατρος. Δυσκολία στην αναπνοή, σάλια, μελάνιασμα: 112"},"en":{"n":"Croup","s":["Barking cough like a seal","Hoarse voice","Noisy breathing in","Worse at night"],"aid":"• Keep the child calm in your arms\n• Cool air (balcony, open window)","note":"Paediatrician. Breathing difficulty, drooling, blue colour: call 112"}},{"id":"bronchiolitis","areas":["child","resp"],"sev":"caution","el":{"n":"Βρογχιολίτιδα (βρέφη)","s":["Βρέφος κάτω των 2 ετών","Βήχας και καταρροή","Γρήγορη αναπνοή","Δυσκολία στο τάισμα"],"aid":"• Πλύσεις μύτης με φυσιολογικό ορό\n• Μικρά συχνά γεύματα","note":"Παιδίατρος. Ρουφούνε τα πλευρά, παύσεις αναπνοής, λίγες βρεγμένες πάνες: Επείγοντα"},"en":{"n":"Bronchiolitis (babies)","s":["Baby under 2","Cough and runny nose","Fast breathing","Trouble feeding"],"aid":"• Saline nose drops\n• Small frequent feeds","note":"Paediatrician. Ribs pulling in, breathing pauses, few wet nappies: go to A&E"}},{"id":"otitismedia","areas":["child","ent"],"sev":"norm","el":{"n":"Μέση ωτίτιδα (παιδί)","s":["Πόνος στο αυτί","Το παιδί τραβά το αυτί","Πυρετός","Κλάμα, κακός ύπνος"],"aid":"• Παυσίπονο/αντιπυρετικό παιδικό στη σωστή δόση για το βάρος\n• Ζέστη έξω από το αυτί","note":"Παιδίατρος αν κρατά πάνω από 2-3 μέρες, βγαίνει υγρό ή είναι κάτω των 6 μηνών"},"en":{"n":"Middle ear infection (child)","s":["Ear pain","Child pulls at the ear","Fever","Crying, poor sleep"],"aid":"• Children’s pain/fever medicine at the right weight dose\n• Warmth outside the ear","note":"Paediatrician if over 2-3 days, discharge, or under 6 months"}},{"id":"hfmd","areas":["child","skin"],"sev":"norm","el":{"n":"Νόσος χεριών-ποδιών-στόματος","s":["Πυρετός","Πληγές στο στόμα","Φουσκαλάκια σε παλάμες και πατούσες","Άρνηση φαγητού"],"aid":"• Δροσερά υγρά και μαλακά φαγητά\n• Πλύσιμο χεριών","note":"Παιδίατρος αν δεν πίνει, έχει λίγα ούρα ή είναι πολύ νυσταγμένο"},"en":{"n":"Hand, foot and mouth disease","s":["Fever","Mouth sores","Small blisters on palms and soles","Refusing food"],"aid":"• Cool fluids and soft foods\n• Hand washing","note":"Paediatrician if not drinking, little urine, or very drowsy"}},{"id":"scarlet","areas":["child"],"sev":"caution","el":{"n":"Οστρακιά","s":["Πονόλαιμος και πυρετός","Εξάνθημα σαν «γυαλόχαρτο»","Γλώσσα σαν «φράουλα»","Κόκκινα μάγουλα"],"aid":"• Παιδίατρος για αντιβίωση\n• Σπίτι μέχρι 24 ώρες μετά την αντιβίωση","note":"Παιδίατρος ΣΥΝΤΟΜΑ"},"en":{"n":"Scarlet fever","s":["Sore throat and fever","“Sandpaper” rash","“Strawberry” tongue","Flushed cheeks"],"aid":"• Paediatrician for antibiotics\n• Stay home until 24 hours after antibiotics","note":"See a paediatrician SOON"}},{"id":"measles","areas":["child","gen"],"sev":"risk","el":{"n":"Ιλαρά","s":["Υψηλός πυρετός","Βήχας, καταρροή, κόκκινα μάτια","Εξάνθημα από το πρόσωπο προς τα κάτω","Λευκά στίγματα μέσα στο στόμα"],"aid":"• Τηλεφωνήστε στον γιατρό ΠΡΙΝ πάτε (είναι πολύ μεταδοτική)\n• Μακριά από έγκυες και βρέφη","note":"Το εμβόλιο MMR προστατεύει. Δύσπνοια, σπασμοί ή υπνηλία: 112"},"en":{"n":"Measles","s":["High fever","Cough, runny nose, red eyes","Rash spreading down from the face","White spots inside the mouth"],"aid":"• Phone the doctor BEFORE going (very contagious)\n• Away from pregnant women and babies","note":"The MMR vaccine protects. Breathlessness, seizures or drowsiness: call 112"}},{"id":"febrileseiz","areas":["child"],"sev":"risk","el":{"n":"Πυρετικοί σπασμοί","s":["Παιδί 6 μηνών-5 ετών με πυρετό","Σπασμοί σώματος","Ματιά στο κενό","Συνήθως κρατά λίγα λεπτά"],"aid":"• Στο πλάι, σε ασφαλές σημείο\n• Τίποτα στο στόμα\n• Μετρήστε τη διάρκεια","note":"112 αν κρατά πάνω από 5 λεπτά ή είναι η πρώτη φορά. Πάντα έλεγχος από παιδίατρο"},"en":{"n":"Febrile seizure","s":["Child 6 months-5 years with fever","Body jerking","Staring","Usually lasts a few minutes"],"aid":"• On the side, in a safe place\n• Nothing in the mouth\n• Time it","note":"Call 112 if over 5 minutes or first time. Always see a paediatrician"}},{"id":"colic","areas":["child"],"sev":"norm","el":{"n":"Κολικοί βρέφους","s":["Βρέφος κάτω των 4 μηνών","Έντονο κλάμα πάνω από 3 ώρες, συχνά απόγευμα","Σφίγγει τα πόδια","Κατά τα άλλα τρώει και παίρνει βάρος"],"aid":"• Κράτημα και λίκνισμα\n• Απαλό μασάζ κοιλιάς\n• Ζητήστε βοήθεια για να ξεκουραστείτε","note":"Παιδίατρος αν έχει πυρετό, εμετό, δεν τρώει ή δεν παίρνει βάρος. ΠΟΤΕ μην κουνάτε δυνατά το μωρό"},"en":{"n":"Infant colic","s":["Baby under 4 months","Intense crying over 3 hours, often evenings","Pulls legs up","Otherwise feeds and gains weight"],"aid":"• Hold and rock\n• Gentle tummy massage\n• Ask for help so you can rest","note":"Paediatrician if fever, vomiting, not feeding or not gaining weight. NEVER shake a baby"}},{"id":"diaperrash","areas":["child","skin"],"sev":"norm","el":{"n":"Σύγκαμα πάνας","s":["Κόκκινο δέρμα στην περιοχή της πάνας","Ερεθισμός","Κλάμα στην αλλαγή"],"aid":"• Συχνές αλλαγές πάνας\n• Χρόνος χωρίς πάνα\n• Κρέμα ψευδαργύρου","note":"Παιδίατρος αν δεν βελτιώνεται σε 3 μέρες ή έχει φουσκάλες"},"en":{"n":"Nappy rash","s":["Red skin in the nappy area","Irritation","Crying at changes"],"aid":"• Frequent nappy changes\n• Nappy-free time\n• Zinc cream","note":"Paediatrician if no better in 3 days or blisters"}},{"id":"teething","areas":["child"],"sev":"norm","el":{"n":"Οδοντοφυΐα","s":["Σάλια","Δαγκώνει τα πάντα","Κόκκινα ούλα","Γκρίνια","Ελαφρά άνοδος θερμοκρασίας"],"aid":"• Κρύος κρίκος οδοντοφυΐας\n• Μασάζ ούλων με καθαρό δάχτυλο","note":"Ο υψηλός πυρετός ή η διάρροια ΔΕΝ οφείλονται στα δόντια — δείτε παιδίατρο"},"en":{"n":"Teething","s":["Drooling","Chewing everything","Red gums","Fussiness","Slight temperature rise"],"aid":"• Cool teething ring\n• Massage gums with a clean finger","note":"High fever or diarrhoea are NOT due to teething — see a paediatrician"}},{"id":"pinworms","areas":["child"],"sev":"norm","el":{"n":"Οξυουρίαση (σκουληκάκια)","s":["Φαγούρα στον πρωκτό τη νύχτα","Ανήσυχος ύπνος","Μικρά άσπρα σκουληκάκια"],"aid":"• Πλύσιμο χεριών, κοντά νύχια\n• Πλύσιμο σεντονιών\n• Θεραπεία όλης της οικογένειας","note":"Φαρμακοποιός ή παιδίατρος"},"en":{"n":"Pinworms (threadworms)","s":["Itchy bottom at night","Restless sleep","Small white worms"],"aid":"• Hand washing, short nails\n• Wash bedding\n• Treat the whole family","note":"Pharmacist or paediatrician"}},{"id":"mumps","areas":["child","gen"],"sev":"caution","el":{"n":"Παρωτίτιδα (μαγουλάδες)","s":["Πρήξιμο κάτω από τα αυτιά","Πόνος στη μάσηση","Πυρετός","Κόπωση"],"aid":"• Μαλακά φαγητά\n• Υγρά\n• Απομόνωση 5 ημέρες","note":"Γιατρός. Το εμβόλιο MMR προστατεύει"},"en":{"n":"Mumps","s":["Swelling below the ears","Pain chewing","Fever","Tiredness"],"aid":"• Soft foods\n• Fluids\n• Isolate for 5 days","note":"See a doctor. The MMR vaccine protects"}},{"id":"roseola","areas":["child","skin"],"sev":"norm","el":{"n":"Ροδάνθη (έκτη νόσος)","s":["Βρέφος ή νήπιο","Υψηλός πυρετός 3 μέρες","Μετά πέφτει ο πυρετός και βγαίνει ροζ εξάνθημα"],"aid":"• Υγρά\n• Αντιπυρετικό στη σωστή δόση","note":"Παιδίατρος για τον πυρετό. Σπασμοί: δείτε «Πυρετικοί σπασμοί»"},"en":{"n":"Roseola","s":["Baby or toddler","High fever for 3 days","Then fever drops and a pink rash appears"],"aid":"• Fluids\n• Fever medicine at the right dose","note":"Paediatrician for the fever. Seizures: see “Febrile seizure”"}},{"id":"newbornjaundice","areas":["child"],"sev":"caution","el":{"n":"Ίκτερος νεογνού","s":["Κίτρινο δέρμα ή μάτια στις πρώτες μέρες","Νυσταγμένο μωρό","Δεν τρώει καλά"],"aid":"• Συχνό τάισμα","note":"Παιδίατρος ΣΗΜΕΡΑ — ειδικά αν ξεκίνησε το πρώτο 24ωρο, κρατά πάνω από 2 εβδομάδες ή κόπρανα είναι άσπρα"},"en":{"n":"Newborn jaundice","s":["Yellow skin or eyes in the first days","Sleepy baby","Feeding poorly"],"aid":"• Frequent feeds","note":"Paediatrician TODAY — especially if in the first 24 hours, over 2 weeks, or pale stools"}},{"id":"falls","areas":["senior","musc"],"sev":"caution","el":{"n":"Πτώσεις και αστάθεια","s":["Πέσατε τον τελευταίο χρόνο","Νιώθετε ασταθής","Φοβάστε μήπως πέσετε","Κρατιέστε από έπιπλα"],"aid":"• Κάντε το τεστ κινδύνου πτώσεων στην εφαρμογή\n• Φως τη νύχτα, όχι χαλάκια, χειρολαβές στο μπάνιο\n• Ασκήσεις ισορροπίας (π.χ. Tai Chi)\n• Ελέγξτε όραση και φάρμακα","note":"Γιατρός — οι πτώσεις έχουν αιτίες που διορθώνονται (φάρμακα, πίεση, όραση, βιταμίνη D)"},"en":{"n":"Falls and unsteadiness","s":["Fell in the past year","Feel unsteady","Afraid of falling","Hold on to furniture"],"aid":"• Take the falls risk test in this app\n• Night light, no loose rugs, bathroom grab bars\n• Balance exercises (e.g. Tai Chi)\n• Check eyesight and medicines","note":"See a doctor — falls have fixable causes (medicines, blood pressure, eyesight, vitamin D)"}},{"id":"polypharmacy","areas":["senior"],"sev":"caution","el":{"n":"Πολλά φάρμακα μαζί","s":["Παίρνετε 5 ή περισσότερα φάρμακα","Ζάλη, υπνηλία ή σύγχυση","Νέα συμπτώματα μετά από νέο φάρμακο","Διαφορετικοί γιατροί γράφουν φάρμακα"],"aid":"• Γράψτε όλα σας τα φάρμακα στο «Για τον γιατρό»\n• Πάρτε όλα τα κουτιά στον γιατρό μία φορά τον χρόνο\n• Ρωτάτε τον φαρμακοποιό πριν από κάθε νέο σκεύασμα ή βότανο","note":"Γιατρός για αναθεώρηση φαρμάκων. Μη σταματάτε φάρμακα μόνοι σας"},"en":{"n":"Taking many medicines","s":["Taking 5 or more medicines","Dizziness, drowsiness or confusion","New symptoms after a new medicine","Several doctors prescribing"],"aid":"• List all your medicines in “For the doctor”\n• Take all boxes to the doctor once a year\n• Ask the pharmacist before any new product or herb","note":"See a doctor for a medicines review. Do not stop medicines on your own"}},{"id":"frailty","areas":["senior"],"sev":"caution","el":{"n":"Ευθραυστότητα και απώλεια μυών","s":["Αδυναμία και πιο αργό περπάτημα","Απώλεια βάρους χωρίς λόγο","Κούραση","Δυσκολία να σηκωθείτε από καρέκλα"],"aid":"• Πρωτεΐνη σε κάθε γεύμα (αυγό, γιαούρτι, όσπρια, ψάρι)\n• Ασκήσεις δύναμης: σηκωθείτε-καθίστε από καρέκλα 10 φορές\n• Περπάτημα κάθε μέρα","note":"Γιατρός — η άσκηση και η διατροφή την αναστρέφουν σε μεγάλο βαθμό"},"en":{"n":"Frailty and muscle loss","s":["Weakness and slower walking","Unintended weight loss","Tiredness","Hard to get up from a chair"],"aid":"• Protein at every meal (egg, yoghurt, pulses, fish)\n• Strength exercise: sit-to-stand 10 times\n• Walk every day","note":"See a doctor — exercise and nutrition can largely reverse it"}},{"id":"heatstroke","areas":["gen","senior"],"sev":"emer","el":{"n":"Θερμοπληξία","s":["Πολύ ζεστό δέρμα","Σύγχυση ή παράξενη συμπεριφορά","Πονοκέφαλος, ζάλη","Ναυτία, εμετός","Λιποθυμία"],"aid":"• ΚΑΛΕΣΤΕ 112\n• Μεταφορά σε σκιά ή κλιματισμό\n• Δροσίστε με νερό και ανεμιστήρα, κρύες κομπρέσες σε μασχάλες και βουβωνική χώρα\n• Νερό μόνο αν είναι πλήρως ξύπνιος","note":"Στον καύσωνα: νερό συχνά, όχι έξοδος 11:00-17:00, ελέγχετε τους ηλικιωμένους γείτονες"},"en":{"n":"Heat stroke","s":["Very hot skin","Confusion or strange behaviour","Headache, dizziness","Nausea, vomiting","Fainting"],"aid":"• CALL 112\n• Move to shade or air conditioning\n• Cool with water and a fan, cold packs in armpits and groin\n• Water only if fully awake","note":"In a heatwave: drink often, stay in 11:00-17:00, check on older neighbours"}},{"id":"heatexhaust","areas":["gen","senior"],"sev":"caution","el":{"n":"Θερμική εξάντληση","s":["Έντονη εφίδρωση","Κούραση και αδυναμία","Ζάλη","Ναυτία","Κράμπες"],"aid":"• Δροσερό μέρος, ξάπλωμα με πόδια ψηλά\n• Νερό ή διάλυμα ενυδάτωσης\n• Δροσερό πανί","note":"Αν δεν βελτιωθεί σε 30 λεπτά ή εμφανιστεί σύγχυση: 112 (θερμοπληξία)"},"en":{"n":"Heat exhaustion","s":["Heavy sweating","Tiredness and weakness","Dizziness","Nausea","Cramps"],"aid":"• Cool place, lie down with legs raised\n• Water or rehydration drink\n• Cool cloth","note":"If not better in 30 minutes or confusion appears: call 112 (heat stroke)"}},{"id":"hypothermia","areas":["gen","senior"],"sev":"risk","el":{"n":"Υποθερμία","s":["Τρέμουλο (που μπορεί να σταματήσει)","Κρύο, χλωμό δέρμα","Σύγχυση, υπνηλία","Αργή ομιλία"],"aid":"• Ζεστό μέρος, στεγνά ρούχα, κουβέρτες\n• Ζεστό ρόφημα αν είναι ξύπνιος\n• Όχι αλκοόλ, όχι καυτό μπάνιο","note":"Σύγχυση ή υπνηλία: 112. Οι ηλικιωμένοι σε κρύα σπίτια κινδυνεύουν"},"en":{"n":"Hypothermia","s":["Shivering (may stop)","Cold, pale skin","Confusion, drowsiness","Slurred speech"],"aid":"• Warm place, dry clothes, blankets\n• Warm drink if awake\n• No alcohol, no hot bath","note":"Confusion or drowsiness: call 112. Older people in cold homes are at risk"}},{"id":"anaphylaxis","areas":["gen","skin"],"sev":"emer","el":{"n":"Αναφυλαξία (σοβαρή αλλεργική αντίδραση)","s":["Πρήξιμο σε χείλη, γλώσσα ή λαιμό","Δύσπνοια ή σφύριγμα","Κνίδωση σε όλο το σώμα","Ζάλη ή λιποθυμία","Μετά από φαγητό, τσίμπημα ή φάρμακο"],"aid":"• Αν έχει ένεση αδρεναλίνης: ΤΩΡΑ στον μηρό\n• ΚΑΛΕΣΤΕ 112\n• Ξαπλωμένος με πόδια ψηλά (καθιστός αν δυσκολεύεται να αναπνεύσει)","note":"Μετά: Αλλεργιολόγος. Κρατάτε πάντα μαζί την ένεση αν σας έχει γραφτεί"},"en":{"n":"Anaphylaxis (severe allergic reaction)","s":["Swelling of lips, tongue or throat","Breathlessness or wheeze","Hives all over","Dizziness or fainting","After food, sting or medicine"],"aid":"• If they have an adrenaline pen: use it NOW in the thigh\n• CALL 112\n• Lie down with legs raised (sit if struggling to breathe)","note":"Afterwards: allergist. Always carry your pen if prescribed"}},{"id":"sepsis","areas":["gen","senior"],"sev":"emer","el":{"n":"Σήψη (σοβαρή λοίμωξη)","s":["Πυρετός ή πολύ χαμηλή θερμοκρασία","Σύγχυση","Πολύ γρήγορη αναπνοή","Γκριζωπό, μαρμαρωμένο δέρμα","Δεν έχει ουρήσει όλη μέρα","«Νιώθω ότι θα πεθάνω»"],"aid":"• ΚΑΛΕΣΤΕ 112 και πείτε «υποψία σήψης»","note":"Κάθε ώρα μετράει. Πιο συχνή σε ηλικιωμένους, διαβητικούς, μετά από επέμβαση"},"en":{"n":"Sepsis (severe infection)","s":["Fever or very low temperature","Confusion","Very fast breathing","Grey, mottled skin","No urine all day","“I feel like I might die”"],"aid":"• CALL 112 and say “suspected sepsis”","note":"Every hour counts. More common in older people, diabetics, after surgery"}},{"id":"fatigue","areas":["gen"],"sev":"caution","el":{"n":"Χρόνια κόπωση","s":["Κούραση για εβδομάδες που δεν φεύγει με ύπνο","Δυσκολία στη συγκέντρωση","Αδυναμία"],"aid":"• Τακτικός ύπνος\n• Ήπια κίνηση\n• Ημερολόγιο ενέργειας","note":"Γιατρός για εξετάσεις: αναιμία, θυρεοειδής, σάκχαρο, Β12, βιταμίνη D, κατάθλιψη, άπνοια"},"en":{"n":"Long-term tiredness","s":["Tired for weeks, not fixed by sleep","Poor concentration","Weakness"],"aid":"• Regular sleep\n• Gentle activity\n• Energy diary","note":"See a doctor for tests: anaemia, thyroid, sugar, B12, vitamin D, depression, apnoea"}},{"id":"weightloss","areas":["gen","senior"],"sev":"risk","el":{"n":"Απώλεια βάρους χωρίς λόγο","s":["Χάσατε πάνω από 5% του βάρους σε 6-12 μήνες χωρίς δίαιτα","Μειωμένη όρεξη","Κόπωση","Νυχτερινές εφιδρώσεις"],"aid":"• Ζυγιστείτε και σημειώστε στο «Ημερολόγιο υγείας»","note":"Γιατρός ΣΥΝΤΟΜΑ — χρειάζεται έλεγχος για την αιτία"},"en":{"n":"Unexplained weight loss","s":["Lost over 5% of weight in 6-12 months without trying","Reduced appetite","Tiredness","Night sweats"],"aid":"• Weigh yourself and note it in the “Health diary”","note":"See a doctor SOON — the cause needs checking"}},{"id":"mono","areas":["gen","ent"],"sev":"caution","el":{"n":"Λοιμώδης μονοπυρήνωση","s":["Πολύ έντονος πονόλαιμος","Πυρετός","Πρησμένοι αδένες στον λαιμό","Μεγάλη κόπωση για εβδομάδες"],"aid":"• Ξεκούραση\n• Υγρά\n• Όχι επαφή-αθλήματα για 4 εβδομάδες (σπλήνας)","note":"Γιατρός. Δυσκολία στην αναπνοή ή κατάποση, ή πόνος αριστερά στην κοιλιά: Επείγοντα"},"en":{"n":"Glandular fever (mono)","s":["Very severe sore throat","Fever","Swollen neck glands","Great tiredness for weeks"],"aid":"• Rest\n• Fluids\n• No contact sports for 4 weeks (spleen)","note":"See a doctor. Breathing or swallowing difficulty, or left abdominal pain: go to A&E"}},{"id":"foodallergy","areas":["gen","skin"],"sev":"caution","el":{"n":"Τροφική αλλεργία","s":["Φαγούρα στο στόμα μετά από φαγητό","Κνίδωση","Πρήξιμο χειλιών","Εμετός ή κοιλόπονος"],"aid":"• Σημειώστε τι φάγατε\n• Διαβάζετε ετικέτες","note":"Αλλεργιολόγος. Δύσπνοια ή πρήξιμο λαιμού: 112 (αναφυλαξία)"},"en":{"n":"Food allergy","s":["Itchy mouth after eating","Hives","Swollen lips","Vomiting or stomach pain"],"aid":"• Note what you ate\n• Read labels","note":"Allergist. Breathlessness or throat swelling: call 112 (anaphylaxis)"}},{"id":"poisoning","areas":["gen","child"],"sev":"emer","el":{"n":"Δηλητηρίαση ή κατάποση ουσίας","s":["Κατάποση φαρμάκων, καθαριστικών ή φυτών","Εμετός","Υπνηλία ή σύγχυση","Εγκαύματα στο στόμα"],"aid":"• ΜΗΝ προκαλέσετε εμετό\n• Κρατήστε τη συσκευασία\n• Αναίσθητος ή δυσκολία αναπνοής: 112\n• Ελλάδα: Κέντρο Δηλητηριάσεων 210 7793777","note":"Φυλάτε φάρμακα και χημικά ψηλά, κλειδωμένα, μακριά από παιδιά"},"en":{"n":"Poisoning or swallowing a substance","s":["Swallowed medicines, cleaners or plants","Vomiting","Drowsiness or confusion","Burns in the mouth"],"aid":"• Do NOT induce vomiting\n• Keep the packaging\n• Unconscious or breathing difficulty: call 112\n• Greece: Poison Centre +30 210 7793777","note":"Keep medicines and chemicals high, locked, away from children"}},{"id":"carbonmono","areas":["gen"],"sev":"emer","el":{"n":"Δηλητηρίαση από μονοξείδιο του άνθρακα","s":["Πονοκέφαλος, ζάλη, ναυτία","Πολλοί στο ίδιο σπίτι έχουν συμπτώματα","Χειρότερα μέσα στο σπίτι, καλύτερα έξω","Μαγκάλι, σόμπα, θερμοσίφωνας γκαζιού"],"aid":"• Βγείτε ΑΜΕΣΑ έξω\n• Ανοίξτε παράθυρα\n• ΚΑΛΕΣΤΕ 112","note":"Ποτέ μαγκάλι ή γεννήτρια σε κλειστό χώρο. Βάλτε ανιχνευτή μονοξειδίου"},"en":{"n":"Carbon monoxide poisoning","s":["Headache, dizziness, nausea","Several people in the home have symptoms","Worse indoors, better outside","Brazier, stove, gas water heater"],"aid":"• Get outside AT ONCE\n• Open windows\n• CALL 112","note":"Never use a brazier or generator indoors. Fit a CO detector"}},{"id":"snakebite","areas":["gen"],"sev":"emer","el":{"n": /* ---------------- ΚΕΦΑΛΙΔΑ & ΔΙΑΔΡΟΜΕΣ ---------------- */
function header(title){
  const inner=!!title;
  return `<header class="bar${inner?' inner':''}">
   ${inner?`<button class="home" onclick="go('')" aria-label="${t('home')}">🏠<span>${t('home')}</span></button>`:''}
   <div class="brand">${inner?'':'<img src="icon-192.png" alt="">'}<div><b>${inner?esc(title):t('app')}</b><small>${t('sub')}</small></div></div>
   ${inner?`<a class="ic sos" href="tel:112" aria-label="112">📞 112</a>`:`<button class="ic" onclick="toggleLang()" aria-label="Language">${LANG==='el'?'EN':'ΕΛ'}</button>
   <button class="ic" onclick="toggleTheme()" aria-label="Theme">${document.documentElement.classList.contains('dark')?'☀️':'🌙'}</button>`}
  </header>`;
}
function go(h){location.hash=h?'#'+h:'#'; if(!h)render()}
window.addEventListener('hashchange',render);
function render(){
  const h=decodeURIComponent(location.hash.slice(1));const [r,arg]=h.split('/');
  document.documentElement.lang=LANG;
  const V={'':vHome,describe:vDescribe,body:vBody,area:vArea,results:vResults,signs:vSigns,tests:vTests,test:vTest,tool:vTool,checkups:vCheckups,diary:vDiary,doctor:vDoctor,photos:vPhotos,all:vAll,c:vCond,sources:vSources,help:vHelp};
  const f=V[r]||vHome;closeSheet();
  $('#app').innerHTML=f(arg);
  window.scrollTo(0,0);
  if(f.after)f.after(arg);
}
function toggleLang(){LANG=LANG==='el'?'en':'el';store.set('lang',LANG);render()}
function toggleTheme(){const d=document.documentElement.classList.toggle('dark');store.set('theme',d?'dark':'light');render()}

/* ---------------- ΑΡΧΙΚΗ ---------------- */
function vHome(){
  const tiles=[['describe','💬',1],['body','🧍',2],['signs','🔔',3],['tests','📋',4],['checkups','🩺',5],['diary','📈',6],['doctor','🗒️',7],['photos','📸',8],['all','📚',9]];

  <a class="sosbig" href="tel:112"><span class="n">112</span><div><b>${t('call')}</b><span>${t('callsub')}</span></div></a>
  <nav class="tiles">${tiles.map(([r,e,n])=>`<a class="tile t${n}" href="#${r}"><span class="e">${e}</span><b>${t('t'+n)}</b><small>${t('t'+n+'s')}</small></a>`).join('')}</nav>
  <div class="minilinks"><button onclick="go('help')">❓ ${t('help')}</button><button onclick="go('sources')">📚 ${t('sources')}</button></div>
  <p class="disc">${t('disc')}</p>`;
}

/* ---------------- ΠΕΡΙΓΡΑΦΗ ---------------- */
function vDescribe(){
  const sr=window.SpeechRecognition||window.webkitSpeechRecognition;
  return header(t('t1'))+`<div class="card top">
   <h2>💬 ${t('t1')}</h2>
   <p class="lead">${L('Γράψτε όπως μιλάτε: πού πονάει, από πότε, τι άλλο νιώθετε. Μην ανησυχείτε για την ορθογραφία — θα σας καταλάβουμε.','Write the way you speak: where it hurts, since when, what else you feel. Do not worry about spelling — we will understand.')}</p>
   <textarea id="nl" placeholder="${L('π.χ. Από χθες πονάει το κεφάλι μου, έχω ναυτία και με ενοχλεί το φως…','e.g. Since yesterday my head hurts, I feel sick and light bothers me…')}">${esc(LAST&&LAST.mode==='text'?LAST.input:'')}</textarea>
   <div class="sp"></div>
   <div class="chips quick">${t('chips').map(c=>`<button class="chip" onclick="addChip(this)">${esc(c)}</button>`).join('')}</div>
  </div>
  <div class="dock">${sr?`<button class="btn violet" id="micBtn" onclick="listen()">🎤 ${t('speak')}</button>`:''}

   <button class="btn ghost small" onclick="$('#nl').value='';$('#nl').focus()">🗑️</button></div>`;
}
function addChip(b){const ta=$('#nl');ta.value=(ta.value.trim()?ta.value.trim()+', ':'')+b.textContent;b.classList.add('on')}
function listen(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
  const r=new SR();r.lang=LANG==='el'?'el-GR':'en-GB';r.interimResults=false;
  const b=$('#micBtn');b.textContent='🎙️ '+t('listening');
  r.onresult=e=>{const txt=e.results[0][0].transcript;const ta=$('#nl');ta.value=(ta.value.trim()?ta.value.trim()+' ':'')+txt};
  r.onend=()=>{b.textContent='🎤 '+t('speak')};r.onerror=r.onend;r.start();
}
function doAnalyze(){
  const txt=$('#nl').value.trim();if(!txt){$('#nl').focus();return}
  const res=analyzeText(txt);
  LAST={mode:'text',input:txt,list:res.list,words:res.words,date:Date.now()};store.set('last',LAST);go('results');
}

function vBody(){

  </div></div>`;
}
function bodySVG(){

   ${z('head','<circle cx="100" cy="42" r="32" fill="#f87171"/>')}
   ${z('ent','<rect x="86" y="72" width="28" height="22" rx="8" fill="#f472b6"/>')}
   ${z('chest','<path d="M58 94 H142 Q150 94 150 104 V160 H50 V104 Q50 94 58 94Z" fill="#fb7185"/>')}
   ${z('belly','<rect x="52" y="160" width="96" height="58" rx="6" fill="#fbbf24"/>')}
   ${z('pelvis','<path d="M52 218 H148 V246 Q100 270 52 246Z" fill="#60a5fa"/>')}
   ${z('musc','<path d="M50 100 L24 196 L36 200 L60 120Z" fill="#fb923c"/>')}
   ${z('musc','<path d="M150 100 L176 196 L164 200 L140 120Z" fill="#fb923c"/>')}
   ${z('musc','<path d="M60 250 L56 400 H86 L96 262Z" fill="#fb923c"/>')}
   ${z('musc','<path d="M140 250 L144 400 H114 L104 262Z" fill="#fb923c"/>')}
   <g font-size="22" text-anchor="middle" pointer-events="none"><text x="100" y="50">🧠</text><text x="100" y="134">❤️</text><text x="100" y="196">🫃</text><text x="100" y="244">💧</text><text x="72" y="330">🦴</text><text x="128" y="330">🦴</text></g>
  </svg>`;
}
function bodyTap(z){
  const map={chest:['cardio','resp'],belly:['gastro','hepat','endo'],pelvis:['urine','gyn','male']};
  if(!map[z])return go('area/'+z);
  sheet(`<h3>${t('choose')}</h3><div class="opts">${map[z].map(a=>`<button class="area" style="${grad(a)}" onclick="closeSheet();go('area/${a}')"><span class="e">${AREA[a][1]}</span><span>${areaName(a)}</span></button>`).join('')}
   <button class="btn ghost" onclick="closeSheet()">✖</button></div>`);
}
function sheet(html){const d=document.createElement('div');d.className='sheet';d.id='sheet';d.innerHTML=`<div class="box">${html}</div>`;d.onclick=e=>{if(e.target===d)closeSheet()};document.body.appendChild(d)}
function closeSheet(){const s=$('#sheet');if(s)s.remove()}

function areaSyms(area){
  const map=new Map();
  COND.filter(c=>c.areas.includes(area)).forEach(c=>D(c).s.forEach((s,i)=>{const k=norm(s).trim();if(!map.has(k))map.set(k,{txt:s,refs:[]});map.get(k).refs.push([c.id,i])}));
  return [...map.entries()].map(([k,v])=>({k,...v}));
}
function vArea(id){
  if(!AREA[id])return vBody();
  if(curArea!==id){SEL=new Set();FILTER='';curArea=id}
  const n=COND.filter(c=>c.areas.includes(id)).length;
  return header(areaName(id))+`<div class="card top">
   <h2>${AREA[id][1]} ${areaName(id)}</h2>
   <p class="lead">${L('Πατήστε όσα συμπτώματα έχετε και μετά «Έλεγχος».','Tap all the symptoms you have, then “Check”.')} <span class="muted">(${n} ${t('conds')})</span></p>
   <input type="search" id="flt" placeholder="${t('filter')}" value="${esc(FILTER)}" oninput="FILTER=this.value;drawChips()">
   <div class="sp"></div><div class="chipbox"><div class="chips" id="chips"></div></div>
  </div>
  <div class="dock"><button class="btn ghost small" onclick="go('body')">↩ ${t('back')}</button><button class="btn" id="chkBtn" onclick="doCheck()">🔍 ${t('check')}</button></div>`;
}
vArea.after=()=>drawChips();
function drawChips(){
  const all=areaSyms(curArea);const f=norm(FILTER).trim();
  const list=f?all.filter(s=>s.k.includes(f)||fuzzyHas(s.k,f)):all;
  $('#chips').innerHTML=list.map(s=>`<button class="chip${SEL.has(s.k)?' on':''}" onclick="togSym(this,'${s.k.replace(/'/g,'')}')">${esc(s.txt)}</button>`).join('')||`<p class="muted">—</p>`;
  updChk();
}
function togSym(b,k){if(SEL.has(k))SEL.delete(k);else SEL.add(k);b.classList.toggle('on');updChk()}
function updChk(){const b=$('#chkBtn');if(!b)return;b.innerHTML=`🔍 ${t('check')}${SEL.size?` (${SEL.size})`:''}`;b.disabled=!SEL.size}
function doCheck(){
  if(!SEL.size)return;
  const all=areaSyms(curArea).filter(s=>SEL.has(s.k));const per={};
  all.forEach(s=>s.refs.forEach(([cid,i])=>{(per[cid]=per[cid]||new Set()).add(i)}));
  const out=Object.entries(per).map(([id,set])=>{const c=CBYID[id];const pc=Math.round(100*set.size/D(c).s.length);return {id,syms:[...set],score:set.size+pc/100,pc}});
  LAST={mode:'area',area:curArea,input:all.map(s=>s.txt).join(', '),list:rank(out),words:[],date:Date.now()};store.set('last',LAST);go('results');
}

/* ---------------- ΑΠΟΤΕΛΕΣΜΑΤΑ ---------------- */
function condCard(r,open){
  const c=CBYID[r.id];if(!c)return '';const d=D(c);
  const ms=r.syms&&r.syms.length?`<div class="matched">✔️ ${t('yours')}: ${r.syms.map(i=>`<mark>${esc(d.s[i])}</mark>`).join(' ')}</div>`:'';
  return `<div class="card res ${c.sev}${open?' open':''}" onclick="if(!event.target.closest('a,button'))this.classList.toggle('open')">
   <div class="hd"><div><h3>${esc(d.n)}</h3><span class="tag ${c.sev}">${t('sev')[c.sev]}</span>${r.pc!=null?`<span class="tag pc">${r.pc}% ${t('match')}</span>`:''}</div><span class="arrow">▼</span></div>
   ${ms}<div class="body">${condBody(c)}</div></div>`;
}
function condBody(c){
  const d=D(c);const en=c.en.n.split(/\s[—(]/)[0];
  return `${c.sev==='emer'?`<a class="alert112" href="tel:112"><span class="n">112</span>${L('Πατήστε για κλήση τώρα','Tap to call now')}</a>`:''}
   <div class="sec"><b>📋 ${t('syms')}</b>${d.s.map(esc).join(' · ')}</div>
   <div class="sec"><b>🆘 ${t('aid')}</b>${esc(d.aid).replace(/\n/g,'<br>')}</div>
   ${d.med?`<div class="sec warn"><b>💊 ${t('meds')}</b>${d.med.map(esc).join(' · ')}<br><small>⚠️ ${t('medwarn')}</small></div>`:''}
   <div class="sec"><b>👩‍⚕️ ${t('note')}</b>${esc(d.note)}</div>
   <div class="sec srcs"><b>📚 ${t('more')}</b><a href="https://www.nhs.uk/search/?q=${encodeURIComponent(en)}" target="_blank" rel="noopener">NHS 🔗</a><a href="https://medlineplus.gov/search/?query=${encodeURIComponent(en)}" target="_blank" rel="noopener">MedlinePlus 🔗</a><a href="https://www.mayoclinic.org/search/search-results?q=${encodeURIComponent(en)}" target="_blank" rel="noopener">Mayo Clinic 🔗</a></div>
   <p class="muted" style="margin-top:8px">${t('areaLbl')}: ${c.areas.map(a=>`<a href="#area/${a}">${AREA[a][1]} ${areaName(a)}</a>`).join(' · ')}</p>`;
}
function vResults(){
  if(!LAST)return vDescribe();
  const list=LAST.list||[];const emer=list.slice(0,5).some(r=>CBYID[r.id]&&CBYID[r.id].sev==='emer'&&(r.syms.length>=2||r.pc>=40));
  const backTo=LAST.mode==='area'?`area/${LAST.area}`:'describe';
  return header(t('results'))+`
   ${emer?`<a class="alert112" href="tel:112"><span class="n">112</span>${t('emerTop')}</a>`:''}
   <div class="card top"><h2>📋 ${t('results')}</h2><p class="muted">“${esc(LAST.input).slice(0,220)}”</p>
   ${LAST.words&&LAST.words.length?`<p class="matched">${t('recog')}: ${LAST.words.slice(0,12).map(w=>`<mark>${esc(w)}</mark>`).join(' ')}</p>`:''}
   <p class="muted" style="margin-top:6px">${L('Πατήστε μια κάρτα για να δείτε τι να κάνετε.','Tap a card to see what to do.')}</p></div>
   ${list.length?list.map((r,i)=>condCard(r,i===0)).join(''):`<div class="card"><p>${t('nomatch')}</p></div>`}
   <p class="disc">${t('disc')}</p>
   <div class="dock"><button class="btn ghost small" onclick="go('${backTo}')">↩ ${t('back')}</button><button class="btn orange" onclick="saveForDoc(this)">🗒️ ${t('savedoc')}</button></div>`;
}
function saveForDoc(b){
  if(!LAST)return;const arr=store.get('checks',[]);
  arr.unshift({date:LAST.date,input:LAST.input,top:(LAST.list||[]).slice(0,3).map(r=>r.id)});store.set('checks',arr.slice(0,8));
  const doc=store.get('doc',{});if(!doc.feel){doc.feel=LAST.input;store.set('doc',doc)}
  b.textContent=t('saved');b.disabled=true;
}

/* ---------------- ΤΕΣΤ ---------------- */
function vTests(){
  const res=store.get('tests',{});
  return header(t('t4'))+`<div class="card top"><h2>📋 ${t('tests')}</h2><p class="lead">${t('testsLead')}</p>
   <div class="tcards">${TESTS.map(x=>{const d=x[LANG];const r=res[x.id];return `<button class="tcard" style="--c:${x.c}" onclick="startTest('${x.id}')"><span class="e">${x.i}</span><span><b>${d.t}</b><small>${r?`✔️ ${r.score} — ${esc(r.txt)}`:d.d}</small></span></button>`}).join('')}</div></div>
   <div class="card"><h2>📏 ${t('tools')}</h2><div class="tcards">
    <button class="tcard" style="--c:#14b8a6" onclick="go('tool/bmi')"><span class="e">⚖️</span><span><b>${t('bmi')}</b><small>${t('bmis')}</small></span></button>
    <button class="tcard" style="--c:#e11d48" onclick="go('tool/bp')"><span class="e">🩺</span><span><b>${t('bp')}</b><small>${t('bps')}</small></span></button></div></div>`;
}
function startTest(id){TST={id,ans:[],step:0};go('test/'+id)}
function vTest(id){
  const x=TESTS.find(z=>z.id===id);if(!x)return vTests();
  if(!TST||TST.id!==id)TST={id,ans:[],step:0};
  const d=x[LANG];const n=x.q.length;
  if(TST.step>=n)return testResult(x);
  const q=x.q[TST.step];const qt=LANG==='el'?q.el:q.en;
  let opts;
  if(x.yn)opts=[[t('yes'),t('yes'),q.p||1,'yes'],[t('no'),t('no'),0,'no']];
  else if(x.scale)opts=x.scale.map(o=>[o[0],o[1],o[2],'']);
  else opts=q.o.map(o=>[o[0],o[1],o[2],'']);
  const cur=TST.ans[TST.step];
  return header(d.t)+`<div class="card top">
   <p class="muted">${x.i} ${d.t} · ${t('q')} ${TST.step+1} ${t('of')} ${n}</p>
   <div class="prog"><i style="width:${Math.round(100*TST.step/n)}%"></i></div>
   ${TST.step===0&&x.scale?`<p class="muted" style="margin-bottom:8px">${esc(d.d)}</p>`:''}
   <div class="qtext">${esc(qt)}</div>
   ${q.bmi?`<div class="grid2"><input type="number" id="bh" inputmode="decimal" placeholder="${t('height')}"><input type="number" id="bw" inputmode="decimal" placeholder="${t('weight')}"></div><button class="btn small violet" style="margin:10px 0" onclick="bmiPick()">🧮 ${t('calc')}</button>`:''}
   <div class="opts">${opts.map((o,i)=>`<button class="opt ${o[3]}${cur&&cur.i===i?' on':''}" onclick="answer(${i},${o[2]})">${esc(LANG==='el'?o[0]:o[1])}</button>`).join('')}</div>
  </div>
  <div class="dock"><button class="btn ghost small" onclick="${TST.step?'TST.step--;render()':`go('tests')`}">↩ ${TST.step?t('prev'):t('back')}</button></div>`;
}
function bmiPick(){const h=+$('#bh').value/100,w=+$('#bw').value;if(!h||!w)return;const b=w/(h*h);answer(b<25?0:b<=30?1:2,b<25?0:b<=30?1:3)}
function answer(i,p){TST.ans[TST.step]={i,p};TST.step++;render()}
function testResult(x){
  const d=x[LANG];const score=TST.ans.reduce((a,b)=>a+b.p,0);
  const r=x.r.find(z=>score>=z[0]&&score<=z[1])||x.r[x.r.length-1];const txt=LANG==='el'?r[3]:r[4];
  const res=store.get('tests',{});res[x.id]={score,txt,date:Date.now(),title:d.t};store.set('tests',res);
  const crisis=x.id==='phq9'&&x.q.some((q,i)=>q.crisis&&TST.ans[i]&&TST.ans[i].p>0);
  return header(d.t)+`
   ${crisis?`<div class="crisis"><b>💜 ${t('crisis')}</b><p style="margin-top:8px">📞 <a href="tel:112">112</a> · 🇬🇷 ${L('Γραμμή Παρέμβασης για την Αυτοκτονία','Suicide Prevention Line')} <a href="tel:1018">1018</a> · 🇨🇾 Cyprus Samaritans <a href="tel:80007773">8000 7773</a></p></div>`:''}
   <div class="gauge ${r[2]}"><div>${x.i} ${t('score')}</div><div class="sc">${score}</div><p>${esc(txt)}</p></div>
   <div class="card"><p>ℹ️ ${t('testnote')}</p><p class="muted" style="margin-top:6px">${esc(d.src)}</p></div>
   <div class="dock"><button class="btn ghost small" onclick="go('tests')">📋 ${t('alltests')}</button><button class="btn" onclick="startTest('${x.id}')">🔄 ${t('retake')}</button></div>`;
}
function vTool(k){
  if(k==='bmi')return header(t('bmi'))+`<div class="card top"><h2>⚖️ ${t('bmi')}</h2>
   <div class="grid2"><div><label class="f">${t('height')}</label><input type="number" id="h" inputmode="decimal" value="${esc(store.get('height',''))}"></div><div><label class="f">${t('weight')}</label><input type="number" id="w" inputmode="decimal"></div></div>
   <div class="sp"></div><button class="btn wide" onclick="calcBMI()">🧮 ${t('calc')}</button><div class="sp"></div><div id="out"></div>
   <p class="muted">${L('Ο ΔΜΣ είναι γενικός δείκτης — δεν ισχύει το ίδιο για αθλητές, ηλικιωμένους ή εγκυμοσύνη.','BMI is a general measure — it is less accurate for athletes, older people or pregnancy.')}</p></div>
   <div class="dock"><button class="btn ghost small" onclick="go('tests')">↩ ${t('back')}</button></div>`;
  return header(t('bp'))+`<div class="card top"><h2>🩺 ${t('bp')}</h2>
   <div class="grid2"><div><label class="f">${t('sys')}</label><input type="number" id="s" inputmode="numeric" placeholder="120"></div><div><label class="f">${t('dia')}</label><input type="number" id="d" inputmode="numeric" placeholder="80"></div></div>
   <div class="sp"></div><button class="btn wide" onclick="calcBP()">🧮 ${t('calc')}</button><div class="sp"></div><div id="out"></div>
   <p class="muted">${L('Μετρήστε καθιστός, μετά από 5 λεπτά ηρεμίας, με το χέρι στο ύψος της καρδιάς. Κάντε 2 μετρήσεις.','Measure seated after 5 minutes of rest, arm at heart level. Take 2 readings.')}</p></div>
   <div class="dock"><button class="btn ghost small" onclick="go('tests')">↩ ${t('back')}</button><button class="btn violet" onclick="go('diary')">📈 ${t('t6')}</button></div>`;

function calcBMI(){const hc=+$('#h').value,w=+$('#w').value;if(!hc||!w)return;store.set('height',hc);const b=w/((hc/100)**2);

const DT = {bp:'🩺',sugar:'🍬',weight:'⚖️',temp:'🌡️',pulse:'💓',spo2:'🫁',note:'📝'};
function rate(e){
  const v=e.v;
  if(e.type==='bp'){const k=bpClass(v[0],v[1]);return [['y','g','y','o','r','r'][k],t('bpRes')[k]]}
  if(e.type==='sugar'){const x=v[0],f=e.when!=='after';let k;if(x<70)k=0;else if(f?x<100:x<140)k=1;else if(f?x<126:x<200)k=2;else if(x<300)k=3;else k=4;return [['r','g','y','o','r'][k],t('sugarRes')[k]]}
  if(e.type==='temp'){const x=v[0];const k=x<35?0:x<37.5?1:x<38?2:x<39.5?3:4;return [['r','g','y','o','r'][k],t('tempRes')[k]]}
  if(e.type==='pulse'){const x=v[0];const k=x<50?0:x<=100?1:x<=130?2:3;return [['y','g','o','r'][k],t('pulseRes')[k]]}
  if(e.type==='spo2'){const x=v[0];const k=x>=95?0:x>=92?1:2;return [['g','y','r'][k],t('spo2Res')[k]]}
  if(e.type==='weight'){const h=store.get('height',0);if(h){const b=v[0]/((h/100)**2);const k=b<18.5?0:b<25?1:b<30?2:3;return [['y','g','o','r'][k],`${t('bmi')} ${b.toFixed(1)}`]}return ['n','']}
  return ['n',''];
}

function chart(list){
  const W=600,H=220,P=34;const series=DTYPE==='bp'?[list.map(e=>e.v[0]),list.map(e=>e.v[1])]:[list.map(e=>e.v[0])];
  const vals=series.flat();let mn=Math.min(...vals),mx=Math.max(...vals);if(mx===mn){mx+=1;mn-=1}const pad=(mx-mn)*.15;mn-=pad;mx+=pad;
  const X=i=>P+(W-P*2)*(list.length===1?.5:i/(list.length-1)),Y=v=>H-P-(H-P*2)*(v-mn)/(mx-mn);
  const cols=['#e11d48','#3b82f6'];
  const lines=series.map((s,k)=>`<polyline fill="none" stroke="${cols[k]}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" points="${s.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>${s.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="5" fill="${cols[k]}"/>`).join('')}`).join('');
  const grid=[0,.5,1].map(f=>{const v=mn+(mx-mn)*f;return `<line x1="${P}" x2="${W-P}" y1="${Y(v)}" y2="${Y(v)}" stroke="currentColor" opacity=".15"/><text x="4" y="${Y(v)+5}" font-size="14" fill="currentColor" opacity=".7">${Math.round(v)}</text>`}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${grid}${lines}</svg>${DTYPE==='bp'?`<p class="muted"><span style="color:#e11d48">●</span> ${t('sys')} &nbsp; <span style="color:#3b82f6">●</span> ${t('dia')}</p>`:''}`;
}

  return header(t('sources'))+`<div class="card top"><h2>📚 ${t('sources')}</h2><p class="lead">${t('srcLead')}</p><div class="list">${S.map(s=>`<div class="it"><span class="e">${s[0]}</span><div><b><a href="${s[4]}" target="_blank" rel="noopener">${s[1]} 🔗</a></b><span>${L(s[2],s[3])}</span></div></div>`).join('')}</div></div>
   <div class="card"><h3>📞 ${L('Χρήσιμα τηλέφωνα','Useful numbers')}</h3><div class="list">
    <div class="it"><span class="e">🚑</span><div><b><a href="tel:112">112</a></b><span>${L('Ευρωπαϊκός αριθμός έκτακτης ανάγκης (Ελλάδα, Κύπρος, όλη η ΕΕ)','European emergency number (Greece, Cyprus, all EU)')}</span></div></div>
    <div class="it"><span class="e">💜</span><div><b><a href="tel:1018">1018</a></b><span>${L('Ελλάδα — Γραμμή Παρέμβασης για την Αυτοκτονία (Κλίμακα), 24ωρη','Greece — Suicide Prevention Line (Klimaka), 24h')}</span></div></div>
    <div class="it"><span class="e">💜</span><div><b><a href="tel:80007773">8000 7773</a></b><span>${L('Κύπρος — Cyprus Samaritans, συναισθηματική στήριξη','Cyprus — Cyprus Samaritans, emotional support')}</span></div></div>
    <div class="it"><span class="e">☠️</span><div><b><a href="tel:+302107793777">210 7793777</a></b><span>${L('Ελλάδα — Κέντρο Δηλητηριάσεων','Greece — Poison Centre')}</span></div></div></div></div>
   <div class="card"><p class="muted">⚠️ ${t('limit')}</p></div>`;
}
function vHelp(){
  return header(t('help'))+`<div class="card top"><h2>❓ ${t('help')}</h2><div class="list">${t('helpText').map((x,i)=>`<div class="it"><span class="e">${['👆','🏠','📞','💬','🧍','🔒','🌙','📲'][i]}</span><div>${esc(x)}</div></div>`).join('')}</div></div>
   <div class="card"><h3>📲 ${t('install')}</h3><p>${t('installTxt')}</p></div><p class="disc">${t('disc')}</p>`;
}

if(store.get('theme',null)==='dark'||(store.get('theme',null)==null&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');
render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
