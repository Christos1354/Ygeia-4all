,"Tender temples","Jaw pain when chewing","Blurred or double vision","Fatigue, fever"],"aid":"• See a doctor THE SAME DAY\n• Any vision change: go to A&E","note":"Threatens eyesight. Needs a blood test and quick treatment"}},{"id":"rls","areas":["head","psy"],"sev":"norm","el":{"n":"Σύνδρομο ανήσυχων ποδιών","s":["Ακατανίκητη ανάγκη να κουνάτε τα πόδια","Χειρότερο το βράδυ και στο κρεβάτι","Βελτιώνεται με το περπάτημα","Κακός ύπνος"],"aid":"• Περπάτημα ή διάταση πριν τον ύπνο\n• Λιγότερος καφές και αλκοόλ βράδυ\n• Ελέγξτε σίδηρο (φερριτίνη)","note":"Γιατρός αν χαλά τον ύπνο σας"},"en":{"n":"Restless legs syndrome","s":["Urge to move the legs","Worse in the evening and in bed","Better when walking","Poor sleep"],"aid":"• Walk or stretch before bed\n• Less coffee and alcohol in the evening\n• Check iron (ferritin)","note":"See a doctor if it disturbs your sleep"}},{"id":"cataract","areas":["eye","senior"],"sev":"caution","el":{"n":"Καταρράκτης","s":["Θολή ή «ομιχλώδης» όραση","Θάμπωμα από φώτα τη νύχτα","Ξεθωριασμένα χρώματα","Συχνές αλλαγές γυαλιών"],"aid":"• Καλός φωτισμός στο σπίτι\n• Γυαλιά ηλίου\n• Προσοχή στην οδήγηση τη νύχτα","note":"Οφθαλμίατρος. Η επέμβαση είναι σύντομη και πολύ επιτυχημένη"},"en":{"n":"Cataract","s":["Cloudy or misty vision","Glare from lights at night","Faded colours","Frequent glasses changes"],"aid":"• Good lighting at home\n• Sunglasses\n• Care when driving at night","note":"Eye doctor. Surgery is short and very successful"}},{"id":"amd","areas":["eye","senior"],"sev":"risk","el":{"n":"Εκφύλιση ωχράς κηλίδας","s":["Θολό ή σκοτεινό σημείο στο κέντρο","Ίσιες γραμμές φαίνονται στραβές","Δυσκολία στο διάβασμα και στα πρόσωπα"],"aid":"• Ελέγχετε κάθε μάτι χωριστά κοιτώντας ένα πλακάκι ή πλέγμα\n• Διακοπή καπνίσματος\n• Πράσινα λαχανικά","note":"Οφθαλμίατρος ΣΥΝΤΟΜΑ αν οι γραμμές στραβώσουν ξαφνικά — η «υγρή» μορφή θέλει γρήγορη θεραπεία"},"en":{"n":"Macular degeneration","s":["Blurry or dark spot in the centre","Straight lines look wavy","Trouble reading and seeing faces"],"aid":"• Check each eye separately on a grid or tiles\n• Stop smoking\n• Green leafy vegetables","note":"See an eye doctor SOON if lines suddenly look wavy — the “wet” form needs fast treatment"}},{"id":"dryeye","areas":["eye"],"sev":"norm","el":{"n":"Ξηροφθαλμία","s":["Κάψιμο ή αίσθηση άμμου","Κόκκινα μάτια","Δακρύρροια από ερεθισμό","Χειρότερα στον υπολογιστή ή στον αέρα"],"aid":"• Τεχνητά δάκρυα χωρίς συντηρητικά\n• Διαλείμματα από οθόνες (ανοιγοκλείστε τα μάτια)\n• Υγραντήρας χώρου","note":"Οφθαλμίατρος αν επιμένει, πονά ή πέφτει η όραση"},"en":{"n":"Dry eye","s":["Burning or gritty feeling","Red eyes","Watering from irritation","Worse at screens or in wind"],"aid":"• Preservative-free artificial tears\n• Screen breaks (blink often)\n• Room humidifier","note":"Eye doctor if persistent, painful or vision drops"}},{"id":"retinaldet","areas":["eye"],"sev":"emer","el":{"n":"Αποκόλληση αμφιβληστροειδούς","s":["Ξαφνικά πολλά «μυγάκια» στην όραση","Λάμψεις φωτός","Σκιά ή κουρτίνα που κλείνει μέρος της όρασης"],"aid":"• Πηγαίνετε ΑΜΕΣΑ σε οφθαλμολογικό ή Τμήμα επειγόντων\n• Μην οδηγείτε μόνοι","note":"Κάθε ώρα μετράει για να σωθεί η όραση"},"en":{"n":"Retinal detachment","s":["Sudden shower of floaters","Flashes of light","Shadow or curtain over part of vision"],"aid":"• Go IMMEDIATELY to an eye emergency or A&E\n• Do not drive yourself","note":"Every hour counts to save the sight"}},{"id":"acuteglauc","areas":["eye"],"sev":"emer","el":{"n":"Οξύ γλαύκωμα (κλειστής γωνίας)","s":["Ξαφνικός έντονος πόνος στο μάτι","Κόκκινο μάτι","Θολή όραση με κύκλους γύρω από τα φώτα","Πονοκέφαλος, ναυτία, εμετός"],"aid":"• Τμήμα επειγόντων ΑΜΕΣΑ\n• Μην περιμένετε να περάσει","note":"Μπορεί να προκαλέσει τύφλωση μέσα σε ώρες"},"en":{"n":"Acute angle-closure glaucoma","s":["Sudden severe eye pain","Red eye","Blurred vision with halos around lights","Headache, nausea, vomiting"],"aid":"• Go to A&E IMMEDIATELY\n• Do not wait for it to pass","note":"Can cause blindness within hours"}},{"id":"diabretina","areas":["eye","endo"],"sev":"risk","el":{"n":"Διαβητική αμφιβληστροειδοπάθεια","s":["Συχνά χωρίς συμπτώματα στην αρχή","Θολή όραση","Σκοτεινά σημεία","Διακυμάνσεις όρασης"],"aid":"• Καλός έλεγχος σακχάρου και πίεσης\n• Βυθοσκόπηση κάθε χρόνο αν έχετε διαβήτη","note":"Οφθαλμίατρος ετησίως για κάθε διαβητικό — προλαμβάνει την τύφλωση"},"en":{"n":"Diabetic retinopathy","s":["Often no symptoms at first","Blurred vision","Dark spots","Fluctuating vision"],"aid":"• Good blood sugar and pressure control\n• Yearly eye check if diabetic","note":"Yearly eye exam for every diabetic — it prevents blindness"}},{"id":"blepharitis","areas":["eye"],"sev":"norm","el":{"n":"Βλεφαρίτιδα","s":["Κόκκινα, πρησμένα βλέφαρα","Κρούστες στις βλεφαρίδες το πρωί","Φαγούρα ή κάψιμο","Αίσθηση ξένου σώματος"],"aid":"• Ζεστές κομπρέσες 5 λεπτά\n• Καθαρισμός άκρης βλεφάρων με ειδικά μαντηλάκια\n• Όχι μακιγιάζ για λίγες μέρες","note":"Οφθαλμίατρος αν δεν βελτιώνεται σε 2-3 εβδομάδες"},"en":{"n":"Blepharitis","s":["Red, swollen eyelids","Crusts on lashes in the morning","Itch or burning","Feeling of something in the eye"],"aid":"• Warm compresses for 5 minutes\n• Clean lid margins with special wipes\n• No make-up for a few days","note":"Eye doctor if no better in 2-3 weeks"}},{"id":"uveitis","areas":["eye"],"sev":"risk","el":{"n":"Ιριδοκυκλίτιδα (ραγοειδίτιδα)","s":["Πόνος στο μάτι","Κοκκίνισμα γύρω από την ίριδα","Πόνος με το φως","Θολή όραση"],"aid":"• Οφθαλμίατρος το ίδιο 24ωρο\n• Γυαλιά ηλίου","note":"Χρειάζεται ειδική θεραπεία — όχι απλές σταγόνες επιπεφυκίτιδας"},"en":{"n":"Uveitis / iritis","s":["Eye pain","Redness around the iris","Pain with light","Blurred vision"],"aid":"• Eye doctor within 24 hours\n• Sunglasses","note":"Needs specific treatment — not ordinary conjunctivitis drops"}},{"id":"presbyopia","areas":["eye","senior"],"sev":"norm","el":{"n":"Πρεσβυωπία / Αλλαγές όρασης","s":["Δυσκολία στο διάβασμα κοντά","Κρατάτε το κείμενο μακριά","Κούραση ματιών","Πονοκέφαλος μετά το διάβασμα"],"aid":"• Καλός φωτισμός\n• Μεγαλύτερα γράμματα στο κινητό","note":"Οφθαλμίατρος για σωστά γυαλιά και έλεγχο πίεσης ματιού μετά τα 40"},"en":{"n":"Presbyopia / vision changes","s":["Difficulty reading up close","Holding text far away","Tired eyes","Headache after reading"],"aid":"• Good lighting\n• Bigger text on the phone","note":"Eye doctor for correct glasses and eye-pressure check after 40"}},{"id":"subconj","areas":["eye"],"sev":"norm","el":{"n":"Υποσυζυγιακή αιμορραγία (κόκκινη κηλίδα)","s":["Έντονη κόκκινη κηλίδα στο λευκό του ματιού","Χωρίς πόνο","Όραση φυσιολογική","Μετά από βήχα ή σφίξιμο"],"aid":"• Συνήθως φεύγει μόνη της σε 1-2 εβδομάδες\n• Ελέγξτε την πίεσή σας","note":"Γιατρός αν πονά, θολώνει η όραση, επαναλαμβάνεται ή παίρνετε αντιπηκτικά"},"en":{"n":"Subconjunctival haemorrhage","s":["Bright red patch on the white of the eye","No pain","Normal vision","After coughing or straining"],"aid":"• Usually clears by itself in 1-2 weeks\n• Check your blood pressure","note":"See a doctor if painful, vision blurs, it recurs, or you take blood thinners"}},{"id":"otitisext","areas":["ent"],"sev":"norm","el":{"n":"Εξωτερική ωτίτιδα («αυτί κολυμβητή»)","s":["Πόνος όταν τραβάτε το αυτί","Φαγούρα στο αυτί","Υγρό ή υγρασία","Βουλωμένη αίσθηση"],"aid":"• Κρατήστε το αυτί στεγνό\n• Όχι μπατονέτες\n• Ζέστη έξω από το αυτί για τον πόνο","note":"Γιατρός για σταγόνες. Αν έχετε διαβήτη και έντονο πόνο: γρήγορα"},"en":{"n":"Outer ear infection (swimmer’s ear)","s":["Pain when pulling the ear","Itchy ear","Discharge or moisture","Blocked feeling"],"aid":"• Keep the ear dry\n• No cotton buds\n• Warmth outside the ear for pain","note":"See a doctor for drops. If diabetic with severe pain: promptly"}},{"id":"earwax","areas":["ent","senior"],"sev":"norm","el":{"n":"Βύσμα κερίου (κυψελίδα)","s":["Βουλωμένο αυτί","Μειωμένη ακοή στο ένα αυτί","Βουητό","Ελαφριά ζάλη"],"aid":"• Σταγόνες ελαιολάδου για λίγες μέρες\n• Όχι μπατονέτες — σπρώχνουν το κερί πιο μέσα","note":"Γιατρός ή Ωτορινολαρυγγολόγος για καθαρισμό αν δεν φύγει"},"en":{"n":"Earwax blockage","s":["Blocked ear","Reduced hearing in one ear","Ringing","Mild dizziness"],"aid":"• Olive oil drops for a few days\n• No cotton buds — they push wax deeper","note":"GP or ENT for removal if it does not clear"}},{"id":"hearingloss","areas":["ent","senior"],"sev":"caution","el":{"n":"Βαρηκοΐα (σταδιακή απώλεια ακοής)","s":["Ζητάτε συχνά να επαναλάβουν","Ανεβάζετε πολύ την τηλεόραση","Δυσκολία σε θορυβώδη μέρη","Βουητό"],"aid":"• Μιλάτε πρόσωπο με πρόσωπο\n• Λιγότερος θόρυβος φόντου\n• Έλεγχος ακοής (ακοόγραμμα)","note":"Ωτορινολαρυγγολόγος. Τα ακουστικά βοηθούν και προστατεύουν και τη μνήμη"},"en":{"n":"Gradual hearing loss","s":["Often asking people to repeat","TV turned up loud","Trouble in noisy places","Ringing"],"aid":"• Speak face to face\n• Less background noise\n• Hearing test (audiogram)","note":"ENT. Hearing aids help and also protect memory"}},{"id":"suddenhear","areas":["ent"],"sev":"risk","el":{"n":"Αιφνίδια βαρηκοΐα","s":["Ξαφνική απώλεια ακοής στο ένα αυτί","Βουητό","Αίσθημα πίεσης","Μερικές φορές ζάλη"],"aid":"• Ωτορινολαρυγγολόγος ΤΗΝ ΙΔΙΑ ή την επόμενη μέρα\n• Μη θεωρήσετε ότι είναι απλό βούλωμα","note":"Η έγκαιρη θεραπεία (μέσα σε λίγες μέρες) σώζει την ακοή"},"en":{"n":"Sudden hearing loss","s":["Sudden hearing loss in one ear","Ringing","Pressure feeling","Sometimes dizziness"],"aid":"• See an ENT TODAY or tomorrow\n• Do not assume it is just wax","note":"Early treatment (within days) saves hearing"}},{"id":"tinnitus","areas":["ent","senior"],"sev":"norm","el":{"n":"Εμβοές (βουητό στα αυτιά)","s":["Βουητό, σφύριγμα ή βόμβος","Χειρότερο στην ησυχία","Δυσκολία στον ύπνο"],"aid":"• Απαλός ήχος φόντου τη νύχτα\n• Προστασία από δυνατούς θορύβους\n• Λιγότερο αλκοόλ και καφές","note":"Γιατρός αν είναι μόνο στο ένα αυτί, «χτυπά» με τον σφυγμό ή ήρθε ξαφνικά"},"en":{"n":"Tinnitus (ringing in the ears)","s":["Ringing, whistling or buzzing","Worse in silence","Trouble sleeping"],"aid":"• Soft background sound at night\n• Protect from loud noise\n• Less alcohol and coffee","note":"See a doctor if one-sided, pulsing with the heartbeat, or sudden"}},{"id":"meniere","areas":["ent"],"sev":"caution","el":{"n":"Νόσος Ménière","s":["Κρίσεις ιλίγγου για ώρες","Βουητό","Πίεση στο αυτί","Διακυμαινόμενη ακοή"],"aid":"• Λιγότερο αλάτι\n• Ξαπλώστε σε ακίνητη θέση στην κρίση\n• Ημερολόγιο κρίσεων","note":"Ωτορινολαρυγγολόγος"},"en":{"n":"Ménière’s disease","s":["Vertigo attacks lasting hours","Ringing","Ear pressure","Fluctuating hearing"],"aid":"• Less salt\n• Lie still during an attack\n• Keep an attack diary","note":"ENT specialist"}},{"id":"nosebleed","areas":["ent"],"sev":"norm","el":{"n":"Ρινορραγία (αίμα από τη μύτη)","s":["Αίμα από το ένα ρουθούνι","Μετά από ξηρό αέρα ή φύσημα","Ξαναγίνεται"],"aid":"• Καθίστε, σκύψτε ΜΠΡΟΣΤΑ (όχι πίσω)\n• Πιέστε το μαλακό μέρος της μύτης 10-15 λεπτά συνεχόμενα\n• Κρύο στη ράχη της μύτης","note":"112 ή Επείγοντα αν δεν σταματά σε 20 λεπτά, μετά από χτύπημα στο κεφάλι ή με αντιπηκτικά. Ελέγξτε την πίεση"},"en":{"n":"Nosebleed","s":["Blood from one nostril","After dry air or nose blowing","Recurs"],"aid":"• Sit, lean FORWARD (not back)\n• Pinch the soft part of the nose for 10-15 minutes non-stop\n• Cold on the bridge of the nose","note":"Call 112 or go to A&E if not stopping in 20 minutes, after a head injury, or on blood thinners. Check blood pressure"}},{"id":"aphthous","areas":["ent"],"sev":"norm","el":{"n":"Άφθες (πληγές στο στόμα)","s":["Μικρές λευκές πληγές με κόκκινο γύρο","Πόνος στο φαγητό","Επανέρχονται"],"aid":"• Στοματικά διαλύματα χωρίς αλκοόλ\n• Αποφύγετε ξινά και καυτερά\n• Μαλακή οδοντόβουρτσα","note":"Γιατρός ή Οδοντίατρος αν μια πληγή δεν κλείνει σε 3 εβδομάδες"},"en":{"n":"Mouth ulcers","s":["Small white sores with red edge","Painful when eating","Keep coming back"],"aid":"• Alcohol-free mouthwash\n• Avoid sour and spicy food\n• Soft toothbrush","note":"GP or dentist if one sore has not healed in 3 weeks"}},{"id":"thrush","areas":["ent","senior"],"sev":"norm","el":{"n":"Μυκητίαση στόματος (καντιντίαση)","s":["Λευκές πλάκες στη γλώσσα και μάγουλα","Κοκκίνισμα από κάτω","Κάψιμο","Αλλαγή γεύσης"],"aid":"• Καθαρίστε καλά οδοντοστοιχίες\n• Ξεβγάλτε το στόμα μετά από εισπνεόμενο κορτιζόνης","note":"Γιατρός ή φαρμακοποιός για αντιμυκητιακό. Ελέγξτε σάκχαρο αν επανέρχεται"},"en":{"n":"Oral thrush","s":["White patches on tongue and cheeks","Red underneath","Burning","Altered taste"],"aid":"• Clean dentures well\n• Rinse mouth after steroid inhalers","note":"Doctor or pharmacist for antifungal. Check blood sugar if recurring"}},{"id":"gums","areas":["ent"],"sev":"norm","el":{"n":"Ουλίτιδα / Περιοδοντίτιδα","s":["Ούλα που ματώνουν στο βούρτσισμα","Κόκκινα πρησμένα ούλα","Κακοσμία στόματος","Δόντια που κουνιούνται"],"aid":"• Βούρτσισμα 2 φορές τη μέρα\n• Οδοντικό νήμα\n• Διακοπή καπνίσματος","note":"Οδοντίατρος. Η περιοδοντίτιδα συνδέεται και με διαβήτη και καρδιά"},"en":{"n":"Gum disease (gingivitis / periodontitis)","s":["Gums bleed when brushing","Red swollen gums","Bad breath","Loose teeth"],"aid":"• Brush twice a day\n• Floss\n• Stop smoking","note":"Dentist. Gum disease is linked to diabetes and heart health"}},{"id":"oralcancer","areas":["ent"],"sev":"risk","el":{"n":"Επίμονη πληγή στο στόμα (προειδοποίηση)","s":["Πληγή στο στόμα ή γλώσσα πάνω από 3 εβδομάδες","Λευκή ή κόκκινη πλάκα","Ογκίδιο στον λαιμό","Πόνος στην κατάποση"],"aid":"• Μην περιμένετε να περάσει\n• Διακοπή καπνίσματος και αλκοόλ","note":"Οδοντίατρος ή Ωτορινολαρυγγολόγος για εξέταση ΣΥΝΤΟΜΑ"},"en":{"n":"Persistent mouth sore (warning)","s":["Mouth or tongue sore for over 3 weeks","White or red patch","Lump in the neck","Pain swallowing"],"aid":"• Do not wait for it to pass\n• Stop smoking and alcohol","note":"See a dentist or ENT SOON"}},{"id":"quinsy","areas":["ent"],"sev":"risk","el":{"n":"Περιαμυγδαλικό απόστημα","s":["Πολύ έντονος πόνος στη μία πλευρά του λαιμού","Δυσκολία να ανοίξει το στόμα","Φωνή «σαν καυτή πατάτα»","Δυσκολία στην κατάποση σάλιου","Πυρετός"],"aid":"• Γιατρός ή Επείγοντα ΣΗΜΕΡΑ","note":"112 αν δυσκολεύεται να αναπνεύσει"},"en":{"n":"Peritonsillar abscess (quinsy)","s":["Very severe one-sided throat pain","Cannot open mouth fully","“Hot potato” voice","Cannot swallow saliva","Fever"],"aid":"• See a doctor or A&E TODAY","note":"Call 112 if breathing is difficult"}},{"id":"tmj","areas":["ent","musc"],"sev":"norm","el":{"n":"Κροταφογναθική διαταραχή","s":["Πόνος στο σαγόνι μπροστά από το αυτί","Κλικ όταν ανοίγει το στόμα","Πονοκέφαλος","Σφίξιμο δοντιών τη νύχτα"],"aid":"• Μαλακές τροφές\n• Ζεστές κομπρέσες\n• Αποφύγετε τσίχλα","note":"Οδοντίατρος — νάρθηκας νυκτός βοηθά"},"en":{"n":"Jaw joint disorder (TMJ)","s":["Jaw pain in front of the ear","Clicking when opening the mouth","Headache","Teeth clenching at night"],"aid":"• Soft foods\n• Warm compresses\n• Avoid chewing gum","note":"Dentist — a night guard helps"}},{"id":"nasalpolyps","areas":["ent","resp"],"sev":"norm","el":{"n":"Χρόνια ρινίτιδα / Ρινικοί πολύποδες","s":["Μόνιμα βουλωμένη μύτη","Μειωμένη όσφρηση","Καταρροή προς τον λαιμό","Ροχαλητό"],"aid":"• Πλύσεις μύτης με φυσιολογικό ορό\n• Αποφυγή καπνού","note":"Ωτορινολαρυγγολόγος αν κρατά πάνω από 12 εβδομάδες ή μόνο από το ένα ρουθούνι με αίμα"},"en":{"n":"Chronic rhinitis / nasal polyps","s":["Constantly blocked nose","Reduced smell","Drip down the throat","Snoring"],"aid":"• Saline nose rinses\n• Avoid smoke","note":"ENT if over 12 weeks, or one-sided with blood"}},{"id":"heartfail","areas":["cardio","senior","resp"],"sev":"risk","el":{"n":"Καρδιακή ανεπάρκεια","s":["Λαχάνιασμα στην προσπάθεια ή ξαπλωμένος","Πρησμένοι αστράγαλοι","Κούραση","Ξυπνάτε τη νύχτα με δύσπνοια","Αύξηση βάρους μέσα σε λίγες μέρες"],"aid":"• Ζυγιστείτε κάθε πρωί και σημειώστε\n• Λιγότερο αλάτι\n• Κοιμηθείτε με επιπλέον μαξιλάρι","note":"Καρδιολόγος. Αύξηση πάνω από 2 κιλά σε 3 μέρες ή δύσπνοια σε ηρεμία: γιατρός αμέσως"},"en":{"n":"Heart failure","s":["Breathless on effort or lying flat","Swollen ankles","Tiredness","Waking at night breathless","Weight gain over a few days"],"aid":"• Weigh yourself every morning and note it\n• Less salt\n• Sleep on an extra pillow","note":"Cardiologist. Gaining over 2 kg in 3 days or breathless at rest: see a doctor at once"}},{"id":"afib","areas":["cardio","senior"],"sev":"risk","el":{"n":"Κολπική μαρμαρυγή","s":["Ακανόνιστος, γρήγορος σφυγμός","Αίσθημα φτερουγίσματος στο στήθος","Ζάλη","Κόπωση ή λαχάνιασμα"],"aid":"• Μετρήστε τον σφυγμό στον καρπό για 30 δευτερόλεπτα\n• Σημειώστε πότε συμβαίνει","note":"Καρδιολόγος — αυξάνει πολύ τον κίνδυνο εγκεφαλικού, η θεραπεία τον μειώνει. Με πόνο στο στήθος ή λιποθυμία: 112"},"en":{"n":"Atrial fibrillation","s":["Irregular, fast pulse","Fluttering in the chest","Dizziness","Fatigue or breathlessness"],"aid":"• Check your wrist pulse for 30 seconds\n• Note when it happens","note":"Cardiologist — it greatly raises stroke risk; treatment lowers it. With chest pain or fainting: call 112"}},{"id":"orthostatic","areas":["cardio","senior"],"sev":"caution","el":{"n":"Ορθοστατική υπόταση (ζάλη όταν σηκώνεστε)","s":["Ζάλη μόλις σηκωθείτε","Σκοτείνιασμα ματιών","Αστάθεια","Περνά σε λίγα δευτερόλεπτα"],"aid":"• Σηκωθείτε σε 3 βήματα: κάθισμα, περιμένετε, όρθιος\n• Αρκετά υγρά\n• Κάλτσες διαβαθμισμένης συμπίεσης αν τις προτείνει ο γιατρός","note":"Γιατρός — συχνά οφείλεται σε φάρμακα πίεσης ή αφυδάτωση. Αυξάνει τις πτώσεις"},"en":{"n":"Orthostatic hypotension (dizzy on standing)","s":["Dizzy on standing up","Vision going dark","Unsteady","Passes in seconds"],"aid":"• Stand up in 3 steps: sit, wait, stand\n• Enough fluids\n• Compression stockings if advised","note":"See a doctor — often due to blood pressure medicines or dehydration. Raises fall risk"}},{"id":"pad","areas":["cardio","senior"],"sev":"risk","el":{"n":"Περιφερική αρτηριοπάθεια (κακή κυκλοφορία ποδιών)","s":["Πόνος στη γάμπα όταν περπατάτε, περνά με στάση","Κρύα πόδια","Πληγές που δεν κλείνουν","Αδύναμος σφυγμός στο πόδι"],"aid":"• Διακοπή καπνίσματος\n• Καθημερινό περπάτημα μέχρι τον πόνο, στάση, συνέχεια\n• Φροντίδα ποδιών","note":"Αγγειοχειρουργός ή Καρδιολόγος. Ξαφνικά κρύο, χλωμό, πονεμένο πόδι: 112"},"en":{"n":"Peripheral artery disease","s":["Calf pain when walking that eases with rest","Cold feet","Sores that do not heal","Weak foot pulse"],"aid":"• Stop smoking\n• Daily walking up to the pain, rest, continue\n• Foot care","note":"Vascular surgeon or Cardiologist. Sudden cold, pale, painful leg: call 112"}},{"id":"varicose","areas":["cardio"],"sev":"norm","el":{"n":"Κιρσοί","s":["Φουσκωμένες, στριφογυριστές φλέβες","Βάρος στα πόδια το βράδυ","Πρήξιμο αστραγάλων","Φαγούρα"],"aid":"• Ψηλά πόδια όταν ξεκουράζεστε\n• Περπάτημα\n• Κάλτσες συμπίεσης","note":"Αγγειοχειρουργός αν πονά, κοκκινίζει, ματώνει ή κάνει πληγή"},"en":{"n":"Varicose veins","s":["Bulging, twisted veins","Heavy legs in the evening","Ankle swelling","Itching"],"aid":"• Raise legs when resting\n• Walking\n• Compression stockings","note":"Vascular surgeon if painful, red, bleeding or ulcerating"}},{"id":"aortic","areas":["cardio","senior"],"sev":"emer","el":{"n":"Διαχωρισμός ή ρήξη αορτής","s":["Ξαφνικός σκιστικός πόνος στο στήθος ή πλάτη","Πόνος που «ταξιδεύει»","Λιποθυμία","Διαφορά πίεσης στα δύο χέρια"],"aid":"• ΚΑΛΕΣΤΕ 112 ΑΜΕΣΑ\n• Ξαπλώστε ακίνητος","note":"Άμεσος κίνδυνος ζωής"},"en":{"n":"Aortic dissection or rupture","s":["Sudden tearing chest or back pain","Pain that moves","Fainting","Different blood pressure in each arm"],"aid":"• CALL 112 NOW\n• Lie still","note":"Immediately life-threatening"}},{"id":"pericarditis","areas":["cardio"],"sev":"risk","el":{"n":"Περικαρδίτιδα","s":["Κοφτερός πόνος στο στήθος","Χειρότερος στη βαθιά ανάσα ή ξαπλωμένος","Καλύτερα όταν σκύβετε μπροστά","Πυρετός"],"aid":"• Γιατρός ΣΗΜΕΡΑ για ΗΚΓ\n• Ξεκούραση","note":"Κάθε πόνος στο στήθος θέλει εξέταση. Αν πιέζει ή απλώνεται στο χέρι: 112"},"en":{"n":"Pericarditis","s":["Sharp chest pain","Worse with deep breath or lying down","Better leaning forward","Fever"],"aid":"• See a doctor TODAY for an ECG\n• Rest","note":"Any chest pain needs checking. If pressing or spreading to the arm: call 112"}},{"id":"hypcrisis","areas":["cardio"],"sev":"emer","el":{"n":"Υπερτασική κρίση","s":["Πίεση 180/120 ή πάνω","Έντονος πονοκέφαλος","Πόνος στο στήθος","Θόλωση όρασης","Σύγχυση ή αδυναμία"],"aid":"• Ξαναμετρήστε μετά από 5 λεπτά ηρεμίας\n• Με συμπτώματα: 112","note":"Χωρίς συμπτώματα: γιατρός σήμερα. Με συμπτώματα: 112"},"en":{"n":"Hypertensive crisis","s":["Blood pressure 180/120 or above","Severe headache","Chest pain","Blurred vision","Confusion or weakness"],"aid":"• Re-measure after 5 minutes of rest\n• With symptoms: call 112","note":"Without symptoms: see a doctor today. With symptoms: call 112"}},{"id":"raynaud","areas":["cardio","skin"],"sev":"norm","el":{"n":"Φαινόμενο Raynaud","s":["Δάχτυλα άσπρα και μετά μπλε στο κρύο","Μούδιασμα","Κοκκινίζουν όταν ζεσταθούν"],"aid":"• Γάντια και ζεστές κάλτσες\n• Όχι κάπνισμα","note":"Γιατρός αν εμφανιστεί μετά τα 40, πληγές στα δάχτυλα ή πόνος στις αρθρώσεις"},"en":{"n":"Raynaud’s phenomenon","s":["Fingers go white then blue in the cold","Numbness","Turn red when warmed"],"aid":"• Gloves and warm socks\n• No smoking","note":"See a doctor if it starts after 40, finger sores, or joint pain"}},{"id":"copd","areas":["resp","senior"],"sev":"risk","el":{"n":"ΧΑΠ (Χρόνια αποφρακτική πνευμονοπάθεια)","s":["Χρόνιος βήχας με φλέγματα","Λαχάνιασμα που χειροτερεύει με τα χρόνια","Σφύριγμα","Συχνές βρογχίτιδες","Καπνιστής ή πρώην καπνιστής"],"aid":"• Διακοπή καπνίσματος — το πιο σημαντικό\n• Εμβόλια γρίπης και πνευμονιόκοκκου\n• Ασκήσεις αναπνοής","note":"Πνευμονολόγος — σπιρομέτρηση. Χείλη μπλε ή σύγχυση: 112"},"en":{"n":"COPD (chronic obstructive lung disease)","s":["Chronic cough with phlegm","Breathlessness worsening over years","Wheezing","Frequent chest infections","Smoker or ex-smoker"],"aid":"• Stop smoking — the most important step\n• Flu and pneumococcal vaccines\n• Breathing exercises","note":"Lung specialist — spirometry test. Blue lips or confusion: call 112"}},{"id":"apnea","areas":["resp","psy"],"sev":"caution","el":{"n":"Αποφρακτική άπνοια ύπνου","s":["Δυνατό ροχαλητό","Παύσεις αναπνοής στον ύπνο (το λέει ο σύντροφος)","Υπνηλία τη μέρα","Πρωινός πονοκέφαλος","Νυχτερινή ούρηση"],"aid":"• Κάντε το τεστ STOP-BANG στην εφαρμογή\n• Απώλεια βάρους\n• Όχι αλκοόλ το βράδυ\n• Ύπνος στο πλάι","note":"Γιατρός ή Πνευμονολόγος για μελέτη ύπνου. Συνδέεται με πίεση και καρδιά. Μην οδηγείτε όταν νυστάζετε"},"en":{"n":"Obstructive sleep apnoea","s":["Loud snoring","Breathing pauses in sleep (partner notices)","Daytime sleepiness","Morning headache","Night-time urination"],"aid":"• Take the STOP-BANG test in this app\n• Weight loss\n• No alcohol in the evening\n• Sleep on your side","note":"GP or lung specialist for a sleep study. Linked to blood pressure and heart. Do not drive when sleepy"}},{"id":"tb","areas":["resp","gen"],"sev":"risk","el":{"n":"Φυματίωση","s":["Βήχας πάνω από 3 εβδομάδες","Αίμα στα φλέγματα","Νυχτερινές εφιδρώσεις","Απώλεια βάρους","Πυρετός"],"aid":"• Καλύπτετε στόμα και μύτη\n• Αερισμός χώρων","note":"Γιατρός ΣΥΝΤΟΜΑ — θεραπεύεται πλήρως με σωστή αγωγή"},"en":{"n":"Tuberculosis","s":["Cough over 3 weeks","Blood in phlegm","Night sweats","Weight loss","Fever"],"aid":"• Cover mouth and nose\n• Ventilate rooms","note":"See a doctor SOON — fully curable with proper treatment"}},{"id":"pertussis","areas":["resp","child"],"sev":"risk","el":{"n":"Κοκκύτης","s":["Κρίσεις βήχα που κόβουν την ανάσα","Ήχος «σφυρίγματος» στην εισπνοή","Εμετός μετά τον βήχα","Ξεκινά σαν κρυολόγημα"],"aid":"• Βρέφη: γιατρό ΑΜΕΣΑ\n• Μακριά από μωρά","note":"Γιατρός. Βρέφος που μελανιάζει ή σταματά να αναπνέει: 112. Το εμβόλιο προστατεύει (και σε εγκυμοσύνη)"},"en":{"n":"Whooping cough (pertussis)","s":["Coughing fits that take the breath away","“Whoop” sound breathing in","Vomiting after coughing","Starts like a cold"],"aid":"• Babies: see a doctor AT ONCE\n• Keep away from babies","note":"See a doctor. Baby turning blue or stopping breathing: call 112. Vaccine protects (also in pregnancy)"}},{"id":"lungwarn","areas":["resp","senior"],"sev":"risk","el":{"n":"Σημάδια που θέλουν έλεγχο πνεύμονα","s":["Βήχας που κρατά πάνω από 3 εβδομάδες ή αλλάζει","Αίμα στα φλέγματα","Βραχνάδα πάνω από 3 εβδομάδες","Απώλεια βάρους","Πόνος στο στήθος"],"aid":"• Μην περιμένετε\n• Διακοπή καπνίσματος","note":"Γιατρός για ακτινογραφία ΣΥΝΤΟΜΑ. Βαρείς καπνιστές 50-80: ρωτήστε για αξονική χαμηλής δόσης"},"en":{"n":"Warning signs needing a lung check","s":["Cough over 3 weeks or changing","Blood in phlegm","Hoarseness over 3 weeks","Weight loss","Chest pain"],"aid":"• Do not wait\n• Stop smoking","note":"See a doctor for an X-ray SOON. Heavy smokers 50-80: ask about low-dose CT"}},{"id":"pneumothorax","areas":["resp"],"sev":"emer","el":{"n":"Πνευμοθώρακας","s":["Ξαφνικός κοφτερός πόνος στη μία πλευρά του στήθους","Ξαφνική δύσπνοια","Γρήγορη αναπνοή"],"aid":"• ΚΑΛΕΣΤΕ 112 ή Τμήμα επειγόντων ΑΜΕΣΑ","note":"Συχνότερος σε ψηλούς νέους και καπνιστές, ή μετά από χτύπημα"},"en":{"n":"Collapsed lung (pneumothorax)","s":["Sudden sharp pain on one side of the chest","Sudden breathlessness","Fast breathing"],"aid":"• CALL 112 or go to A&E NOW","note":"More common in tall young people and smokers, or after an injury"}},{"id":"choking","areas":["resp","gen","child"],"sev":"emer","el":{"n":"Πνιγμονή (κάτι κόλλησε στον λαιμό)","s":["Δεν μπορεί να μιλήσει ή να βήξει","Πιάνει τον λαιμό του","Γίνεται μπλε","Θορυβώδης ή καθόλου αναπνοή"],"aid":"• Αν βήχει: ενθαρρύνετε τον βήχα\n• Αν δεν μπορεί: 5 χτυπήματα στην πλάτη ανάμεσα στις ωμοπλάτες\n• Μετά 5 ωθήσεις στην κοιλιά (Heimlich) — όχι σε βρέφη\n• ΚΑΛΕΣΤΕ 112","note":"Βρέφη: χτυπήματα πλάτης και πιέσεις στο στήθος, όχι κοιλιά. Μάθετε πρώτες βοήθειες!"},"en":{"n":"Choking","s":["Cannot speak or cough","Clutching the throat","Turning blue","Noisy or no breathing"],"aid":"• If coughing: encourage coughing\n• If not: 5 back blows between the shoulder blades\n• Then 5 abdominal thrusts (Heimlich) — not for babies\n• CALL 112","note":"Babies: back blows and chest thrusts, not abdominal. Learn first aid!"}},{"id":"constipation","areas":["gastro","senior"],"sev":"norm","el":{"n":"Δυσκοιλιότητα","s":["Λιγότερες από 3 κενώσεις την εβδομάδα","Σκληρά κόπρανα","Πίεση και φούσκωμα","Αίσθηση ατελούς κένωσης"],"aid":"• Νερό και φυτικές ίνες (λαχανικά, φρούτα, όσπρια, δαμάσκηνα)\n• Καθημερινό περπάτημα\n• Τουαλέτα στην ίδια ώρα μετά το πρωινό","note":"Γιατρός αν είναι νέο μετά τα 50, με αίμα, απώλεια βάρους ή έντονο πόνο. Ελέγξτε αν φταίει κάποιο φάρμακο"},"en":{"n":"Constipation","s":["Fewer than 3 bowel movements a week","Hard stools","Straining and bloating","Feeling of incomplete emptying"],"aid":"• Water and fibre (vegetables, fruit, pulses, prunes)\n• Daily walking\n• Toilet at the same time after breakfast","note":"See a doctor if new after 50, with blood, weight loss or severe pain. Check whether a medicine is the cause"}},{"id":"hemorrhoids","areas":["gastro"],"sev":"norm","el":{"n":"Αιμορροΐδες","s":["Κόκκινο αίμα στο χαρτί","Φαγούρα στον πρωκτό","Πρήξιμο ή «μπαλάκι»","Πόνος στην κένωση"],"aid":"• Φυτικές ίνες και νερό\n• Όχι πολύ ώρα στην τουαλέτα\n• Χλιαρά καθίσματα νερού","note":"Γιατρός για να αποκλειστεί άλλη αιτία αιμορραγίας, ειδικά μετά τα 45 ή με αλλαγή στις κενώσεις"},"en":{"n":"Haemorrhoids (piles)","s":["Bright red blood on paper","Anal itching","Swelling or lump","Pain on passing stool"],"aid":"• Fibre and water\n• Do not sit long on the toilet\n• Warm sitz baths","note":"See a doctor to rule out other causes of bleeding, especially after 45 or with bowel changes"}},{"id":"fissure","areas":["gastro"],"sev":"norm","el":{"n":"Ραγάδα πρωκτού","s":["Κοφτερός πόνος στην κένωση","Πόνος που κρατά ώρα μετά","Λίγο κόκκινο αίμα"],"aid":"• Μαλακά κόπρανα με ίνες και νερό\n• Χλιαρά καθίσματα","note":"Γιατρός αν δεν κλείσει σε 6 εβδομάδες"},"en":{"n":"Anal fissure","s":["Sharp pain when passing stool","Pain lasting a while after","A little bright red blood"],"aid":"• Soft stools with fibre and water\n• Warm sitz baths","note":"See a doctor if not healed in 6 weeks"}},{"id":"diverticulitis","areas":["gastro","senior"],"sev":"risk","el":{"n":"Εκκολπωματίτιδα","s":["Πόνος κάτω αριστερά στην κοιλιά","Πυρετός","Ναυτία","Αλλαγή στις κενώσεις"],"aid":"• Γιατρός ΣΗΜΕΡΑ\n• Ελαφριά υγρή διατροφή μέχρι την εξέταση","note":"Έντονος πόνος, ψηλός πυρετός ή αίμα: Επείγοντα"},"en":{"n":"Diverticulitis","s":["Pain in the lower left abdomen","Fever","Nausea","Change in bowel habit"],"aid":"• See a doctor TODAY\n• Light liquid diet until seen","note":"Severe pain, high fever or bleeding: go to A&E"}},{"id":"celiac","areas":["gastro","endo"],"sev":"caution","el":{"n":"Κοιλιοκάκη (δυσανεξία στη γλουτένη)","s":["Φουσκώματα","Διάρροια ή δυσκοιλιότητα","Κόπωση και αναιμία","Απώλεια βάρους","Εξάνθημα με φαγούρα"],"aid":"• ΜΗΝ κόψετε τη γλουτένη πριν την εξέταση αίματος — χαλάει το αποτέλεσμα","note":"Γαστρεντερολόγος — απλή εξέταση αίματος"},"en":{"n":"Coeliac disease (gluten)","s":["Bloating","Diarrhoea or constipation","Fatigue and anaemia","Weight loss","Itchy rash"],"aid":"• Do NOT cut out gluten before the blood test — it spoils the result","note":"Gastroenterologist — simple blood test"}},{"id":"lactose","areas":["gastro"],"sev":"norm","el":{"n":"Δυσανεξία στη λακτόζη","s":["Φούσκωμα μετά από γάλα","Αέρια","Διάρροια","Κοιλιακές κράμπες"],"aid":"• Δοκιμάστε γάλα χωρίς λακτόζη\n• Το γιαούρτι και το σκληρό τυρί συνήθως ανέχονται","note":"Γιατρός αν υπάρχει απώλεια βάρους ή αίμα"},"en":{"n":"Lactose intolerance","s":["Bloating after milk","Wind","Diarrhoea","Stomach cramps"],"aid":"• Try lactose-free milk\n• Yoghurt and hard cheese are usually tolerated","note":"See a doctor if weight loss or blood"}},{"id":"ibd","areas":["gastro"],"sev":"risk","el":{"n":"Φλεγμονώδης νόσος εντέρου (Crohn, Ελκώδης κολίτιδα)","s":["Διάρροια πάνω από 4 εβδομάδες","Αίμα ή βλέννα στα κόπρανα","Κοιλιακός πόνος","Απώλεια βάρους","Κόπωση"],"aid":"• Υγρά για να μην αφυδατωθείτε\n• Ημερολόγιο συμπτωμάτων","note":"Γαστρεντερολόγος ΣΥΝΤΟΜΑ"},"en":{"n":"Inflammatory bowel disease (Crohn’s, colitis)","s":["Diarrhoea over 4 weeks","Blood or mucus in stool","Abdominal pain","Weight loss","Fatigue"],"aid":"• Fluids to avoid dehydration\n• Symptom diary","note":"See a gastroenterologist SOON"}},{"id":"colonwarn","areas":["gastro","senior"],"sev":"risk","el":{"n":"Σημάδια που θέλουν έλεγχο εντέρου","s":["Αίμα στα κόπρανα ή μαύρα κόπρανα","Αλλαγή στις κενώσεις πάνω από 3 εβδομάδες","Αναιμία χωρίς λόγο","Απώλεια βάρους","Πόνος κοιλιάς"],"aid":"• Μην ντραπείτε — μιλήστε στον γιατρό","note":"Γιατρός ΣΥΝΤΟΜΑ. Από τα 45-50: προληπτικός έλεγχος (κολονοσκόπηση ή τεστ κοπράνων)"},"en":{"n":"Warning signs needing a bowel check","s":["Blood in stool or black stool","Change in bowel habit over 3 weeks","Unexplained anaemia","Weight loss","Abdominal pain"],"aid":"• Do not be embarrassed — tell your doctor","note":"See a doctor SOON. From age 45-50: screening (colonoscopy or stool test)"}},{"id":"gibleed","areas":["gastro"],"sev":"emer","el":{"n":"Αιμορραγία πεπτικού","s":["Εμετός με αίμα ή σαν «κατακάθι καφέ»","Μαύρα, πισσώδη κόπρανα","Ζάλη ή λιποθυμία","Ωχρότητα"],"aid":"• ΚΑΛΕΣΤΕ 112\n• Ξαπλώστε\n• Τίποτα από το στόμα","note":"Συχνότερα με αντιφλεγμονώδη, ασπιρίνη ή αντιπηκτικά"},"en":{"n":"Gastrointestinal bleeding","s":["Vomiting blood or “coffee grounds”","Black, tarry stools","Dizziness or fainting","Pallor"],"aid":"• CALL 112\n• Lie down\n• Nothing by mouth","note":"More common with anti-inflammatories, aspirin or blood thinners"}},{"id":"obstruction","areas":["gastro"],"sev":"emer","el":{"n":"Απόφραξη εντέρου","s":["Κοιλιακός πόνος σε κύματα","Φούσκωμα κοιλιάς","Εμετός","Δεν βγαίνουν αέρια ούτε κόπρανα"],"aid":"• Τμήμα επειγόντων ΑΜΕΣΑ\n• Τίποτα από το στόμα","note":"Χρειάζεται νοσοκομείο"},"en":{"n":"Bowel obstruction","s":["Cramping abdominal pain in waves","Swollen belly","Vomiting","No wind or stools passing"],"aid":"• Go to A&E NOW\n• Nothing by mouth","note":"Needs hospital care"}},{"id":"hernia","areas":["gastro","male"],"sev":"caution","el":{"n":"Κήλη (βουβωνοκήλη, ομφαλοκήλη)","s":["Πρήξιμο στη βουβωνική χώρα ή στον αφαλό","Μεγαλώνει όταν βήχετε ή σηκώνεστε","Ενόχληση ή βάρος"],"aid":"• Αποφύγετε βαριά σηκώματα\n• Μη σφίγγεστε στην τουαλέτα","note":"Χειρουργός. Σκληρό, πονεμένο πρήξιμο που δεν μπαίνει μέσα, με εμετό: Επείγοντα"},"en":{"n":"Hernia (groin, belly button)","s":["Bulge in the groin or belly button","Bigger when coughing or standing","Discomfort or heaviness"],"aid":"• Avoid heavy lifting\n• Do not strain on the toilet","note":"Surgeon. Hard, painful bulge that will not go back, with vomiting: go to A&E"}},{"id":"dysphagia","areas":["gastro","senior"],"sev":"risk","el":{"n":"Δυσκολία στην κατάποση (δυσφαγία)","s":["Το φαγητό «κολλάει»","Βήχας ή πνίξιμο όταν τρώτε","Πόνος στην κατάποση","Απώλεια βάρους"],"aid":"• Μικρές μπουκιές, καθιστός όρθιος\n• Μαλακά φαγητά","note":"Γιατρός ΣΥΝΤΟΜΑ — μετά από εγκεφαλικό ή αν χειροτερεύει χρειάζεται έλεγχο"},"en":{"n":"Difficulty swallowing (dysphagia)","s":["Food “sticks”","Coughing or choking when eating","Pain on swallowing","Weight loss"],"aid":"• Small bites, sitting upright\n• Soft foods","note":"See a doctor SOON — after a stroke or if worsening it needs checking"}},{"id":"cholecystitis","areas":["hepat"],"sev":"risk","el":{"n":"Χολοκυστίτιδα","s":["Πόνος δεξιά κάτω από τα πλευρά που κρατά ώρες","Πυρετός","Ναυτία και εμετός","Πόνος μετά από λιπαρό φαγητό"],"aid":"• Γιατρός ή Επείγοντα ΣΗΜΕΡΑ\n• Τίποτα λιπαρό","note":"Κιτρίνισμα ματιών ή ψηλός πυρετός: Επείγοντα"},"en":{"n":"Gallbladder inflammation (cholecystitis)","s":["Pain under the right ribs lasting hours","Fever","Nausea and vomiting","Pain after fatty food"],"aid":"• See a doctor or A&E TODAY\n• Nothing fatty","note":"Yellow eyes or high fever: go to A&E"}},{"id":"pancreatitis","areas":["hepat","gastro"],"sev":"emer","el":{"n":"Οξεία παγκρεατίτιδα","s":["Έντονος πόνος στο πάνω μέρος της κοιλιάς που πάει στην πλάτη","Εμετός","Πυρετός","Χειρότερα μετά από φαγητό ή αλκοόλ"],"aid":"• Τμήμα επειγόντων ΑΜΕΣΑ\n• Τίποτα από το στόμα","note":"Συχνές αιτίες: πέτρες χολής και αλκοόλ"},"en":{"n":"Acute pancreatitis","s":["Severe upper abdominal pain going to the back","Vomiting","Fever","Worse after food or alcohol"],"aid":"• Go to A&E NOW\n• Nothing by mouth","note":"Common causes: gallstones and alcohol"}},{"id":"hepatitisBC","areas":["hepat","gen"],"sev":"caution","el":{"n":"Ηπατίτιδα Β ή C","s":["Συχνά χωρίς συμπτώματα για χρόνια","Κόπωση","Κιτρίνισμα δέρματος ή ματιών","Σκούρα ούρα"],"aid":"• Ζητήστε απλή εξέταση αίματος\n• Μη μοιράζεστε ξυράφια ή οδοντόβουρτσες","note":"Γιατρός. Η ηπατίτιδα C θεραπεύεται πλήρως, για τη Β υπάρχει εμβόλιο"},"en":{"n":"Hepatitis B or C","s":["Often no symptoms for years","Fatigue","Yellow skin or eyes","Dark urine"],"aid":"• Ask for a simple blood test\n• Do not share razors or toothbrushes","note":"See a doctor. Hepatitis C is curable; there is a vaccine for B"}},{"id":"cirrhosis","areas":["hepat"],"sev":"risk","el":{"n":"Κίρρωση ήπατος","s":["Κόπωση","Πρησμένη κοιλιά","Κιτρίνισμα","Μελανιές εύκολα","Σύγχυση"],"aid":"• Καθόλου αλκοόλ\n• Προσοχή στα παυσίπονα — ρωτήστε γιατρό","note":"Ηπατολόγος. Εμετός με αίμα ή σύγχυση: 112"},"en":{"n":"Liver cirrhosis","s":["Fatigue","Swollen belly","Yellowing","Easy bruising","Confusion"],"aid":"• No alcohol at all\n• Care with painkillers — ask your doctor","note":"Liver specialist. Vomiting blood or confusion: call 112"}},{"id":"gilbert","areas":["hepat"],"sev":"norm","el":{"n":"Σύνδρομο Gilbert","s":["Ελαφρύ κιτρίνισμα ματιών με νηστεία, άγχος ή ίωση","Κατά τα άλλα καλά"],"aid":"• Τακτικά γεύματα\n• Αρκετό νερό","note":"Αθώα κατάσταση, αλλά το πρώτο κιτρίνισμα πρέπει να το δει γιατρός"},"en":{"n":"Gilbert’s syndrome","s":["Mild yellow eyes with fasting, stress or a virus","Otherwise well"],"aid":"• Regular meals\n• Enough water","note":"Harmless, but the first episode of yellowing should be checked by a doctor"}},{"id":"pyelo","areas":["urine"],"sev":"risk","el":{"n":"Πυελονεφρίτιδα (λοίμωξη νεφρού)","s":["Πόνος στη μέση στο πλάι","Ψηλός πυρετός με ρίγη","Τσούξιμο στην ούρηση","Ναυτία ή εμετός"],"aid":"• Γιατρός ΣΗΜΕΡΑ\n• Πολλά υγρά","note":"Χρειάζεται αντιβίωση. Σύγχυση ή πολύ χαμηλή πίεση: 112"},"en":{"n":"Kidney infection (pyelonephritis)","s":["Pain in the side of the back","High fever with chills","Burning urination","Nausea or vomiting"],"aid":"• See a doctor TODAY\n• Plenty of fluids","note":"Needs antibiotics. Confusion or very low pressure: call 112"}},{"id":"ckd","areas":["urine","senior","endo"],"sev":"risk","el":{"n":"Χρόνια νεφρική νόσος","s":["Συνήθως χωρίς συμπτώματα στην αρχή","Πρήξιμο στα πόδια","Κόπωση","Φαγούρα","Αλλαγή στα ούρα"],"aid":"• Έλεγχος κρεατινίνης και ούρων αν έχετε διαβήτη ή πίεση\n• Προσοχή στα αντιφλεγμονώδη","note":"Νεφρολόγος. Καλή ρύθμιση πίεσης και σακχάρου προστατεύει τα νεφρά"},"en":{"n":"Chronic kidney disease","s":["Usually no symptoms at first","Swollen legs","Fatigue","Itching","Change in urine"],"aid":"• Kidney blood and urine tests if diabetic or hypertensive\n• Care with anti-inflammatories","note":"Kidney specialist. Good blood pressure and sugar control protects the kidneys"}},{"id":"incontinence","areas":["urine","senior","gyn"],"sev":"norm","el":{"n":"Ακράτεια ούρων","s":["Διαφυγή ούρων στον βήχα ή γέλιο","Ξαφνική ανάγκη που δεν προλαβαίνετε","Συχνοουρία"],"aid":"• Ασκήσεις πυελικού εδάφους (Kegel)\n• Λιγότερος καφές\n• Τακτικό πρόγραμμα τουαλέτας","note":"Γιατρός, Ουρολόγος ή Γυναικολόγος — πολύ συχνό και θεραπεύσιμο, μην ντρέπεστε"},"en":{"n":"Urinary incontinence","s":["Leaking when coughing or laughing","Sudden urge you cannot hold","Frequent urination"],"aid":"• Pelvic floor (Kegel) exercises\n• Less coffee\n• Regular toilet schedule","note":"GP, Urologist or Gynaecologist — very common and treatable, do not be embarrassed"}},{"id":"retention","areas":["urine","male","senior"],"sev":"emer","el":{"n":"Οξεία επίσχεση ούρων","s":["Δεν μπορείτε να ουρήσετε καθόλου","Πόνος και φούσκωμα κάτω κοιλιά","Έντονη ανάγκη"],"aid":"• Τμήμα επειγόντων ΑΜΕΣΑ","note":"Συχνό σε άνδρες με προστάτη ή μετά από κάποια φάρμακα"},"en":{"n":"Acute urinary retention","s":["Cannot pass urine at all","Pain and swelling in the lower belly","Strong urge"],"aid":"• Go to A&E NOW","note":"Common in men with prostate enlargement or after some medicines"}},{"id":"hematuria","areas":["urine"],"sev":"risk","el":{"n":"Αίμα στα ούρα","s":["Ροζ, κόκκινα ή καφέ ούρα","Με ή χωρίς πόνο"],"aid":"• Πίνετε νερό\n• Σημειώστε αν φάγατε παντζάρια (βάφουν τα ούρα)","note":"Γιατρός ΣΥΝΤΟΜΑ, ακόμη κι αν σταμάτησε — ειδικά μετά τα 45 ή αν καπνίζετε"},"en":{"n":"Blood in urine","s":["Pink, red or brown urine","With or without pain"],"aid":"• Drink water\n• Note if you ate beetroot (it colours urine)","note":"See a doctor SOON, even if it stopped — especially over 45 or if you smoke"}},{"id":"oab","areas":["urine","senior"],"sev":"norm","el":{"n":"Υπερδραστήρια κύστη","s":["Συχνή ανάγκη για ούρηση","Ξυπνάτε πολλές φορές τη νύχτα","Ξαφνική επιτακτική ανάγκη"],"aid":"• Λιγότερα υγρά 2 ώρες πριν τον ύπνο\n• Λιγότερος καφές και αλκοόλ\n• Εκπαίδευση κύστης","note":"Γιατρός — ελέγξτε σάκχαρο και ουρολοίμωξη"},"en":{"n":"Overactive bladder","s":["Need to urinate often","Waking many times at night","Sudden urgent need"],"aid":"• Fewer drinks 2 hours before bed\n• Less coffee and alcohol\n• Bladder training","note":"See a doctor — check blood sugar and urine infection"}},{"id":"diabetes2","areas":["endo","senior"],"sev":"risk","el":{"n":"Διαβήτης τύπου 2","s":["Πολλή δίψα","Συχνοουρία","Κόπωση","Θολή όραση","Πληγές που αργούν να κλείσουν","Συχνές λοιμώξεις"],"aid":"• Κάντε το τεστ κινδύνου διαβήτη στην εφαρμογή\n• Μέτρηση σακχάρου νηστείας ή HbA1c\n• Περπάτημα 30 λεπτά τη μέρα, λιγότερη ζάχαρη και άσπρο ψωμί","note":"Γιατρός. Η έγκαιρη διάγνωση προστατεύει μάτια, νεφρά, καρδιά και πόδια"},"en":{"n":"Type 2 diabetes","s":["Much thirst","Frequent urination","Tiredness","Blurred vision","Slow-healing sores","Frequent infections"],"aid":"• Take the diabetes risk test in this app\n• Fasting glucose or HbA1c test\n• Walk 30 minutes a day, less sugar and white bread","note":"See a doctor. Early diagnosis protects eyes, kidneys, heart and feet"}},{"id":"diabetes1","areas":["endo","child"],"sev":"risk","el":{"n":"Διαβήτης τύπου 1","s":["Ξαφνική πολλή δίψα και ούρηση","Απώλεια βάρους παρά την πείνα","Κόπωση","Νυχτερινή ενούρηση σε παιδί","Αναπνοή που μυρίζει «φρούτο»"],"aid":"• Γιατρός ΣΗΜΕΡΑ — απλή μέτρηση σακχάρου","note":"Εμετός, βαριά αναπνοή ή υπνηλία: 112 (κετοξέωση)"},"en":{"n":"Type 1 diabetes","s":["Sudden great thirst and urination","Weight loss despite hunger","Tiredness","Bed-wetting in a child","Fruity-smelling breath"],"aid":"• See a doctor TODAY — simple blood sugar test","note":"Vomiting, heavy breathing or drowsiness: call 112 (ketoacidosis)"}},{"id":"prediabetes","areas":["endo"],"sev":"caution","el":{"n":"Προδιαβήτης","s":["Συνήθως χωρίς συμπτώματα","Σάκχαρο νηστείας 100-125","HbA1c 5,7-6,4%","Βάρος στην κοιλιά"],"aid":"• Χάσιμο 5-7% του βάρους μειώνει πολύ τον κίνδυνο\n• 150 λεπτά περπάτημα την εβδομάδα\n• Λιγότερα αναψυκτικά και γλυκά","note":"Γιατρός — επανέλεγχος κάθε χρόνο. Είναι η ευκαιρία να προλάβετε τον διαβήτη"},"en":{"n":"Prediabetes","s":["Usually no symptoms","Fasting glucose 100-125 mg/dL","HbA1c 5.7-6.4%","Weight around the waist"],"aid":"• Losing 5-7% of body weight greatly lowers risk\n• 150 minutes walking per week\n• Fewer soft drinks and sweets","note":"See a doctor — re-check yearly. It is the chance to prevent diabetes"}},{"id":"hypogly","areas":["endo","gen"],"sev":"emer","el":{"n":"Υπογλυκαιμία (πολύ χαμηλό σάκχαρο)","s":["Τρέμουλο και εφίδρωση","Ξαφνική πείνα","Σύγχυση ή παράξενη συμπεριφορά","Ταχυπαλμία","Σάκχαρο κάτω από 70"],"aid":"• Αν μπορεί να καταπιεί: 15 γρ. ζάχαρη (μισό ποτήρι χυμό ή 3-4 κουταλάκια ζάχαρη)\n• Ξαναμέτρηση σε 15 λεπτά\n• Αν είναι αναίσθητος: τίποτα από το στόμα, 112","note":"Συχνό σε όσους παίρνουν ινσουλίνη ή κάποια χάπια διαβήτη. Ενημερώστε τον γιατρό"},"en":{"n":"Hypoglycaemia (very low blood sugar)","s":["Shaking and sweating","Sudden hunger","Confusion or strange behaviour","Racing heart","Blood sugar below 70 mg/dL"],"aid":"• If able to swallow: 15 g sugar (half a glass of juice or 3-4 teaspoons sugar)\n• Re-check in 15 minutes\n• If unconscious: nothing by mouth, call 112","note":"Common in people on insulin or some diabetes tablets. Tell your doctor"}},{"id":"hypergly","areas":["endo"],"sev":"emer","el":{"n":"Πολύ υψηλό σάκχαρο (κετοξέωση / υπερωσμωτικό)","s":["Σάκχαρο πάνω από 300","Έντονη δίψα και ούρηση","Εμετός","Βαριά, γρήγορη αναπνοή","Υπνηλία ή σύγχυση"],"aid":"• Με εμετό, σύγχυση ή δύσπνοια: ΚΑΛΕΣΤΕ 112\n• Νερό αν μπορεί να πιει","note":"Χωρίς αυτά τα συμπτώματα: επικοινωνήστε με τον γιατρό σας σήμερα"},"en":{"n":"Very high blood sugar (DKA / hyperosmolar state)","s":["Blood sugar above 300 mg/dL","Intense thirst and urination","Vomiting","Heavy, fast breathing","Drowsiness or confusion"],"aid":"• With vomiting, confusion or breathlessness: CALL 112\n• Water if able to drink","note":"Without these symptoms: contact your doctor today"}},{"id":"hypothyroid","areas":["endo","senior"],"sev":"caution","el":{"n":"Υποθυρεοειδισμός (αργός θυρεοειδής)","s":["Κόπωση και νύστα","Κρυώνετε εύκολα","Αύξηση βάρους","Δυσκοιλιότητα","Ξηρό δέρμα, τριχόπτωση","Αργή σκέψη ή κακή διάθεση"],"aid":"• Απλή εξέταση αίματος TSH","note":"Ενδοκρινολόγος ή γιατρός — θεραπεύεται εύκολα με ένα χάπι την ημέρα"},"en":{"n":"Underactive thyroid (hypothyroidism)","s":["Tiredness and sleepiness","Feeling cold","Weight gain","Constipation","Dry skin, hair loss","Slow thinking or low mood"],"aid":"• Simple TSH blood test","note":"Endocrinologist or GP — easily treated with one daily tablet"}},{"id":"hyperthyroid","areas":["endo"],"sev":"caution","el":{"n":"Υπερθυρεοειδισμός (υπερδραστήριος θυρεοειδής)","s":["Ταχυπαλμία","Απώλεια βάρους με καλή όρεξη","Τρέμουλο χεριών","Εφίδρωση, ζεσταίνεστε","Νευρικότητα, αϋπνία","Γουρλωμένα μάτια"],"aid":"• Εξέταση αίματος TSH","note":"Ενδοκρινολόγος. Πολύ γρήγορος σφυγμός με πυρετό ή σύγχυση: 112"},"en":{"n":"Overactive thyroid (hyperthyroidism)","s":["Racing heart","Weight loss with good appetite","Shaky hands","Sweating, feeling hot","Nervousness, insomnia","Bulging eyes"],"aid":"• TSH blood test","note":"Endocrinologist. Very fast pulse with fever or confusion: call 112"}},{"id":"metabolic","areas":["endo","cardio"],"sev":"caution","el":{"n":"Παχυσαρκία / Μεταβολικό σύνδρομο","s":["Περίμετρος μέσης άνδρες >102 εκ., γυναίκες >88 εκ.","Υψηλή πίεση","Υψηλά τριγλυκερίδια","Υψηλό σάκχαρο"],"aid":"• Υπολογίστε τον Δείκτη Μάζας Σώματος στην εφαρμογή\n• Μεσογειακή διατροφή\n• Λίγη κίνηση κάθε μέρα — κάθε βήμα μετράει","note":"Γιατρός για έλεγχο σακχάρου, λιπιδίων και πίεσης. Χωρίς ενοχές — είναι ιατρικό θέμα"},"en":{"n":"Obesity / metabolic syndrome","s":["Waist over 102 cm (men) or 88 cm (women)","High blood pressure","High triglycerides","High blood sugar"],"aid":"• Calculate your BMI in this app\n• Mediterranean diet\n• A little movement every day — every step counts","note":"See a doctor for sugar, lipids and blood pressure checks. No guilt — it is a medical matter"}},{"id":"gout","areas":["endo","musc"],"sev":"caution","el":{"n":"Ουρική αρθρίτιδα","s":["Ξαφνικός πολύ έντονος πόνος σε άρθρωση, συχνά μεγάλο δάχτυλο ποδιού","Κόκκινη, ζεστή, πρησμένη άρθρωση","Ξεκινά συχνά τη νύχτα"],"aid":"• Ανάπαυση και πάγος (τυλιγμένος σε πανί)\n• Πολύ νερό\n• Λιγότερο κόκκινο κρέας, θαλασσινά, μπίρα","note":"Γιατρός. Με πυρετό: αποκλεισμός λοίμωξης άρθρωσης ΣΗΜΕΡΑ"},"en":{"n":"Gout","s":["Sudden very severe joint pain, often the big toe","Red, hot, swollen joint","Often starts at night"],"aid":"• Rest and ice (wrapped in cloth)\n• Plenty of water\n• Less red meat, seafood, beer","note":"See a doctor. With fever: rule out joint infection TODAY"}},{"id":"vitd","areas":["endo","senior"],"sev":"norm","el":{"n":"Έλλειψη βιταμίνης D","s":["Κόπωση","Πόνοι σε οστά και μύες","Μυϊκή αδυναμία","Συχνά χωρίς συμπτώματα"],"aid":"• Λίγος ήλιος στα χέρια (10-15 λεπτά, όχι το μεσημέρι)\n• Ψάρια, αυγά","note":"Γιατρός για εξέταση αίματος πριν πάρετε συμπληρώματα"},"en":{"n":"Vitamin D deficiency","s":["Tiredness","Bone and muscle aches","Muscle weakness","Often no symptoms"],"aid":"• A little sun on the arms (10-15 minutes, not midday)\n• Fish, eggs","note":"See a doctor for a blood test before taking supplements"}},{"id":"b12","areas":["endo","senior","head"],"sev":"caution","el":{"n":"Έλλειψη βιταμίνης Β12","s":["Κόπωση και ωχρότητα","Μούδιασμα στα πόδια","Αστάθεια","Προβλήματα μνήμης","Πονεμένη κόκκινη γλώσσα"],"aid":"• Ελέγξτε αν παίρνετε μετφορμίνη ή χάπια στομάχου — μειώνουν τη Β12\n• Χορτοφάγοι: πηγές Β12","note":"Γιατρός — απλή εξέταση αίματος, θεραπεύεται εύκολα"},"en":{"n":"Vitamin B12 deficiency","s":["Tiredness and pallor","Numb feet","Unsteadiness","Memory problems","Sore red tongue"],"aid":"• Check if you take metformin or stomach pills — they lower B12\n• Vegetarians: B12 sources","note":"See a doctor — simple blood test, easily treated"}},{"id":"osteoporosis","areas":["endo","musc","senior"],"sev":"caution","el":{"n":"Οστεοπόρωση","s":["Συνήθως χωρίς συμπτώματα μέχρι το κάταγμα","Μειωμένο ύψος","Καμπούρα","Κάταγμα από μικρή πτώση"],"aid":"• Ασβέστιο από γαλακτοκομικά και πράσινα λαχανικά\n• Περπάτημα και ασκήσεις ισορροπίας\n• Ασφαλές σπίτι κατά των πτώσεων","note":"Γιατρός για μέτρηση οστικής πυκνότητας (γυναίκες 65+, άνδρες 70+ ή νωρίτερα με παράγοντες κινδύνου)"},"en":{"n":"Osteoporosis","s":["Usually no symptoms until a fracture","Loss of height","Stooped back","Fracture from a minor fall"],"aid":"• Calcium from dairy and green vegetables\n• Walking and balance exercises\n• Fall-proof home","note":"See a doctor for a bone density scan (women 65+, men 70+, or earlier with risk factors)"}},{"id":"dehydration","areas":["gen","senior","child"],"sev":"risk","el":{"n":"Αφυδάτωση","s":["Δίψα (οι ηλικιωμένοι συχνά δεν διψούν)","Σκούρα, λίγα ούρα","Ζάλη","Ξηρό στόμα","Σύγχυση ή κόπωση"],"aid":"• Νερό σε μικρές συχνές γουλιές\n• Διάλυμα ενυδάτωσης από φαρμακείο σε διάρροια ή εμετό\n• Δροσερός χώρος","note":"Σύγχυση, λιποθυμία ή καθόλου ούρα για 8 ώρες: Επείγοντα. Βρέφη και ηλικιωμένοι κινδυνεύουν περισσότερο"},"en":{"n":"Dehydration","s":["Thirst (older people often do not feel thirsty)","Dark, little urine","Dizziness","Dry mouth","Confusion or fatigue"],"aid":"• Small frequent sips of water\n• Oral rehydration solution from the pharmacy in diarrhoea or vomiting\n• Cool place","note":"Confusion, fainting or no urine for 8 hours: go to A&E. Babies and older people are most at risk"}},{"id":"menopause","areas":["gyn","senior"],"sev":"norm","el":{"n":"Εμμηνόπαυση","s":["Εξάψεις και νυχτερινές εφιδρώσεις","Ακανόνιστη ή καθόλου περίοδος","Αλλαγές διάθεσης","Αϋπνία","Ξηρότητα κόλπου"],"aid":"• Ελαφριά ρούχα σε στρώσεις\n• Λιγότερος καφές, αλκοόλ, καυτερά\n• Άσκηση για οστά και διάθεση","note":"Γυναικολόγος για επιλογές θεραπείας. ΚΑΘΕ αιμορραγία μετά από 12 μήνες χωρίς περίοδο: γιατρός"},"en":{"n":"Menopause","s":["Hot flushes and night sweats","Irregular or no periods","Mood changes","Insomnia","Vaginal dryness"],"aid":"• Light layered clothing\n• Less coffee, alcohol, spicy food\n• Exercise for bones and mood","note":"Gynaecologist for treatment options. ANY bleeding after 12 months without periods: see a doctor"}},{"id":"endometriosis","areas":["gyn"],"sev":"caution","el":{"n":"Ενδομητρίωση","s":["Πολύ επώδυνες περίοδοι","Πόνος στην επαφή","Χρόνιος πυελικός πόνος","Δυσκολία σύλληψης"],"aid":"• Ημερολόγιο πόνου και κύκλου\n• Ζέστη στην κοιλιά","note":"Γυναικολόγος — ο έντονος πόνος περιόδου ΔΕΝ είναι «φυσιολογικός»"},"en":{"n":"Endometriosis","s":["Very painful periods","Pain during sex","Chronic pelvic pain","Difficulty conceiving"],"aid":"• Pain and cycle diary\n• Warmth on the belly","note":"Gynaecologist — severe period pain is NOT “normal”"}},{"id":"pcos","areas":["gyn","endo"],"sev":"caution","el":{"n":"Σύνδρομο πολυκυστικών ωοθηκών","s":["Ακανόνιστες περίοδοι","Ακμή","Τριχοφυΐα σε πρόσωπο ή σώμα","Αύξηση βάρους","Δυσκολία σύλληψης"],"aid":"• Υγιεινή διατροφή και κίνηση βοηθούν πολύ","note":"Γυναικολόγος ή Ενδοκρινολόγος — ελέγξτε και σάκχαρο"},"en":{"n":"Polycystic ovary syndrome (PCOS)","s":["Irregular periods","Acne","Excess facial or body hair","Weight gain","Difficulty conceiving"],"aid":"• Healthy diet and activity help a lot","note":"Gynaecologist or Endocrinologist — check blood sugar too"}},{"id":"breastlump","areas":["gyn"],"sev":"risk","el":{"n":"Ογκίδιο ή αλλαγή στο στήθος","s":["Ογκίδιο στο στήθος ή μασχάλη","Αλλαγή σχήματος","Δέρμα σαν «φλούδα πορτοκαλιού»","Θηλή που εισέχει ή υγρό/αίμα"],"aid":"• Αυτοεξέταση μία φορά τον μήνα\n• Μην περιμένετε να φύγει","note":"Γιατρός ΣΥΝΤΟΜΑ. Τα περισσότερα ογκίδια είναι καλοήθη, αλλά πρέπει να εξεταστούν. Και οι άνδρες μπορεί να έχουν"},"en":{"n":"Breast lump or change","s":["Lump in the breast or armpit","Change in shape","Skin like “orange peel”","Inverted nipple or discharge/blood"],"aid":"• Self-check once a month\n• Do not wait for it to go away","note":"See a doctor SOON. Most lumps are benign but must be checked. Men can be affected too"}},{"id":"mastitis","areas":["gyn"],"sev":"caution","el":{"n":"Μαστίτιδα","s":["Κόκκινο, ζεστό, πονεμένο σημείο στο στήθος","Πυρετός και ρίγη","Συχνά στον θηλασμό"],"aid":"• Συνεχίστε τον θηλασμό ή άντληση\n• Ζεστές κομπρέσες πριν, κρύες μετά\n• Ξεκούραση και υγρά","note":"Γιατρός αν δεν βελτιωθεί σε 24 ώρες ή έχετε πυρετό"},"en":{"n":"Mastitis","s":["Red, hot, painful area on the breast","Fever and chills","Often when breastfeeding"],"aid":"• Keep breastfeeding or pumping\n• Warm compresses before, cold after\n• Rest and fluids","note":"See a doctor if no better in 24 hours or with fever"}},{"id":"ectopic","areas":["gyn"],"sev":"emer","el":{"n":"Εξωμήτρια κύηση","s":["Πιθανή εγκυμοσύνη ή καθυστέρηση περιόδου","Πόνος στη μία πλευρά κάτω κοιλιά","Κολπική αιμορραγία","Πόνος στον ώμο","Ζάλη ή λιποθυμία"],"aid":"• ΚΑΛΕΣΤΕ 112 ή Επείγοντα ΑΜΕΣΑ","note":"Κίνδυνος ζωής από εσωτερική αιμορραγία"},"en":{"n":"Ectopic pregnancy","s":["Possible pregnancy or late period","One-sided lower abdominal pain","Vaginal bleeding","Shoulder-tip pain","Dizziness or fainting"],"aid":"• CALL 112 or go to A&E NOW","note":"Life-threatening internal bleeding risk"}},{"id":"abnbleed","areas":["gyn","senior"],"sev":"risk","el":{"n":"Ασυνήθιστη κολπική αιμορραγία","s":["Αιμορραγία μετά την εμμηνόπαυση","Αιμορραγία μετά την επαφή","Αιμορραγία ανάμεσα στις περιόδους","Πολύ βαριές περίοδοι"],"aid":"• Σημειώστε ημερομηνίες και ποσότητα","note":"Γυναικολόγος ΣΥΝΤΟΜΑ — ειδικά η αιμορραγία μετά την εμμηνόπαυση πρέπει πάντα να ελέγχεται"},"en":{"n":"Abnormal vaginal bleeding","s":["Bleeding after menopause","Bleeding after sex","Bleeding between periods","Very heavy periods"],"aid":"• Note dates and amount","note":"Gynaecologist SOON — bleeding after menopause must always be checked"}},{"id":"pms","areas":["gyn"],"sev":"norm","el":{"n":"Προεμμηνορροϊκό σύνδρομο","s":["Ευερεθιστότητα ή λύπη πριν την περίοδο","Φούσκωμα","Ευαισθησία στο στήθος","Λιγούρες"],"aid":"• Άσκηση\n• Λιγότερο αλάτι και καφές\n• Καλός ύπνος","note":"Γιατρός αν επηρεάζει σοβαρά δουλειά ή σχέσεις"},"en":{"n":"Premenstrual syndrome (PMS)","s":["Irritability or sadness before the period","Bloating","Breast tenderness","Cravings"],"aid":"• Exercise\n• Less salt and coffee\n• Good sleep","note":"See a doctor if it seriously affects work or relationships"}},{"id":"fibroids","areas":["gyn"],"sev":"caution","el":{"n":"Ινομυώματα μήτρας","s":["Βαριές ή μακριές περίοδοι","Πίεση ή βάρος κάτω κοιλιά","Συχνοουρία","Αναιμία"],"aid":"• Ημερολόγιο περιόδου\n• Τροφές με σίδηρο","note":"Γυναικολόγος — υπέρηχος"},"en":{"n":"Uterine fibroids","s":["Heavy or long periods","Pressure or heaviness in lower belly","Frequent urination","Anaemia"],"aid":"• Period diary\n• Iron-rich foods","note":"Gynaecologist — ultrasound"}},{"id":"pid","areas":["gyn"],"sev":"risk","el":{"n":"Φλεγμονώδης νόσος πυέλου","s":["Πόνος κάτω κοιλιά","Ασυνήθιστα υγρά κόλπου","Πυρετός","Πόνος στην επαφή"],"aid":"• Γιατρός ΣΗΜΕΡΑ — χρειάζεται αντιβίωση","note":"Χωρίς θεραπεία μπορεί να προκαλέσει υπογονιμότητα"},"en":{"n":"Pelvic inflammatory disease","s":["Lower abdominal pain","Unusual vaginal discharge","Fever","Pain during sex"],"aid":"• See a doctor TODAY — needs antibiotics","note":"Untreated it can cause infertility"}},{"id":"preeclampsia","areas":["gyn"],"sev":"emer","el":{"n":"Προεκλαμψία (εγκυμοσύνη)","s":["Έγκυος μετά την 20ή εβδομάδα","Έντονος πονοκέφαλος","Θόλωση ή λάμψεις στην όραση","Ξαφνικό πρήξιμο προσώπου και χεριών","Πόνος κάτω από τα πλευρά δεξιά"],"aid":"• Επικοινωνήστε ΑΜΕΣΑ με μαιευτήριο ή 112\n• Μετρήστε την πίεση","note":"Επικίνδυνο για μητέρα και μωρό"},"en":{"n":"Pre-eclampsia (pregnancy)","s":["Pregnant after 20 weeks","Severe headache","Blurred vision or flashing lights","Sudden swelling of face and hands","Pain below the right ribs"],"aid":"• Contact the maternity unit or 112 AT ONCE\n• Measure blood pressure","note":"Dangerous for mother and baby"}},{"id":"sti","areas":["gyn","male"],"sev":"caution","el":{"n":"Σεξουαλικώς μεταδιδόμενα νοσήματα","s":["Ασυνήθιστα υγρά","Τσούξιμο στην ούρηση","Πληγές ή φουσκάλες στα γεννητικά όργανα","Φαγούρα","Συχνά χωρίς συμπτώματα"],"aid":"• Όχι επαφή μέχρι τον έλεγχο\n• Προφυλακτικό","note":"Γιατρός ή κλινική — εξετάσεις εμπιστευτικά. Ενημερώστε τον σύντροφο"},"en":{"n":"Sexually transmitted infections","s":["Unusual discharge","Burning on urination","Sores or blisters on the genitals","Itching","Often no symptoms"],"aid":"• No sex until tested\n• Condoms","note":"Doctor or clinic — confidential testing. Inform your partner"}},{"id":"torsion","areas":["male","child"],"sev":"emer","el":{"n":"Συστροφή όρχεως","s":["Ξαφνικός πολύ έντονος πόνος στον όρχι","Πρήξιμο","Ναυτία και εμετός","Συχνά σε εφήβους"],"aid":"• Τμήμα επειγόντων ΑΜΕΣΑ — χρόνος 6 ωρών για να σωθεί ο όρχις","note":"Μην περιμένετε να περάσει"},"en":{"n":"Testicular torsion","s":["Sudden very severe testicle pain","Swelling","Nausea and vomiting","Often in teenagers"],"aid":"• Go to A&E NOW — about 6 hours to save the testicle","note":"Do not wait for it to pass"}},{"id":"ed","areas":["male","cardio"],"sev":"caution","el":{"n":"Στυτική δυσλειτουργία","s":["Δυσκολία στη στύση","Μειωμένη επιθυμία"],"aid":"• Διακοπή καπνίσματος\n• Άσκηση\n• Λιγότερο αλκοόλ","note":"Ουρολόγος ή γιατρός — μπορεί να είναι πρώιμο σημάδι καρδιάς, διαβήτη ή πίεσης. Μην αγοράζετε χάπια από το ίντερνετ"},"en":{"n":"Erectile dysfunction","s":["Difficulty getting an erection","Reduced desire"],"aid":"• Stop smoking\n• Exercise\n• Less alcohol","note":"Urologist or GP — can be an early sign of heart disease, diabetes or high blood pressure. Do not buy pills online"}},{"id":"prostatitis","areas":["male"],"sev":"caution","el":{"n":"Προστατίτιδα","s":["Πόνος στο περίνεο ή χαμηλά στη μέση","Τσούξιμο στην ούρηση","Πυρετός","Δύσκολη ούρηση"],"aid":"• Υγρά\n• Γιατρός σύντομα","note":"Ουρολόγος. Ψηλός πυρετός και δεν ουρείτε: Επείγοντα"},"en":{"n":"Prostatitis","s":["Pain between scrotum and anus or low back","Burning on urination","Fever","Difficult urination"],"aid":"• Fluids\n• See a doctor soon","note":"Urologist. High fever and unable to urinate: go to A&E"}},{"id":"prostatewarn","areas":["male","senior"],"sev":"risk","el":{"n":"Σημάδια που θέλουν έλεγχο προστάτη","s":["Αδύναμη ροή ούρων","Συχνή νυχτερινή ούρηση","Αίμα στα ούρα ή στο σπέρμα","Πόνος στα οστά ή χαμηλά στη μέση"],"aid":"• Σημειώστε πόσες φορές σηκώνεστε τη νύχτα","note":"Ουρολόγος. Από τα 50 (45 με οικογενειακό ιστορικό): συζητήστε με τον γιατρό το τεστ PSA"},"en":{"n":"Warning signs needing a prostate check","s":["Weak urine flow","Frequent night urination","Blood in urine or semen","Bone or low back pain"],"aid":"• Note how often you get up at night","note":"Urologist. From 50 (45 with family history): discuss the PSA test with your doctor"}},{"id":"testislump","areas":["male"],"sev":"risk","el":{"n":"Ογκίδιο στον όρχι","s":["Σκληρό ογκίδιο χωρίς πόνο","Βάρος στο όσχεο","Αλλαγή μεγέθους"],"aid":"• Αυτοεξέταση μία φορά τον μήνα στο ντους","note":"Ουρολόγος ΣΥΝΤΟΜΑ — συχνότερος σε νέους 15-40, θεραπεύεται πολύ καλά νωρίς"},"en":{"n":"Testicular lump","s":["Hard painless lump","Heaviness in the scrotum","Change in size"],"aid":"• Self-check monthly in the shower","note":"Urologist SOON — commonest at 15-40, very treatable early"}},{"id":"balanitis","areas":["male"],"sev":"norm","el":{"n":"Βαλανίτιδα","s":["Κοκκίνισμα και φαγούρα στο πέος","Υγρό","Τσούξιμο"],"aid":"• Καθαρισμός με χλιαρό νερό χωρίς σαπούνι\n• Καλό στέγνωμα","note":"Γιατρός αν επιμένει. Αν επανέρχεται: ελέγξτε σάκχαρο"},"en":{"n":"Balanitis","s":["Redness and itching of the penis tip","Discharge","Soreness"],"aid":"• Clean with warm water without soap\n• Dry well","note":"See a doctor if persistent. If recurring: check blood sugar"}},{"id":"neckpain","areas":["musc"],"sev":"norm","el":{"n":"Αυχενικό σύνδρομο","s":["Πόνος και δυσκαμψία στον αυχένα","Πόνος προς τους ώμους","Πονοκέφαλος από πίσω","Χειρότερα με κινητό ή υπολογιστή"],"aid":"• Ζέστη και ήπιες κινήσεις\n• Οθόνη στο ύψος των ματιών\n• Σωστό μαξιλάρι","note":"Γιατρός αν απλώνεται στο χέρι με μούδιασμα ή αδυναμία. Με πυρετό και δυσκαμψία: μηνιγγίτιδα — 112"},"en":{"n":"Neck pain","s":["Pain and stiffness in the neck","Pain into the shoulders","Headache from the back","Worse with phone or computer"],"aid":"• Heat and gentle movement\n• Screen at eye level\n• Proper pillow","note":"See a doctor if it spreads into the arm with numbness or weakness. With fever and stiffness: meningitis — call 112"}},{"id":"sciatica","areas":["musc"],"sev":"caution","el":{"n":"Ισχιαλγία","s":["Πόνος από τη μέση προς τον γλουτό και το πόδι","Μούδιασμα ή τσιμπήματα στο πόδι","Χειρότερα όταν κάθεστε ή βήχετε"],"aid":"• Συνεχίστε ήπια κίνηση και περπάτημα\n• Ζέστη\n• Αποφύγετε πολλή ακινησία","note":"Γιατρός. Μούδιασμα στα γεννητικά, πρόβλημα ούρησης ή αδυναμία στα πόδια: Επείγοντα (δείτε «Ιππουρίδα»)"},"en":{"n":"Sciatica","s":["Pain from the low back to buttock and leg","Numbness or tingling in the leg","Worse sitting or coughing"],"aid":"• Keep gently moving and walking\n• Heat\n• Avoid long bed rest","note":"See a doctor. Numb groin, bladder problems or leg weakness: A&E (see “Cauda equina”)"}},{"id":"cauda","areas":["musc"],"sev":"emer","el":{"n":"Σύνδρομο ιππουρίδας","s":["Πόνος μέσης με μούδιασμα στα γεννητικά ή «σέλα»","Δυσκολία ή απώλεια ελέγχου ούρων ή κοπράνων","Αδυναμία και στα δύο πόδια"],"aid":"• Τμήμα επειγόντων ΑΜΕΣΑ","note":"Χρειάζεται επείγουσα επέμβαση για να μη μείνει μόνιμη βλάβη"},"en":{"n":"Cauda equina syndrome","s":["Back pain with numbness in the groin/“saddle” area","Difficulty or loss of bladder or bowel control","Weakness in both legs"],"aid":"• Go to A&E NOW","note":"Needs urgent surgery to prevent permanent damage"}},{"id":"rheumatoid","areas":["musc"],"sev":"caution","el":{"n":"Ρευματοειδής αρθρίτιδα","s":["Πόνος και πρήξιμο σε μικρές αρθρώσεις χεριών και ποδιών","Και στις δύο πλευρές","Πρωινή δυσκαμψία πάνω από 1 ώρα","Κόπωση"],"aid":"• Ήπια άσκηση\n• Ζέστη το πρωί","note":"Ρευματολόγος ΝΩΡΙΣ — η έγκαιρη θεραπεία προλαμβάνει την καταστροφή των αρθρώσεων"},"en":{"n":"Rheumatoid arthritis","s":["Pain and swelling in small joints of hands and feet","Both sides","Morning stiffness over 1 hour","Fatigue"],"aid":"• Gentle exercise\n• Warmth in the morning","note":"Rheumatologist EARLY — early treatment prevents joint damage"}},{"id":"frozenshoulder","areas":["musc"],"sev":"norm","el":{"n":"Παγωμένος ώμος","s":["Πόνος στον ώμο","Δυσκολία να σηκώσετε το χέρι ή να το φέρετε πίσω","Χειρότερα τη νύχτα"],"aid":"• Ήπιες ασκήσεις κινητικότητας κάθε μέρα\n• Ζέστη","note":"Γιατρός ή Φυσικοθεραπευτής. Πιο συχνό σε διαβητικούς"},"en":{"n":"Frozen shoulder","s":["Shoulder pain","Hard to lift the arm or reach behind","Worse at night"],"aid":"• Gentle mobility exercises daily\n• Heat","note":"GP or physiotherapist. More common in diabetics"}},{"id":"tendinitis","areas":["musc"],"sev":"norm","el":{"n":"Τενοντίτιδα (π.χ. «αγκώνας του τενίστα»)","s":["Πόνος σε συγκεκριμένο σημείο κοντά σε άρθρωση","Χειρότερα στην κίνηση","Ευαισθησία στο άγγιγμα"],"aid":"• Ξεκούραση από την κίνηση που πονά\n• Πάγος 15 λεπτά\n• Σταδιακή επιστροφή","note":"Γιατρός ή Φυσικοθεραπευτής αν κρατά πάνω από 6 εβδομάδες"},"en":{"n":"Tendinitis (e.g. tennis elbow)","s":["Pain at a specific spot near a joint","Worse with movement","Tender to touch"],"aid":"• Rest from the painful movement\n• Ice for 15 minutes\n• Gradual return","note":"GP or physiotherapist if over 6 weeks"}},{"id":"plantar","areas":["musc"],"sev":"norm","el":{"n":"Πελματιαία απονευρωσίτιδα («άκανθα»)","s":["Πόνος στη φτέρνα","Χειρότερος στα πρώτα βήματα το πρωί","Βελτιώνεται με το περπάτημα"],"aid":"• Διατάσεις γάμπας και πέλματος\n• Καλά παπούτσια με στήριξη\n• Κύλισμα μπουκαλιού με πάγο κάτω από το πέλμα","note":"Γιατρός ή Ορθοπαιδικός αν κρατά πάνω από 2 μήνες"},"en":{"n":"Plantar fasciitis (heel pain)","s":["Heel pain","Worst with first steps in the morning","Eases with walking"],"aid":"• Calf and foot stretches\n• Supportive shoes\n• Roll a frozen bottle under the foot","note":"GP or orthopaedist if over 2 months"}},{"id":"fracture","areas":["musc","senior"],"sev":"risk","el":{"n":"Κάταγμα","s":["Έντονος πόνος μετά από πτώση ή χτύπημα","Πρήξιμο και μελανιά","Παραμόρφωση","Δεν μπορείτε να στηρίξετε βάρος"],"aid":"• Ακινητοποίηση με νάρθηκα ή μαξιλάρι\n• Πάγος τυλιγμένος\n• Επείγοντα για ακτινογραφία","note":"Κόκαλο που βγαίνει ή κρύο, χλωμό χέρι/πόδι: 112"},"en":{"n":"Fracture (broken bone)","s":["Severe pain after a fall or blow","Swelling and bruising","Deformity","Cannot bear weight"],"aid":"• Immobilise with a splint or pillow\n• Wrapped ice\n• Go to A&E for an X-ray","note":"Bone breaking the skin or cold, pale limb: call 112"}},{"id":"hipfracture","areas":["musc","senior"],"sev":"emer","el":{"n":"Κάταγμα ισχίου μετά από πτώση","s":["Πόνος στο ισχίο ή βουβωνική χώρα μετά από πτώση","Δεν μπορεί να σταθεί","Το πόδι είναι πιο κοντό και γυρισμένο προς τα έξω"],"aid":"• ΚΑΛΕΣΤΕ 112\n• Μην τον σηκώσετε με τη βία\n• Κουβέρτα για ζέστη","note":"Συχνό σε ηλικιωμένους με οστεοπόρωση. Μετά: πρόληψη πτώσεων"},"en":{"n":"Hip fracture after a fall","s":["Hip or groin pain after a fall","Cannot stand","Leg shorter and turned outwards"],"aid":"• CALL 112\n• Do not force them up\n• Blanket for warmth","note":"Common in older people with osteoporosis. Afterwards: fall prevention"}},{"id":"fibromyalgia","areas":["musc","psy"],"sev":"caution","el":{"n":"Ινομυαλγία","s":["Διάχυτος πόνος σε όλο το σώμα πάνω από 3 μήνες","Έντονη κόπωση","Κακός ύπνος","Δυσκολία συγκέντρωσης"],"aid":"• Σταδιακή ήπια άσκηση (περπάτημα, κολύμπι)\n• Πρόγραμμα ύπνου\n• Διαχείριση άγχους","note":"Γιατρός ή Ρευματολόγος — πρώτα αποκλείονται άλλες αιτίες"},"en":{"n":"Fibromyalgia","s":["Widespread body pain over 3 months","Severe fatigue","Poor sleep","Poor concentration"],"aid":"• Gradual gentle exercise (walking, swimming)\n• Sleep routine\n• Stress management","note":"GP or rheumatologist — other causes are ruled out first"}},{"id":"pmr","areas":["musc","senior"],"sev":"caution","el":{"n":"Ρευματική πολυμυαλγία","s":["Πόνος και δυσκαμψία στους ώμους και τους γοφούς","Χειρότερα το πρωί","Συνήθως μετά τα 50","Κόπωση"],"aid":"• Γιατρός για εξέταση αίματος","note":"Αν μαζί υπάρχει πονοκέφαλος ή πρόβλημα όρασης: κροταφική αρτηρίτιδα — γιατρός ΣΗΜΕΡΑ"},"en":{"n":"Polymyalgia rheumatica","s":["Pain and stiffness in shoulders and hips","Worse in the morning","Usually after 50","Fatigue"],"aid":"• See a doctor for a blood test","note":"With headache or vision problems: temporal arteritis — see a doctor TODAY"}},{"id":"bursitis","areas":["musc"],"sev":"norm","el":{"n":"Θυλακίτιδα","s":["Πρήξιμο και πόνος σε γόνατο, αγκώνα ή ισχίο","Πόνος όταν ξαπλώνετε από εκείνη την πλευρά"],"aid":"• Ξεκούραση\n• Πάγος\n• Αποφύγετε την πίεση στο σημείο","note":"Γιατρός αν είναι κόκκινο, ζεστό ή έχετε πυρετό (λοίμωξη)"},"en":{"n":"Bursitis","s":["Swelling and pain at knee, elbow or hip","Pain lying on that side"],"aid":"• Rest\n• Ice\n• Avoid pressure on the spot","note":"See a doctor if red, hot or with fever (infection)"}},{"id":"kneeoa","areas":["musc","senior"],"sev":"norm","el":{"n":"Οστεοαρθρίτιδα γόνατος ή ισχίου (φθορά)","s":["Πόνος στο περπάτημα και τις σκάλες","Δυσκαμψία μετά την ακινησία","Τρίξιμο","Πρήξιμο"],"aid":"• Ενδυνάμωση μηρών\n• Απώλεια βάρους ελαφρύνει το γόνατο\n• Μπαστούνι στο αντίθετο χέρι","note":"Ορθοπαιδικός ή Φυσικοθεραπευτής"},"en":{"n":"Knee or hip osteoarthritis (wear and tear)","s":["Pain walking and on stairs","Stiffness after rest","Creaking","Swelling"],"aid":"• Strengthen thigh muscles\n• Weight loss eases the knee\n• Walking stick in the opposite hand","note":"Orthopaedist or physiotherapist"}},{"id":"psoriasis","areas":["skin"],"sev":"caution","el":{"n":"Ψωρίαση","s":["Κόκκινες πλάκες με ασημί λέπια","Αγκώνες, γόνατα, τριχωτό κεφαλής","Φαγούρα","Αλλαγές στα νύχια","Πόνος σε αρθρώσεις"],"aid":"• Ενυδατική κρέμα κάθε μέρα\n• Λίγος ήλιος βοηθά\n• Αποφύγετε το ξύσιμο","note":"Δερματολόγος — υπάρχουν πολύ καλές θεραπείες. Πόνος σε αρθρώσεις: Ρευματολόγος"},"en":{"n":"Psoriasis","s":["Red patches with silvery scales","Elbows, knees, scalp","Itching","Nail changes","Joint pain"],"aid":"• Moisturiser every day\n• A little sun helps\n• Avoid scratching","note":"Dermatologist — very good treatments exist. Joint pain: rheumatologist"}},{"id":"cellulitis","areas":["skin","senior"],"sev":"risk","el":{"n":"Κυτταρίτιδα (λοίμωξη δέρματος)","s":["Κόκκινο, ζεστό, πρησμένο δέρμα που απλώνεται","Πόνος","Πυρετός ή ρίγη","Συχνά στο πόδι"],"aid":"• Σημαδέψτε με στυλό τα όρια του κοκκινίσματος\n• Πόδι ψηλά\n• Γιατρός ΣΗΜΕΡΑ","note":"Χρειάζεται αντιβίωση. Απλώνεται γρήγορα ή ψηλός πυρετός: Επείγοντα"},"en":{"n":"Cellulitis (skin infection)","s":["Red, hot, swollen skin that spreads","Pain","Fever or chills","Often on the leg"],"aid":"• Mark the edge of the redness with a pen\n• Raise the leg\n• See a doctor TODAY","note":"Needs antibiotics. Spreading fast or high fever: go to A&E"}},{"id":"bcc","areas":["skin","senior"],"sev":"caution","el":{"n":"Καρκίνος δέρματος (βασικοκυτταρικό / ακανθοκυτταρικό)","s":["Γυαλιστερό «μαργαριταρένιο» ογκίδιο","Πληγή που ματώνει και δεν κλείνει","Τραχιά λεπιώδης κηλίδα","Σε σημεία που βλέπουν ήλιο"],"aid":"• Αντηλιακό και καπέλο\n• Φωτογραφίστε το σημείο στο «Ημερολόγιο φωτογραφιών»","note":"Δερματολόγος ΣΥΝΤΟΜΑ — θεραπεύεται πολύ καλά όταν βρεθεί νωρίς"},"en":{"n":"Skin cancer (basal or squamous cell)","s":["Shiny “pearly” bump","Sore that bleeds and does not heal","Rough scaly patch","On sun-exposed areas"],"aid":"• Sunscreen and hat\n• Photograph the spot in the “Photo diary”","note":"Dermatologist SOON — very curable when found early"}},{"id":"impetigo","areas":["skin","child"],"sev":"norm","el":{"n":"Μολυσματικό κηρίο","s":["Κόκκινες πληγές γύρω από μύτη και στόμα","Κρούστες χρώματος μελιού","Φαγούρα","Μεταδίδεται εύκολα"],"aid":"• Πλύσιμο με σαπούνι και νερό\n• Ξεχωριστή πετσέτα\n• Κομμένα νύχια","note":"Γιατρός για αντιβιοτική κρέμα. Παιδί στο σπίτι μέχρι να ξεραθούν οι πληγές"},"en":{"n":"Impetigo","s":["Red sores around nose and mouth","Honey-coloured crusts","Itching","Spreads easily"],"aid":"• Wash with soap and water\n• Separate towel\n• Short nails","note":"See a doctor for antibiotic cream. Keep child home until sores crust over"}},{"id":"scabies","areas":["skin"],"sev":"norm","el":{"n":"Ψώρα","s":["Έντονη φαγούρα, χειρότερη τη νύχτα","Μικρά σπυράκια και γραμμούλες","Ανάμεσα στα δάχτυλα, καρπούς, μέση","Φαγούρα και σε άλλους στο σπίτι"],"aid":"• Θεραπεία ΟΛΟΙ στο σπίτι ταυτόχρονα\n• Πλύσιμο σεντονιών και ρούχων στους 60°C","note":"Γιατρός ή φαρμακοποιός για ειδική κρέμα"},"en":{"n":"Scabies","s":["Intense itch, worse at night","Small spots and tiny lines","Between fingers, wrists, waist","Others at home itch too"],"aid":"• Treat EVERYONE at home at the same time\n• Wash sheets and clothes at 60°C","note":"Doctor or pharmacist for the special cream"}},{"id":"coldsore","areas":["skin","ent"],"sev":"norm","el":{"n":"Επιχείλιος έρπης","s":["Τσούξιμο στο χείλος","Μικρές φουσκάλες","Κρούστα σε λίγες μέρες","Επανέρχεται με άγχος, ήλιο ή κρυολόγημα"],"aid":"• Αντιιική κρέμα από φαρμακείο με το πρώτο τσούξιμο\n• Μη φιλάτε μωρά\n• Αντηλιακό χειλιών","note":"Γιατρός αν είναι κοντά στο μάτι ή πολύ συχνό"},"en":{"n":"Cold sore","s":["Tingling on the lip","Small blisters","Crust in a few days","Returns with stress, sun or colds"],"aid":"• Antiviral cream from the pharmacy at the first tingle\n• Do not kiss babies\n• Lip sunscreen","note":"See a doctor if near the eye or very frequent"}},{"id":"rosacea","areas":["skin"],"sev":"norm","el":{"n":"Ροδόχρους νόσος","s":["Κοκκίνισμα στο πρόσωπο","Ορατά αγγειάκια","Σπυράκια χωρίς μαύρα στίγματα","Χειρότερα με ζέστη, αλκοόλ, καυτερά"],"aid":"• Αντηλιακό\n• Ήπιος καθαρισμός\n• Σημειώστε τι το χειροτερεύει","note":"Δερματολόγος"},"en":{"n":"Rosacea","s":["Facial redness","Visible small vessels","Spots without blackheads","Worse with heat, alcohol, spicy food"],"aid":"• Sunscreen\n• Gentle cleansing\n• Note what triggers it","note":"Dermatologist"}},{"id":"sunburn","areas":["skin"],"sev":"norm","el":{"n":"Ηλιακό έγκαυμα","s":["Κόκκινο, ζεστό δέρμα","Πόνος","Φουσκάλες","Πονοκέφαλος"],"aid":"• Δροσερό ντους\n• Ενυδατική με αλόη\n• Πολύ νερό\n• Όχι ήλιο μέχρι να γιάνει","note":"Γιατρός με εκτεταμένες φουσκάλες, πυρετό ή σύγχυση (θερμοπληξία)"},"en":{"n":"Sunburn","s":["Red, hot skin","Pain","Blisters","Headache"],"aid":"• Cool shower\n• Aloe moisturiser\n• Plenty of water\n• No sun until healed","note":"See a doctor with extensive blisters, fever or confusion (heat stroke)"}},{"id":"burn","areas":["skin","gen"],"sev":"caution","el":{"n":"Έγκαυμα","s":["Κόκκινο ή άσπρο δέρμα μετά από ζέστη, νερό ή χημικό","Φουσκάλες","Πόνος"],"aid":"• Δροσερό τρεχούμενο νερό για 20 λεπτά\n• Βγάλτε δαχτυλίδια\n• Καλύψτε με διαφανή μεμβράνη\n• ΟΧΙ πάγο, βούτυρο, οδοντόκρεμα","note":"Επείγοντα: μεγάλο έγκαυμα, σε πρόσωπο, χέρια, γεννητικά, ηλεκτρικό ή χημικό, σε παιδί ή ηλικιωμένο"},"en":{"n":"Burn","s":["Red or white skin after heat, water or chemical","Blisters","Pain"],"aid":"• Cool running water for 20 minutes\n• Remove rings\n• Cover with cling film\n• NO ice, butter, toothpaste","note":"A&E: large burn, on face, hands, genitals, electrical or chemical, in a child or older person"}},{"id":"pressureulcer","areas":["skin","senior"],"sev":"risk","el":{"n":"Κατάκλιση (έλκος πίεσης)","s":["Κόκκινο σημείο που δεν ξεθωριάζει με πίεση","Σε φτέρνες, ιερό οστό, γοφούς","Ανοιχτή πληγή","Σε κατάκοιτο ή καθηλωμένο"],"aid":"• Αλλαγή θέσης κάθε 2 ώρες\n• Ειδικό στρώμα\n• Καθαρό, στεγνό δέρμα\n• Καλή διατροφή και νερό","note":"Γιατρός ή νοσηλευτής για φροντίδα. Μυρωδιά ή πυρετός: λοίμωξη"},"en":{"n":"Pressure ulcer (bedsore)","s":["Red spot that does not fade when pressed","On heels, tailbone, hips","Open wound","In bedbound or chair-bound person"],"aid":"• Change position every 2 hours\n• Special mattress\n• Clean, dry skin\n• Good nutrition and fluids","note":"Doctor or nurse for wound care. Smell or fever: infection"}},{"id":"fungalfoot","areas":["skin"],"sev":"norm","el":{"n":"Μύκητες ποδιών και νυχιών","s":["Φαγούρα και ξεφλούδισμα ανάμεσα στα δάχτυλα","Κιτρινωπά, χοντρά νύχια","Κακοσμία"],"aid":"• Καλό στέγνωμα ανάμεσα στα δάχτυλα\n• Βαμβακερές κάλτσες\n• Σαγιονάρες σε κοινόχρηστα ντους","note":"Φαρμακοποιός ή Δερματολόγος. Διαβητικοί: δείτε γιατρό νωρίς"},"en":{"n":"Athlete’s foot and nail fungus","s":["Itch and peeling between toes","Yellowish, thick nails","Odour"],"aid":"• Dry well between toes\n• Cotton socks\n• Flip-flops in shared showers","note":"Pharmacist or dermatologist. Diabetics: see a doctor early"}},{"id":"warts","areas":["skin"],"sev":"norm","el":{"n":"Κονδυλώματα / Μυρμηγκιές","s":["Μικρά σκληρά ογκίδια με τραχιά επιφάνεια","Στα χέρια ή τις πατούσες","Μαύρες τελίτσες"],"aid":"• Συνήθως φεύγουν μόνες τους\n• Μη τις ξύνετε","note":"Δερματολόγος αν πονούν, πολλαπλασιάζονται ή είναι στο πρόσωπο ή γεννητικά"},"en":{"n":"Warts / verrucas","s":["Small hard bumps with rough surface","On hands or soles","Tiny black dots"],"aid":"• Often go away on their own\n• Do not pick them","note":"Dermatologist if painful, spreading, or on face or genitals"}},{"id":"seborrheic","areas":["skin"],"sev":"norm","el":{"n":"Σμηγματορροϊκή δερματίτιδα / Πιτυρίδα","s":["Λέπια στο τριχωτό","Κόκκινες λιπαρές κηλίδες στο πρόσωπο, φρύδια, μύτη","Φαγούρα"],"aid":"• Αντιπιτυριδικό σαμπουάν 2 φορές την εβδομάδα","note":"Δερματολόγος αν επιμένει"},"en":{"n":"Seborrhoeic dermatitis / dandruff","s":["Scales on the scalp","Red greasy patches on face, eyebrows, nose","Itching"],"aid":"• Anti-dandruff shampoo twice a week","note":"Dermatologist if persistent"}},{"id":"hairloss","areas":["skin"],"sev":"norm","el":{"n":"Τριχόπτωση","s":["Αραίωμα μαλλιών","Πολλές τρίχες στη βούρτσα","Κενά σημεία"],"aid":"• Ελέγξτε σίδηρο, θυρεοειδή, βιταμίνη D\n• Ήπια φροντίδα, όχι σφιχτά χτενίσματα","note":"Δερματολόγος αν είναι ξαφνική ή σε κύκλους (γυροειδής αλωπεκία)"},"en":{"n":"Hair loss","s":["Thinning hair","Lots of hair in the brush","Bald patches"],"aid":"• Check iron, thyroid, vitamin D\n• Gentle care, no tight hairstyles","note":"Dermatologist if sudden or in round patches (alopecia areata)"}},{"id":"dryskin","areas":["skin","senior"],"sev":"norm","el":{"n":"Ξηροδερμία και κνησμός ηλικιωμένων","s":["Ξηρό, σκασμένο δέρμα","Φαγούρα, χειρότερη τον χειμώνα","Λεπτές ρωγμές"],"aid":"• Χλιαρό, σύντομο ντους\n• Πλούσια ενυδατική αμέσως μετά\n• Λιγότερο σαπούνι","note":"Γιατρός αν η φαγούρα είναι έντονη χωρίς εμφανή αιτία — ελέγχονται ήπαρ, νεφρά, θυρεοειδής, σίδηρος"},"en":{"n":"Dry, itchy skin in older age","s":["Dry, cracked skin","Itch, worse in winter","Fine cracks"],"aid":"• Warm, short showers\n• Rich moisturiser straight after\n• Less soap","note":"See a doctor if itch is severe with no obvious cause — liver, kidneys, thyroid, iron are checked"}},{"id":"diabfoot","areas":["skin","endo","senior"],"sev":"risk","el":{"n":"Διαβητικό πόδι","s":["Πληγή στο πόδι που δεν πονά","Αλλαγή χρώματος","Πρήξιμο ή ζέστη","Κάλοι, ρωγμές"],"aid":"• Ελέγχετε πατούσες κάθε μέρα (με καθρέφτη)\n• Ποτέ ξυπόλυτοι\n• Μη κόβετε μόνοι κάλους","note":"Γιατρός ΣΥΝΤΟΜΑ για κάθε πληγή σε διαβητικό. Μαύρισμα ή πυρετός: Επείγοντα"},"en":{"n":"Diabetic foot","s":["Foot sore that does not hurt","Colour change","Swelling or warmth","Calluses, cracks"],"aid":"• Check soles daily (with a mirror)\n• Never barefoot\n• Do not cut corns yourself","note":"See a doctor SOON for any sore in a diabetic. Blackening or fever: go to A&E"}},{"id":"tickbite","areas":["skin","gen"],"sev":"caution","el":{"n":"Τσίμπημα τσιμπουριού","s":["Τσιμπούρι στο δέρμα","Κόκκινος δακτύλιος που μεγαλώνει (μέρες μετά)","Πυρετός, πόνοι"],"aid":"• Αφαιρέστε με λαβίδα κοντά στο δέρμα, τραβώντας ίσια\n• Καθαρίστε\n• Σημειώστε την ημερομηνία","note":"Γιατρός αν εμφανιστεί δακτύλιος ή πυρετός τις επόμενες εβδομάδες"},"en":{"n":"Tick bite","s":["Tick on the skin","Expanding red ring (days later)","Fever, aches"],"aid":"• Remove with tweezers close to the skin, pulling straight\n• Clean\n• Note the date","note":"See a doctor if a ring or fever appears in the following weeks"}},{"id":"lice","areas":["skin","child"],"sev":"norm","el":{"n":"Ψείρες κεφαλιού","s":["Φαγούρα στο κεφάλι","Κόνιδες (αυγά) κολλημένες στις τρίχες","Ψειρίτσες"],"aid":"• Ειδική λοσιόν από φαρμακείο\n• Χτένα για ψείρες σε βρεγμένα μαλλιά\n• Έλεγχος όλης της οικογένειας","note":"Φαρμακοποιός. Δεν είναι σημάδι κακής υγιεινής"},"en":{"n":"Head lice","s":["Itchy scalp","Nits (eggs) stuck to hair","Small lice"],"aid":"• Special lotion from the pharmacy\n• Lice comb on wet hair\n• Check the whole family","note":"Pharmacist. It is not a sign of poor hygiene"}},{"id":"panic","areas":["psy"],"sev":"caution","el":{"n":"Κρίσεις πανικού","s":["Ξαφνικός έντονος φόβος","Ταχυπαλμία","Δύσπνοια ή πνίξιμο","Ζάλη, τρέμουλο","Φόβος ότι θα πεθάνετε ή θα «τρελαθείτε»"],"aid":"• Αργή αναπνοή: εισπνοή 4, κράτημα 2, εκπνοή 6\n• Πείτε στον εαυτό σας «θα περάσει σε λίγα λεπτά»","note":"Η πρώτη φορά με πόνο στο στήθος θέλει έλεγχο καρδιάς. Μετά: γιατρός ή ψυχολόγος — θεραπεύεται πολύ καλά"},"en":{"n":"Panic attacks","s":["Sudden intense fear","Racing heart","Breathless or choking","Dizzy, shaking","Fear of dying or “going mad”"],"aid":"• Slow breathing: in 4, hold 2, out 6\n• Tell yourself “it will pass in a few minutes”","note":"The first time with chest pain, check the heart. Then: GP or psychologist — very treatable"}},{"id":"gad","areas":["psy"],"sev":"caution","el":{"n":"Γενικευμένο άγχος","s":["Συνεχής ανησυχία για πολλά","Ένταση και σφίξιμο","Κόπωση","Δυσκολία συγκέντρωσης","Κακός ύπνος"],"aid":"• Κάντε το τεστ άγχους στην εφαρμογή\n• Καθημερινή κίνηση\n• Λιγότερος καφές\n• Μιλήστε σε κάποιον","note":"Γιατρός ή ψυχολόγος αν κρατά πάνω από 6 μήνες ή σας εμποδίζει"},"en":{"n":"Generalised anxiety","s":["Constant worry about many things","Tension and tightness","Fatigue","Poor concentration","Poor sleep"],"aid":"• Take the anxiety test in this app\n• Daily activity\n• Less coffee\n• Talk to someone","note":"GP or psychologist if over 6 months or it stops you living normally"}},{"id":"insomnia","areas":["psy","senior"],"sev":"norm","el":{"n":"Αϋπνία","s":["Δυσκολία να κοιμηθείτε","Ξυπνάτε πολλές φορές ή πολύ νωρίς","Κούραση τη μέρα","Ανησυχία για τον ύπνο"],"aid":"• Ίδια ώρα ύπνου και ξυπνήματος\n• Όχι οθόνες 1 ώρα
